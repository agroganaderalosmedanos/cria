<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cría — Agroganadera Los Médanos</title>
<style>
:root {
  --bg: #F7F3E8; --bg2: #F0EAD8; --bg3: #E8DCC2;
  --text: #4A2E1A; --text2: #7a5c3a; --text3: #a8896a;
  --border: rgba(74,46,26,0.12); --border2: rgba(74,46,26,0.22);
  --green: #3F5A2A; --green-dark: #2d4020; --green-bg: #eaf0e2; --green-text: #2d4020;
  --clay: #D46A33; --clay-dark: #b5561f; --clay-bg: #f6ede4; --clay-text: #b5561f;
  --gold: #6A7F3F; --gold-dark: #4e6030; --gold-bg: #eaf0e2; --gold-text: #4e6030;
  --bordeaux: #631627; --bordeaux-dark: #4a1020;
  --sidebar-bg: #3a5020;
  --red: #8b1a1a; --blue: #1a3a8b; --blue-bg: #e8edf8; --blue-text: #1a3a8b;
  --navy: #1a2a5e; --navy-bg: #e8ecf6;
  --serif: 'Aptos', 'Calibri', 'Segoe UI', -apple-system, sans-serif;
  --sans: 'Aptos', 'Calibri', 'Segoe UI', -apple-system, sans-serif;
  --bg: #faf8f4; --bg2: #f3efe6; --bg3: #ece5d6;
  --text: #2b261f; --text2: #6b6357; --text3: #a39a89;
  --border: rgba(43,38,31,0.1); --border2: rgba(43,38,31,0.18);
  --green: #2f6b3f; --green-dark: #1f4d2b; --green-bg: #e6efe3; --green-text: #1f4d2b;
  --clay: #a8512f; --clay-bg: #f6e8e0; --clay-text: #7a3a20;
  --gold: #b8860b; --gold-bg: #f5edd8; --gold-text: #8a6508;
  --red: #b3261e; --red-bg: #fbeae8; --red-text: #8c1d17;
  --radius: 10px; --radius-lg: 16px;
  --shadow: 0 1px 3px rgba(43,38,31,0.08), 0 1px 2px rgba(43,38,31,0.06);
  --shadow-md: 0 4px 12px rgba(43,38,31,0.08);
  --serif: 'Aptos', 'Calibri', 'Segoe UI', -apple-system, sans-serif;
  --sans: 'Aptos', 'Calibri', 'Segoe UI', -apple-system, sans-serif;
  --mono: 'IBM Plex Mono', 'SF Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; }
::selection { background: var(--gold-bg); }

#root { min-height: 100vh; }
.app-shell { display: flex; min-height: 100vh; }

.sidebar {
  width: 240px; flex-shrink: 0; background: var(--sidebar-bg); color: #e8e4dc;
  display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
}
.sidebar-brand { padding: 22px 20px 18px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.sidebar-brand .farm-icon { font-size: 22px; margin-bottom: 6px; display: block; }
.sidebar-brand .farm-name { font-family: var(--serif); font-size: 17px; font-weight: 600; color: #fff; letter-spacing: -0.01em; line-height: 1.25; }
.sidebar-brand .farm-sub { font-size: 11px; color: #a39a89; margin-top: 2px; }
.btn-inicio-sidebar { display: inline-block; margin-top: 14px; font-size: 13px; font-weight: 700; color: #fff; text-decoration: none; background: var(--bordeaux); border: none; border-radius: 20px; padding: 8px 18px; transition: all .15s; letter-spacing: .01em; }
.btn-inicio-sidebar:hover { background: var(--bordeaux-dark); }
.btn-logout-sidebar { display: block; margin-top: 8px; font-size: 12px; font-weight: 600; color: #a39a89; text-decoration: none; border: none; background: none; cursor: pointer; font-family: inherit; padding: 0; transition: color .15s; }
.btn-logout-sidebar:hover { color: #fff; }

.sidebar-nav { flex: 1; padding: 14px 10px; overflow-y: auto; }
.nav-section-label { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #8a8174; padding: 14px 10px 6px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px;
  color: #cfc9bd; font-size: 13.5px; font-weight: 500; cursor: pointer; transition: background 0.15s, color 0.15s;
  margin-bottom: 1px; border: none; background: none; width: 100%; text-align: left;
}
.nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
.nav-item.active { background: var(--bordeaux); color: #fff; }
.nav-item .nav-icon { font-size: 15px; width: 18px; text-align: center; flex-shrink: 0; }

.sidebar-footer { padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 11px; color: #8a8174; }
.sidebar-footer .sync-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; }
.sync-dot.ok { background: #5fb87a; } .sync-dot.bad { background: #d97757; } .sync-dot.busy { background: #d4b65f; animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

.main { flex: 1; min-width: 0; }
.topbar {
  display: flex; align-items: center; justify-content: space-between; padding: 16px 28px;
  border-bottom: 1px solid var(--border); background: var(--bg); position: sticky; top: 0; z-index: 5;
}
.topbar h1 { font-family: var(--serif); font-size: 21px; font-weight: 600; letter-spacing: -0.01em; }
.topbar .topbar-sub { font-size: 12.5px; color: var(--text2); margin-top: 1px; }
.content { padding: 24px 28px 60px; max-width: 1280px; }

.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px;
  font-size: 13px; font-weight: 600; border: 1px solid transparent; cursor: pointer; transition: all 0.15s;
  font-family: var(--sans); white-space: nowrap;
}
.btn-primary { background: var(--green); color: #fff; }
.btn-primary:hover { background: var(--green-dark); }
.btn-secondary { background: var(--bg2); color: var(--text); border-color: var(--border2); }
.btn-secondary:hover { background: var(--bg3); }
.btn-danger { background: var(--red-bg); color: var(--red-text); }
.btn-danger:hover { background: #f5d6d3; }
.btn-ghost { background: transparent; color: var(--text2); padding: 6px 10px; }
.btn-ghost:hover { background: var(--bg2); color: var(--text); }
.btn-sm { padding: 5px 11px; font-size: 12px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.panel { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 18px; box-shadow: var(--shadow); }
.panel-title { font-size: 15px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.panel-title .count-badge { font-size: 11px; font-weight: 600; background: var(--bg2); color: var(--text2); padding: 1px 8px; border-radius: 100px; }

.section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text3); margin: 26px 0 10px; }
.section-label:first-child { margin-top: 0; }

.fgrid { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 4px; }
.fg { display: flex; flex-direction: column; gap: 5px; min-width: 160px; flex: 1; }
.fg label { font-size: 11.5px; font-weight: 600; color: var(--text2); }
.fg label .opt { font-weight: 400; color: var(--text3); }
.fg input, .fg select, .fg textarea {
  border: 1px solid var(--border2); border-radius: 8px; padding: 8px 11px; font-size: 13.5px;
  font-family: var(--sans); background: var(--bg); color: var(--text); transition: border-color 0.15s, background 0.15s;
}
.fg input:focus, .fg select:focus, .fg textarea:focus { outline: none; border-color: var(--green); background: #fff; }
.fg input::placeholder { color: var(--text3); }

.radio-group { display: flex; gap: 8px; flex-wrap: wrap; }
.radio-pill {
  padding: 7px 14px; border-radius: 100px; border: 1.5px solid var(--border2); font-size: 12.5px; font-weight: 600;
  cursor: pointer; color: var(--text2); background: var(--bg); transition: all 0.15s; user-select: none;
}
.radio-pill.selected { background: var(--green); border-color: var(--green); color: #fff; }
.radio-pill:hover:not(.selected) { border-color: var(--text3); }

.helper-text { font-size: 11.5px; color: var(--text3); margin-top: 6px; line-height: 1.5; }
.live-calc { font-size: 13px; font-weight: 600; margin-top: 8px; padding: 9px 13px; border-radius: 8px; }
.live-calc.green { background: var(--green-bg); color: var(--green-text); }
.live-calc.red { background: var(--red-bg); color: var(--red-text); }

.tw { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
table.dt { width: 100%; border-collapse: collapse; font-size: 13px; }
table.dt th { text-align: left; padding: 10px 14px; background: var(--bg2); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text2); border-bottom: 1px solid var(--border); white-space: nowrap; }
table.dt th.tc, table.dt td.tc { text-align: center; }
table.dt td { padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.dt tbody tr:hover { background: var(--bg2); }
table.dt tbody tr:last-child td { border-bottom: none; }
.row-actions { display: flex; gap: 4px; justify-content: flex-end; }
.icon-btn { background: none; border: none; cursor: pointer; font-size: 13px; padding: 4px 6px; border-radius: 5px; color: var(--text3); }
.icon-btn:hover { background: var(--bg3); color: var(--text); }
.icon-btn.danger:hover { background: var(--red-bg); color: var(--red-text); }

.empty-state { text-align: center; padding: 48px 20px; color: var(--text3); }
.empty-state .ico { font-size: 32px; display: block; margin-bottom: 10px; opacity: 0.6; }
.empty-state .msg { font-size: 13.5px; }

.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 100px; font-size: 11.5px; font-weight: 600; }
.pill-green { background: var(--green-bg); color: var(--green-text); }
.pill-clay { background: var(--clay-bg); color: var(--clay-text); }
.pill-gold { background: var(--gold-bg); color: var(--gold-text); }
.pill-red { background: var(--red-bg); color: var(--red-text); }
.pill-gray { background: var(--bg3); color: var(--text2); }

.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; }
.kpi-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px 18px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.kpi-card .kpi-icon { font-size: 17px; margin-bottom: 8px; }
.kpi-card .kpi-label { font-size: 11.5px; color: var(--text2); font-weight: 600; margin-bottom: 4px; }
.kpi-card .kpi-value { font-family: var(--serif); font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
.kpi-card .kpi-sub { font-size: 11px; color: var(--text3); margin-top: 3px; }
.kpi-card.accent-green { border-top: 3px solid var(--green); }
.kpi-card.accent-clay { border-top: 3px solid var(--clay); }
.kpi-card.accent-gold { border-top: 3px solid var(--gold); }
.kpi-card.accent-red { border-top: 3px solid var(--red); }
.kpi-card.compact { padding: 10px 14px; }
.kpi-card.compact .kpi-icon { font-size: 13px; margin-bottom: 4px; }
.kpi-card.compact .kpi-label { font-size: 10.5px; margin-bottom: 2px; }
.kpi-card.compact .kpi-value { font-size: 18px; }

.rodeo-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 20px; }
.rodeo-chip {
  flex-shrink: 0; padding: 10px 16px; border-radius: 12px; border: 1.5px solid var(--border2);
  background: #fff; cursor: pointer; transition: all 0.15s; min-width: 130px;
}
.rodeo-chip:hover { border-color: var(--green); }
.rodeo-chip.active { border-color: var(--green); background: var(--green-bg); }
.rodeo-chip .rc-name { font-size: 12.5px; font-weight: 700; color: var(--text); }
.rodeo-chip .rc-meta { font-size: 10.5px; color: var(--text3); margin-top: 2px; }
.rodeo-chip.active .rc-name { color: var(--green-dark); }

.modal-overlay { position: fixed; inset: 0; background: rgba(43,38,31,0.45); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
.modal { background: #fff; border-radius: var(--radius-lg); width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; box-shadow: var(--shadow-md); }
.modal-header { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--border); }
.modal-header h3 { font-family: var(--serif); font-size: 17px; font-weight: 600; }
.modal-close { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text3); padding: 4px; }
.modal-body { padding: 20px 22px; }
.modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 22px; border-top: 1px solid var(--border); }

#toast-zone { position: fixed; bottom: 22px; right: 22px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast { padding: 12px 18px; border-radius: 10px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow-md); animation: slideIn 0.25s ease-out; max-width: 360px; }
.toast.ok { background: var(--green); color: #fff; }
.toast.err { background: var(--red); color: #fff; }
@keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

.loader { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 60px 20px; color: var(--text3); font-size: 13px; }
.spinner { width: 16px; height: 16px; border: 2px solid var(--border2); border-top-color: var(--green); border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.setup-wrap { max-width: 520px; margin: 80px auto; padding: 0 20px; }
.setup-wrap .panel { padding: 32px; }

@media (max-width: 860px) {
  .sidebar { position: fixed; left: -240px; z-index: 50; transition: left 0.2s; box-shadow: var(--shadow-md); }
  .sidebar.open { left: 0; }
  .mobile-menu-btn { display: flex !important; }
  .content { padding: 18px 16px 60px; }
  .topbar { padding: 14px 16px; }
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
}
.mobile-menu-btn { display: none; background: none; border: none; font-size: 20px; cursor: pointer; padding: 4px 8px; }

@media print {
  .sidebar, .topbar, .btn { display: none !important; }
}
</style>

<body>
<div id="root"></div>
<div id="toast-zone"></div>
<script>
let S = {
  apiUrl: localStorage.getItem('cria_api_url') || 'https://script.google.com/macros/s/AKfycbz-ahGdifI9FykD0r6hz47fjPZ6H5TwKWMOsCfW5f_M41oXneTffMk7CKz0svOgezSD_w/exec',
  apiToken: localStorage.getItem('cria_api_token') || 'LosMedanos2026Cria',
  page: 'dashboard',
  sidebarOpen: false,
  loading: false,
  syncStatus: 'idle',
  catalogs: null,
  selectedRodeoId: null,
  selectedCampoId: null,
  dashboard: null,
  stock: null,
  corralesStock: undefined,
  cache: {},
  modal: null,
};

function save() {
  localStorage.setItem('cria_api_url', S.apiUrl);
  localStorage.setItem('cria_api_token', S.apiToken);
}

function apiConfigured() { return !!(S.apiUrl && S.apiToken); }

async function apiCall(action, opts = {}) {
  if (!apiConfigured()) throw new Error('API no configurada');
  S.syncStatus = 'busy';
  renderSyncDot();
  try {
    let url = S.apiUrl + '?action=' + action + '&token=' + encodeURIComponent(S.apiToken);
    if (opts.params) {
      Object.entries(opts.params).forEach(([k, v]) => { url += '&' + k + '=' + encodeURIComponent(v); });
    }
    const fetchOpts = { method: opts.body ? 'POST' : 'GET' };
    if (opts.body) {
      // Inyectar usuario de sesión automáticamente en todos los POST
      const session = window.__lmSession || {};
      const bodyConUsuario = { ...opts.body, usuario: session.usuario || 'sistema' };
      fetchOpts.body = JSON.stringify(bodyConUsuario);
      fetchOpts.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
    }
    const res = await fetch(url, fetchOpts);
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'Error desconocido');
    S.syncStatus = 'ok';
    renderSyncDot();
    return json.data;
  } catch (err) {
    S.syncStatus = 'bad';
    renderSyncDot();
    throw err;
  }
}

function renderSyncDot() {
  const el = document.getElementById('sync-dot');
  if (!el) return;
  el.className = 'sync-dot ' + (S.syncStatus === 'busy' ? 'busy' : S.syncStatus === 'bad' ? 'bad' : 'ok');
}

function toast(msg, type) {
  type = type || 'ok';
  const zone = document.getElementById('toast-zone');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  zone.appendChild(el);
  setTimeout(() => el.remove(), 3800);
}

function today() { return new Date().toISOString().slice(0, 10); }
function fd(dateStr) {
  if (!dateStr) return '—';
  const parts = String(dateStr).split('-');
  if (parts.length === 3) return parts[2] + '/' + parts[1] + '/' + parts[0];
  return dateStr;
}
function fn(n, dec) {
  dec = dec || 0;
  if (n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString('es-AR', { maximumFractionDigits: dec, minimumFractionDigits: dec });
}
function pct(n) { return n === null || n === undefined ? '—' : fn(n, 1) + '%'; }
function gid() { return 'tmp_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function rodeoNombre(rodeoId) {
  const r = (S.catalogs && S.catalogs.rodeos || []).find(x => String(x.rodeo_id) === String(rodeoId));
  return r ? r.nombre : '—';
}
function campoNombre(campoId) {
  const c = (S.catalogs && S.catalogs.campos || []).find(x => String(x.campo_id) === String(campoId));
  return c ? c.nombre : '—';
}
function rodeosCriaActivos() {
  return (S.catalogs && S.catalogs.rodeos || []).filter(r => (r.categoria === 'vaca' || r.categoria === 'vaquillona'));
}
function rodeosConServicio() {
  const servicios = S.cache.servicios || [];
  const idsConServicio = new Set(servicios.map(s => String(s.rodeo_id)));
  return rodeosCriaActivos().filter(r => idsConServicio.has(String(r.rodeo_id)));
}

function rodeosCriaPorCampo(campoId) {
  return rodeosCriaActivos().filter(r => String(r.campo_id) === String(campoId));
}

function rodeosConServicioPorCampo(campoId) {
  return rodeosConServicio().filter(r => String(r.campo_id) === String(campoId));
}

function rodeosConPrenadas() {
  const tactos = S.cache.tactos || [];
  const idsConPrenadas = new Set(tactos.filter(t => Number(t.prenadas) > 0).map(t => String(t.rodeo_id)));
  return rodeosCriaActivos().filter(r => idsConPrenadas.has(String(r.rodeo_id)));
}

function rodeosConPrenadasPorCampo(campoId) {
  return rodeosConPrenadas().filter(r => String(r.campo_id) === String(campoId));
}
function rodeosTodos() {
  return (S.catalogs && S.catalogs.rodeos || []);
}
function rodeosPorCampo(campoId) {
  return rodeosTodos().filter(r => String(r.campo_id) === String(campoId));
}
function rodeoOptionsHtml(rodeosList) {
  if (!rodeosList.length) return '<option value="">Sin rodeos en este campo</option>';
  return rodeosList.map(r => `<option value="${r.rodeo_id}">${r.nombre}</option>`).join('');
}

async function loadCatalogs() {
  S.catalogs = await apiCall('catalog');
}
async function loadEntity(entity, force) {
  if (!force && S.cache[entity]) return S.cache[entity];
  const data = await apiCall('list', { params: { entity } });
  S.cache[entity] = data;
  return data;
}
async function loadDashboard() {
  S.dashboard = await apiCall('dashboard');
}
function invalidateCache(entity) { delete S.cache[entity]; }

async function init() {
  if (!apiConfigured()) { S.page = 'setup'; render(); return; }
  render();
  try {
    await loadCatalogs();
    render(); // app navegable de inmediato; el Resumen calcula sus índices solo al visitarlo
    loadDashboard().then(render).catch(() => {}); // precarga silenciosa en segundo plano, sin bloquear ni avisar error si tarda
  } catch (err) {
    toast('Error al conectar: ' + err.message, 'err');
  }
}

const NAV = [
  { section: 'Panel', items: [
    { k: 'dashboard', icon: '◈', label: 'Resumen' },
  ]},
  { section: 'Ciclo de cría', items: [
    { k: 'servicios', icon: '⚭', label: 'Servicios' },
    { k: 'tactos', icon: '◔', label: 'Tactos' },
    { k: 'abortos', icon: '⊘', label: 'Abortos' },
    { k: 'pariciones', icon: '✦', label: 'Pariciones' },
    { k: 'mortandad', icon: '†', label: 'Mortandad' },
    { k: 'destetes', icon: '⊞', label: 'Destetes' },
  ]},
  { section: 'Stock', items: [
    { k: 'movimientos', icon: '⇄', label: 'Movimientos/Stock' },
  ]},
  { section: 'Sistema', items: [
    { k: 'config', icon: '⚙', label: 'Configuración' },
  ]},
];

async function goto(page) {
  S.page = page;
  S.sidebarOpen = false;
  const entityMap = { servicios: 'servicios', tactos: 'tactos', abortos: 'abortos', pariciones: 'pariciones', mortandad: 'mortandad', destetes: 'destetes', movimientos: 'movimientos' };
  if (entityMap[page] && !S.cache[entityMap[page]]) {
    S.loading = true; render();
    try { await loadEntity(entityMap[page]); } catch (err) { toast(err.message, 'err'); }
    S.loading = false;
  }
  // Tactos, Abortos y Pariciones necesitan la caché de Servicios para filtrar rodeos con servicio registrado
  if ((page === 'tactos' || page === 'abortos' || page === 'pariciones') && !S.cache.servicios) {
    try { await loadEntity('servicios'); } catch (err) { /* silencioso */ }
  }
  // Destetes necesita la caché de Tactos para filtrar rodeos con vacas preñadas confirmadas
  if (page === 'destetes' && !S.cache.tactos) {
    try { await loadEntity('tactos'); } catch (err) { /* silencioso */ }
  }
  // Si el Resumen fue invalidado por un registro reciente (Pariciones/Destetes/Mortandad/Abortos),
  // se recarga automáticamente al volver a visitarlo.
  if (page === 'dashboard' && !S.dashboard) {
    loadDashboard().then(render).catch(() => {});
  }
  if (page === 'movimientos' && !S.stock) {
    try { await loadStock(); } catch (err) { toast(err.message, 'err'); }
  }
  if (page === 'movimientos' && S.corralesStock === undefined) {
    loadCorralesStock().then(render).catch(() => {});
  }
  render();
}

function render() {
  const root = document.getElementById('root');
  if (S.page === 'setup') {
    root.innerHTML = buildSetup();
    attachSetupEvents();
    return;
  }
  root.innerHTML = buildShell();
  attachShellEvents();
}

function buildDashboard() {
  if (!S.dashboard) return '<div class="loader"><div class="spinner"></div>Calculando índices…</div>';
  const g = S.dashboard.general;
  const rodeosList = S.dashboard.rodeos || [];
  const campos = (S.catalogs && S.catalogs.campos) || [];

  let h = '<div class="section-label">Establecimiento — todos los rodeos de cría</div>';
  h += buildKpiRow(g);

  h += '<div class="section-label">Filtrar por campo</div>';
  h += '<div class="rodeo-strip">';
  h += `<div class="rodeo-chip ${!S.selectedCampoId ? 'active' : ''}" data-campo="">
          <div class="rc-name">Todos los campos</div></div>`;
  campos.forEach(c => {
    h += `<div class="rodeo-chip ${String(S.selectedCampoId) === String(c.campo_id) ? 'active' : ''}" data-campo="${c.campo_id}">
      <div class="rc-name">${c.nombre}</div>
    </div>`;
  });
  h += '</div>';

  const rodeosFiltrados = (S.selectedCampoId
    ? rodeosList.filter(r => String(r.rodeo.campo_id) === String(S.selectedCampoId))
    : rodeosList
  ).slice().sort((a, b) => {
    const cmpCampo = campoNombre(a.rodeo.campo_id).localeCompare(campoNombre(b.rodeo.campo_id), 'es', { sensitivity: 'base' });
    if (cmpCampo !== 0) return cmpCampo;
    return a.rodeo.nombre.localeCompare(b.rodeo.nombre, 'es', { sensitivity: 'base' });
  });

  if (S.selectedCampoId) {
    const campoSel = campos.find(c => String(c.campo_id) === String(S.selectedCampoId));
    h += `<div class="panel">
      <div class="panel-title">${campoSel ? campoSel.nombre : ''} <span class="pill pill-gray">${rodeosFiltrados.length} rodeo${rodeosFiltrados.length===1?'':'s'}</span></div>
      ${buildKpiRow(aggregateKpis_(rodeosFiltrados))}
    </div>`;
  }

  h += '<div class="section-label">Por rodeo</div>';
  h += '<div class="rodeo-strip">';
  h += `<div class="rodeo-chip ${!S.selectedRodeoId ? 'active' : ''}" data-rodeo="">
          <div class="rc-name">Todos</div><div class="rc-meta">vista general</div></div>`;
  rodeosFiltrados.forEach(r => {
    h += `<div class="rodeo-chip ${String(S.selectedRodeoId) === String(r.rodeo.rodeo_id) ? 'active' : ''}" data-rodeo="${r.rodeo.rodeo_id}">
      <div class="rc-name">${r.rodeo.nombre}</div>
      <div class="rc-meta">${campoNombre(r.rodeo.campo_id)}</div>
    </div>`;
  });
  h += '</div>';

  if (S.selectedRodeoId) {
    const sel = rodeosFiltrados.find(r => String(r.rodeo.rodeo_id) === String(S.selectedRodeoId));
    if (sel) {
      h += `<div class="panel">
        <div class="panel-title">${sel.rodeo.nombre} <span class="pill pill-gray">${campoNombre(sel.rodeo.campo_id)}</span></div>
        ${buildKpiRow(sel.kpis)}
      </div>`;
    }
  } else {
    const sortStateD = (S.sort && S.sort.dashboard_rodeos) || null;
    const arrowD = key => (sortStateD && sortStateD.key === key) ? (sortStateD.dir === 'asc' ? ' ▲' : ' ▼') : '';
    let rodeosOrdenados = rodeosFiltrados;
    if (sortStateD) {
      rodeosOrdenados = [...rodeosFiltrados].sort((a, b) => {
        let va = dashboardSortValue_(a, sortStateD.key), vb = dashboardSortValue_(b, sortStateD.key);
        if (va == null) va = '';
        if (vb == null) vb = '';
        const na = Number(va), nb = Number(vb);
        const numeric = va !== '' && vb !== '' && !isNaN(na) && !isNaN(nb);
        const cmp = numeric ? (na - nb) : String(va).localeCompare(String(vb), 'es', { sensitivity: 'base' });
        return sortStateD.dir === 'asc' ? cmp : -cmp;
      });
    }
    h += `<div class="tw"><table class="dt"><thead><tr>
      <th class="sortable-th" style="cursor:pointer;user-select:none" onclick="sortDashboardRodeos('nombre')">Rodeo${arrowD('nombre')}</th>
      <th class="sortable-th" style="cursor:pointer;user-select:none" onclick="sortDashboardRodeos('campo')">Campo${arrowD('campo')}</th>
      <th class="tc sortable-th" style="cursor:pointer;user-select:none" onclick="sortDashboardRodeos('prenez')">Preñez${arrowD('prenez')}</th>
      <th class="tc sortable-th" style="cursor:pointer;user-select:none" onclick="sortDashboardRodeos('paricion')">Parición${arrowD('paricion')}</th>
      <th class="tc sortable-th" style="cursor:pointer;user-select:none" onclick="sortDashboardRodeos('destete')">Destete${arrowD('destete')}</th>
      <th class="tc sortable-th" style="cursor:pointer;user-select:none" onclick="sortDashboardRodeos('abortos')">Abortos${arrowD('abortos')}</th>
      <th class="tc sortable-th" style="cursor:pointer;user-select:none" onclick="sortDashboardRodeos('mortandad')">Mort. terneros${arrowD('mortandad')}</th>
    </tr></thead><tbody>`;
    rodeosOrdenados.forEach(r => {
      const k = r.kpis;
      h += `<tr>
        <td><strong>${r.rodeo.nombre}</strong></td>
        <td style="color:var(--text2)">${campoNombre(r.rodeo.campo_id)}</td>
        <td class="tc">${pillForPct(k.servicio.indice_prenez, fn(k.servicio.total_prenadas)+'/'+fn(k.servicio.total_serviciadas))}</td>
        <td class="tc">${pillForPct(k.paricion.indice_paricion, fn(k.paricion.nacidos_vivos)+'/'+fn(k.servicio.total_prenadas))}</td>
        <td class="tc">${pillForPct(k.destete.indice_destete, fn(k.destete.total_destetados)+'/'+fn(k.paricion.nacidos_vivos))}</td>
        <td class="tc">${k.gestacion.abortos > 0 ? '<span class="pill pill-clay">' + k.gestacion.abortos + '</span>' : '—'}</td>
        <td class="tc">${k.destete.mortandad_terneros > 0 ? '<span class="pill pill-red">' + k.destete.mortandad_terneros + '</span>' : '—'}</td>
      </tr>`;
    });
    h += '</tbody></table></div>';
  }
  return h;
}

function dashboardSortValue_(r, key) {
  switch (key) {
    case 'nombre': return r.rodeo.nombre || '';
    case 'campo': return campoNombre(r.rodeo.campo_id) || '';
    case 'prenez': return r.kpis.servicio.indice_prenez;
    case 'paricion': return r.kpis.paricion.indice_paricion;
    case 'destete': return r.kpis.destete.indice_destete;
    case 'abortos': return r.kpis.gestacion.abortos;
    case 'mortandad': return r.kpis.destete.mortandad_terneros;
    default: return '';
  }
}

function sortDashboardRodeos(key) {
  if (!S.sort) S.sort = {};
  const current = S.sort.dashboard_rodeos;
  if (current && current.key === key) {
    current.dir = current.dir === 'asc' ? 'desc' : 'asc';
  } else {
    S.sort.dashboard_rodeos = { key, dir: 'asc' };
  }
  render();
}

// Suma los valores crudos de KPIs de varios rodeos y recalcula los porcentajes agregados
function aggregateKpis_(rodeosArr) {
  let totServ = 0, prenIatf = 0, prenToro = 0, totPren = 0;
  let totTacteadasIatf = 0, totTacteadasToro = 0;
  let nacVivos = 0, nacMuertos = 0, abortos = 0, totDest = 0, mortTerneros = 0;
  rodeosArr.forEach(r => {
    const k = r.kpis;
    totServ += k.servicio.total_serviciadas || 0;
    prenIatf += k.servicio.prenadas_iatf || 0;
    prenToro += k.servicio.prenadas_toro || 0;
    totPren += k.servicio.total_prenadas || 0;
    totTacteadasIatf += k.servicio.total_tacteadas_iatf || 0;
    totTacteadasToro += k.servicio.total_tacteadas_toro || 0;
    nacVivos += k.paricion.nacidos_vivos || 0;
    nacMuertos += k.paricion.nacidos_muertos || 0;
    abortos += k.gestacion.abortos || 0;
    totDest += k.destete.total_destetados || 0;
    mortTerneros += k.destete.mortandad_terneros || 0;
  });
  return {
    servicio: {
      total_serviciadas: totServ, prenadas_iatf: prenIatf, prenadas_toro: prenToro, total_prenadas: totPren,
      total_tacteadas_iatf: totTacteadasIatf, total_tacteadas_toro: totTacteadasToro,
      indice_prenez: totServ > 0 ? round1_(totPren / totServ * 100) : null,
      indice_prenez_iatf: totTacteadasIatf > 0 ? round1_(prenIatf / totTacteadasIatf * 100) : null,
      indice_prenez_toro: totTacteadasToro > 0 ? round1_(prenToro / totTacteadasToro * 100) : null,
    },
    gestacion: { abortos },
    paricion: { nacidos_vivos: nacVivos, nacidos_muertos: nacMuertos, indice_paricion: totPren > 0 ? round1_(nacVivos / totPren * 100) : null },
    destete: { total_destetados: totDest, mortandad_terneros: mortTerneros, indice_destete: nacVivos > 0 ? round1_(totDest / nacVivos * 100) : null },
  };
}
function round1_(n) { return n === null || n === undefined || isNaN(n) ? null : Math.round(n * 10) / 10; }

function pillForPct(p, detalle) {
  const det = detalle ? `<div style="font-size:10px;color:var(--text3);margin-top:2px">${detalle}</div>` : '';
  if (p === null || p === undefined) return `<span style="color:var(--text3)">—</span>${det}`;
  const cls = p >= 85 ? 'pill-green' : p >= 65 ? 'pill-gold' : 'pill-red';
  return `<span class="pill ${cls}">${fn(p,1)}%</span>${det}`;
}

      <div class="kpi-sub">${fn(k.servicio.prenadas_iatf)} de ${fn(k.servicio.total_tacteadas_iatf)} vacas (IATF)</div>

}

    <div id="sv-toro-wrap" style="display:none;margin-top:12px">
      <div class="fg"><label>Identificación del toro <span class="opt">(nombre o caravana)</span></label>
        <input type="text" id="sv-toro" placeholder="Ej: Don Pedro / 982000...">
      </div>
    </div>

    <div class="fg" style="margin-top:12px;max-width:400px">
      <label>Observación <span class="opt">(opcional)</span></label>
      <input type="text" id="sv-obs" placeholder="Opcional">
    </div>
    <button class="btn btn-primary" id="sv-save" style="margin-top:10px">Registrar servicio</button>
  </div>`;

  // Historial — agrupar filas IATF del mismo rodeo/fecha para mostrarlas juntas
  const grupos = [];
  const vistos = new Set();
  items.forEach(item => {
    if (item.tipo === 'IATF') {
      const key = item.rodeo_id + '|' + item.fecha_inicio;
      if (!vistos.has(key)) {
        vistos.add(key);
        const grupo = items.filter(i => i.tipo === 'IATF' && i.rodeo_id === item.rodeo_id && i.fecha_inicio === item.fecha_inicio);
        grupos.push({ ...item, _toros: grupo.map(g => `${g.identificacion_toro || '—'}${g.cantidad ? ' ('+g.cantidad+' vacas)' : ''}`).join(' / ') });
      }
    } else {
      grupos.push({ ...item, _toros: item.identificacion_toro || '—' });
    }
  });

  h += buildEntityTable(grupos, [
    { key: 'fecha_inicio', label: 'Inicio', render: v => fd(v) },
    { key: 'fecha_fin', label: 'Fin', render: v => v ? fd(v) : '—' },
    { key: 'tipo', label: 'Tipo', render: v => `<span class="pill ${v === 'IATF' ? 'pill-gold' : 'pill-green'}">${v}</span>` },
    { key: 'rodeo_id', label: 'Rodeo', render: v => rodeoNombre(v) },
    { key: '_toros', label: 'Toro / Cantidad', render: v => v || '—' },
    { key: 'observacion', label: 'Obs.', render: v => v || '—' },
  ], 'servicios', 'servicio_id');

  return h;
}

function attachServiciosEvents() {
  // Guard: si los elementos no están en el DOM no hacer nada
  if (!document.getElementById('sv-save')) return;

  // Toggle IATF vs Toros a campo
  document.querySelectorAll('#sv-tipo-group .radio-pill').forEach(p => p.onclick = () => {
    document.querySelectorAll('#sv-tipo-group .radio-pill').forEach(x => x.classList.remove('selected'));
    p.classList.add('selected');
    const esIATF = p.dataset.tipo === 'IATF';
    const iatfWrap = document.getElementById('sv-iatf-wrap');
    const toroWrap = document.getElementById('sv-toro-wrap');
    if (iatfWrap) iatfWrap.style.display = esIATF ? 'block' : 'none';
    if (toroWrap) toroWrap.style.display = esIATF ? 'none' : 'block';
  });

  // Actualizar total de vacas IATF
  function actualizarTotal() {
    const filas = document.querySelectorAll('.sv-cant');
    let total = 0;
    filas.forEach(f => { const v = parseInt(f.value); if (!isNaN(v) && v > 0) total += v; });
    const lbl = document.getElementById('sv-total-label');
    if (lbl) lbl.textContent = total > 0 ? `Total: ${total} vacas` : '';
  }

  // Agregar fila de toro
  const addToroBtn = document.getElementById('sv-add-toro');
  if (addToroBtn) addToroBtn.onclick = () => {
    const list = document.getElementById('sv-toros-list');
    if (!list) return;
    const div = document.createElement('div');
    div.className = 'sv-toro-row';
    div.style.cssText = 'display:flex;gap:8px;align-items:center;margin-bottom:8px';
    div.innerHTML = `
      <input type="number" class="sv-cant" placeholder="Cant. vacas" min="1" style="width:120px;padding:7px 10px;border:1px solid var(--border2);border-radius:8px;font-size:13px;background:var(--bg)">
      <input type="text" class="sv-toro-id" placeholder="Identificación toro" style="flex:1;padding:7px 10px;border:1px solid var(--border2);border-radius:8px;font-size:13px;background:var(--bg)">
      <button class="sv-del-row btn" style="padding:5px 10px;font-size:12px;background:var(--bg2);color:var(--red)" title="Quitar fila">✕</button>`;
    div.querySelector('.sv-del-row').onclick = () => { div.remove(); actualizarTotal(); };
    div.querySelector('.sv-cant').oninput = actualizarTotal;
    list.appendChild(div);
    div.querySelector('.sv-cant').focus();
  };

  // Escuchar cambios en la primera fila de cantidad
  document.querySelectorAll('.sv-cant').forEach(el => el.oninput = actualizarTotal);

  // Guardar
  const save = document.getElementById('sv-save');
  save.onclick = async () => {
    const tipoEl = document.querySelector('#sv-tipo-group .selected');
    if (!tipoEl) return;
    const tipo = tipoEl.dataset.tipo;
    const rodeoEl = document.getElementById('sv-rodeo');
    const fechaIniEl = document.getElementById('sv-fecha-ini');
    const fechaFinEl = document.getElementById('sv-fecha-fin');
    const obsEl = document.getElementById('sv-obs');
    const rodeo_id = rodeoEl ? rodeoEl.value : '';
    const fecha_inicio = fechaIniEl ? fechaIniEl.value : '';
    const fecha_fin = fechaFinEl ? fechaFinEl.value : '';
    const observacion = obsEl ? obsEl.value.trim() : '';
    if (!fecha_inicio || !rodeo_id) { toast('Completá fecha y rodeo.', 'err'); return; }

    if (tipo === 'IATF') {
      const filas = [];
      document.querySelectorAll('.sv-toro-row').forEach(row => {
        const cantEl = row.querySelector('.sv-cant');
        const toroEl = row.querySelector('.sv-toro-id');
        if (!cantEl || !toroEl) return;
        const cant = parseInt(cantEl.value);
        const toro = toroEl.value.trim();
        if (toro && cant > 0) filas.push({ cantidad: cant, identificacion_toro: toro });
      });
      if (filas.length === 0) { toast('Completá al menos un toro con cantidad.', 'err'); return; }
      save.disabled = true;
      try {
        for (const fila of filas) {
          await apiCall('create', { body: { entity: 'servicios', data: {
            tipo, rodeo_id, fecha_inicio, fecha_fin, observacion,
            identificacion_toro: fila.identificacion_toro,
            cantidad: fila.cantidad,
          }}});
        }
        invalidateCache('servicios');
        toast(`Servicio IATF registrado — ${filas.length} toro${filas.length > 1 ? 's' : ''}`, 'ok');
        await loadEntity('servicios', true);
        render();
      } catch (err) { toast(err.message, 'err'); } finally { save.disabled = false; }

    } else {
      const toroEl = document.getElementById('sv-toro');
      const data = {
        tipo, rodeo_id, fecha_inicio, fecha_fin, observacion,
        identificacion_toro: toroEl ? toroEl.value.trim() : '',
      };
      save.disabled = true;
      try {
        await apiCall('create', { body: { entity: 'servicios', data } });
        invalidateCache('servicios');
        toast('Servicio registrado', 'ok');
        await loadEntity('servicios', true);
        render();
      } catch (err) { toast(err.message, 'err'); } finally { save.disabled = false; }
    }
  };

  attachTableDeleteEvents('servicios', 'servicio_id');
}

  h += buildEntityTable(items, [

    { key: 'total_tacteadas', label: 'Tacteadas', render: v => fn(v) },

window.updateTactoCalc = function() {
  const total = Number(document.getElementById('tc-total') && document.getElementById('tc-total').value) || 0;
  const pren = Number(document.getElementById('tc-prenadas') && document.getElementById('tc-prenadas').value) || 0;
  const calcEl = document.getElementById('tc-calc');
  if (!calcEl) return;
  if (total > 0) {
    const vacias = total - pren;
    if (vacias < 0) { calcEl.innerHTML = '<div class="live-calc red">Las preñadas no pueden superar el total tacteadas.</div>'; return; }
    const indice = (pren / total * 100).toFixed(1);
    calcEl.innerHTML = '<div class="live-calc green">→ Vacías: ' + vacias + ' · Índice de preñez de este tacto: ' + indice + '%</div>';
  } else { calcEl.innerHTML = ''; }
};
function attachTactosEvents() {
  document.querySelectorAll('#tc-tipo-group .radio-pill').forEach(p => p.onclick = () => {
    document.querySelectorAll('#tc-tipo-group .radio-pill').forEach(x => x.classList.remove('selected'));
    p.classList.add('selected');
  });
  const save = document.getElementById('tc-save');
  if (save) save.onclick = async () => {
    const tipo = document.querySelector('#tc-tipo-group .selected').dataset.tipo;
    const total = Number(document.getElementById('tc-total').value) || 0;
    const pren = Number(document.getElementById('tc-prenadas').value) || 0;
    if (!total) { toast('Ingresá el total tacteadas.', 'err'); return; }
    if (pren > total) { toast('Las preñadas no pueden superar el total.', 'err'); return; }
    const data = {
      tipo_tacto: tipo,
      rodeo_id: document.getElementById('tc-rodeo').value,
      fecha: document.getElementById('tc-fecha').value,
      total_tacteadas: total, prenadas: pren, vacias: total - pren,
      observacion: document.getElementById('tc-obs').value.trim(),
    };
    save.disabled = true;
    try {
      await apiCall('create', { body: { entity: 'tactos', data } });
      invalidateCache('tactos');
      toast('Tacto registrado — ' + pren + ' preñadas, ' + (total - pren) + ' vacías', 'ok');
      await loadEntity('tactos', true);
      await loadDashboard();
      render();
    } catch (err) { toast(err.message, 'err'); } finally { save.disabled = false; }
  };
  attachTableDeleteEvents('tactos', 'tacto_id');
}

function actividadPorCategoria_(categoria) {
  const c = String(categoria || '').trim().toLowerCase();
  const mapa = {
    'vaca': 'Cría',
    'vacas': 'Cría',
    'vaca venta': 'Venta',
    'vacas venta': 'Venta',
    'vaquillona': 'Cría',
    'vaquillonas': 'Cría',
    'vaquillona próximo servicio': 'Recría',
    'vaquillonas próximo servicio': 'Recría',
    'vaquillona venta': 'Venta',
    'vaquillonas venta': 'Venta',
    'vaquillona para venta': 'Venta',
    'vaquillonas para venta': 'Venta',
    'novillito': 'Recría',
    'novillitos': 'Recría',
    'vaquilloncita': 'Recría',
    'vaquilloncitas': 'Recría',
    'ternero': 'Recría',
    'terneros': 'Recría',
    'ternera': 'Recría',
    'terneras': 'Recría',
    'novillo': 'Engorde',
    'novillos': 'Engorde',
  };
  return mapa[c] || 'Otra';
}

function buildStockTable_(stockList, campoFiltro) {
  const filtrado = campoFiltro ? stockList.filter(s => String(s.campo_id) === String(campoFiltro)) : stockList;
  if (!stockList.length) {
    return `<div class="empty-state"><span class="ico">◌</span><div class="msg">Cargando stock…</div></div>`;
  }
  const corralesDisponible = S.corralesStock && typeof S.corralesStock === 'object';
  const corralesPorCampo = corralesDisponible ? corralesStockPorCampoNombre_() : {};
  const nombreCampoFiltro = campoFiltro ? campoNombre(campoFiltro) : null;
  const corralesEnEsteFiltro = corralesDisponible
    ? (campoFiltro ? (corralesPorCampo[nombreCampoFiltro] || 0) : Object.values(corralesPorCampo).reduce((s, x) => s + x, 0))
    : 0;

  const totalGeneral = filtrado.reduce((s, x) => s + (Number(x.stock) || 0), 0) + corralesEnEsteFiltro;
  const porCategoria = {};
  filtrado.forEach(s => { porCategoria[s.categoria] = (porCategoria[s.categoria] || 0) + (Number(s.stock) || 0); });
  const porCampo = {};
  filtrado.forEach(s => {
    const nombreCampo = campoNombre(s.campo_id);
    porCampo[nombreCampo] = (porCampo[nombreCampo] || 0) + (Number(s.stock) || 0);
  });
  if (!campoFiltro && corralesDisponible) {
    Object.entries(corralesPorCampo).forEach(([campo, tot]) => {
      porCampo[campo] = (porCampo[campo] || 0) + tot;
    });
  }
  const ordenActividad = ['Cría', 'Recría', 'Engorde', 'Venta', 'Otra'];
  const porActividad = {};
  filtrado.forEach(s => {
    const act = actividadPorCategoria_(s.categoria);
    porActividad[act] = (porActividad[act] || 0) + (Number(s.stock) || 0);
  });
  if (corralesDisponible) {
    porActividad['Engorde'] = (porActividad['Engorde'] || 0) + corralesEnEsteFiltro;
  }
  const porActividadOrdenado = ordenActividad.filter(a => porActividad[a] !== undefined);
  const notaCorrales = S.corralesStock === undefined
    ? '<div style="font-size:12.5px;color:var(--text2);margin-bottom:8px">Cargando stock de Corrales…</div>'
    : (S.corralesStock === null
      ? '<div style="font-size:12.5px;color:var(--clay-text);margin-bottom:8px">⚠ No se pudo traer el stock de Corrales en este momento.</div>'
      : (corralesDisponible ? `<div style="font-size:12.5px;color:var(--text2);margin-bottom:8px">El total y Engorde incluyen ${fn(corralesEnEsteFiltro)} animales de Corrales (dato en vivo)${campoFiltro ? ' en este campo' : ''}.</div>` : ''));

  let h = `<div style="margin-bottom:16px">
    ${notaCorrales}
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px">
      <div style="background:var(--green-bg);color:var(--green-text);border-radius:9px;padding:8px 15px;font-size:14.5px;font-weight:700;white-space:nowrap">
        ⛭ Total: ${fn(totalGeneral)}
      </div>
      ${porActividadOrdenado.map(act => `
        <div style="background:var(--gold-bg, var(--bg2));color:var(--gold-text, var(--text2));border-radius:9px;padding:8px 15px;font-size:14.5px;font-weight:700;white-space:nowrap">
          ${act}: <strong>${fn(porActividad[act])}</strong>
        </div>
      `).join('')}
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px">
      ${Object.entries(porCategoria).map(([cat, tot]) => `
        <div style="background:var(--bg2);color:var(--text2);border-radius:9px;padding:8px 15px;font-size:14.5px;font-weight:600;white-space:nowrap">
          ${cat}: <strong style="color:var(--text)">${fn(tot)}</strong>
        </div>
      `).join('')}
    </div>
    ${!campoFiltro ? `<div style="display:flex;flex-wrap:wrap;gap:8px">
      ${Object.entries(porCampo).map(([campo, tot]) => `
        <div style="background:var(--bg2);color:var(--text2);border-radius:9px;padding:8px 15px;font-size:14.5px;font-weight:600;white-space:nowrap">
          📍 ${campo}: <strong style="color:var(--text)">${fn(tot)}</strong>
        </div>
      `).join('')}
    </div>` : ''}
  </div>`;
  h += `<div class="tw"><table class="dt"><thead><tr><th>Rodeo</th><th>Campo</th><th>Categoría</th><th class="tc">Stock</th></tr></thead><tbody>`;
  filtrado.forEach(s => {
    h += `<tr><td><strong>${s.nombre}</strong></td><td style="color:var(--text2)">${campoNombre(s.campo_id)}</td>
      <td><span class="pill pill-gray">${s.categoria}</span></td>
      <td class="tc"><strong>${fn(s.stock)}</strong></td></tr>`;
  });
  h += `</tbody></table></div>`;
  return h;
}

async function loadCorralesStock() {
  try {
    const res = await fetch('https://raw.githubusercontent.com/agroganaderalosmedanos/corrales/main/datos.json');
    const data = await res.json();
    const porCorral = {};
    (data.ingresos || []).forEach(x => { porCorral[x.cid] = (porCorral[x.cid] || 0) + (Number(x.cant) || 0); });
    (data.ventas || []).forEach(x => { porCorral[x.cid] = (porCorral[x.cid] || 0) - (Number(x.cant) || 0); });
    S.corralesStock = porCorral; // { cid: stock_actual }
  } catch (err) {
    S.corralesStock = null; // si falla la consulta, no se muestra el dato pero no rompe la página
  }
}

const CORRAL_CAMPO_NOMBRE_ = { '1': 'El Cencerro', '2': 'El Misterio', '3': 'El Misterio' };

function corralesStockPorCampoNombre_() {
  const out = {};
  if (S.corralesStock && typeof S.corralesStock === 'object') {
    Object.entries(S.corralesStock).forEach(([cid, stock]) => {
      const campo = CORRAL_CAMPO_NOMBRE_[cid] || 'Corral sin campo asignado';
      out[campo] = (out[campo] || 0) + stock;
    });
  }
  return out;
}

function buildEntityTable(items, cols, entity, idCol) {
  if (!items.length) {
    return '<div class="empty-state"><span class="ico">◌</span><div class="msg">Todavía no hay registros. Cargá el primero arriba.</div></div>';
  }
  if (!S.sort) S.sort = {};
  const sortState = S.sort[entity];
  let sortedItems = items;
  if (sortState) {
    sortedItems = [...items].sort((a, b) => {
      let va = a[sortState.key], vb = b[sortState.key];
      if (va == null) va = '';
      if (vb == null) vb = '';
      const na = Number(va), nb = Number(vb);
      const numeric = va !== '' && vb !== '' && !isNaN(na) && !isNaN(nb);
      const cmp = numeric ? (na - nb) : String(va).localeCompare(String(vb), 'es', { sensitivity: 'base' });
      return sortState.dir === 'asc' ? cmp : -cmp;
    });
  }
  let h = `<div class="section-label">Historial <span class="count-badge" style="margin-left:6px">${items.length}</span></div>
  <div class="tw"><table class="dt"><thead><tr>`;
  cols.forEach(c => {
    const activo = sortState && sortState.key === c.key;
    const flecha = activo ? (sortState.dir === 'asc' ? ' ▲' : ' ▼') : '';
    h += `<th class="sortable-th" onclick="sortEntityTable('${entity}','${c.key}')" style="cursor:pointer;user-select:none" title="Ordenar por ${c.label}">${c.label}${flecha}</th>`;
  });
  h += '<th></th></tr></thead><tbody>';
  sortedItems.forEach(item => {
    h += '<tr>';
    cols.forEach(c => h += `<td>${c.render ? c.render(item[c.key]) : (item[c.key] != null ? item[c.key] : '—')}</td>`);
    h += `<td><div class="row-actions">
      <button class="icon-btn" data-edit="${item[idCol]}" data-entity="${entity}" data-idcol="${idCol}" title="Editar">✎</button>
      <button class="icon-btn danger" data-del="${item[idCol]}" data-entity="${entity}" data-idcol="${idCol}" title="Eliminar">✕</button>
    </div></td>`;
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  return h;
}

function sortEntityTable(entity, key) {
  if (!S.sort) S.sort = {};
  const current = S.sort[entity];
  if (current && current.key === key) {
    current.dir = current.dir === 'asc' ? 'desc' : 'asc';
  } else {
    S.sort[entity] = { key, dir: 'asc' };
  }
  render();
}
function attachTableDeleteEvents(entity, idCol) {
  document.querySelectorAll('[data-del][data-entity="' + entity + '"]').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm('¿Eliminar este registro?')) return;
      try {
        await apiCall('delete', { body: { entity, id: btn.dataset.del } });
        invalidateCache(entity);
        toast('Registro eliminado', 'ok');
        await loadEntity(entity, true);
        await loadDashboard();
        if (entity === 'movimientos') { S.stock = null; await loadStock(); }
        render();
      } catch (err) { toast(err.message, 'err'); }
    };
  });
  document.querySelectorAll('[data-edit][data-entity="' + entity + '"]').forEach(btn => {
    btn.onclick = () => openEditModal(entity, idCol, btn.dataset.edit);
  });
}

// ── EDICIÓN GENÉRICA DE REGISTROS ───────────────────────────────────────
// Construye un modal de edición a partir del item crudo en S.cache[entity],
// infiriendo el tipo de campo por el nombre/valor de la clave.
function fieldInputType_(key, value) {
  if (key.includes('fecha')) return 'date';
  if (key === 'rodeo_id' || key === 'rodeo_origen_id' || key === 'rodeo_destino_id') return 'rodeo';
  if (key === 'campo_id' || key === 'campo_origen_id' || key === 'campo_destino_id') return 'campo';
  if (key === 'tipo' || key === 'tipo_tacto' || key === 'tipo_venta' || key === 'estado') return 'text';
  if (typeof value === 'number' || (!isNaN(value) && value !== '' && value !== null)) return 'number';
  return 'text';
}
function openEditModal(entity, idCol, id) {
  const items = S.cache[entity] || [];
  const item = items.find(i => String(i[idCol]) === String(id));
  if (!item) { toast('No se encontró el registro.', 'err'); return; }
  const keys = Object.keys(item).filter(k => k !== idCol);
  const rodeosL = rodeosTodos();
  const camposL = (S.catalogs && S.catalogs.campos) || [];

  let fieldsHtml = '';
  keys.forEach(k => {
    const type = fieldInputType_(k, item[k]);
    const fid = 'edit-' + k;
    if (type === 'rodeo') {
      fieldsHtml += `<div class="fg"><label>${k}</label>
        <select id="${fid}">${rodeosL.map(r => `<option value="${r.rodeo_id}" ${String(r.rodeo_id)===String(item[k])?'selected':''}>${r.nombre}</option>`).join('')}</select></div>`;
    } else if (type === 'campo') {
      fieldsHtml += `<div class="fg"><label>${k}</label>
        <select id="${fid}">${camposL.map(c => `<option value="${c.campo_id}" ${String(c.campo_id)===String(item[k])?'selected':''}>${c.nombre}</option>`).join('')}</select></div>`;
    } else if (type === 'date') {
      fieldsHtml += `<div class="fg"><label>${k}</label><input type="date" id="${fid}" value="${item[k]||''}"></div>`;
    } else if (type === 'number') {
      fieldsHtml += `<div class="fg"><label>${k}</label><input type="number" id="${fid}" value="${item[k]!=null?item[k]:''}"></div>`;
    } else {
      fieldsHtml += `<div class="fg"><label>${k}</label><input type="text" id="${fid}" value="${(item[k]!=null?item[k]:'').toString().replace(/"/g,'&quot;')}"></div>`;
    }
  });

  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-overlay" id="edit-modal-overlay">
      <div class="modal">
        <div class="modal-header"><h3>Editar registro</h3><button class="modal-close" id="edit-modal-close">✕</button></div>
        <div class="modal-body"><div class="fgrid">${fieldsHtml}</div></div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="edit-modal-cancel">Cancelar</button>
          <button class="btn btn-primary" id="edit-modal-save">Guardar cambios</button>
        </div>
      </div>
    </div>`);

  const closeModal = () => document.getElementById('edit-modal-overlay')?.remove();
  document.getElementById('edit-modal-close').onclick = closeModal;
  document.getElementById('edit-modal-cancel').onclick = closeModal;
  document.getElementById('edit-modal-save').onclick = async () => {
    const data = {};
    keys.forEach(k => {
      const el = document.getElementById('edit-' + k);
      if (!el) return;
      data[k] = el.tagName === 'SELECT' ? el.value : (el.type === 'number' ? Number(el.value) : el.value.trim());
    });
    const saveBtn = document.getElementById('edit-modal-save');
    saveBtn.disabled = true;
    try {
      await apiCall('update', { body: { entity, id, data } });
      invalidateCache(entity);
      toast('Registro actualizado', 'ok');
      await loadEntity(entity, true);
      await loadDashboard();
      if (entity === 'movimientos') { S.stock = null; await loadStock(); }
      closeModal();
      render();
    } catch (err) { toast(err.message, 'err'); saveBtn.disabled = false; }
  };
}


const LOGIN_API_URL = 'https://script.google.com/macros/s/AKfycbz-ahGdifI9FykD0r6hz47fjPZ6H5TwKWMOsCfW5f_M41oXneTffMk7CKz0svOgezSD_w/exec';
const LOGIN_TOKEN   = 'LosMedanos2026Cria';

function loginGetSession() {
  try { return JSON.parse(localStorage.getItem('lm_session') || 'null'); } catch(e) { return null; }
}
function loginSetSession(data) { localStorage.setItem('lm_session', JSON.stringify(data)); }
function loginClear() { localStorage.removeItem('lm_session'); location.reload(); }

function loginRequired(onSuccess) {
  const session = loginGetSession();
  if (session) { onSuccess(session); return; }
  showLoginScreen(onSuccess);
}

function showLoginScreen(onSuccess) {
  const overlay = document.createElement('div');
  overlay.className = 'login-overlay';
  overlay.innerHTML = `
    <div class="login-box">
      <div style="display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:20px">
      <img src="https://agroganaderalosmedanos.github.io/isologo.png" style="width:62px">
      <div>
        <div style="font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.10em;text-transform:uppercase">Agroganadera</div>
        <div style="font-family:var(--serif);font-size:22px;font-weight:700;color:var(--text);line-height:1.1">Los Médanos</div>
      </div>
    </div>
      <div class="login-sub" style="text-align:center;font-size:12px;color:var(--text3);margin-bottom:20px">Ingresá tus credenciales para continuar</div>
      <div class="login-field"><label>Usuario</label>
        <input type="text" id="li-user" placeholder="tu usuario" autocomplete="username">
      </div>
      <div class="login-field"><label>Contraseña</label>
        <input type="password" id="li-pass" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="login-btn" id="li-btn">Ingresar</button>
      <div class="login-error" id="li-err"></div>
    </div>`;
  document.body.appendChild(overlay);
  const btn = document.getElementById('li-btn');
  const userEl = document.getElementById('li-user');
  const passEl = document.getElementById('li-pass');
  const errEl  = document.getElementById('li-err');
  async function doLogin() {
    const usuario = userEl.value.trim();
    const password = passEl.value;
    if (!usuario || !password) { errEl.textContent = 'Completá usuario y contraseña.'; return; }
    btn.disabled = true; btn.textContent = 'Verificando…'; errEl.textContent = '';
    try {
      const url = LOGIN_API_URL + '?action=login&token=' + encodeURIComponent(LOGIN_TOKEN);
      const res = await fetch(url, { method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ usuario, password }) });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'Error al conectar');
      loginSetSession(json.data);
      overlay.remove();
      onSuccess(json.data);
    } catch(err) {
      errEl.textContent = err.message;
      btn.disabled = false; btn.textContent = 'Ingresar';
    }
  }
  btn.onclick = doLogin;
  passEl.onkeydown = e => { if (e.key === 'Enter') doLogin(); }

  userEl.onkeydown = e => { if (e.key === 'Enter') passEl.focus(); }
  setTimeout(() => userEl.focus(), 100);
}
loginRequired(session => { window.__lmSession = session; init(); });
</script>
