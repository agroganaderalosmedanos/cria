      <div class="fg" style="flex:0"><label>Moneda</label>
        <div class="radio-group" id="mb-moneda-group">
          <div class="radio-pill ${moneda === 'ARS' ? 'selected' : ''}" data-moneda="ARS">$ ARS</div>
          <div class="radio-pill ${moneda === 'USD' ? 'selected' : ''}" data-moneda="USD">U$D</div>
        </div>
      </div>
    </div>
  </div>`;

  if (!mb) {
    h += '<div class="empty-state"><span class="ico">◌</span><div class="msg">Elegí un período y calculá.</div></div>';
    return h;
  }

  if (moneda === 'USD' && !S.corralesTipoCambio) {
    h += '<div class="empty-state"><span class="ico">◌</span><div class="msg">No se pudo traer la cotización del dólar desde Corrales en este momento. Probá de nuevo en unos segundos, o cargá el tipo de cambio en Corrales primero.</div></div>';
    return h;
  }

  const vw = moneda === 'USD' ? vistaUsdMargenBruto_(mb) : null;
  const simb = moneda === 'USD' ? 'U$D ' : '$ ';
  const dec = moneda === 'USD' ? 2 : 0;
  const valIngresos = vw ? vw.total : mb.ingresos.total;
  const valEgresos = vw ? vw.insumos : mb.egresos.insumos;
  const valResultado = vw ? vw.resultado : mb.resultado;
  const valVentas = vw ? vw.ventas : mb.ingresos.ventas;
  const valCesion = vw ? vw.cesion : mb.ingresos.cesion_destete_ars;

  const resultadoPositivo = valResultado >= 0;
  h += `<div class="kpi-row">
    <div class="kpi-card accent-green">
      <div class="kpi-icon">↑</div><div class="kpi-label">Ingresos totales</div>
      <div class="kpi-value">${simb}${fn(valIngresos, dec)}</div>
      <div class="kpi-sub">Ventas + cesión por destete</div>
    </div>
    <div class="kpi-card accent-clay">
      <div class="kpi-icon">↓</div><div class="kpi-label">Egresos (insumos)</div>
      <div class="kpi-value">${simb}${fn(valEgresos, dec)}</div>
      <div class="kpi-sub">Alimentación y veterinaria consumida</div>
    </div>
    <div class="kpi-card ${resultadoPositivo ? 'accent-green' : 'accent-red'}">
      <div class="kpi-icon">${resultadoPositivo ? '✓' : '!'}</div><div class="kpi-label">Margen bruto</div>
      <div class="kpi-value">${simb}${fn(valResultado, dec)}</div>
      <div class="kpi-sub">${fd(mb.periodo.desde)} — ${fd(mb.periodo.hasta)}</div>
    </div>
  </div>`;
  if (vw && (vw.ventasSinCotizacion || vw.consumosSinCotizacion)) {
    h += `<div class="helper-text" style="margin-bottom:10px;color:var(--clay-text)">⚠ ${vw.ventasSinCotizacion ? vw.ventasSinCotizacion + ' venta(s) ' : ''}${vw.ventasSinCotizacion && vw.consumosSinCotizacion ? 'y ' : ''}${vw.consumosSinCotizacion ? vw.consumosSinCotizacion + ' consumo(s) ' : ''}sin cotización BNA cargada en Corrales para su fecha — quedaron fuera de este total en dólares.</div>`;
  }

  h += `<div class="panel">
    <div class="panel-title">Detalle de ingresos</div>
    <div class="fgrid">
      <div class="fg"><label>Ventas reales</label><div style="font-size:18px;font-weight:600">${simb}${fn(valVentas, dec)}</div><div class="helper-text">${mb.ingresos.cant_ventas} venta${mb.ingresos.cant_ventas === 1 ? '' : 's'}${mb.ingresos.ventas_sin_precio ? ' — ⚠ ' + mb.ingresos.ventas_sin_precio + ' sin precio cargado' : ''}</div></div>
      <div class="fg"><label>Cesión interna por destete</label><div style="font-size:18px;font-weight:600">${simb}${fn(valCesion, dec)}</div><div class="helper-text">${mb.ingresos.cant_destetes} destete${mb.ingresos.cant_destetes === 1 ? '' : 's'}${moneda === 'ARS' ? ' · ref. U$D ' + fn(mb.ingresos.cesion_destete_usd_ref, 2) : ''}${mb.ingresos.destetes_sin_precio_interno.length ? ' — ⚠ ' + mb.ingresos.destetes_sin_precio_interno.length + ' sin precio interno vigente' : ''}</div></div>
    </div>
  </div>`;

  h += `<div class="panel">
    <div class="panel-title">Detalle de ventas reales</div>`;
  if (!mb.ingresos.detalle_ventas.length) {
    h += '<div class="empty-state"><span class="ico">◌</span><div class="msg">Sin ventas en este período.</div></div>';
  } else {
    const filasVentas = vw ? vw.detalle_ventas : mb.ingresos.detalle_ventas;
    h += '<div class="tw"><table class="dt"><thead><tr><th>Fecha</th><th>Rodeo</th><th>Comprador</th><th class="tc">Cantidad</th><th class="tc">Precio/animal</th><th class="tc">Importe</th></tr></thead><tbody>';
    filasVentas.forEach(v => {
      const importeMostrado = vw ? v.importe_usd : v.importe;
      h += `<tr>
        <td>${fd(v.fecha)}</td>
        <td>${rodeoNombre(v.rodeo_id)}</td>
        <td>${v.comprador || '—'}</td>
        <td class="tc">${fn(v.cant_animales)}</td>
        <td class="tc">${v.precio_pactado ? simb + fn(vw ? v.precio_pactado_usd : v.precio_pactado, dec) : '<span class="pill pill-clay">sin precio</span>'}</td>
        <td class="tc"><strong>${importeMostrado == null ? '<span class="pill pill-clay">sin cotización</span>' : simb + fn(importeMostrado, dec)}</strong></td>
      </tr>`;
    });
    h += '</tbody></table></div>';
  }
  h += '</div>';

  h += `<div class="panel">
    <div class="panel-title">Detalle de cesiones por destete</div>`;
  if (!mb.ingresos.detalle_destetes.length) {
    h += '<div class="empty-state"><span class="ico">◌</span><div class="msg">Sin destetes en este período.</div></div>';
  } else {
    h += '<div class="tw"><table class="dt"><thead><tr><th>Fecha</th><th>Rodeo</th><th class="tc">Cant.</th><th class="tc">Peso prom.</th><th class="tc">Kg totales</th><th class="tc">' + (moneda === 'USD' ? 'U$D/kg usado' : '$/kg usado') + '</th><th class="tc">Valor</th></tr></thead><tbody>';
    mb.ingresos.detalle_destetes.forEach(d => {
      const precioUsado = moneda === 'USD' ? d.precio_usd_kg_usado : d.precio_ars_kg_usado;
      const valor = moneda === 'USD' ? d.valor_usd : d.valor_ars;
      h += `<tr>
        <td>${fd(d.fecha)}</td>
        <td>${rodeoNombre(d.rodeo_id)}</td>
        <td class="tc">${fn(d.total)}</td>
        <td class="tc">${fn(d.peso_prom_kg)} kg</td>
        <td class="tc">${fn(d.kg_total)} kg</td>
        <td class="tc">${d.sin_precio ? '<span class="pill pill-clay">sin precio vigente</span>' : simb + fn(precioUsado, dec === 0 ? 2 : dec)}</td>
        <td class="tc"><strong>${d.sin_precio ? '—' : simb + fn(valor, dec)}</strong></td>
      </tr>`;
    });
    h += '</tbody></table></div>';
  }
  h += '</div>';

  h += `<div class="panel">
    <div class="panel-title">Detalle de egresos por producto</div>`;
  const filasProducto = vw ? vw.detalle_por_producto : mb.egresos.detalle_por_producto;
  if (!filasProducto.length) {
    h += '<div class="empty-state"><span class="ico">◌</span><div class="msg">Sin consumos de insumos en este período.</div></div>';
  } else {
    h += '<div class="tw"><table class="dt"><thead><tr><th>Producto</th><th class="tc">Costo</th></tr></thead><tbody>';
    filasProducto.forEach(p => {
      h += `<tr><td>${p.producto}</td><td class="tc">${simb}${fn(p.costo, dec)}</td></tr>`;
    });

  }
  h += '</div>';

  h += `<div class="panel">
    <div class="panel-title">Costos diferidos — próxima campaña</div>
    <p class="helper-text" style="margin-bottom:14px">Gastos ya cargados en Insumos pero etiquetados con una campaña futura (ej. semen, sincronización para el próximo servicio) — no entran en el margen de este período, quedan acá hasta que los imputes al servicio al que corresponden. Siempre en pesos.</p>`;
  const diferidos = mb.egresos.diferidos_proxima_campana;
  if (!diferidos.length) {
    h += '<div class="empty-state"><span class="ico">◌</span><div class="msg">No hay gastos diferidos cargados.</div></div>';
  } else {
    diferidos.forEach(d => {
      h += `<div style="margin-bottom:16px">
        <div style="font-weight:700;font-size:14.5px;margin-bottom:4px">${d.campana} <span class="pill pill-gold" style="margin-left:6px">${d.cant_items} ítem${d.cant_items === 1 ? '' : 's'}</span></div>
        <div style="font-size:17px;font-weight:600;margin-bottom:6px">$ ${fn(d.total)}</div>
        <div class="tw"><table class="dt"><thead><tr><th>Fecha</th><th>Producto</th><th class="tc">Cantidad</th><th class="tc">Costo</th></tr></thead><tbody>`;
      d.detalle.forEach(it => {
        h += `<tr><td>${fd(it.fecha)}</td><td>${it.producto}</td><td class="tc">${fn(it.cantidad)}</td><td class="tc">$ ${fn(it.costo)}</td></tr>`;
      });
      h += '</tbody></table></div></div>';
    });
  }
  h += '</div>';

  return h;
}

function actualizarPreviewUsd_() {
  const preview = document.getElementById('pi-usd-preview');
  if (!preview) return;
  const fecha = document.getElementById('pi-fecha').value;
  const ars = Number(document.getElementById('pi-ars').value) || 0;
  if (!fecha || !ars) { preview.textContent = '—'; preview.style.color = 'var(--text2)'; return; }
  const tc = tipoCambioVigente_(fecha);
  if (!tc) {
    preview.textContent = 'Sin cotización en Corrales para esa fecha';
    preview.style.color = 'var(--clay-text)';
    return;
  }
  const usd = ars / Number(tc.valor);
  preview.innerHTML = `U$D ${fn(usd, 2)} <span style="font-size:11px;font-weight:400;color:var(--text3)">(cotización $${fn(tc.valor)} del ${fd(tc.fecha)})</span>`;
  preview.style.color = 'var(--text)';
}

function attachMargenBrutoEvents() {
  const save = document.getElementById('pi-save');
  if (save) save.onclick = async () => {
    const fecha = document.getElementById('pi-fecha').value;
    const ars = Number(document.getElementById('pi-ars').value) || 0;
    if (!fecha || !ars) { toast('Completá la fecha y el precio en pesos.', 'err'); return; }
    const tc = tipoCambioVigente_(fecha);
    let usd = '';
    if (tc) {
      usd = Math.round((ars / Number(tc.valor)) * 100) / 100;
    } else {
      toast('No hay cotización de dólar cargada en Corrales para esa fecha — se guarda solo en pesos.', 'err');
    }
    const data = {
      fecha_desde: fecha, precio_ars_kg: ars, precio_usd_kg: usd,
      observacion: document.getElementById('pi-obs').value.trim(),
    };
    save.disabled = true;
    try {
      await apiCall('create', { body: { entity: 'precios_internos', data } });
      invalidateCache('precios_internos');
      toast('Precio interno guardado', 'ok');
      await loadEntity('precios_internos', true);
      S.margenBruto = null;
      render();
    } catch (err) { toast(err.message, 'err'); } finally { save.disabled = false; }
  };
  attachTableDeleteEvents('precios_internos', 'precio_id');

  const presetSel = document.getElementById('mb-preset');
  if (presetSel) {
    const customMode = S.margenBrutoPeriodo && S.margenBrutoPeriodo.custom;
    presetSel.value = customMode ? 'custom' : (S.margenBrutoPeriodoPreset || 'anio');
    const toggleCustom = () => {
      const isCustom = presetSel.value === 'custom';
      document.getElementById('mb-desde-wrap').style.display = isCustom ? '' : 'none';
      document.getElementById('mb-hasta-wrap').style.display = isCustom ? '' : 'none';
    };
    toggleCustom();
    presetSel.onchange = toggleCustom;
  }
  const calcBtn = document.getElementById('mb-calcular');
  if (calcBtn) calcBtn.onclick = async () => {
    const preset = document.getElementById('mb-preset').value;
    if (preset === 'custom') {
      const desde = document.getElementById('mb-desde').value;
      const hasta = document.getElementById('mb-hasta').value;
      if (!desde || !hasta) { toast('Completá desde y hasta.', 'err'); return; }
      S.margenBrutoPeriodo = { desde, hasta, custom: true };
      S.margenBrutoPeriodoPreset = 'custom';
    } else {
      S.margenBrutoPeriodo = periodoPreset_(preset);
      S.margenBrutoPeriodoPreset = preset;
    }
    calcBtn.disabled = true;
    try { await calcularMargenBruto_(); render(); }
    catch (err) { toast(err.message, 'err'); }
    finally { calcBtn.disabled = false; }
  };

  document.querySelectorAll('#mb-moneda-group .radio-pill').forEach(p => p.onclick = () => {
    S.margenBrutoMoneda = p.dataset.moneda;
    render();
  });
}

function buildEntityTable(items, cols, entity, idCol) {
  if (!items.length) {
    return '<div class="empty-state"><span class="ico">◌</span><div class="msg">Todavía no hay registros. Cargá el primero arriba.</div></div>';
  }
  if (!S.sort) S.sort = {};
  const sortState = S.sort[entity];
  let sortedItems = items;
  if (sortState) {
    sortedItems = [...items].sort((a, b) => {
      let va = a[sortState.key], vb = b[sortState.key];
      if (va == null) va = '';
      if (vb == null) vb = '';
      const na = Number(va), nb = Number(vb);
      const numeric = va !== '' && vb !== '' && !isNaN(na) && !isNaN(nb);
      const cmp = numeric ? (na - nb) : String(va).localeCompare(String(vb), 'es', { sensitivity: 'base' });
      return sortState.dir === 'asc' ? cmp : -cmp;
    });
  }
  let h = `<div class="section-label">Historial <span class="count-badge" style="margin-left:6px">${items.length}</span></div>
  <div class="tw"><table class="dt"><thead><tr>`;
  cols.forEach(c => {
    const activo = sortState && sortState.key === c.key;
    const flecha = activo ? (sortState.dir === 'asc' ? ' ▲' : ' ▼') : '';
    h += `<th class="sortable-th" onclick="sortEntityTable('${entity}','${c.key}')" style="cursor:pointer;user-select:none" title="Ordenar por ${c.label}">${c.label}${flecha}</th>`;
  });
  h += '<th></th></tr></thead><tbody>';
  sortedItems.forEach(item => {
    h += '<tr>';
    cols.forEach(c => h += `<td>${c.render ? c.render(item[c.key]) : (item[c.key] != null ? item[c.key] : '—')}</td>`);
    h += `<td><div class="row-actions">
      <button class="icon-btn" data-edit="${item[idCol]}" data-entity="${entity}" data-idcol="${idCol}" title="Editar">✎</button>
      <button class="icon-btn danger" data-del="${item[idCol]}" data-entity="${entity}" data-idcol="${idCol}" title="Eliminar">✕</button>
    </div></td>`;
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  return h;
}

function sortEntityTable(entity, key) {
  if (!S.sort) S.sort = {};
  const current = S.sort[entity];
  if (current && current.key === key) {
    current.dir = current.dir === 'asc' ? 'desc' : 'asc';
  } else {
    S.sort[entity] = { key, dir: 'asc' };
  }
  render();
}
function attachTableDeleteEvents(entity, idCol) {
  document.querySelectorAll('[data-del][data-entity="' + entity + '"]').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm('¿Eliminar este registro?')) return;
      try {
        await apiCall('delete', { body: { entity, id: btn.dataset.del } });
        invalidateCache(entity);
        toast('Registro eliminado', 'ok');
        await loadEntity(entity, true);
        await loadDashboard();
        if (entity === 'movimientos' || entity === 'ventas') { S.stock = null; await loadStock(); }
        if (entity === 'compras_insumos' || entity === 'consumos_insumos') { S.stockProductos = null; await loadStockProductos(); }
        if (entity === 'precios_internos' || entity === 'destetes' || entity === 'ventas') { S.margenBruto = null; }
        if (entity === 'productos') { await loadCatalogs(); S.stockProductos = null; await loadStockProductos(); }
        render();
      } catch (err) { toast(err.message, 'err'); }
    };
  });
  document.querySelectorAll('[data-edit][data-entity="' + entity + '"]').forEach(btn => {
    btn.onclick = () => openEditModal(entity, idCol, btn.dataset.edit);
  });
}

// ── EDICIÓN GENÉRICA DE REGISTROS ───────────────────────────────────────
// Construye un modal de edición a partir del item crudo en S.cache[entity],
// infiriendo el tipo de campo por el nombre/valor de la clave.
function fieldInputType_(key, value) {
  if (key.includes('fecha')) return 'date';
  if (key === 'rodeo_id' || key === 'rodeo_origen_id' || key === 'rodeo_destino_id') return 'rodeo';
  if (key === 'campo_id' || key === 'campo_origen_id' || key === 'campo_destino_id') return 'campo';
  if (key === 'activo' || key === 'por_campo') return 'boolean';
  if (key === 'tipo' || key === 'tipo_tacto' || key === 'tipo_venta' || key === 'estado') return 'text';
  if (typeof value === 'number' || (!isNaN(value) && value !== '' && value !== null)) return 'number';
  return 'text';
}
function openEditModal(entity, idCol, id) {
  const items = S.cache[entity] || [];
  const item = items.find(i => String(i[idCol]) === String(id));
  if (!item) { toast('No se encontró el registro.', 'err'); return; }
  const keys = Object.keys(item).filter(k => k !== idCol);
  const rodeosL = rodeosTodos();
  const camposL = (S.catalogs && S.catalogs.campos) || [];

  let fieldsHtml = '';
  keys.forEach(k => {
    const type = fieldInputType_(k, item[k]);
    const fid = 'edit-' + k;
    if (type === 'rodeo') {
      fieldsHtml += `<div class="fg"><label>${k}</label>
        <select id="${fid}">${rodeosL.map(r => `<option value="${r.rodeo_id}" ${String(r.rodeo_id)===String(item[k])?'selected':''}>${r.nombre}</option>`).join('')}</select></div>`;
    } else if (type === 'campo') {
      fieldsHtml += `<div class="fg"><label>${k}</label>
        <select id="${fid}"><option value="">—</option>${camposL.map(c => `<option value="${c.campo_id}" ${String(c.campo_id)===String(item[k])?'selected':''}>${c.nombre}</option>`).join('')}</select></div>`;
    } else if (type === 'boolean') {
      const esTrue = item[k] === true || String(item[k]).toLowerCase() === 'true';
      fieldsHtml += `<div class="fg"><label>${k}</label>
        <select id="${fid}"><option value="true" ${esTrue?'selected':''}>Sí</option><option value="false" ${!esTrue?'selected':''}>No</option></select></div>`;
    } else if (type === 'date') {
      fieldsHtml += `<div class="fg"><label>${k}</label><input type="date" id="${fid}" value="${item[k]||''}"></div>`;
    } else if (type === 'number') {
      fieldsHtml += `<div class="fg"><label>${k}</label><input type="number" id="${fid}" value="${item[k]!=null?item[k]:''}"></div>`;
    } else {
      fieldsHtml += `<div class="fg"><label>${k}</label><input type="text" id="${fid}" value="${(item[k]!=null?item[k]:'').toString().replace(/"/g,'&quot;')}"></div>`;
    }
  });

  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-overlay" id="edit-modal-overlay">
      <div class="modal">
        <div class="modal-header"><h3>Editar registro</h3><button class="modal-close" id="edit-modal-close">✕</button></div>
        <div class="modal-body"><div class="fgrid">${fieldsHtml}</div></div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="edit-modal-cancel">Cancelar</button>
          <button class="btn btn-primary" id="edit-modal-save">Guardar cambios</button>
        </div>
      </div>
    </div>`);

  const closeModal = () => document.getElementById('edit-modal-overlay')?.remove();
  document.getElementById('edit-modal-close').onclick = closeModal;
  document.getElementById('edit-modal-cancel').onclick = closeModal;
  document.getElementById('edit-modal-save').onclick = async () => {
    const data = {};
    keys.forEach(k => {
      const el = document.getElementById('edit-' + k);
      if (!el) return;
      const type = fieldInputType_(k, item[k]);
      if (type === 'boolean') { data[k] = el.value === 'true'; return; }
      data[k] = el.tagName === 'SELECT' ? el.value : (el.type === 'number' ? Number(el.value) : el.value.trim());
    });
    const saveBtn = document.getElementById('edit-modal-save');
    saveBtn.disabled = true;
    try {
      await apiCall('update', { body: { entity, id, data } });
      invalidateCache(entity);
      toast('Registro actualizado', 'ok');
      await loadEntity(entity, true);
      await loadDashboard();
      if (entity === 'movimientos') { S.stock = null; await loadStock(); }
      if (entity === 'precios_internos' || entity === 'destetes' || entity === 'ventas') { S.margenBruto = null; }
      if (entity === 'compras_insumos' || entity === 'consumos_insumos') { S.stockProductos = null; await loadStockProductos(); }
      if (entity === 'productos') { await loadCatalogs(); S.stockProductos = null; await loadStockProductos(); }
      closeModal();
      render();
    } catch (err) { toast(err.message, 'err'); saveBtn.disabled = false; }
  };
}


const LOGIN_API_URL = 'https://script.google.com/macros/s/AKfycbz-ahGdifI9FykD0r6hz47fjPZ6H5TwKWMOsCfW5f_M41oXneTffMk7CKz0svOgezSD_w/exec';
const LOGIN_TOKEN   = 'LosMedanos2026Cria';

function loginGetSession() {
  try { return JSON.parse(localStorage.getItem('lm_session') || 'null'); } catch(e) { return null; }
}
function loginSetSession(data) { localStorage.setItem('lm_session', JSON.stringify(data)); }
function loginClear() { localStorage.removeItem('lm_session'); location.reload(); }

function loginRequired(onSuccess) {
  const session = loginGetSession();
  if (session) { onSuccess(session); return; }
  showLoginScreen(onSuccess);
}

function showLoginScreen(onSuccess) {
  const overlay = document.createElement('div');
  overlay.className = 'login-overlay';
  overlay.innerHTML = `
    <div class="login-box">
      <div style="display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:20px">
      <img src="https://agroganaderalosmedanos.github.io/isologo.png" style="width:62px">
      <div>
        <div style="font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.10em;text-transform:uppercase">Agroganadera</div>
        <div style="font-family:var(--serif);font-size:22px;font-weight:700;color:var(--text);line-height:1.1">Los Médanos</div>
      </div>
    </div>
      <div class="login-sub" style="text-align:center;font-size:12px;color:var(--text3);margin-bottom:20px">Ingresá tus credenciales para continuar</div>
      <div class="login-field"><label>Usuario</label>
        <input type="text" id="li-user" placeholder="tu usuario" autocomplete="username">
      </div>
      <div class="login-field"><label>Contraseña</label>
        <input type="password" id="li-pass" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="login-btn" id="li-btn">Ingresar</button>
      <div class="login-error" id="li-err"></div>
    </div>`;
  document.body.appendChild(overlay);
  const btn = document.getElementById('li-btn');
  const userEl = document.getElementById('li-user');
  const passEl = document.getElementById('li-pass');
  const errEl  = document.getElementById('li-err');
  async function doLogin() {
    const usuario = userEl.value.trim();
    const password = passEl.value;
    if (!usuario || !password) { errEl.textContent = 'Completá usuario y contraseña.'; return; }
    btn.disabled = true; btn.textContent = 'Verificando…'; errEl.textContent = '';
    try {
      const url = LOGIN_API_URL + '?action=login&token=' + encodeURIComponent(LOGIN_TOKEN);
      const res = await fetch(url, { method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ usuario, password }) });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'Error al conectar');
      loginSetSession(json.data);
      overlay.remove();
      onSuccess(json.data);
    } catch(err) {
      errEl.textContent = err.message;
      btn.disabled = false; btn.textContent = 'Ingresar';
    }
  }
  btn.onclick = doLogin;
  passEl.onkeydown = e => { if (e.key === 'Enter') doLogin(); }

  userEl.onkeydown = e => { if (e.key === 'Enter') passEl.focus(); }
  setTimeout(() => userEl.focus(), 100);
}
loginRequired(session => { window.__lmSession = session; init(); });
</script>
