    // ── Conciliación de Existencia consolidada (cabezas) ────────────────────
    // Las cesiones entre Cría/Recría/Terminación deberían cancelarse entre sí acá
    // (lo que una envía, otra la recibe) — si no cancelan del todo, es señal de que
    // alguna cesión fue a parar a un rodeo que ninguna de las tres actividades
    // reconoce como propio.
    h += buildConciliacionCabezas_('Consolidado (Cría + Recría + Terminación)', {
      ei: eiCabTotal,
      compras: (rCria.detalle.comprasCab||0) + (rRec.detalle.comprasCab||0) + (rEng.detalle.comprasCab||0),
      cesionesRecibidas: (rCria.detalle.cesRecCab||0) + (rRec.detalle.cesRecCab||0) + (rEng.detalle.cesRecCab||0),
      nacimientos: nacCabTotal,
      cesionesEnviadas: (rCria.detalle.cesEnvCab||0) + (rRec.detalle.cesEnvCab||0) + (rEng.detalle.cesEnvCab||0),
      ventas: (rCria.detalle.ventasCab||0) + (rRec.detalle.ventasCab||0) + (rEng.detalle.ventasCab||0),
      mortandad: (rCria.detalle.mortCab||0) + (rRec.detalle.mortCab||0) + (rEng.detalle.mortCab||0),
    }, efCabTotal);


    // ── INDICADORES PRODUCTIVOS Y SANITARIOS ───────────────────────────────
    const pariciones = S.cache.pariciones || [];
    const pariVivosTot = pariciones.reduce((s,p)=>s+(Number(p.nacidos_vivos)||0),0);
    const pariMuertosTot = pariciones.reduce((s,p)=>s+(Number(p.nacidos_muertos)||0),0);

    const rodeosEngGDP = rodeosEngordeValidos_();
    const gdpsRep = [];
    rodeosEngGDP.forEach(r => { const g = egGanDiaria_(r.rodeo_id); if (g!==null && g!==undefined && !isNaN(g)) gdpsRep.push(g); });
    const gdpPromRep = gdpsRep.length ? gdpsRep.reduce((s,v)=>s+v,0)/gdpsRep.length : null;
    const efCabEng = rEng.detalle.efCab||0;

    const kpiGeneral = S.dashboard && S.dashboard.general;
    const indicePrenez = kpiGeneral && kpiGeneral.servicio ? kpiGeneral.servicio.indice_prenez : null;
    const totPrenadas = kpiGeneral && kpiGeneral.servicio ? (kpiGeneral.servicio.total_prenadas||0) : 0;

    function tarjetaInd_(icono, label, valor, sub, color) {
      return `<div style="background:var(--bg2);border-radius:8px;padding:10px 12px;flex:1;min-width:120px">
        <div style="font-size:15px;margin-bottom:2px">${icono}</div>
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--text3);letter-spacing:.03em">${label}</div>
        <div style="font-size:16px;font-weight:800;margin-top:2px;color:${color||'var(--text)'}">${valor}</div>
        ${sub?`<div style="font-size:10px;color:var(--text3);margin-top:2px;line-height:1.4">${sub}</div>`:''}
      </div>`;
    }

    h += `<div class="panel">
      <div class="panel-title">🩺 Indicadores productivos y sanitarios</div>
      <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px">
        ${tarjetaInd_('🐮','Índice de preñez', indicePrenez!==null&&indicePrenez!==undefined?indicePrenez+'%':'—', 'Global de servicio')}
        ${tarjetaInd_('✦','Pariciones (vivos)', fn(pariVivosTot), pariMuertosTot>0?`${fn(pariMuertosTot)} nacidos muertos`:'Sin nacidos muertos')}
        ${tarjetaInd_('💀','Mortandad', fn(mortTot)+' cab.',
            (mortTot>0?'Cría · Recría · Terminación':'Sin bajas registradas') +
            `<br><span style="font-size:10px;opacity:.8">sobre Exist. Final: ${fn(efCabTotal)} cab.</span>`,
            mortTot>0?'var(--red-text)':'var(--green-text)')}
        ${tarjetaInd_('⊘','Abortos', fn(abortTot),
            (abortTot>0?'Cría · Recría':'Sin abortos registrados') +
            (totPrenadas>0?`<br><span style="font-size:10px;opacity:.8">sobre ${fn(totPrenadas)} preñadas (vaca+vaquillona)</span>`:''),
            abortTot>0?'var(--clay-text)':'var(--green-text)')}
        ${tarjetaInd_('⚖','GDP Terminación', gdpPromRep!==null?fn(gdpPromRep,3)+' kg/día':'—', gdpPromRep!==null?`Promedio ${gdpsRep.length} de ${rodeosEngGDP.length} corrales${gdpsRep.length<rodeosEngGDP.length?' (resto sin pesadas suficientes)':''}`:'Sin pesadas suficientes')}
        ${tarjetaInd_('🏭','Existencia en Terminación', fn(efCabEng)+' cab.', 'Al '+fd(corteGlobal))}
      </div>
    </div>`;

    // ── VENTAS Y STOCK POR CATEGORÍA ─────────────────────────────────────────
    // Se reutiliza calcStockHacienda_ (misma lógica que Stock de Hacienda) solo
    // para obtener ventas y stock final agrupados por categoría. No se compara
    // ventas contra la Existencia Inicial: un animal puede cambiar de categoría
    // entre el inicio del período y el momento de la venta (ternero → novillito
    // → novillo), así que "% sobre EI" distorsiona — lo que sí es comparable es
    // la participación de cada categoría sobre el total vendido o sobre el
    // stock actual.
    let ventasCatRows = [];
    let stockCatRows = [];
    try {
      const dataCat = calcStockHacienda_('2000-01-01', corteGlobal, null, false);
      // Los rodeos "X venta" (ej. "Vaca venta") son un bucket logístico para
      // hacienda ya apartada para la venta — se agrupan con su categoría base.
      const CATSKNOWN = ['Toro','Vaca','Vaquillona','Vaquillona proximo servicio','Vaquilloncita','Novillito','Ternero','Ternera','Novillo'];
      const mergedCat = {};
      Object.values(dataCat.filas).forEach(f => {
        let key = f.categoria;
        const low = key.toLowerCase();
        if (low.indexOf('venta') !== -1) {
          const base = low.replace(/venta/g,'').trim();
          const match = CATSKNOWN.find(c => c.toLowerCase() === base);
          key = match || (base.charAt(0).toUpperCase()+base.slice(1));
        }
        if (!mergedCat[key]) mergedCat[key] = { categoria: key, ventas:0, sf:0 };
        mergedCat[key].ventas += f.ventas;
        mergedCat[key].sf += f.sf;
      });
      ventasCatRows = Object.values(mergedCat)
        .filter(f => f.ventas > 0)
        .sort((a,b)=>b.ventas-a.ventas);
      stockCatRows = Object.values(mergedCat)
        .filter(f => f.sf > 0)
        .sort((a,b)=>b.sf-a.sf);
    } catch (err) { ventasCatRows = []; stockCatRows = []; }

    if (stockCatRows.length) {
      const totStockCat = stockCatRows.reduce((s,r)=>s+r.sf,0);
      h += `<div class="panel">
        <div class="panel-title">📦 Stock por categoría — al ${fd(corteGlobal)}</div>
        <table class="dt"><thead><tr><th>Categoría</th><th class="tc">Cabezas</th><th class="tc">% del stock total</th></tr></thead><tbody>
          ${stockCatRows.map(r=>`<tr>
            <td style="font-weight:600">${r.categoria}</td>
            <td class="tc">${fn(r.sf)}</td>
            <td class="tc">${(r.sf/totStockCat*100).toFixed(1)}%</td>
          </tr>`).join('')}
          <tr style="background:var(--bg2);font-weight:800">
            <td>Total</td>
            <td class="tc">${fn(totStockCat)}</td>
            <td class="tc">100.0%</td>
          </tr>
        </tbody></table>
      </div>`;
    }

    if (ventasCatRows.length) {
      const totVentasCat = ventasCatRows.reduce((s,r)=>s+r.ventas,0);
      h += `<div class="panel">
        <div class="panel-title">🐄 Ventas por categoría</div>
        <table class="dt"><thead><tr><th>Categoría</th><th class="tc">Cabezas vendidas</th><th class="tc">% del total vendido</th></tr></thead><tbody>
          ${ventasCatRows.map(r=>`<tr>
            <td style="font-weight:600">${r.categoria}</td>
            <td class="tc">${fn(r.ventas)}</td>
            <td class="tc">${(r.ventas/totVentasCat*100).toFixed(1)}%</td>
          </tr>`).join('')}
          <tr style="background:var(--bg2);font-weight:800">
            <td>Total</td>
            <td class="tc">${fn(totVentasCat)}</td>
            <td class="tc">100.0%</td>
          </tr>
        </tbody></table>
      </div>`;
    }

    // ── DETALLE DE INGRESOS Y EGRESOS POR ACTIVIDAD ─────────────────────────
    // Se agrega acá (además de en la pestaña "Resultado económico") para que
    // el Reporte Directorio impreso/PDF quede completo y permita rastrear
    // diferencias entre dos informes línea por línea, sin tener que cambiar
    // de pestaña y volver a imprimir.
    h += '<div class="section-label" style="margin-top:4px">💵 Detalle de Ingresos y Egresos por actividad</div>';
    h += buildDetalleIngresosEgresosPorActividad_();

    // ── ANÁLISIS ────────────────────────────────────────────────────────
    const actsOrdenadas = acts.slice().sort((a,b)=>b.margen-a.margen);
    const mejorAct = actsOrdenadas[0];
    const peorAct  = actsOrdenadas[actsOrdenadas.length-1];
    const tendenciaTxt = deltaCab>0
      ? `la existencia total de hacienda creció ${fn(deltaCab)} cabezas (${deltaCabPct!==null?deltaCabPct.toFixed(1):'—'}%) respecto del inicio del período`
      : deltaCab<0
        ? `la existencia total de hacienda se redujo en ${fn(Math.abs(deltaCab))} cabezas (${deltaCabPct!==null?Math.abs(deltaCabPct).toFixed(1):'—'}%) respecto del inicio del período`
        : `la existencia total de hacienda se mantuvo estable respecto del inicio del período`;
    const sanidadTxt = (mortTot>0||abortTot>0)
      ? `En materia sanitaria se registraron ${mortTot>0?fn(mortTot)+' bajas por mortandad':''}${mortTot>0&&abortTot>0?' y ':''}${abortTot>0?fn(abortTot)+' abortos':''}, un punto a monitorear de cerca.`
      : `No se registraron pérdidas por mortandad ni abortos en el período, un resultado sanitario sólido.`;
    const gdpTxt = gdpPromRep!==null ? ` En Terminación, la ganancia diaria de peso promedio fue de ${fn(gdpPromRep,3)} kg/día.` : '';

    const bulletsAnalisis = [
      `Al ${fd(corteGlobal)}, el resultado consolidado de Agroganadera Los Médanos arroja una utilidad ${marTotal>=0?'':'negativa '}de ${fmMB(Math.abs(marTotal))} sobre ingresos totales de ${fmMB(ingTotal)}, equivalente a un margen del ${margenPct.toFixed(1)}% sobre ingresos.`,
      `${mejorAct.emoji} ${mejorAct.nombre} fue la actividad más rentable del período con ${fmMB(mejorAct.margen)}${peorAct.margen<0?`, mientras que ${peorAct.emoji} ${peorAct.nombre} cerró con un resultado negativo de ${fmMB(Math.abs(peorAct.margen))}`:''}.`,
      `En cuanto a la hacienda, ${tendenciaTxt}, con ${fn(pariVivosTot)} nacimientos vivos registrados en el período${pariMuertosTot>0?` (y ${fn(pariMuertosTot)} nacidos muertos)`:''}.`,
      sanidadTxt,
    ];
    if (gdpTxt) bulletsAnalisis.push(gdpTxt.trim());

    h += `<div class="panel" style="background:linear-gradient(135deg,var(--bg2),var(--bg))">
      <div class="panel-title">🧭 Análisis</div>
      <ul style="font-size:14px;line-height:1.7;color:var(--text2);margin:0;padding-left:20px">
        ${bulletsAnalisis.map(b=>`<li>${b}</li>`).join('')}
      </ul>
    </div>`;

    // ── Pie del informe: fecha real de generación + versión del sistema.
    // Fundamental para poder comparar dos PDFs viejos entre sí — la fecha de
    // CORTE (arriba, en el encabezado) puede ser la misma en dos informes,
    // pero si se generaron con versiones distintas del sistema, los cálculos
    // de EI/EF pueden diferir aunque los datos de Sheets no hayan cambiado.
    h += `<div style="text-align:center;font-size:11px;color:var(--text3);margin-top:18px;padding-top:14px;border-top:1px solid var(--border)">
      Agroganadera Los Médanos · Informe generado el ${fd(today())} · Versión del sistema: ${APP_VERSION} · Uso interno y para inversores
    </div>`;

    return h;
  }

  // Detalle de Ingresos y Egresos por actividad (Cría / Recría / Terminación) —
  // se usa tanto en la pestaña "Resultado económico" como en el "Reporte
  // Directorio" (imprimible), para que el PDF también quede completo y se
  // puedan rastrear diferencias entre dos informes línea por línea.
  function buildDetalleIngresosEgresosPorActividad_() {
    return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px">
      <div class="panel" style="margin-bottom:0">
        <div class="panel-title" style="color:var(--green-text)">📈 Ingresos totales</div>
        <table class="dt"><tbody>
          <tr style="font-weight:600;background:var(--bg2)"><td colspan="2">🐄 Cría</td></tr>
          <tr><td style="padding-left:16px">Ventas (${rCria.detalle.cantVentas})</td><td class="tr">${fmMB(rCria.detalle.ingVentas)}</td></tr>
          <tr><td style="padding-left:16px">Cesiones a Recría</td><td class="tr">${fmMB(rCria.detalle.ingCesiones)}</td></tr>
          <tr><td style="padding-left:16px">Stock valorizado (EF)</td><td class="tr">${fmMB(rCria.detalle.ef)}</td></tr>
          <tr style="background:var(--green-bg)"><td><strong>Subtotal Cría</strong></td><td class="tr"><strong>${fmMB(rCria.ing)}</strong></td></tr>
          <tr style="font-weight:600;background:var(--bg2)"><td colspan="2">🌱 Recría</td></tr>
          <tr><td style="padding-left:16px">Ventas</td><td class="tr">${fmMB(rRec.detalle.ingVentas)}</td></tr>
          <tr><td style="padding-left:16px">Cesiones a Terminación</td><td class="tr">${fmMB(rRec.detalle.ingCesEng)}</td></tr>
          <tr><td style="padding-left:16px">Stock valorizado (EF)</td><td class="tr">${fmMB(rRec.detalle.ef)}</td></tr>
          <tr style="background:var(--green-bg)"><td><strong>Subtotal Recría</strong></td><td class="tr"><strong>${fmMB(rRec.ing)}</strong></td></tr>
          <tr style="font-weight:600;background:var(--bg2)"><td colspan="2">🏭 Terminación</td></tr>
          <tr><td style="padding-left:16px">Ventas</td><td class="tr">${fmMB(rEng.detalle.ingVentas)}</td></tr>
          <tr><td style="padding-left:16px">Stock valorizado (EF)</td><td class="tr">${fmMB(rEng.detalle.ef)}</td></tr>
          <tr style="background:var(--green-bg)"><td><strong>Subtotal Terminación</strong></td><td class="tr"><strong>${fmMB(rEng.ing)}</strong></td></tr>
          <tr style="font-size:15px;background:var(--green-bg)"><td><strong>TOTAL INGRESOS</strong></td><td class="tr" style="color:var(--green)"><strong>${fmMB(ingTotal)}</strong></td></tr>
        </tbody></table>
      </div>
      <div class="panel" style="margin-bottom:0">
        <div class="panel-title" style="color:var(--red)">📉 Egresos totales</div>
        <table class="dt"><tbody>
          <tr style="font-weight:600;background:var(--bg2)"><td colspan="2">🐄 Cría</td></tr>
          <tr><td style="padding-left:16px">Stock inicial (EI)</td><td class="tr">${fmMB(rCria.detalle.ei)}</td></tr>
          <tr><td style="padding-left:16px">Compras hacienda</td><td class="tr">${fmMB(rCria.detalle.compras)}</td></tr>
          <tr><td style="padding-left:16px">Alimentación</td><td class="tr">${fmMB(rCria.detalle.egAlim)}</td></tr>
          <tr><td style="padding-left:16px">Veterinaria</td><td class="tr">${fmMB(rCria.detalle.egVet)}</td></tr>
          <tr><td style="padding-left:16px">Sueldos</td><td class="tr">${fmMB(rCria.detalle.egSueldos)}</td></tr>
          <tr style="background:rgba(220,50,50,0.06)"><td><strong>Subtotal Cría</strong></td><td class="tr"><strong>${fmMB(rCria.eg)}</strong></td></tr>
          <tr style="font-weight:600;background:var(--bg2)"><td colspan="2">🌱 Recría</td></tr>
          <tr><td style="padding-left:16px">Stock inicial (EI)</td><td class="tr">${fmMB(rRec.detalle.ei)}</td></tr>
          <tr><td style="padding-left:16px">Cesión recibida de Cría</td><td class="tr">${fmMB(rRec.detalle.egCesionCria)}</td></tr>
          ${rRec.detalle.egCompraExt>0?`<tr><td style="padding-left:16px">Compra externa</td><td class="tr">${fmMB(rRec.detalle.egCompraExt)}</td></tr>`:''}
          <tr><td style="padding-left:16px">Alimentación</td><td class="tr">${fmMB(rRec.detalle.egAlim)}</td></tr>
          <tr><td style="padding-left:16px">Veterinaria</td><td class="tr">${fmMB(rRec.detalle.egVet)}</td></tr>
          <tr><td style="padding-left:16px">Sueldos</td><td class="tr">${fmMB(rRec.detalle.egSueldos)}</td></tr>
          <tr style="background:rgba(220,50,50,0.06)"><td><strong>Subtotal Recría</strong></td><td class="tr"><strong>${fmMB(rRec.eg)}</strong></td></tr>
          <tr style="font-weight:600;background:var(--bg2)"><td colspan="2">🏭 Terminación</td></tr>
          <tr><td style="padding-left:16px">Stock inicial (EI)</td><td class="tr">${fmMB(rEng.detalle.ei)}</td></tr>
          <tr><td style="padding-left:16px">Cesión recibida de Recría</td><td class="tr">${fmMB(rEng.detalle.egCesiones)}</td></tr>
          <tr><td style="padding-left:16px">Compra de hacienda</td><td class="tr">${fmMB(rEng.detalle.egCompras)}</td></tr>
          <tr><td style="padding-left:16px">Alimentación</td><td class="tr">${fmMB(rEng.detalle.egAlim)}</td></tr>
          <tr><td style="padding-left:16px">Veterinaria</td><td class="tr">${fmMB(rEng.detalle.egVet)}</td></tr>
          ${rEng.detalle.egOtros>0?`<tr><td style="padding-left:16px">Otros insumos</td><td class="tr">${fmMB(rEng.detalle.egOtros)}</td></tr>`:''}
          <tr><td style="padding-left:16px">Sueldos</td><td class="tr">${fmMB(rEng.detalle.egSueldos)}</td></tr>
          <tr style="background:rgba(220,50,50,0.06)"><td><strong>Subtotal Terminación</strong></td><td class="tr"><strong>${fmMB(rEng.eg)}</strong></td></tr>
          <tr style="font-size:15px;background:rgba(220,50,50,0.1)"><td><strong>TOTAL EGRESOS</strong></td><td class="tr" style="color:var(--red)"><strong>${fmMB(egTotal)}</strong></td></tr>
        </tbody></table>
      </div>
    </div>`;
  }

  if (tabMB === 'resultado') {
    h += buildDetalleIngresosEgresosPorActividad_();

    h += `<div class="panel" style="background:${mb2};border:2px solid ${mc};margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:${mc}">Margen bruto ganadero total</div>
          <div style="font-size:12px;color:${mc};margin-top:2px">Al ${fd(corteGlobal)}</div>
        </div>
        <div style="font-size:36px;font-weight:800;color:${mc}">${marTotal>=0?'':'-'}${fmMB(Math.abs(marTotal))}</div>
      </div>
    </div>`;

    // Verificación
    h += `<div class="panel" style="padding:14px 16px">
      <div class="panel-title" style="font-size:12px">🔍 Verificación — suma de los 3 márgenes individuales</div>
      <div class="tw"><table class="dt"><tbody>
        <tr><td>🐄 Cría</td><td class="tr" style="color:${rCria.margen>=0?'var(--green)':'var(--red)'};font-weight:600">${rCria.margen>=0?'':'-'}${fmMB(Math.abs(rCria.margen))}</td></tr>
        <tr><td>🌱 Recría</td><td class="tr" style="color:${rRec.margen>=0?'var(--green)':'var(--red)'};font-weight:600">${rRec.margen>=0?'':'-'}${fmMB(Math.abs(rRec.margen))}</td></tr>
        <tr><td>🏭 Terminación</td><td class="tr" style="color:${rEng.margen>=0?'var(--green)':'var(--red)'};font-weight:600">${rEng.margen>=0?'':'-'}${fmMB(Math.abs(rEng.margen))}</td></tr>
        <tr style="background:${mb2}"><td><strong>Suma de los 3</strong></td><td class="tr" style="color:${mc};font-weight:800">${marTotal>=0?'':'-'}${fmMB(Math.abs(marTotal))}</td></tr>
      </tbody></table></div>
    </div>`;

    h += buildVerificacionValuacion_('🐄 Cría', rCria.detalle, fmMB, 'vv-cria');
    h += buildVerificacionValuacion_('🌱 Recría', rRec.detalle, fmMB, 'vv-recria');
    h += buildVerificacionValuacion_('🏭 Terminación', rEng.detalle, fmMB, 'vv-eng');

    // Ranking
    const acts = [
      { n:'🐄 Cría', ing:rCria.ing, eg:rCria.eg, mar:rCria.margen },
      { n:'🌱 Recría', ing:rRec.ing, eg:rRec.eg, mar:rRec.margen },
      { n:'🏭 Terminación', ing:rEng.ing, eg:rEng.eg, mar:rEng.margen },
    ].sort((a,b)=>b.mar-a.mar);

    h += `<div class="panel"><div class="panel-title">📊 Resultado por actividad</div>
      <div class="tw"><table class="dt"><thead><tr>
        <th>Actividad</th><th class="tc">Ingresos</th><th class="tc">Egresos</th><th class="tc">Margen</th><th class="tc">% del total</th>
      </tr></thead><tbody>`;
    acts.forEach((a,i)=>{
      const pct = marTotal!==0?(a.mar/Math.abs(marTotal)*100).toFixed(1):'—';
      const cm  = a.mar>=0?'var(--green)':'var(--red)';
      h += `<tr><td><strong>${['🥇','🥈','🥉'][i]||''} ${a.n}</strong></td>
        <td class="tc">${fmMB(a.ing)}</td><td class="tc">${fmMB(a.eg)}</td>
        <td class="tc" style="color:${cm};font-weight:700">${a.mar>=0?'':'-'}${fmMB(Math.abs(a.mar))}</td>
        <td class="tc"><span class="pill ${a.mar>=0?'pill-green':'pill-red'}">${pct}%</span></td>
      </tr>`;
    });
    h += '</tbody></table></div></div>';

    if (mortTot>0) {
      h += `<div class="panel" style="border:2px solid var(--red);background:rgba(200,50,50,0.05)">
        <div class="panel-title" style="color:var(--red)">💀 Mortandad por actividad</div>
        <div class="tw"><table class="dt"><tbody>
          ${mortCria>0?`<tr><td>🐄 Cría</td><td class="tc" style="color:var(--red);font-weight:700">${mortCria} animales</td></tr>`:''}
          ${mortRec>0?`<tr><td>🌱 Recría</td><td class="tc" style="color:var(--red);font-weight:700">${mortRec} animales</td></tr>`:''}
          ${mortEng>0?`<tr><td>🏭 Terminación</td><td class="tc" style="color:var(--red);font-weight:700">${mortEng} animales</td></tr>`:''}
          <tr style="background:rgba(200,50,50,0.1)"><td><strong>Total</strong></td><td class="tc" style="color:var(--red);font-weight:800;font-size:16px">${mortTot}</td></tr>
        </tbody></table></div>
        <div style="font-size:12px;color:var(--red);margin-top:8px">⚠ La mortandad no se contabiliza como egreso — su impacto está en el menor stock valorizado.</div>
      </div>`;
    }
  }

  if (tabMB === 'productivo') {
    const stockTodos = S.stock||[];
    function stockPorAct(actividad) {
      const rods = rodeosAll.filter(r=>normAct_(r.actividad)===normAct_(actividad));
      const cats = {};
      rods.forEach(r=>{ const stk=stockTodos.find(s=>String(s.rodeo_id)===String(r.rodeo_id)); const cant=stk?stk.stock||0:0; if(cant===0)return; cats[r.categoria]=(cats[r.categoria]||0)+cant; });
      return cats;
    }
    function bloqueStock(titulo, cats) {
      const tot=Object.values(cats).reduce((s,v)=>s+v,0);
      let b=`<div><div style="font-weight:700;font-size:12px;text-transform:uppercase;color:var(--text2);margin-bottom:8px">${titulo}</div>`;
      Object.entries(cats).forEach(([cat,cant])=>{ b+=`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border)"><span style="color:var(--text2);font-size:13px">${cat}</span><strong>${fn(cant)}</strong></div>`; });
      b+=`<div style="display:flex;justify-content:space-between;padding:6px 0;margin-top:4px"><span style="font-weight:700">Total</span><strong style="font-size:16px;color:var(--gold-text)">${fn(tot)}</strong></div></div>`;
      return b;
    }

    h += `<div class="panel"><div class="panel-title">📦 Stock actual por actividad y categoría</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px">
        ${bloqueStock('🐄 Cría', stockPorAct('Cría'))}
        ${bloqueStock('🌱 Recría', stockPorAct('Recría'))}
        ${bloqueStock('🏭 Terminación', stockPorAct('Engorde'))}
      </div></div>`;

    if (convTermPonderada !== null) {
      h += `<div class="panel"><div class="panel-title">🌾 Conversión alimenticia — Terminación</div>
        <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center">
          <div style="background:var(--gold-bg);border-radius:8px;padding:12px 20px;text-align:center">
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--gold-text)">Promedio ponderado (todos los corrales)</div>
            <div style="font-size:24px;font-weight:800;color:var(--gold);margin-top:4px">${fn(convTermPonderada,1)} : 1</div>
          </div>
          ${costoKgMSTermPonderado?`<div style="background:var(--bg2);border-radius:8px;padding:12px 20px;text-align:center">
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text2)">Costo por kg de MS</div>
            <div style="font-size:24px;font-weight:800;margin-top:4px">${fmMB(costoKgMSTermPonderado)}</div>
          </div>`:''}
          <div style="font-size:12px;color:var(--text3);max-width:320px">Ponderado por kg producidos de cada corral. ${hayAlimSinMSTerm?'⚠ Hay corrales con alimentos sin % de materia seca cargado — el número no incluye esos consumos.':'Para el detalle de un corral puntual, entrá a Terminación → Costos.'}</div>
        </div>
      </div>`;
    }

    const rents = [
      { n:'🐄 Cría', mar:rCria.margen, eg:rCria.eg, stock:Object.values(stockPorAct('Cría')).reduce((s,v)=>s+v,0) },
      { n:'🌱 Recría', mar:rRec.margen, eg:rRec.eg, stock:Object.values(stockPorAct('Recría')).reduce((s,v)=>s+v,0) },
      { n:'🏭 Terminación', mar:rEng.margen, eg:rEng.eg, stock:Object.values(stockPorAct('Engorde')).reduce((s,v)=>s+v,0) },
    ].sort((a,b)=>b.mar-a.mar);

    h += `<div class="panel"><div class="panel-title">🏆 Ranking de rentabilidad</div>
      <div class="tw"><table class="dt"><thead><tr>
        <th>#</th><th>Actividad</th><th class="tc">Margen total</th><th class="tc">Margen/cabeza</th><th class="tc">ROI</th>
      </tr></thead><tbody>`;
    rents.forEach((a,i)=>{
      const marCab=a.stock>0?a.mar/a.stock:null, roi=a.eg>0?(a.mar/a.eg*100):null, cm=a.mar>=0?'var(--green)':'var(--red)';
      h+=`<tr><td style="font-size:20px">${['🥇','🥈','🥉'][i]}</td><td><strong>${a.n}</strong></td>
        <td class="tc" style="color:${cm};font-weight:700">${a.mar>=0?'':'-'}${fmMB(Math.abs(a.mar))}</td>
        <td class="tc">${marCab!==null?`<span style="color:${cm};font-weight:600">${a.mar>=0?'':'-'}${fmMB(Math.abs(marCab))}/cab</span>`:'—'}</td>
        <td class="tc">${roi!==null?`<span class="pill ${roi>=0?'pill-green':'pill-red'}">${roi.toFixed(1)}%</span>`:'—'}</td></tr>`;
    });
    const mejor=rents[0], peor=rents[rents.length-1];
    h+=`</tbody></table><div style="margin-top:12px;padding:12px;background:var(--bg2);border-radius:8px;font-size:13px;line-height:1.7">
      <strong>Análisis:</strong>
      <ul style="margin:6px 0 0 0;padding-left:20px">
        <li>La actividad más rentable fue <strong>${mejor.n}</strong> con ${fmMB(mejor.mar)}.</li>
        <li>${peor.mar<0?`<strong>${peor.n}</strong> tuvo resultado negativo de ${fmMB(Math.abs(peor.mar))}.`:'Las tres actividades tuvieron resultado positivo.'}</li>
        <li>${marTotal>=0?`Margen ganadero total positivo: <strong>${fmMB(marTotal)}</strong>.`:`Margen ganadero total negativo: <strong>-${fmMB(Math.abs(marTotal))}</strong>.`}</li>
      </ul>
    </div></div>`;

    if (mortTot>0) {
      h+=`<div class="panel" style="border:2px solid var(--red);background:rgba(200,50,50,0.05)">
        <div class="panel-title" style="color:var(--red)">💀 Resumen de mortandad</div>
        <div class="tw"><table class="dt"><tbody>
          ${mortCria>0?`<tr><td>🐄 Cría</td><td class="tc" style="color:var(--red);font-weight:700">${mortCria} cabezas</td></tr>`:''}
          ${mortRec>0?`<tr><td>🌱 Recría</td><td class="tc" style="color:var(--red);font-weight:700">${mortRec} cabezas</td></tr>`:''}
          ${mortEng>0?`<tr><td>🏭 Terminación</td><td class="tc" style="color:var(--red);font-weight:700">${mortEng} cabezas</td></tr>`:''}
          <tr style="background:rgba(200,50,50,0.12)"><td><strong>Total</strong></td><td class="tc" style="color:var(--red);font-weight:800;font-size:18px">${mortTot} cabezas</td></tr>
        </tbody></table></div>
      </div>`;
    }

    if (abortTot>0) {
      h+=`<div class="panel" style="border:2px solid var(--clay);background:rgba(180,100,30,0.05)">
        <div class="panel-title" style="color:var(--clay-text)">⊘ Resumen de abortos</div>
        <div class="tw"><table class="dt"><tbody>
          ${abortCria>0?`<tr><td>🐄 Cría</td><td class="tc" style="color:var(--clay-text);font-weight:700">${abortCria} abortos</td></tr>`:''}
          ${abortRec>0?`<tr><td>🌱 Recría</td><td class="tc" style="color:var(--clay-text);font-weight:700">${abortRec} abortos</td></tr>`:''}
          <tr style="background:rgba(180,100,30,0.12)"><td><strong>Total</strong></td><td class="tc" style="color:var(--clay-text);font-weight:800;font-size:18px">${abortTot} abortos</td></tr>
        </tbody></table></div>
      </div>`;
    }

    // Índices reproductivos — de S.dashboard (datos del GS)
    const kpi = S.dashboard && S.dashboard.general;
    if (kpi) {
      function pctMB(v) { return v!==null&&v!==undefined ? `<strong>${v}%</strong>` : '<span style="color:var(--muted)">—</span>'; }
      h += `<div class="panel">
        <div class="panel-title">🐄 Índices reproductivos</div>
        <div class="tw"><table class="dt"><thead><tr>
          <th>Índice</th><th class="tc">Valor</th>
        </tr></thead><tbody>
          <tr><td>Preñez general</td><td class="tc">${pctMB(kpi.servicio?.indice_prenez)}</td></tr>
          <tr><td>Preñez IATF</td><td class="tc">${pctMB(kpi.servicio?.indice_prenez_iatf)}</td></tr>
          <tr><td>Preñez toro</td><td class="tc">${pctMB(kpi.servicio?.indice_prenez_toro)}</td></tr>
          <tr><td>Parición</td><td class="tc">${pctMB(kpi.paricion?.indice_paricion)}</td></tr>
          <tr><td>Destete</td><td class="tc">${pctMB(kpi.destete?.indice_destete)}</td></tr>
        </tbody></table></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">
          <div style="background:var(--bg2);border-radius:8px;padding:10px 16px;text-align:center">
            <div style="font-size:11px;color:var(--text2);text-transform:uppercase;margin-bottom:4px">Nacidos vivos</div>
            <div style="font-size:20px;font-weight:800">${fn(kpi.paricion?.nacidos_vivos||0)}</div>
          </div>
          <div style="background:var(--bg2);border-radius:8px;padding:10px 16px;text-align:center">
            <div style="font-size:11px;color:var(--text2);text-transform:uppercase;margin-bottom:4px">Destetados</div>
            <div style="font-size:20px;font-weight:800">${fn(kpi.destete?.total_destetados||0)}</div>
          </div>
          <div style="background:var(--bg2);border-radius:8px;padding:10px 16px;text-align:center">
            <div style="font-size:11px;color:var(--text2);text-transform:uppercase;margin-bottom:4px">Mort. terneros</div>
            <div style="font-size:20px;font-weight:800;color:${(kpi.destete?.mortandad_terneros||0)>0?'var(--red)':'inherit'}">${fn(kpi.destete?.mortandad_terneros||0)}</div>
          </div>
        </div>
      </div>`;
    }
  }

  return h;
}

function actualizarPreviewUsd_() {
  const preview = document.getElementById('pi-usd-preview');
  if (!preview) return;
  const fecha = document.getElementById('pi-fecha').value;
  const ars = Number(document.getElementById('pi-ars').value) || 0;
  if (!fecha || !ars) { preview.textContent = '—'; preview.style.color = 'var(--text2)'; return; }
  const tc = tipoCambioVigente_(fecha);
  if (!tc) {
    preview.textContent = 'Sin cotización en Corrales para esa fecha';
    preview.style.color = 'var(--clay-text)';
    return;
  }
  const usd = ars / Number(tc.valor);
  preview.innerHTML = `U$D ${fn(usd, 2)} <span style="font-size:11px;font-weight:400;color:var(--text3)">(cotización $${fn(tc.valor)} del ${fd(tc.fecha)})</span>`;
  preview.style.color = 'var(--text)';
}

function attachMargenBrutoEvents() {
  const save = document.getElementById('pi-save');
  if (save) save.onclick = async () => {
    const fecha = document.getElementById('pi-fecha').value;
    const ars = Number(document.getElementById('pi-ars').value) || 0;
    if (!fecha || !ars) { toast('Completá la fecha y el precio en pesos.', 'err'); return; }
    const tc = tipoCambioVigente_(fecha);
    let usd = '';
    if (tc) {
      usd = Math.round((ars / Number(tc.valor)) * 100) / 100;
    } else {
      toast('No hay cotización de dólar cargada en Corrales para esa fecha — se guarda solo en pesos.', 'err');
    }
    const data = {
      fecha_desde: fecha, precio_ars_kg: ars, precio_usd_kg: usd,
      observacion: document.getElementById('pi-obs').value.trim(),
    };
    save.disabled = true;
    try {
      await apiCall('create', { body: { entity: 'precios_internos', data } });
      invalidateCache('precios_internos');
      toast('Precio interno guardado', 'ok');
      await loadEntity('precios_internos', true);
      S.margenBruto = null; S._resultCria = null; S._resultRecria = null; S._resultEng = null;
      render();
    } catch (err) { toast(err.message, 'err'); } finally { save.disabled = false; }
  };
  attachTableDeleteEvents('precios_internos', 'precio_id');

  const presetSel = document.getElementById('mb-preset');
  if (presetSel) {
    const customMode = S.margenBrutoPeriodo && S.margenBrutoPeriodo.custom;
    presetSel.value = customMode ? 'custom' : (S.margenBrutoPeriodoPreset || 'anio');
    const toggleCustom = () => {
      const isCustom = presetSel.value === 'custom';
      document.getElementById('mb-desde-wrap').style.display = isCustom ? '' : 'none';
      document.getElementById('mb-hasta-wrap').style.display = isCustom ? '' : 'none';
    };
    toggleCustom();
    presetSel.onchange = toggleCustom;
  }
  const calcBtn = document.getElementById('mb-calcular');
  if (calcBtn) calcBtn.onclick = async () => {
    const preset = document.getElementById('mb-preset').value;
    if (preset === 'custom') {
      const desde = document.getElementById('mb-desde').value;
      const hasta = document.getElementById('mb-hasta').value;
      if (!desde || !hasta) { toast('Completá desde y hasta.', 'err'); return; }
      S.margenBrutoPeriodo = { desde, hasta, custom: true };
      S.margenBrutoPeriodoPreset = 'custom';
    } else {
      S.margenBrutoPeriodo = periodoPreset_(preset);
      S.margenBrutoPeriodoPreset = preset;
    }
    calcBtn.disabled = true;
    try { await calcularMargenBruto_(); render(); }
    catch (err) { toast(err.message, 'err'); }
    finally { calcBtn.disabled = false; }
  };

  document.querySelectorAll('#mb-moneda-group .radio-pill').forEach(p => p.onclick = () => {
    S.margenBrutoMoneda = p.dataset.moneda;
    render();
  });
}

// Exporta un Excel con un resumen reproductivo por rodeo (vaca/vaquillona):
// cuántas en servicio, cuántas tactadas, preñadas, abortos, mortandad y destete
// — para poder comparar el desempeño de cada rodeo de un vistazo.
async function exportarAuditoriaCriaExcel_() {
  toast('Generando Excel de auditoría de Cría... puede tardar unos segundos', 'ok');
  try {
    if (!window.XLSX || !window.__xlsxStyleLoaded) {
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js';
        s.onload = () => { window.__xlsxStyleLoaded = true; resolve(); };
        s.onerror = () => reject(new Error('No se pudo cargar la librería de Excel'));
        document.head.appendChild(s);
      });
    }
    const XLSX = window.XLSX;
    for (const ent of ['movimientos','ventas','mortandad','pesadas','pariciones','destetes','abortos']) {
      if (!S.cache[ent]) { try { await loadEntity(ent); } catch(e) {} }
    }

    const rodeos = (S.catalogs && S.catalogs.rodeos) || [];
    const rodeosCria = rodeos.filter(r => normAct_(r.actividad)==='cria');
    const rodeosCriaIds = new Set(rodeosCria.map(r => String(r.rodeo_id)));
    const corte = S._corteCria || today();
    const stockACorte = stockPorRodeoACorte_(corte);
    const movsTodos = (S.cache.movimientos || []).filter(m => (m.fecha||'') <= corte);
    const ventasTodas = (S.cache.ventas || []).filter(v => rodeosCriaIds.has(String(v.rodeo_id)) && (v.fecha_salida||'') <= corte);
    const tc = tipoCambioVigente_(corte);
    const tcVal = tc ? Number(tc.valor || tc) : null;

    const BORDE = { style:'thin', color:{rgb:'D9D9D9'} };
    const B = { top:BORDE, bottom:BORDE, left:BORDE, right:BORDE };
    const ST_TITULO = { font:{bold:true,color:{rgb:'FFFFFF'},sz:12}, fill:{fgColor:{rgb:'1F3864'}}, alignment:{horizontal:'left',vertical:'center'}, border:B };
    const ST_HEADER = { font:{bold:true,color:{rgb:'1F3864'}}, fill:{fgColor:{rgb:'D6E4F0'}}, alignment:{horizontal:'center',vertical:'center',wrapText:true}, border:B };
    const ST_ROW = { alignment:{horizontal:'center'}, border:B };
    const ST_ROW_ALT = { alignment:{horizontal:'center'}, border:B, fill:{fgColor:{rgb:'F7F7F7'}} };
    const ST_ROWLBL = { border:B };
    const ST_ROWLBL_ALT = { border:B, fill:{fgColor:{rgb:'F7F7F7'}} };
    const ST_TOTAL = { font:{bold:true,color:{rgb:'FFFFFF'}}, fill:{fgColor:{rgb:'1F3864'}}, alignment:{horizontal:'center'}, border:B };
    const ST_TOTALLBL = { font:{bold:true,color:{rgb:'FFFFFF'}}, fill:{fgColor:{rgb:'1F3864'}}, border:B };
    const ST_DIFF = { alignment:{horizontal:'center'}, border:B, font:{bold:true,color:{rgb:'C00000'}} };

    function estilarFila_(ws, r0, ncols, style) {
      for (let c = 0; c < ncols; c++) {
        const addr = XLSX.utils.encode_cell({ r:r0, c });
        if (!ws[addr]) ws[addr] = { t:'s', v:'' };
        ws[addr].s = style;
      }
    }

    const wb = XLSX.utils.book_new();

    // ── HOJA 1: Conciliación de cabezas por rodeo ────────────────────────
    // EI + Nacimientos + Entradas (traslados/compras) − Salidas − Ventas − Mortandad = EF
    // Los Saldos iniciales con tag [pid:...] son Nacimientos (Pariciones), no EI —
    // mismo criterio que usa el Dashboard (esAltaPorParicion_).
    const headers1 = ['Rodeo','Campo','Categoría','EI','+ Nacimientos','+ Entradas (traslados)','− Salidas (traslados)','− Ventas','− Mortandad','= EF calculado','EF real (stock)','Diferencia'];
    const filas1 = rodeosCria.map(r => {
      const rid = String(r.rodeo_id);
      const saldosR = movsTodos.filter(m => m.tipo==='Saldo inicial' && String(m.rodeo_destino_id)===rid && !esAltaPorParicion_(m));
      const eiR = saldosR.reduce((s,m)=>s+(Number(m.cantidad)||0),0);
      const nacR = movsTodos.filter(m => m.tipo==='Saldo inicial' && String(m.rodeo_destino_id)===rid && esAltaPorParicion_(m))
        .reduce((s,m)=>s+(Number(m.cantidad)||0),0);
      const entradasR = movsTodos.filter(m => (m.tipo==='Traslado en bloque'||m.tipo==='Traslado individual') && String(m.rodeo_destino_id)===rid).reduce((s,m)=>s+(Number(m.cantidad)||0),0);
      const salidasR = movsTodos.filter(m => (m.tipo==='Traslado en bloque'||m.tipo==='Traslado individual') && String(m.rodeo_origen_id)===rid).reduce((s,m)=>s+(Number(m.cantidad)||0),0);
      const ventasR = ventasTodas.filter(v => String(v.rodeo_id)===rid).reduce((s,v)=>s+(Number(v.cant_animales)||0),0);
      const mortR = (S.cache.mortandad||[]).filter(m => String(m.rodeo_id)===rid && (m.fecha||'')<=corte).reduce((s,m)=>s+(Number(m.cantidad)||1),0);
      const efCalcR = eiR + nacR + entradasR - salidasR - ventasR - mortR;
      const efRealR = Math.max(0, stockACorte[rid]||0);
      return { nombre: r.nombre, campo: campoNombre(r.campo_id), categoria: r.categoria||'—', eiR, nacR, entradasR, salidasR, ventasR, mortR, efCalcR, efRealR, diff: efRealR-efCalcR };
    }).filter(f => f.eiR||f.nacR||f.entradasR||f.salidasR||f.ventasR||f.mortR||f.efRealR);
    const aoa1 = [
      [`Agroganadera Los Médanos — Auditoría Cría (cabezas)`],
      ['Fecha de corte', fd(corte)],
      [],
      headers1,
    ];
    filas1.forEach(f => aoa1.push([f.nombre, f.campo, f.categoria, f.eiR, f.nacR, f.entradasR, f.salidasR, f.ventasR, f.mortR, f.efCalcR, f.efRealR, f.diff]));
    aoa1.push(['TOTAL','','',
      filas1.reduce((s,f)=>s+f.eiR,0), filas1.reduce((s,f)=>s+f.nacR,0), filas1.reduce((s,f)=>s+f.entradasR,0), filas1.reduce((s,f)=>s+f.salidasR,0),
      filas1.reduce((s,f)=>s+f.ventasR,0), filas1.reduce((s,f)=>s+f.mortR,0), filas1.reduce((s,f)=>s+f.efCalcR,0),
      filas1.reduce((s,f)=>s+f.efRealR,0), filas1.reduce((s,f)=>s+f.diff,0),
    ]);
    const ws1 = XLSX.utils.aoa_to_sheet(aoa1);
    ws1['!cols'] = [{wch:22},{wch:14},{wch:12},{wch:8},{wch:12},{wch:14},{wch:12},{wch:10},{wch:10},{wch:12},{wch:12},{wch:11}];
    ws1['!merges'] = [{ s:{r:0,c:0}, e:{r:0,c:headers1.length-1} }];
    estilarFila_(ws1, 0, headers1.length, ST_TITULO);
    estilarFila_(ws1, 3, headers1.length, ST_HEADER);
    filas1.forEach((f,i) => {
      const r0 = 4+i, alt = i%2===1;
      for (let c=0;c<headers1.length;c++) {
        const addr = XLSX.utils.encode_cell({r:r0,c});
        if (!ws1[addr]) ws1[addr] = { t:'s', v:'' };
        if (c<=2) ws1[addr].s = alt?ST_ROWLBL_ALT:ST_ROWLBL;
        else if (c===11 && f.diff!==0) ws1[addr].s = ST_DIFF;
        else ws1[addr].s = alt?ST_ROW_ALT:ST_ROW;
      }
    });
    estilarFila_(ws1, 4+filas1.length, headers1.length, ST_TOTAL);
    if (ws1[XLSX.utils.encode_cell({r:4+filas1.length,c:0})]) ws1[XLSX.utils.encode_cell({r:4+filas1.length,c:0})].s = ST_TOTALLBL;
    XLSX.utils.book_append_sheet(wb, ws1, 'Conciliación cabezas');

    // ── HOJA 2: Resumen económico por rodeo (ARS crudo + USD a cotización del corte) ──
    const headers2 = ['Rodeo','Campo','Categoría','Stock inicial (ARS)','Compras (ARS)','Alimentación (ARS)','Ventas (ARS)','Stock valorizado (ARS)','Cotización usada','Ingresos−Egresos (U$S)'];
    const aoa2 = [
      [`Agroganadera Los Médanos — Auditoría Cría (economía)`],
      ['Fecha de corte', fd(corte)],

    const ws3 = XLSX.utils.aoa_to_sheet(aoa3);
    ws3['!cols'] = [{wch:12},{wch:20},{wch:26},{wch:26},{wch:10},{wch:14},{wch:12},{wch:12},{wch:30}];
    ws3['!merges'] = [{ s:{r:0,c:0}, e:{r:0,c:headers3.length-1} }];
    estilarFila_(ws3, 0, headers3.length, ST_TITULO);

    movsEng.forEach((m,i) => {

async function exportarIndicesReproduccionExcel_() {
  toast('Generando Excel... puede tardar unos segundos', 'ok');
  try {
    if (!window.XLSX || !window.__xlsxStyleLoaded) {
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js';
        s.onload = () => { window.__xlsxStyleLoaded = true; resolve(); };
        s.onerror = () => reject(new Error('No se pudo cargar la librería de Excel'));
        document.head.appendChild(s);
      });
    }
    const XLSX = window.XLSX;

    // Aseguramos tener cargadas todas las hojas necesarias, aunque no se haya
    // pasado antes por sus pantallas puntuales.
    for (const ent of ['servicios','tactos','abortos','mortandad','destetes']) {
      if (!S.cache[ent]) { try { await loadEntity(ent); } catch(e) {} }
    }

    const rodeosAll = (S.catalogs && S.catalogs.rodeos) || [];
    const campos = (S.catalogs && S.catalogs.campos) || [];
    const campoNombre_ = id => campos.find(c=>String(c.campo_id)===String(id))?.nombre || '—';
    const servicios = S.cache.servicios || [];
    const tactos    = S.cache.tactos    || [];
    const abortos   = S.cache.abortos   || [];
    const mortandad = S.cache.mortandad || [];
    const destetes  = S.cache.destetes  || [];

    // Solo rodeos de vientre (vaca/vaquillona) — mismo criterio que usa el
    // sistema para "Índices de Reproducción".
    const rodeosVientre = rodeosAll.filter(r => {
      const c = (r.categoria||'').toLowerCase();
      return c === 'vaca' || c === 'vaquillona';
    });

    const porRodeo = rodeosVientre.map(r => {
      const rid = String(r.rodeo_id);
      const serv = servicios.filter(s=>String(s.rodeo_id)===rid).reduce((s,x)=>s+(Number(x.cantidad)||0),0);
      // Mismo criterio que usa el resto del sistema (calcKpisFromData_ en el backend):
      // el Tacto final re-confirma (y puede corregir) al IATF, no se suman los dos —
      // se usa el final si existe, y el IATF como respaldo si todavía no se hizo el final.
      const tactosRodeo = tactos.filter(t=>String(t.rodeo_id)===rid);
      const tactoIatf  = tactosRodeo.filter(t=>t.tipo_tacto==='Tacto IATF');
      const tactoFinal = tactosRodeo.filter(t=>t.tipo_tacto==='Tacto final');
      const tactIatf  = tactoIatf.reduce((s,x)=>s+(Number(x.total_tacteadas)||0),0);
      const prenIatf  = tactoIatf.reduce((s,x)=>s+(Number(x.prenadas)||0),0);
      const tactFinal = tactoFinal.reduce((s,x)=>s+(Number(x.total_tacteadas)||0),0);
      const prenFinal = tactoFinal.reduce((s,x)=>s+(Number(x.prenadas)||0),0);
      const tact = tactFinal > 0 ? tactFinal : tactIatf;
      const pren = prenFinal > 0 ? prenFinal : prenIatf;
      const abor = abortos.filter(a=>String(a.rodeo_id)===rid).length;
      const mort = mortandad.filter(m=>String(m.rodeo_id)===rid).reduce((s,x)=>s+(Number(x.cantidad)||1),0);
      const dest = destetes.filter(d=>String(d.rodeo_id)===rid).reduce((s,x)=>s+(Number(x.total)||0),0);
      return { rodeo: r, serv, tact, pren, abor, mort, dest };
    }).filter(x => x.serv || x.tact || x.pren || x.abor || x.mort || x.dest); // se ocultan rodeos sin ninguna actividad

    if (!porRodeo.length) { toast('No hay datos de reproducción para exportar.', 'err'); return; }

    porRodeo.sort((a,b) => a.rodeo.nombre.localeCompare(b.rodeo.nombre, 'es'));

    const BORDE_FINA = { style:'thin', color:{rgb:'D9D9D9'} };
    const BORDES = { top:BORDE_FINA, bottom:BORDE_FINA, left:BORDE_FINA, right:BORDE_FINA };
    const ST_TITULO  = { font:{bold:true,color:{rgb:'FFFFFF'},sz:12}, fill:{fgColor:{rgb:'1F3864'}}, alignment:{horizontal:'left',vertical:'center'}, border:BORDES };
    const ST_HEADER  = { font:{bold:true,color:{rgb:'1F3864'}}, fill:{fgColor:{rgb:'D6E4F0'}}, alignment:{horizontal:'center',vertical:'center',wrapText:true}, border:BORDES };
    const ST_ROW     = { alignment:{horizontal:'center'}, border:BORDES };
    const ST_ROW_ALT = { alignment:{horizontal:'center'}, border:BORDES, fill:{fgColor:{rgb:'F7F7F7'}} };
    const ST_ROWLBL     = { border:BORDES };
    const ST_ROWLBL_ALT = { border:BORDES, fill:{fgColor:{rgb:'F7F7F7'}} };
    const ST_PCT     = { alignment:{horizontal:'center'}, border:BORDES, font:{italic:true,color:{rgb:'375623'}} };
    const ST_PCT_ALT  = { alignment:{horizontal:'center'}, border:BORDES, font:{italic:true,color:{rgb:'375623'}}, fill:{fgColor:{rgb:'F7F7F7'}} };
    const ST_TOTAL   = { font:{bold:true,color:{rgb:'FFFFFF'}}, fill:{fgColor:{rgb:'1F3864'}}, alignment:{horizontal:'center'}, border:BORDES };
    const ST_TOTALLBL= { font:{bold:true,color:{rgb:'FFFFFF'}}, fill:{fgColor:{rgb:'1F3864'}}, border:BORDES };

    const headers = ['Rodeo','Campo','En Servicio','Tactadas','Preñadas','% Preñez','Abortos','Mortandad','Destete','% Destete'];
    const aoa = [
      ['Agroganadera Los Médanos — Índices de Reproducción por Rodeo'],
      ['Generado', fd(today())],
      [],
      headers,
    ];
    porRodeo.forEach(x => {
      const pctPrenez = x.tact > 0 ? Math.round(x.pren/x.tact*1000)/10 : null;
      const pctDestete = x.pren > 0 ? Math.round(x.dest/x.pren*1000)/10 : null;
      aoa.push([
        x.rodeo.nombre, campoNombre_(x.rodeo.campo_id),
        x.serv, x.tact, x.pren, pctPrenez!==null?pctPrenez+'%':'—',
        x.abor, x.mort, x.dest, pctDestete!==null?pctDestete+'%':'—',
      ]);
    });
    const totServ = porRodeo.reduce((s,x)=>s+x.serv,0);
    const totTact = porRodeo.reduce((s,x)=>s+x.tact,0);
    const totPren = porRodeo.reduce((s,x)=>s+x.pren,0);
    const totAbor = porRodeo.reduce((s,x)=>s+x.abor,0);
    const totMort = porRodeo.reduce((s,x)=>s+x.mort,0);
    const totDest = porRodeo.reduce((s,x)=>s+x.dest,0);
    const pctPrenezTot = totTact>0 ? Math.round(totPren/totTact*1000)/10 : null;
    const pctDesteteTot = totPren>0 ? Math.round(totDest/totPren*1000)/10 : null;
    aoa.push([
      'TOTAL', '',
      totServ, totTact, totPren, pctPrenezTot!==null?pctPrenezTot+'%':'—',
      totAbor, totMort, totDest, pctDesteteTot!==null?pctDesteteTot+'%':'—',
    ]);

    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{wch:24},{wch:16},{wch:12},{wch:11},{wch:11},{wch:10},{wch:10},{wch:11},{wch:10},{wch:10}];
    ws['!merges'] = [{ s:{r:0,c:0}, e:{r:0,c:headers.length-1} }];

    function estilarFilaSimple_(r0, style) {
      for (let c = 0; c < headers.length; c++) {
        const addr = XLSX.utils.encode_cell({ r:r0, c });
        if (!ws[addr]) ws[addr] = { t:'s', v:'' };
        ws[addr].s = style;
      }
    }
    estilarFilaSimple_(0, ST_TITULO);
    for (let c=0;c<headers.length;c++){ ws[XLSX.utils.encode_cell({r:3,c})].s = ST_HEADER; }
    // Filas de datos con bandas alternadas
    porRodeo.forEach((x, i) => {
      const r0 = 4 + i;
      const alt = i % 2 === 1;
      for (let c=0;c<headers.length;c++) {
        const addr = XLSX.utils.encode_cell({r:r0,c});
        if (!ws[addr]) ws[addr] = { t:'s', v:'' };
        if (c===0||c===1) ws[addr].s = alt ? ST_ROWLBL_ALT : ST_ROWLBL;
        else if (c===5||c===9) ws[addr].s = alt ? ST_PCT_ALT : ST_PCT;
        else ws[addr].s = alt ? ST_ROW_ALT : ST_ROW;
      }
    });
    // Fila TOTAL
    const rTot = 4 + porRodeo.length;
    for (let c=0;c<headers.length;c++) {
      const addr = XLSX.utils.encode_cell({r:rTot,c});
      if (!ws[addr]) ws[addr] = { t:'s', v:'' };
      ws[addr].s = (c===0) ? ST_TOTALLBL : ST_TOTAL;
    }

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Reproducción por Rodeo');

    const buf = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    const blob = new Blob([buf], {type:'application/octet-stream'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Los_Medanos_Reproduccion_Por_Rodeo_${today().slice(0,7)}.xlsx`;
    a.click();
    URL.revokeObjectURL(url);
    toast('✓ Excel descargado', 'ok');
  } catch(err) {
    console.error(err);
    toast('Error al generar el Excel: ' + err.message, 'err');
  }
}

async function exportarStockExcel_(campoId) {
  toast('Generando Excel... puede tardar unos segundos', 'ok');
  try {
    // Cargar SheetJS si no está disponible — usamos "xlsx-js-style", un fork
    // compatible con la librería community que SÍ escribe estilos de celda
    // (colores, negrita, bordes) en el .xlsx. La librería original que se usaba
    // acá (cdnjs xlsx.full.min.js) ignora los estilos al guardar — por eso la
    // planilla salía sin formato aunque el código ya definía los colores.
    if (!window.XLSX || !window.__xlsxStyleLoaded) {
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js';
        s.onload = () => { window.__xlsxStyleLoaded = true; resolve(); };
        s.onerror = () => reject(new Error('No se pudo cargar la librería de Excel'));
        document.head.appendChild(s);
      });
    }
    const XLSX = window.XLSX;

    const rodeosTodosLista = (S.catalogs && S.catalogs.rodeos) || [];
    const rodeosMap = Object.fromEntries(rodeosTodosLista.map(r=>[String(r.rodeo_id), r]));
    // Si se eligió un campo puntual, todo el reporte se acota a los rodeos de
    // ESE campo — categorías, stock y movimientos. rodeosMap se mantiene con
    // TODOS los rodeos (para poder resolver la categoría de cualquier rodeo de
    // origen/destino), pero "rodeos" (de acá en más) sí queda filtrado.
    const rodeos = campoId ? rodeosTodosLista.filter(r => String(r.campo_id) === String(campoId)) : rodeosTodosLista;
    const rodeoIdsSet = new Set(rodeos.map(r => String(r.rodeo_id)));
    const campoNombreSel = campoId ? (((S.catalogs&&S.catalogs.campos)||[]).find(c=>String(c.campo_id)===String(campoId))?.nombre || 'Campo') : 'Todos los campos';

    const movs     = S.cache.movimientos     || [];
    const ventas   = S.cache.ventas          || [];
    const pariciones = S.cache.pariciones    || [];
    const abortos  = S.cache.abortos         || [];
    const mortandad = S.cache.mortandad      || [];

    // Categorías únicas (columnas) — solo las que existen en el campo elegido
    const cats = [...new Set(rodeos.map(r=>(r.categoria||'').toLowerCase()).filter(Boolean))].sort();
    // Función para obtener categoría de un rodeo_id (mira TODOS los rodeos, no
    // solo los del campo elegido, porque necesitamos poder identificar de dónde
    // viene o hacia dónde va un traslado aunque el otro extremo esté afuera)
    const cat_ = id => (rodeosMap[String(id)]?.categoria||'').toLowerCase();

    // Determinar rango de meses desde el primer movimiento hasta hoy
    const allDates = [
      ...movs.map(m=>m.fecha), ...ventas.map(v=>v.fecha_salida),
      ...pariciones.map(p=>p.fecha), ...abortos.map(a=>a.fecha), ...mortandad.map(m=>m.fecha)
    ].filter(Boolean).map(d=>String(d).slice(0,7)).sort();
    if (!allDates.length) { toast('Sin datos para exportar.', 'err'); return; }

    const mesInicio = allDates[0];
    const mesFin = today().slice(0,7);

    // Generar lista de meses
    const meses = [];
    let [y,m] = mesInicio.split('-').map(Number);
    const [yf,mf] = mesFin.split('-').map(Number);
    while (y < yf || (y===yf && m<=mf)) {
      meses.push(`${y}-${String(m).padStart(2,'0')}`);
      m++; if (m>12) { m=1; y++; }
    }

    // Calcular stock acumulado por categoría hasta fin de cada mes
    function stockAlCierreDeMes_(mesStr) {
      // Misma lógica exacta que getStockTodos en el backend:
      // 1) Calcula stock por rodeo_id
      // 2) Suma por categoría
      // No incluye abortos (el backend tampoco los resta del stock)
      const hasta = mesStr + '-99'; // '99' garantiza incluir cualquier día del mes
      const stockRodeo = {};
      rodeos.forEach(r => { stockRodeo[String(r.rodeo_id)] = 0; });

      movs.forEach(m => {
        if (!m.fecha || String(m.fecha).slice(0,7) > mesStr) return;
        const cant = Number(m.cantidad)||0;
        const dest = String(m.rodeo_destino_id||'');
        const orig = String(m.rodeo_origen_id||'');
        if (dest && stockRodeo[dest] !== undefined) stockRodeo[dest] += cant;
        if (m.tipo !== 'Saldo inicial' && orig && stockRodeo[orig] !== undefined) stockRodeo[orig] -= cant;
      });
      ventas.forEach(v => {
        if (!v.fecha_salida || String(v.fecha_salida).slice(0,7) > mesStr) return;
        const rid = String(v.rodeo_id||'');
        if (stockRodeo[rid] !== undefined) stockRodeo[rid] -= (Number(v.cant_animales)||0);
      });
      mortandad.forEach(m => {
        if (!m.fecha || String(m.fecha).slice(0,7) > mesStr) return;
        const rid = String(m.rodeo_id||'');
        if (stockRodeo[rid] !== undefined) stockRodeo[rid] -= (Number(m.cantidad)||1);
      });

      // Sumar por categoría
      const stock = {};
      cats.forEach(c => stock[c] = 0);
      rodeos.forEach(r => {
        const c = (r.categoria||'').toLowerCase();
        if (c && stock[c] !== undefined) stock[c] += Math.max(0, stockRodeo[String(r.rodeo_id)]||0);
      });
      return stock;
    }

    // Calcular movimientos de un mes por tipo y categoría
    function movsDeMes_(mesStr) {
      const desde = mesStr + '-01', hasta = mesStr + '-31';
      const inRange = d => d && String(d) >= desde && String(d) <= hasta;
      const r = {
        carga_inicial: {}, nacimiento: {}, compra: {}, traslado_in: {},
        recategorizacion_in: {}, venta: {}, muerte: {}, traslado_out: {},
        recategorizacion_out: {}, aborto: {},
      };
      cats.forEach(c => Object.keys(r).forEach(k => r[k][c]=0));

      movs.forEach(m => {
        if (!inRange(m.fecha)) return;
        const cant = Number(m.cantidad)||0;
        const destinoEnCampo = rodeoIdsSet.has(String(m.rodeo_destino_id));
        const origenEnCampo  = rodeoIdsSet.has(String(m.rodeo_origen_id));
        const cIn  = destinoEnCampo ? cat_(m.rodeo_destino_id) : '';
        const cOut = origenEnCampo  ? cat_(m.rodeo_origen_id)  : '';

        if (m.tipo === 'Saldo inicial') {
          if (cIn) r.carga_inicial[cIn] = (r.carga_inicial[cIn]||0) + cant;
        } else if (m.tipo === 'Traslado en bloque' || m.tipo === 'Traslado individual') {
          if (!m.rodeo_origen_id) {
            // Sin rodeo de origen = entrada real desde afuera del sistema (Compra
            // de Hacienda, que ahora genera este mismo tipo de movimiento — ver
            // sincronizarMovimientoCompra_). No es un traslado interno.
            if (cIn) r.compra[cIn] = (r.compra[cIn]||0) + cant;
          } else if (cIn && cOut && cIn !== cOut) {
            // Cambio de categoría (mismo u otro rodeo, pero distinta categoría)
            r.recategorizacion_in[cIn]  = (r.recategorizacion_in[cIn]||0)  + cant;
            r.recategorizacion_out[cOut]= (r.recategorizacion_out[cOut]||0)+ cant;
          } else {
            if (cIn)  r.traslado_in[cIn]  = (r.traslado_in[cIn]||0)  + cant;
            if (cOut) r.traslado_out[cOut]= (r.traslado_out[cOut]||0)+ cant;
          }
        }
      });
      ventas.forEach(v => {
        if (!inRange(v.fecha_salida) || !rodeoIdsSet.has(String(v.rodeo_id))) return;
        const c=cat_(v.rodeo_id); if(c) r.venta[c]=(r.venta[c]||0)+(Number(v.cant_animales)||0);
      });
      pariciones.forEach(p => {
        if (!inRange(p.fecha) || !rodeoIdsSet.has(String(p.rodeo_id))) return;
        const rodeo = rodeosMap[String(p.rodeo_id)];
        const c = rodeo?.categoria?.toLowerCase() === 'ternero' || rodeo?.categoria?.toLowerCase() === 'ternera'
          ? rodeo.categoria.toLowerCase() : 'ternero';
        r.nacimiento[c] = (r.nacimiento[c]||0) + (Number(p.nacidos_vivos)||0);
      });
      mortandad.forEach(m => {
        if (!inRange(m.fecha) || !rodeoIdsSet.has(String(m.rodeo_id))) return;
        const c=cat_(m.rodeo_id); if(c) r.muerte[c]=(r.muerte[c]||0)+(Number(m.cantidad)||1);
      });
      abortos.forEach(a => {
        if (!inRange(a.fecha) || !rodeoIdsSet.has(String(a.rodeo_id))) return;
        const c=cat_(a.rodeo_id); if(c) r.aborto[c]=(r.aborto[c]||0)+1;
      });
      return r;
    }

    // Estilos — colores calcados de la planilla de referencia
    const BORDE_FINA = { style:'thin', color:{rgb:'D9D9D9'} };
    const BORDES     = { top:BORDE_FINA, bottom:BORDE_FINA, left:BORDE_FINA, right:BORDE_FINA };
    const ST_TITULO      = { font:{bold:true,color:{rgb:'FFFFFF'},sz:12}, fill:{fgColor:{rgb:'1F3864'}}, alignment:{horizontal:'left',vertical:'center'}, border:BORDES };
    const ST_LABEL_FECHA = { font:{bold:false}, border:BORDES };
    const ST_CATEGORIAS  = { font:{bold:true,color:{rgb:'1F3864'}}, fill:{fgColor:{rgb:'D6E4F0'}}, alignment:{horizontal:'center',vertical:'center'}, border:BORDES };
    const ST_EXIS_ANT    = { font:{bold:true,color:{rgb:'006100'}}, fill:{fgColor:{rgb:'C6EFCE'}}, alignment:{horizontal:'center'}, border:BORDES };
    const ST_ENTRADAS    = { font:{bold:true,color:{rgb:'FFFFFF'}}, fill:{fgColor:{rgb:'548235'}}, border:BORDES };
    const ST_SUBFILA     = { font:{bold:false}, alignment:{horizontal:'center'}, border:BORDES };
    const ST_SUBFILA_LBL = { font:{bold:false}, border:BORDES };
    const ST_TOT_ENTRADAS= { font:{bold:true}, fill:{fgColor:{rgb:'C6EFCE'}}, alignment:{horizontal:'center'}, border:BORDES };
    const ST_SALIDAS     = { font:{bold:true,color:{rgb:'FFFFFF'}}, fill:{fgColor:{rgb:'C00000'}}, border:BORDES };
    const ST_TOT_SALIDAS = { font:{bold:true}, fill:{fgColor:{rgb:'F4CCCC'}}, alignment:{horizontal:'center'}, border:BORDES };
    const ST_TOT_FINALES = { font:{bold:true,color:{rgb:'FFFFFF'}}, fill:{fgColor:{rgb:'1F3864'}}, alignment:{horizontal:'center'}, border:BORDES };
    const ST_EQUIV_VACA  = { font:{bold:false,color:{rgb:'1F3864'}}, fill:{fgColor:{rgb:'D6E4F0'}}, alignment:{horizontal:'center'}, border:BORDES };

    // Aplica un estilo a un rango de celdas de una fila (r0 = fila 0-based, c0..c1 = columnas 0-based inclusive)
    function estilarFila_(ws, r0, c0, c1, style) {
      for (let c = c0; c <= c1; c++) {
        const addr = XLSX.utils.encode_cell({ r: r0, c });
        if (!ws[addr]) ws[addr] = { t:'s', v:'' };
        ws[addr].s = style;
      }
    }

    const wb = XLSX.utils.book_new();

    // Coeficientes de Equivalente Vaca (EV) — conversión estándar para comparar
    // categorías de distinto porte en una misma unidad de carga animal. Son
    // valores de referencia habituales; si manejás otros propios, avisame y los
    // cambio acá.
    const EV_COEF = {
      vaca: 1.0, 'vaca venta': 1.0, toro: 1.3, torito: 0.5,
      vaquillona: 0.7, 'vaquillona venta': 0.7,
      ternero: 0.4, ternera: 0.4,
      novillo: 0.9, novillito: 0.6,
    };
    const evCoef_ = cat => EV_COEF[cat] !== undefined ? EV_COEF[cat] : 0.6;

    const nombreMesLargo_ = mesStr => {
      const [y,mo] = mesStr.split('-');
      return new Date(Number(y),Number(mo)-1,1).toLocaleString('es-AR',{month:'long',year:'numeric'});
    };
    const fechaInicioLabel = mesInicio + '-01';
    const fechaCierreLabel = (() => {
      const [y,mo] = mesFin.split('-').map(Number);
      return new Date(y,mo,0).toISOString().slice(0,10); // último día del mes de cierre
    })();

    // Construye el bloque de encabezado (nombre, período, título) que va arriba
    // de cada hoja, igual que en la planilla de referencia.
    function encabezado_(subtitulo) {
      return [
        ['Agroganadera Los Médanos — ' + campoNombreSel],
        [],
        ['FECHA INICIO', fd(fechaInicioLabel)],
        ['FECHA CIERRE', fd(fechaCierreLabel)],
        [],
        [subtitulo],
        [],
      ];
    }

    // Arma las filas ENTRADAS/SALIDAS/TOTALES + EQUIVALENTE VACA para un bloque
    // de movimientos ya acumulados (sea de un mes puntual o de todo el período).
    function filasMovimiento_(stockAnterior, movBloque, stockFinal) {
      const catCols = cats.map(c=>c.charAt(0).toUpperCase()+c.slice(1));
      const aoa = [];
      aoa.push(['CATEGORIAS', '', ...catCols, 'TOTAL']);
      const exisAntRow = ['', 'EXIS.ANTERIOR', ...cats.map(c=>Math.max(0,stockAnterior[c]||0))];
      exisAntRow.push(exisAntRow.slice(2).reduce((s,v)=>s+v,0));
      aoa.push(exisAntRow);

      aoa.push(['ENTRADAS', '', ...cats.map(()=>'')]);
      const rowsEntradas = [
        ['','CARGA INICIAL',    ...cats.map(c=>movBloque.carga_inicial[c]||0)],
        ['','NACIMIENTO',       ...cats.map(c=>movBloque.nacimiento[c]||0)],
        ['','COMPRA',           ...cats.map(c=>movBloque.compra[c]||0)],
        ['','TRASLADO',         ...cats.map(c=>movBloque.traslado_in[c]||0)],
        ['','RECATEGORIZACIÓN', ...cats.map(c=>movBloque.recategorizacion_in[c]||0)],
        ['','AJUSTE',           ...cats.map(()=>0)],
      ];
      rowsEntradas.forEach(r => { r.push(r.slice(2).reduce((s,v)=>s+v,0)); aoa.push(r); });
      const totInRow = ['TOTAL DE ENTRADAS', ''];
      cats.forEach((c,ci) => totInRow.push(rowsEntradas.reduce((s,r)=>s+(r[ci+2]||0),0)));
      totInRow.push(totInRow.slice(2).reduce((s,v)=>s+v,0));
      aoa.push(totInRow);

      aoa.push(['SALIDAS', '', ...cats.map(()=>'')]);
      const rowsSalidas = [
        ['','MUERTE',           ...cats.map(c=>movBloque.muerte[c]||0)],
        ['','ABORTO',           ...cats.map(c=>movBloque.aborto[c]||0)],
        ['','VENTA',            ...cats.map(c=>movBloque.venta[c]||0)],
        ['','TRASLADO',         ...cats.map(c=>movBloque.traslado_out[c]||0)],
        ['','RECATEGORIZACIÓN', ...cats.map(c=>movBloque.recategorizacion_out[c]||0)],
        ['','AJUSTE',           ...cats.map(()=>0)],
      ];
      rowsSalidas.forEach(r => { r.push(r.slice(2).reduce((s,v)=>s+v,0)); aoa.push(r); });
      const totOutRow = ['TOTAL DE SALIDAS', ''];
      cats.forEach((c,ci) => totOutRow.push(rowsSalidas.reduce((s,r)=>s+(r[ci+2]||0),0)));
      totOutRow.push(totOutRow.slice(2).reduce((s,v)=>s+v,0));
      aoa.push(totOutRow);

      aoa.push([]);
      const finalRow = ['TOTALES FINALES', '', ...cats.map(c=>Math.max(0,stockFinal[c]||0))];
      finalRow.push(finalRow.slice(2).reduce((s,v)=>s+v,0));
      aoa.push(finalRow);

      const evRow = ['EQUIVALENTE VACA', '', ...cats.map(c=>Math.round(Math.max(0,stockFinal[c]||0)*evCoef_(c)*10)/10)];
      evRow.push(Math.round(evRow.slice(2).reduce((s,v)=>s+v,0)*10)/10);
      aoa.push(evRow);

      return aoa;
    }

    // Aplica el formato al bloque de encabezado (título, fechas, subtítulo) —
    // siempre las mismas 7 filas (0-based: 0..6) que arma encabezado_().
    function estilarEncabezado_(ws, colUltima) {
      estilarFila_(ws, 0, 0, colUltima, ST_TITULO);
      estilarFila_(ws, 2, 0, 1, ST_LABEL_FECHA);
      estilarFila_(ws, 3, 0, 1, ST_LABEL_FECHA);
      estilarFila_(ws, 5, 0, colUltima, ST_TITULO);
      ws['!merges'] = (ws['!merges']||[]).concat([
        { s:{r:0,c:0}, e:{r:0,c:colUltima} },
        { s:{r:5,c:0}, e:{r:5,c:colUltima} },
      ]);
    }

    // Aplica el formato al bloque de ENTRADAS/SALIDAS/TOTALES/EQUIV. VACA que arma
    // filasMovimiento_() — la estructura de filas es siempre la misma (fija):
    // 0 CATEGORIAS · 1 EXIS.ANTERIOR · 2 "ENTRADAS" · 3-8 6 subfilas · 9 TOTAL
    // ENTRADAS · 10 "SALIDAS" · 11-16 6 subfilas · 17 TOTAL SALIDAS · 18 (vacía)
    // · 19 TOTALES FINALES · 20 EQUIVALENTE VACA. filaBase = fila 0-based donde
    // arranca este bloque dentro de la hoja (después del encabezado).
    function estilarBloqueMovimiento_(ws, filaBase, colUltima) {
      estilarFila_(ws, filaBase+0,  0, colUltima, ST_CATEGORIAS);
      estilarFila_(ws, filaBase+1,  0, colUltima, ST_EXIS_ANT);
      estilarFila_(ws, filaBase+2,  0, colUltima, ST_ENTRADAS);
      for (let i=3; i<=8; i++) { estilarFila_(ws, filaBase+i, 0, 1, ST_SUBFILA_LBL); estilarFila_(ws, filaBase+i, 2, colUltima, ST_SUBFILA); }
      estilarFila_(ws, filaBase+9,  0, colUltima, ST_TOT_ENTRADAS);
      estilarFila_(ws, filaBase+10, 0, colUltima, ST_SALIDAS);
      for (let i=11; i<=16; i++) { estilarFila_(ws, filaBase+i, 0, 1, ST_SUBFILA_LBL); estilarFila_(ws, filaBase+i, 2, colUltima, ST_SUBFILA); }
      estilarFila_(ws, filaBase+17, 0, colUltima, ST_TOT_SALIDAS);
      estilarFila_(ws, filaBase+19, 0, colUltima, ST_TOT_FINALES);
      estilarFila_(ws, filaBase+20, 0, colUltima, ST_EQUIV_VACA);
      ws['!merges'] = (ws['!merges']||[]).concat([
        { s:{r:filaBase+2, c:0}, e:{r:filaBase+2, c:colUltima} },
        { s:{r:filaBase+10,c:0}, e:{r:filaBase+10,c:colUltima} },
      ]);
    }

    // === HOJA "TODOS": acumulado de todo el período ===
    const movTodos = { carga_inicial:{}, nacimiento:{}, compra:{}, traslado_in:{}, recategorizacion_in:{}, aborto:{}, venta:{}, muerte:{}, traslado_out:{}, recategorizacion_out:{} };
    cats.forEach(c => Object.keys(movTodos).forEach(k => movTodos[k][c]=0));
    meses.forEach(mesStr => {
      const mm = movsDeMes_(mesStr);
      Object.keys(movTodos).forEach(k => cats.forEach(c => { movTodos[k][c] += mm[k][c]||0; }));
    });
    const stockAntesDeTodo = stockAlCierreDeMes_(
      (mesInicio.slice(5,7)==='01') ? `${Number(mesInicio.slice(0,4))-1}-12` : `${mesInicio.slice(0,4)}-${String(Number(mesInicio.slice(5,7))-1).padStart(2,'0')}`
    );
    const stockFinalTodo = stockAlCierreDeMes_(mesFin);
    const aoaTodos = [
      ...encabezado_('MOVIMIENTO ACUMULADO DE HACIENDA'),
      ...filasMovimiento_(stockAntesDeTodo, movTodos, stockFinalTodo),
    ];
    const wsTodos = XLSX.utils.aoa_to_sheet(aoaTodos);
    const colUltimaTodos = 2 + cats.length; // A,B + una por categoría + TOTAL
    wsTodos['!cols'] = [{wch:22},{wch:20},...cats.map(()=>({wch:14})),{wch:14}];
    estilarEncabezado_(wsTodos, colUltimaTodos);
    estilarBloqueMovimiento_(wsTodos, 7, colUltimaTodos);
    XLSX.utils.book_append_sheet(wb, wsTodos, 'TODOS');

    // === Stock mensual (resumen simple, se mantiene como referencia rápida) ===
    const wsStock = [];
    wsStock.push(['', ...meses.map(m => {
      const [y,mo] = m.split('-');
      return new Date(Number(y),Number(mo)-1,1).toLocaleString('es-AR',{month:'long',year:'numeric'});
    })]);
    cats.forEach(cat => {
      const row = [cat.charAt(0).toUpperCase()+cat.slice(1)];
      meses.forEach(mes => {
        const st = stockAlCierreDeMes_(mes);
        row.push(Math.max(0, st[cat]||0));
      });
      wsStock.push(row);
    });
    const ws1 = XLSX.utils.aoa_to_sheet(wsStock);
    ws1['!cols'] = [{wch:20}, ...meses.map(()=>({wch:14}))];
    estilarFila_(ws1, 0, 0, meses.length, ST_CATEGORIAS);
    XLSX.utils.book_append_sheet(wb, ws1, 'Stock Mensual');

    // === REPORTE 2: Una hoja por mes ===
    meses.forEach(mesStr => {
      const [y,mo] = mesStr.split('-');
      const nombreMes = nombreMesLargo_(mesStr);
      const stockAnterior = stockAlCierreDeMes_(
        mo==='01' ? `${Number(y)-1}-12` : `${y}-${String(Number(mo)-1).padStart(2,'0')}`
      );
      const movMes = movsDeMes_(mesStr);
      const stockFinal = stockAlCierreDeMes_(mesStr);

      const aoa = [
        ...encabezado_('MOVIMIENTO DE HACIENDA — ' + nombreMes.toUpperCase()),
        ...filasMovimiento_(stockAnterior, movMes, stockFinal),
      ];

      const ws = XLSX.utils.aoa_to_sheet(aoa);
      const colUltimaMes = 2 + cats.length;
      ws['!cols'] = [{wch:22},{wch:20},...cats.map(()=>({wch:14})),{wch:14}];
      estilarEncabezado_(ws, colUltimaMes);
      estilarBloqueMovimiento_(ws, 7, colUltimaMes);
      XLSX.utils.book_append_sheet(wb, ws, nombreMes.slice(0,31));
    });

    // Exportar
    const buf = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    const blob = new Blob([buf], {type:'application/octet-stream'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const campoFileTag = campoId ? '_' + campoNombreSel.replace(/[^a-zA-Z0-9]+/g,'_') : '_TodosLosCampos';
    a.download = `Los_Medanos_Stock${campoFileTag}_${today().slice(0,7)}.xlsx`;
    a.click();
    URL.revokeObjectURL(url);
    toast('✓ Excel descargado', 'ok');
  } catch(err) {
    console.error(err);
    toast('Error al generar el Excel: ' + err.message, 'err');
  }
}

function actualizarCatsHistorico_() {
  const campoId = document.getElementById('sh-campo')?.value || '';
  const stockList = (S.stock || []).filter(function(s){
    return campoId ? String(s.campo_id) === String(campoId) : true;
  });

  const sel = document.getElementById('sh-cat');

    sel.innerHTML = '<option value="">Todas las categorías</option>' + cats.map(function(c){ return '<option value="' + c + '">' + c + '</option>'; }).join('');
