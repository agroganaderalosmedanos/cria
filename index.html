<body>
<div id="root"></div>
<div id="toast-zone"></div>
<script>
// Nombre de versión del archivo entregado — se muestra en el pie del Reporte
// Directorio para poder identificar, al comparar dos informes viejos, con qué
// versión del sistema se generó cada uno (la lógica de cálculo puede cambiar
// entre versiones aunque los datos de Sheets sean los mismos).
const APP_VERSION = 'index_consolidado_4_6_155_36';

window.S = {
  apiUrl: localStorage.getItem('cria_api_url') || 'https://script.google.com/macros/s/AKfycbz-ahGdifI9FykD0r6hz47fjPZ6H5TwKWMOsCfW5f_M41oXneTffMk7CKz0svOgezSD_w/exec',
  apiToken: localStorage.getItem('cria_api_token') || 'LosMedanos2026Cria',
  page: 'home',
  sidebarOpen: false,
  loading: false,
  syncStatus: 'idle',
  catalogs: null,
  selectedRodeoId: null,
  selectedCampoId: null,
  dashboard: null,
  stock: null,
  corralesStock: undefined,
  cache: {},
  modal: null,
};
const S = window.S;

function save() {
  localStorage.setItem('cria_api_url', S.apiUrl);
  localStorage.setItem('cria_api_token', S.apiToken);
}

function apiConfigured() { return !!(S.apiUrl && S.apiToken); }

async function apiCall(action, opts = {}) {
  if (!apiConfigured()) throw new Error('API no configurada');
  S.syncStatus = 'busy';
  renderSyncDot();
  try {
    let url = S.apiUrl + '?action=' + action + '&token=' + encodeURIComponent(S.apiToken);
    if (opts.params) {
      Object.entries(opts.params).forEach(([k, v]) => { url += '&' + k + '=' + encodeURIComponent(v); });
    }
    const fetchOpts = { method: opts.body ? 'POST' : 'GET' };
    if (opts.body) {
      // Inyectar usuario de sesión automáticamente en todos los POST
      const session = window.__lmSession || {};
      const bodyConUsuario = { ...opts.body, usuario: session.usuario || 'sistema' };
      fetchOpts.body = JSON.stringify(bodyConUsuario);
      fetchOpts.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
    }
    const res = await fetch(url, fetchOpts);
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'Error desconocido');
    S.syncStatus = 'ok';
    renderSyncDot();
    return json.data;
  } catch (err) {
    S.syncStatus = 'bad';
    renderSyncDot();
    throw err;
  }
}

function renderSyncDot() {
  const el = document.getElementById('sync-dot');
  if (!el) return;
  el.className = 'sync-dot ' + (S.syncStatus === 'busy' ? 'busy' : S.syncStatus === 'bad' ? 'bad' : 'ok');
}

function toast(msg, type) {
  type = type || 'ok';
  const zone = document.getElementById('toast-zone');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  zone.appendChild(el);
  setTimeout(() => el.remove(), 3800);
}

function today() { return new Date().toISOString().slice(0, 10); }

// Calcula el stock de TODOS los rodeos a una fecha de corte específica (≤ corte),
// replicando en el frontend la misma lógica que el backend usa en getStockRodeoAFecha_/
// getStockTodos. Se usa para que los dashboards individuales puedan mostrar el margen
// "como si fuera" una fecha pasada, sin que datos cargados después (ej. una venta de
// mitad de mes que todavía no cerró el período) contaminen el resultado.
function stockPorRodeoACorte_(corte) {
  const movs = S.cache.movimientos || [];
  const ventas = S.cache.ventas || [];
  const mortandad = S.cache.mortandad || [];
  const stockMap = {};
  movs.forEach(m => {
    const cant = Number(m.cantidad) || 0;
    const fechaOk = (m.fecha || '') <= corte;
    if (m.tipo === 'Saldo inicial') {
      // El saldo inicial respeta su propia fecha, igual que el backend.
      if (fechaOk) stockMap[String(m.rodeo_destino_id)] = (stockMap[String(m.rodeo_destino_id)] || 0) + cant;
      return;
    }
    if (!fechaOk) return;
    if (m.rodeo_destino_id) stockMap[String(m.rodeo_destino_id)] = (stockMap[String(m.rodeo_destino_id)] || 0) + cant;
    if (m.rodeo_origen_id)  stockMap[String(m.rodeo_origen_id)]  = (stockMap[String(m.rodeo_origen_id)]  || 0) - cant;
  });
  ventas.forEach(v => {
    if ((v.fecha_salida || '') <= corte) {
      stockMap[String(v.rodeo_id)] = (stockMap[String(v.rodeo_id)] || 0) - (Number(v.cant_animales) || 0);
    }
  });
  mortandad.forEach(m => {
    if ((m.fecha || '') <= corte) {
      stockMap[String(m.rodeo_id)] = (stockMap[String(m.rodeo_id)] || 0) - (Number(m.cantidad) || 1);
    }
  });
  return stockMap;
}
// Último peso promedio registrado de un rodeo, respetando la fecha de corte
// (no usa pesadas posteriores al corte, para no adelantar información).
function ultimaPesadaACorte_(rodeoId, corte) {
  const pesadasR = (S.cache.pesadas || [])
    .filter(p => String(p.rodeo_id) === String(rodeoId) && (p.fecha || '') <= corte)
    .sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
  return pesadasR[0] ? Number(pesadasR[0].peso_prom_kg) || 0 : 0;
}
// Compara por_campo de forma robusta: acepta true, "true", "TRUE", "True", 1, "1"
function esPorCampo_(v) {
  if (v === true || v === 1) return true;
  if (typeof v === 'string') return v.toLowerCase() === 'true' || v === '1';
  return false;
}

function fd(dateStr) {
  if (!dateStr) return '—';
  const parts = String(dateStr).split('-');
  if (parts.length === 3) return parts[2] + '/' + parts[1] + '/' + parts[0];
  return dateStr;
}
function fn(n, dec) {
  dec = dec || 0;
  if (n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString('es-AR', { maximumFractionDigits: dec, minimumFractionDigits: dec });
}
function pct(n) { return n === null || n === undefined ? '—' : fn(n, 1) + '%'; }
function gid() { return 'tmp_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function rodeoNombre(rodeoId) {

}

// Cantidad de terneros nacidos vivos en un rodeo (suma de Pariciones), menos los que
// ya se destetaron antes — da el "stock de terneros disponibles para destetar".
// Se usa para alertar si se intenta destetar un rodeo sin nacimientos cargados,
// o más terneros de los que realmente nacieron (probable falta de carga de Pariciones).
function ternerosDisponiblesParaDestete_(rodeoId) {
  const pariciones = (S.cache.pariciones || []).filter(p => String(p.rodeo_id) === String(rodeoId));
  const nacidos = pariciones.reduce((s, p) => s + (Number(p.nacidos_vivos) || 0), 0);
  const destetesYa = (S.cache.destetes || []).filter(d => String(d.rodeo_id) === String(rodeoId));
  const yaDestetados = destetesYa.reduce((s, d) => s + (Number(d.total) || 0), 0);
  return { nacidos, yaDestetados, disponibles: Math.max(0, nacidos - yaDestetados) };
}
// Vacas preñadas (según Tactos) que todavía no parieron, para un rodeo puntual.
// Es una aproximación (igual que el índice de parición general): se asume ~1 cría
// por vaca preñada, y se cuenta "ya parió" como nacidos_vivos + nacidos_muertos
// (la vaca dio a luz, sea el resultado vivo o muerto). Sirve para saber cuántas
// vacas de ese rodeo faltarían parir todavía — no reemplaza un control por caravana.
function vacasPendientesDeParir_(rodeoId) {
  const tactos = (S.cache.tactos || []).filter(t => String(t.rodeo_id) === String(rodeoId));
  const prenadas = tactos.reduce((s, t) => s + (Number(t.prenadas) || 0), 0);
  const pariciones = (S.cache.pariciones || []).filter(p => String(p.rodeo_id) === String(rodeoId));
  const yaParieron = pariciones.reduce((s, p) => s + (Number(p.nacidos_vivos) || 0) + (Number(p.nacidos_muertos) || 0), 0);
  return { prenadas, yaParieron, pendientes: Math.max(0, prenadas - yaParieron) };
}
function rodeosTodos() {
  return (S.catalogs && S.catalogs.rodeos || []);
}
// Categorías que NUNCA deberían estar en un corral de Terminación/Engorde,
// aunque la columna "actividad" del catálogo esté mal cargada como "Engorde".
// Esto es una red de seguridad ante errores de carga en la planilla — la corrección
// real es arreglar la columna "actividad" del rodeo en la pestaña Rodeos del Sheet.
const CATS_NO_ENGORDE_ = ['ternero', 'ternera', 'vaca', 'vaca venta', 'toro', 'vaquillona', 'vaquillona proximo servicio', 'vaquilloncita'];
function normAct_(s) { return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

// Un movimiento "Saldo inicial" puede ser carga real de stock inicial, o puede
// haber sido creado automáticamente por registrarParicionConTerneros() para dar
// de alta los terneros nacidos. Ambos suman al stock de la misma forma — la
// diferencia es solo de ETIQUETA para que los reportes de Existencia (EI/EF)
// muestren "Nacimientos" como línea aparte en vez de esconderlos dentro del EI,
// que es lo que confundía la lectura del informe para quien no conoce el sistema.
// Se identifican por el tag '[pid:<id>]' que ese registro siempre graba en
// observaciones (el mismo que usa el backend para el borrado en cascada).
// Un movimiento "Saldo inicial" puede ser carga real de stock inicial, o puede
// haber sido creado automáticamente por registrarParicionConTerneros() para dar
// de alta los terneros nacidos. Ambos suman al stock de la misma forma — la
// diferencia es solo de ETIQUETA para que los reportes de Existencia (EI/EF)
// muestren "Nacimientos" como línea aparte en vez de esconderlos dentro del EI,
// que es lo que confundía la lectura del informe para quien no conoce el sistema.
// Se identifican de dos formas: el tag '[pid:<id>]' que graba desde hace poco
// (el mismo que usa el backend para el borrado en cascada), o — para Pariciones
// cargadas ANTES de que ese tag existiera — el texto fijo "Nacimiento — parición"
// que registrarParicionConTerneros() siempre puso al principio de observaciones.
function esAltaPorParicion_(m) {
  if (!m || m.tipo !== 'Saldo inicial') return false;
  const obs = String(m.observaciones || '');
  return /\[pid:\d+\]/.test(obs) || /^Nacimiento\s*—\s*parici[oó]n/i.test(obs);
}

// Clasifica los Traslados que entran/salen de un conjunto de rodeos (una actividad)
// en tres baldes: Compras (sin rodeo de origen — entrada real desde afuera del
// sistema), Cesiones recibidas (origen es un rodeo que NO pertenece a esta
// actividad) y Cesiones enviadas (destino no pertenece a esta actividad). Un
// Traslado entre dos rodeos DE LA MISMA actividad es un movimiento interno — se
// cancela solo (resta de un lado, suma del otro, ambos dentro del mismo total) y
// no debe contarse en ninguno de los tres baldes.
function clasificarTrasladosActividad_(rodeoIdsSet, movs) {
  let compras = 0, cesionesRecibidas = 0, cesionesEnviadas = 0;
  movs.forEach(m => {
    if (m.tipo !== 'Traslado en bloque' && m.tipo !== 'Traslado individual') return;
    const cant = Number(m.cantidad) || 0;
    const destinoAqui = rodeoIdsSet.has(String(m.rodeo_destino_id));
    const origenAqui = rodeoIdsSet.has(String(m.rodeo_origen_id));
    if (destinoAqui && !origenAqui) {
      if (!m.rodeo_origen_id) compras += cant;
      else cesionesRecibidas += cant;
    }
    if (origenAqui && !destinoAqui) {
      cesionesEnviadas += cant;
    }
  });
  return { compras, cesionesRecibidas, cesionesEnviadas };
}

// Panel de conciliación de Existencia en cabezas: EI + Compras + Cesiones
// recibidas + Nacimientos − Cesiones enviadas − Ventas − Mortandad = EF.
// Muestra el cálculo término a término y lo compara contra el EF real (el que
// sale de sumar el stock rodeo por rodeo) — si no coincide, lo marca en rojo
// para que salte a la vista en vez de quedar escondido.
function buildConciliacionCabezas_(titulo, t, efReal) {
  const efCalc = (t.ei||0) + (t.compras||0) + (t.cesionesRecibidas||0) + (t.nacimientos||0)
               - (t.cesionesEnviadas||0) - (t.ventas||0) - (t.mortandad||0);
  const diff = Math.round((efReal||0) - efCalc);
  const ok = diff === 0;
  const filas = [
    { label: 'Existencia inicial (EI)', val: t.ei||0, signo: '' },
    { label: '+ Compras', val: t.compras||0, signo: '+' },
    { label: '+ Cesiones recibidas', val: t.cesionesRecibidas||0, signo: '+' },
    { label: '+ Nacimientos', val: t.nacimientos||0, signo: '+' },
    { label: '− Cesiones enviadas', val: t.cesionesEnviadas||0, signo: '−' },
    { label: '− Ventas', val: t.ventas||0, signo: '−' },
    { label: '− Mortandad', val: t.mortandad||0, signo: '−' },
  ].filter(f => f.val !== 0 || f.signo === '');
  let h = `<div class="panel" style="border:1px solid var(--border2)">
    <div class="panel-title">🧮 ${titulo} — Conciliación de Existencia (cabezas)</div>
    <table class="dt"><tbody>
      ${filas.map(f => `<tr><td>${f.label}</td><td class="tr">${fn(f.val)}</td></tr>`).join('')}
      <tr style="background:var(--bg2);font-weight:800"><td>= EF calculado</td><td class="tr">${fn(efCalc)}</td></tr>
      <tr><td>EF real (stock por rodeo)</td><td class="tr">${fn(efReal||0)}</td></tr>
    </tbody></table>
    ${ok
      ? `<div style="font-size:12.5px;color:var(--green-text);font-weight:600;margin-top:6px">✓ Cierra — el calculado coincide con el real.</div>`
      : `<div style="font-size:12.5px;color:var(--red-text);font-weight:700;margin-top:6px">⚠ No cierra — diferencia de ${fn(Math.abs(diff))} cabezas (${diff>0?'el real tiene más':'el real tiene menos'} de lo que explican estos términos). Puede haber un movimiento mal clasificado o un rodeo excluido de este cálculo.</div>`
    }
  </div>`;
  return h;
}

// Valoriza un movimiento de Saldo inicial (o cualquier movimiento de entrada) para
// mostrar el precio/total en los paneles de EI. Antes solo se miraba precio_cabeza,
// lo que hacía aparecer "sin precio" en rodeos que en realidad estaban cargados
// con precio_kg + peso_prom_kg (ej: terneros valorizados por kg a mano).
function valorMovimientoEntrada_(m) {
  const cant = Number(m.cantidad) || 0;
  const precioCabeza = Number(m.precio_cabeza) || 0;
  const precioKg = Number(m.precio_kg) || 0;
  const peso = Number(m.peso_prom_kg) || 0;
  if (precioCabeza > 0) {
    return { total: cant * precioCabeza, precioLabel: '$ ' + fn(precioCabeza), metodo: 'por cabeza' };
  }
  if (precioKg > 0 && peso > 0) {
    return { total: cant * peso * precioKg, precioLabel: '$ ' + fn(precioKg) + '/kg (' + fn(peso) + ' kg)', metodo: 'por kg' };
  }
  return { total: 0, precioLabel: null, metodo: null };
}

function rodeosEngordeValidos_() {
  const norm_ = s => String(s || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  return rodeosTodos().filter(r => {
    const act = norm_(r.actividad);
    if (act !== 'engorde' && act !== 'terminacion') return false;
    const cat = norm_(r.categoria);
    if (CATS_NO_ENGORDE_.some(c => norm_(c) === cat)) return false;
    return true;
  });
}
function rodeosPorCampo(campoId) {
  return rodeosTodos().filter(r => String(r.campo_id) === String(campoId));
}
function rodeoOptionsHtml(rodeosList) {
  if (!rodeosList.length) return '<option value="">Sin rodeos en este campo</option>';
  return rodeosList.map(r => `<option value="${r.rodeo_id}">${r.nombre}</option>`).join('');
}
// Un rodeo se muestra en el buscador de Movimientos solo si tiene stock actual O algún movimiento/venta registrado.
// Si no tiene NINGUNA de las dos cosas, se oculta (las dos condiciones tienen que faltar juntas).
function rodeoTieneActividad_(rodeoId) {
  const stockRow = (S.stock || []).find(r => String(r.rodeo_id) === String(rodeoId));
  if (stockRow && Number(stockRow.stock) !== 0) return true;
  const tieneMov = (S.cache.movimientos || []).some(m => String(m.rodeo_origen_id) === String(rodeoId) || String(m.rodeo_destino_id) === String(rodeoId));
  if (tieneMov) return true;
  if ((S.cache.ventas || []).some(v => String(v.rodeo_id) === String(rodeoId))) return true;
  // Pesadas también cuentan como actividad: un corral puede tener pesadas cargadas
  // (ej: migradas desde otro sistema) sin tener todavía un movimiento de entrada.
  // Mostrarlo en los selectores ayuda a detectar ese hueco — sin esto, el corral
  // desaparece silenciosamente y parece que "no existe" en vez de "le falta el movimiento".
  return (S.cache.pesadas || []).some(p => String(p.rodeo_id) === String(rodeoId));
}
function rodeosTodosConActividad_() {
  return rodeosTodos().filter(r => rodeoTieneActividad_(r.rodeo_id));
}
function rodeosConActividadPorCampo_(campoId) {
  return rodeosPorCampo(campoId).filter(r => rodeoTieneActividad_(r.rodeo_id));
}
// Para registrar consumo de insumos: solo rodeos con animales AHORA (no tiene sentido cargar consumo en un rodeo vacío)
function rodeosConStockPorCampo_(campoId) {
  return rodeosPorCampo(campoId).filter(r => {
    const row = (S.stock || []).find(s => String(s.rodeo_id) === String(r.rodeo_id));
    return row && Number(row.stock) > 0;
  });
}
// Igual que rodeosConStockPorCampo_ pero sin filtrar por campo — se usa para
// productos de "pozo común" (por_campo=false), donde el consumo puede
// registrarse contra cualquier lote de cualquier campo, no solo el del
// primer campo del catálogo (que es lo que quedaba fijado antes por error).
function rodeosConStockTodosCampos_() {
  return rodeosTodos().filter(r => {
    const row = (S.stock || []).find(s => String(s.rodeo_id) === String(r.rodeo_id));
    return row && Number(row.stock) > 0;
  });
}

  const data = await apiCall('list', { params: { entity } });
  S.cache[entity] = data;
  return data;
}

async function autofetchCotizacion_() {
  // Buscar automáticamente si no tenemos cotización de hoy
  try {
    const hoy = today();
    const yaHoy = (S.catalogs && S.catalogs.tipo_cambio || []).find(t => t.fecha === hoy);
    if (!yaHoy) {
      const res = await fetch('https://dolarapi.com/v1/dolares/oficial', { cache: 'no-store' });
      if (!res.ok) return;
      const data = await res.json();
      const valor = data.venta || data.promedio || null;
      if (!valor) return;
      await apiCall('create', { body: { entity: 'tipo_cambio', data: { fecha: hoy, valor: Number(valor), fuente: 'BNA' } } });
      await loadCatalogs();
      toast('Cotización del día actualizada: $ ' + fn(valor, 2) + ' / U$S', 'ok');
      render();
    }
  } catch(e) { /* silencioso — no interrumpir el inicio */ }
}

async function init() {
  if (!apiConfigured()) { S.page = 'setup'; render(); return; }
  S._loading = true; S._loadingMsg = 'Conectando con la planilla…';
  render();
  try {
    S._loadingMsg = 'Cargando catálogos…';
    render();
    await loadCatalogs();
    S._loading = false;
    if (!S.page || S.page === 'setup') S.page = 'home';
    render(); // app navegable de inmediato
    autofetchCotizacion_();
    // Precargar datos en paralelo sin bloquear la UI
    Promise.all([
      loadDashboard().catch(()=>{}),
      loadStock().catch(()=>{}),
      // compras_insumos y consumos_insumos van SUELTAS, fuera del paquete grande de
      // abajo — son las que necesita la pantalla de Insumos y Veterinaria, y si van
      // adentro del paquete de 14 entidades, Insumos queda esperando a que TODAS
      // las demás (incluidas movimientos y ventas, que pueden ser grandes) terminen
      // primero. Separadas acá, entran rápido por su cuenta.
      loadEntity('compras_insumos').catch(()=>{}),
      loadEntity('consumos_insumos').catch(()=>{}),
      // OPTIMIZACIÓN: antes acá había 16 llamadas sueltas (movimientos, ventas,
      // consumos_insumos, compras_insumos, pesadas, sueldos, mortandad, abortos,
      // destetes, pariciones, egresos_recria, precios_internos, campanas,
      // rodeo_productos, config_corral, engorde_lotes) más resumenRecria, todas
      // disparadas EN PARALELO — Apps Script tiene un límite de ejecuciones
      // simultáneas, así que buena parte de esos pedidos se amontonaban haciendo
      // fila, sumando varios segundos de más a la carga inicial (confirmado con
      // las ejecuciones de Apps Script: varias llegaban con menos de 1 segundo
      // de diferencia entre sí). Ahora se traen las 14 restantes juntas, en una
      // sola llamada — sin incluir compras_insumos/consumos_insumos (ver arriba).
      apiCall('initBundle').then(bundle => {
        Object.keys(bundle).forEach(k => {
          if (k === 'resumenRecria') { S.resumenRecria = bundle[k]; }
          else { S.cache[k] = bundle[k]; }
        });
        return migrarConfigCorralLegacy_();
      }).catch(()=>{}),
      loadCorralesStock().catch(()=>{}),
    ]).then(()=>{ render(); });
  } catch (err) {
    S._loading = false;
    toast('Error al conectar: ' + err.message, 'err');
  }
}

async function goto(page) {
  S.page = page;
  S.sidebarOpen = false;
  render(); // render inmediato para que el ítem del menú se ponga activo
  const entityMap = { servicios: 'servicios', tactos: 'tactos', abortos: 'abortos', pariciones: 'pariciones', mortandad: 'mortandad', destetes: 'destetes', movimientos: 'movimientos', ventas: 'ventas', insumos: 'consumos_insumos', sueldos: 'sueldos', compras_hacienda: 'compras_hacienda' };
  if (entityMap[page] && !S.cache[entityMap[page]]) {
    S.loading = true; render();
    try { await loadEntity(entityMap[page]); } catch (err) { toast(err.message, 'err'); }
    S.loading = false;
  }
  // Tactos, Abortos y Pariciones necesitan la caché de Servicios para filtrar rodeos con servicio registrado
  if ((page === 'tactos' || page === 'abortos' || page === 'pariciones') && !S.cache.servicios) {
    try { await loadEntity('servicios'); } catch (err) { /* silencioso */ }
  }
  // Destetes necesita la caché de Tactos para filtrar rodeos con vacas preñadas confirmadas.
  // Pariciones también la necesita ahora, para el aviso de "cuántas vacas faltan parir".
  if ((page === 'destetes' || page === 'pariciones') && !S.cache.tactos) {
    try { await loadEntity('tactos'); } catch (err) { /* silencioso */ }
  }
  // Si el Resumen fue invalidado por un registro reciente (Pariciones/Destetes/Mortandad/Abortos),
  // se recarga automáticamente al volver a visitarlo.
  if (page === 'dashboard') {
    const t = setTimeout(() => { if (!S.dashboard) { S.dashboardError = 'La conexión tardó demasiado.'; render(); } }, 15000);
    const loads = [];
    if (!S.cache.movimientos)      loads.push(loadEntity('movimientos').catch(()=>{}));
    if (!S.cache.ventas)           loads.push(loadEntity('ventas').catch(()=>{}));
    if (!S.cache.consumos_insumos) loads.push(loadEntity('consumos_insumos').catch(()=>{}));
    if (!S.cache.compras_hacienda) loads.push(loadEntity('compras_hacienda').catch(()=>{}));
    if (!S.cache.sueldos)          loads.push(loadEntity('sueldos').catch(()=>{}));
    if (!S.cache.pesadas)          loads.push(loadEntity('pesadas').catch(()=>{}));
    if (!S.cache.rodeo_productos)  loads.push(loadEntity('rodeo_productos').catch(()=>{}));
    if (!S.cache.productos)        loads.push(loadEntity('productos').catch(()=>{}));
    if (!S.cache.mortandad)        loads.push(loadEntity('mortandad').catch(()=>{}));
    if (!S.cache.abortos)          loads.push(loadEntity('abortos').catch(()=>{}));
    Promise.all(loads).then(() => { clearTimeout(t); render(); }).catch(err => { clearTimeout(t); render(); });
  }
  if (page === 'indices_reproduccion' && !S.indicesData && !S._indicesLoading) {
    S._indicesLoading = true;
    apiCall('dashboard').then(data => { S.indicesData = data; S._indicesLoading = false; render(); }).catch(() => { S._indicesLoading = false; render(); });
  }
  if (page === 'movimientos') {
    // Cargar todo en paralelo para evitar múltiples re-renders
    const movPromises = [];
    if (!S.stock) movPromises.push(loadStock().catch(() => {}));
    if (!S.cache.ventas) movPromises.push(loadEntity('ventas').catch(() => {}));
    if (S.corralesStock === undefined) movPromises.push(loadCorralesStock().catch(() => {}));
    if (movPromises.length) await Promise.all(movPromises);
  }
  if ((page === 'stock_hacienda' || page === 'insumos') && !S.stock) {
    try {
      await loadStock();
      // Re-renderizar stock actual una vez cargado
      if (page === 'stock_hacienda') {
        const el = document.getElementById('sh-stock-actual');
        if (el) el.innerHTML = buildStockTable_(S.stock || [], '', '');
        // Repoblar categorías en los selects
        const catSel = document.getElementById('sh-stock-cat');
        if (catSel && (S.stock||[]).length) {
          const cats = [...new Set((S.stock||[]).map(s=>s.categoria).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
          catSel.innerHTML = '<option value="">Todas las categorías</option>' + cats.map(c=>`<option value="${c}">${c}</option>`).join('');
        }
      }
    } catch (err) { /* silencioso */ }
  }
  if (page === 'insumos' && !S.cache.compras_insumos) {
    try { await loadEntity('compras_insumos'); } catch (err) { /* silencioso */ }
  }
  if (page === 'insumos' && !S.cache.productos) {
    try { await loadEntity('productos'); } catch (err) { /* silencioso */ }
  }
  if (page === 'insumos') {
    // Siempre refrescar catálogo al entrar a Insumos para que por_campo esté actualizado
    try { await loadCatalogs(); } catch (err) { /* silencioso */ }
  }
  if (page === 'insumos' && !S.stockProductos) {
    try { await loadStockProductos(); } catch (err) { toast(err.message, 'err'); }
  }
  if (page.startsWith('engorde')) {
    // Cargar todo en paralelo
    const engPromises = [];
    if (!S.stock)                    engPromises.push(loadStock().catch(()=>{}));
    if (!S.cache.pesadas)            engPromises.push(loadEntity('pesadas').catch(()=>{}));
    if (!S.cache.ventas)             engPromises.push(loadEntity('ventas').catch(()=>{}));
    if (!S.cache.consumos_insumos)   engPromises.push(loadEntity('consumos_insumos').catch(()=>{}));
    if (!S.cache.compras_insumos)    engPromises.push(loadEntity('compras_insumos').catch(()=>{}));
    if (!S.cache.movimientos)        engPromises.push(loadEntity('movimientos').catch(()=>{}));
    if (!S.cache.sueldos)            engPromises.push(loadEntity('sueldos').catch(()=>{}));
    if (engPromises.length) await Promise.all(engPromises);
    // Intentar cargar cotización desde localStorage si no vino de la API
    if (!S.corralesTipoCambio || !S.corralesTipoCambio.length) {
      try {
        const cached = JSON.parse(localStorage.getItem('lm_tipo_cambio') || 'null');
        if (cached && cached.length) S.corralesTipoCambio = cached;
      } catch(e) {}
    }
    if (S.corralesTipoCambio === undefined) { try { await loadCorralesStock(); } catch (err) { /* silencioso */ } }
    // Inicializar corral seleccionado con el primero de Engorde que tenga animales
    if (!egGetCorralId()) {
      const rEng = rodeosEngordeValidos_();
      if (rEng.length) egSetCorralId(String(rEng[0].rodeo_id));
    }
  }
  if (page === 'cesiones_cria' || page === 'cesiones_recria') {
    if (!S.cache.movimientos)     { try { await loadEntity('movimientos'); } catch(e){} }
    if (!S.cache.egresos_recria)  { try { await loadEntity('egresos_recria'); } catch(e){} }
    if (!S.cache.pesadas)         { try { await loadEntity('pesadas'); } catch(e){} }
    if (!S.resumenRecria)         { try { S.resumenRecria = await apiCall('resumenRecria'); } catch(e){} }
  }
  if (page === 'recria_dashboard') {
    const recLoads = [];
    if (!S.resumenRecria)           recLoads.push(apiCall('resumenRecria').then(d=>{ S.resumenRecria=d; }).catch(()=>{}));
    if (!S.cache.pesadas)           recLoads.push(loadEntity('pesadas').catch(()=>{}));
    if (!S.cache.ventas)            recLoads.push(loadEntity('ventas').catch(()=>{}));
    if (!S.cache.egresos_recria)    recLoads.push(loadEntity('egresos_recria').catch(()=>{}));
    if (!S.cache.consumos_insumos)  recLoads.push(loadEntity('consumos_insumos').catch(()=>{}));
    if (!S.cache.destetes)          recLoads.push(loadEntity('destetes').catch(()=>{}));
    if (!S.cache.movimientos)       recLoads.push(loadEntity('movimientos').catch(()=>{}));
    if (!S.cache.mortandad)         recLoads.push(loadEntity('mortandad').catch(()=>{}));
    if (!S.cache.sueldos)           recLoads.push(loadEntity('sueldos').catch(()=>{}));
    if (!S.cache.precios_internos)  recLoads.push(loadEntity('precios_internos').catch(()=>{}));
    if (recLoads.length) await Promise.all(recLoads);
  }
  if (page === 'margenbruto') {
    if (!S.cache.precios_internos)   { try { await loadEntity('precios_internos'); } catch (err) { /* silencioso */ } }
    if (!S.cache.campanas)           { try { await loadEntity('campanas'); } catch (err) { /* silencioso */ } }
    if (!S.resumenRecria)            { try { S.resumenRecria = await apiCall('resumenRecria'); } catch (err) { /* silencioso */ } }
    if (!S.cache.ventas)             { try { await loadEntity('ventas'); } catch (err) { /* silencioso */ } }
    if (!S.cache.egresos_recria)     { try { await loadEntity('egresos_recria'); } catch (err) { /* silencioso */ } }
    if (!S.cache.consumos_insumos)   { try { await loadEntity('consumos_insumos'); } catch (err) { /* silencioso */ } }
    if (!S.cache.destetes)           { try { await loadEntity('destetes'); } catch (err) { /* silencioso */ } }
    if (!S.cache.movimientos)        { try { await loadEntity('movimientos'); } catch (err) { /* silencioso */ } }
    if (!S.cache.sueldos)            { try { await loadEntity('sueldos'); } catch (err) { /* silencioso */ } }
    if (!S.cache.mortandad)          { try { await loadEntity('mortandad'); } catch (err) { /* silencioso */ } }
    if (!S.cache.pesadas)            { try { await loadEntity('pesadas'); } catch (err) { /* silencioso */ } }
    if (!S.stock)                    { try { await loadStock(); } catch (err) { /* silencioso */ } }
    if (!S.dashboard)                { try { await loadDashboard(); } catch (err) { /* silencioso */ } }
    if (S.corralesTipoCambio === undefined) {
      try { await loadCorralesStock(); } catch (err) { /* silencioso */ }
    }
    if (!S.margenBruto) {
      if (!S.margenBrutoPeriodo) S.margenBrutoPeriodo = periodoPreset_('anio');
      try { await calcularMargenBruto_(); } catch (err) { toast(err.message, 'err'); }
    }
  }
  render();
}

function render() {
  const root = document.getElementById('root');

  if (S._loading) {
    root.innerHTML = `
    <div style="min-height:100vh;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px">
      <img src="https://agroganaderalosmedanos.github.io/isologo.png" style="width:90px;animation:lm-pulse 1.5s ease-in-out infinite">
      <div style="text-align:center">
        <div style="font-family:var(--serif);font-size:26px;font-weight:700;color:var(--text);margin-bottom:6px">Agroganadera Los Médanos</div>
        <div style="font-size:14px;color:var(--text2)">${S._loadingMsg||'Cargando…'}</div>
      </div>
      <div style="display:flex;gap:8px">
        <div style="width:8px;height:8px;border-radius:50%;background:var(--green);animation:lm-bounce 1.2s ease-in-out infinite 0s"></div>
        <div style="width:8px;height:8px;border-radius:50%;background:var(--green);animation:lm-bounce 1.2s ease-in-out infinite .2s"></div>
        <div style="width:8px;height:8px;border-radius:50%;background:var(--green);animation:lm-bounce 1.2s ease-in-out infinite .4s"></div>
      </div>
    </div>
    <style>
      @keyframes lm-pulse{0%,100%{opacity:.7}50%{opacity:1}}
      @keyframes lm-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    </style>`;
    return;
  }

  if (S.page === 'setup') {
    root.innerHTML = buildSetup();
    attachSetupEvents();
    return;
  }
  // Guardar scroll del sidebar antes de reconstruir
  const sidebarNav = document.querySelector('.sidebar-nav');
  const savedScroll = sidebarNav ? sidebarNav.scrollTop : 0;

  root.innerHTML = buildShell();
  attachShellEvents();

  // Restaurar scroll del sidebar
  const newSidebarNav = document.querySelector('.sidebar-nav');
  if (newSidebarNav && savedScroll > 0) {
    newSidebarNav.scrollTop = savedScroll;
  }
}

// Exponer funciones clave en window para que los onclick inline puedan acceder
setTimeout(() => { window.goto = goto; window.render = render; }, 0);

function buildShell() {
  // Determinar sección activa
  const activeSection = NAV.find(sec => sec.items.some(it => it.k === S.page));
  // Secciones expandidas: la activa + las que el usuario haya expandido manualmente
  if (!S._expandedSections) S._expandedSections = {};
  if (!S.hasOwnProperty('_manuallyClosed')) S._manuallyClosed = null;
  // Auto-expandir la sección activa solo si ninguna está abierta Y el usuario no la cerró
  const anyOpen = Object.values(S._expandedSections).some(Boolean);
  if (activeSection && !anyOpen && S._manuallyClosed !== activeSection.defaultPage) {
    S._expandedSections = { [activeSection.defaultPage]: true };
  }

  const navHtml = NAV.map(sec => {
    const isActive   = sec === activeSection;
    const isExpanded = !!S._expandedSections[sec.defaultPage];
    return `
    <button class="nav-section-btn${isActive ? ' active-sec' : ''}"
      onclick="
        const wasOpen = !!(window.S._expandedSections || {})['${sec.defaultPage}'];
        window.S._expandedSections = {};
        if (wasOpen) {
          window.S._manuallyClosed = '${sec.defaultPage}';
          render();
        } else {
          window.S._manuallyClosed = null;
          window.S._expandedSections['${sec.defaultPage}'] = true;
          goto('${sec.defaultPage}');
        }
      ">
      <span style="font-size:15px">${{'Cría':'🐄','Recría':'🌱','Terminación':'🏭','Margen Bruto Ganadero':'📊','Acciones Comunes':'📁','Configuración':'⚙️'}[sec.section]||''}</span>
      <span>${sec.section}</span>
      <i class="ti ${isExpanded ? 'ti-chevron-down' : 'ti-chevron-right'}" style="margin-left:auto;font-size:12px;opacity:.6" aria-hidden="true"></i>
    </button>
    ${isExpanded ? sec.items.map(it => `
      <button class="nav-item ${S.page === it.k ? 'active' : ''}" data-nav="${it.k}" style="padding-left:32px;font-size:12.5px;color:rgba(255,255,255,.75)">
        <i class="ti ${it.icon} nav-icon" style="font-size:13px;opacity:.7" aria-hidden="true"></i>${it.label}
      </button>
    `).join('') : ''}
  `;}).join('');

  return `
  <div class="app-shell">
    <div class="sidebar ${S.sidebarOpen ? 'open' : ''}">
      <div class="sidebar-brand">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
          <img src="https://agroganaderalosmedanos.github.io/isologo.png" style="width:42px;">
          <div>
            <div style="font-size:9.5px;font-weight:600;color:rgba(255,255,255,0.5);letter-spacing:.10em;text-transform:uppercase">Agroganadera</div>
            <div style="font-family:var(--serif);font-size:15px;font-weight:700;color:#fff;line-height:1.15">Los Médanos</div>
          </div>
        </div>
        <div class="farm-sub" style="font-size:10.5px;color:rgba(255,255,255,0.45);margin-bottom:10px">Gestión de cría</div>
        <a href="https://agroganaderalosmedanos.github.io/" class="btn-inicio-sidebar" title="Volver al inicio">← Inicio</a>
        <br><button class="btn-logout-sidebar" onclick="loginClear()">⎋ Cerrar sesión</button>
      </div>
      <div class="sidebar-nav">${navHtml}</div>
      <div class="sidebar-footer">
        <span class="sync-dot ${S.syncStatus === 'busy' ? 'busy' : S.syncStatus === 'bad' ? 'bad' : 'ok'}" id="sync-dot"></span>
        ${S.syncStatus === 'bad' ? 'Sin conexión' : 'Conectado a Sheets'}
      </div>
    </div>
    <div class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:10px">
          <button class="mobile-menu-btn" id="btn-menu">☰</button>
          <div>
            ${S.page !== 'home' && pageTitle(S.page) ? `<h1>${pageTitle(S.page)}</h1>` : ''}
            ${S.page !== 'home' ? `<div class="topbar-sub">${pageSubtitle(S.page)}</div>` : ''}
          </div>
        </div>
      </div>
      <div class="content" id="content">${buildPage(S.page)}</div>
    </div>
  </div>
  `;
}

  const titles = {
    dashboard: 'Resultados Económicos Cría', indices_reproduccion: 'Índices de Reproducción', precios_valorizacion: 'Precios para Valorización de Stock', servicios: 'Servicios', tactos: 'Tactos',
    abortos: 'Abortos', pariciones: 'Pariciones', mortandad: 'Mortandad',
    home: '', recria_dashboard: 'Dashboard Recría', campanas: 'Campañas', cesiones_cria: 'Cesiones — Cría a Recría', cesiones_recria: 'Cesiones — Recría a Terminación', destetes: 'Destetes', movimientos: 'Movimientos de Hacienda', ventas: 'Ventas de Hacienda', stock_hacienda: 'Stock de Hacienda', compras_hacienda: 'Compras de Hacienda', insumos: 'Insumos', margenbruto: 'Margen Bruto Ganadero', config: 'Configuración', abm: 'ABM — Catálogos', precios_valorizacion: 'Hacienda — Precios del mes', cotizacion: 'Cotización U$S', sueldos: 'Sueldos', pesadas: 'Pesadas', engorde: 'Resultado Económico Terminación', engorde_costos: 'Resultado Económico Terminación', engorde_comparacion: 'Resultado Económico Terminación', engorde_proyeccion: 'Resultado Económico Terminación', engorde_cierre: 'Resultado Económico Terminación', engorde_historial: 'Resultado Económico Terminación', engorde_pesadas: 'Pesadas — Engorde',

}
function pageSubtitle(p) {
  const subs = {
    dashboard: 'Ingresos, egresos y margen por campaña', precios_valorizacion: 'Un registro por mes — el sistema usa el más reciente al generar informes', indices_reproduccion: 'Índices de preñez, parición y destete por rodeo',

    ventas: 'Registro de ventas y baja de stock',

}

function buildPage(page) {
  if (S.loading) return '<div class="loader"><div class="spinner"></div>Cargando datos…</div>';
  switch (page) {
    case 'home':       return buildHome();
    case 'dashboard':  return buildDashboard();
    case 'servicios':  return buildServicios();
    case 'tactos':     return buildTactos();
    case 'abortos':    return buildAbortos();
    case 'pariciones': return buildPariciones();
    case 'mortandad':  return buildMortandad();
    case 'destetes':   return buildDestetes();
    case 'movimientos': return buildMovimientos();
    case 'ventas':      return buildVentas();
    case 'insumos':     return buildInsumos();
    case 'margenbruto': return buildMargenBruto();
    case 'recria_dashboard':  return buildRecriaDashboard();
    case 'cesiones_cria':     return buildCesionesCria();
    case 'cesiones_recria':   return buildCesionesRecria();
    case 'engorde':
    case 'engorde_costos':
    case 'engorde_comparacion':
    case 'engorde_proyeccion':
    case 'engorde_cierre':
    case 'engorde_historial': return buildEngorde();
    case 'engorde_pesadas':   return buildEngordePesadasPage();
    case 'engorde_alim':    return buildEngordeAlim();
    case 'sueldos':          return buildSueldos();
    case 'indices_reproduccion': return buildIndicesReproduccion();
    case 'compras_hacienda':     return buildComprasHacienda();
    case 'precios_valorizacion':  return buildPreciosValPage();
    case 'ia':           return buildIA();
    case 'stock_hacienda': return buildStockHacienda();
    case 'pesadas':      return buildPesadas();
    case 'cotizacion':  return buildCotizacion();
    case 'config':     return buildConfig();
    case 'abm':
      if (S.abmTab === 'corrales' && !S.cache.config_corral) {
        loadEntity('config_corral', true).catch(()=>{ S.cache.config_corral = []; }).then(render);
      }
      return buildABM();
    case 'campanas':    return buildCampanas();
    default: return '';
  }
}

function buildSetup() {
  return `
  <div class="setup-wrap">
    <div style="text-align:center;margin-bottom:24px">
      <div style="font-size:28px;margin-bottom:8px">⛭</div>
      <div style="font-family:var(--serif);font-size:22px;font-weight:600">Los Médanos</div>
      <div style="font-size:13px;color:var(--text2);margin-top:2px">Configuración inicial — gestión de cría</div>
    </div>
    <div class="panel">
      <div class="panel-title">Conectar con la planilla de datos</div>
      <p style="font-size:12.5px;color:var(--text2);margin-bottom:16px;line-height:1.6">
        Pegá la URL de la API (Apps Script Web App) y el token de acceso. Estos datos quedan guardados solo en este navegador.
      </p>
      <div class="fgrid" style="flex-direction:column">
        <div class="fg">
          <label>URL de la API <span class="opt">(termina en /exec)</span></label>
          <input type="text" id="su-url" placeholder="https://script.google.com/macros/s/.../exec" value="${S.apiUrl}">
        </div>
        <div class="fg">
          <label>Token de acceso</label>
          <input type="password" id="su-token" placeholder="Token configurado en el script" value="${S.apiToken}">
        </div>
      </div>
      <div id="su-status" style="margin-top:10px;font-size:12.5px"></div>
      <button class="btn btn-primary" id="su-save" style="margin-top:14px;width:100%;justify-content:center">Conectar</button>
    </div>
  </div>`;
}
function attachSetupEvents() {
  document.getElementById('su-save').onclick = async () => {
    const url = document.getElementById('su-url').value.trim();
    const token = document.getElementById('su-token').value.trim();
    const statusEl = document.getElementById('su-status');
    if (!url || !token) { statusEl.textContent = 'Completá ambos campos.'; statusEl.style.color = 'var(--red)'; return; }
    S.apiUrl = url; S.apiToken = token;
    statusEl.textContent = 'Probando conexión…'; statusEl.style.color = 'var(--text2)';
    try {
      await loadCatalogs();
      save();
      toast('Conectado correctamente', 'ok');
      S.page = 'dashboard';
      await loadDashboard();
      render();
    } catch (err) {
      statusEl.textContent = 'Error: ' + err.message; statusEl.style.color = 'var(--red)';
    }
  };
}

function attachShellEvents() {
  document.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => {
    // Scroll active nav item into view after navigation
    goto(b.dataset.nav).then(() => {
      const active = document.querySelector('.nav-item.active');
      if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    });
  });
  const menuBtn = document.getElementById('btn-menu');
  if (menuBtn) menuBtn.onclick = () => { S.sidebarOpen = !S.sidebarOpen; render(); };
  attachPageEvents(S.page);
}

function attachPageEvents(page) {
  const fns = {
    dashboard: attachDashboardEvents, servicios: attachServiciosEvents, tactos: attachTactosEvents,
    abortos: attachAbortosEvents, pariciones: attachParicionesEvents, mortandad: attachMortandadEvents,

// ÍNDICES DE REPRODUCCIÓN (antes era el "Resumen Cría" del panel)
// ══════════════════════════════════════════════════════════════════════
function aggregateKpis_(rodeosArr) {
  let totServ = 0, prenIatf = 0, prenToro = 0, totPren = 0;
  let totTacteadasIatf = 0, totTacteadasToro = 0;
  let nacVivos = 0, nacMuertos = 0, abortos = 0, totDest = 0, mortTerneros = 0;
  rodeosArr.forEach(r => {
    const k = r.kpis;
    totServ += k.servicio.total_serviciadas || 0;
    prenIatf += k.servicio.prenadas_iatf || 0;
    prenToro += k.servicio.prenadas_toro || 0;
    totPren += k.servicio.total_prenadas || 0;
    totTacteadasIatf += k.servicio.total_tacteadas_iatf || 0;
    totTacteadasToro += k.servicio.total_tacteadas_toro || 0;
    nacVivos += k.paricion.nacidos_vivos || 0;
    nacMuertos += k.paricion.nacidos_muertos || 0;
    abortos += k.gestacion.abortos || 0;
    totDest += k.destete.total_destetados || 0;
    mortTerneros += k.destete.mortandad_terneros || 0;
  });
  const totTacteadas = totTacteadasIatf + totTacteadasToro;
  const basePreñez = totServ || totTacteadas; // usar tacteadas si no hay servicios registrados
  return {
    servicio: {
      total_serviciadas: totServ, prenadas_iatf: prenIatf, prenadas_toro: prenToro, total_prenadas: totPren,
      total_tacteadas_iatf: totTacteadasIatf, total_tacteadas_toro: totTacteadasToro,
      total_tacteadas: totTacteadas,
      indice_prenez: basePreñez > 0 ? round1_(totPren / basePreñez * 100) : null,
      indice_prenez_iatf: totTacteadasIatf > 0 ? round1_(prenIatf / totTacteadasIatf * 100) : null,
      indice_prenez_toro: totTacteadasToro > 0 ? round1_(prenToro / totTacteadasToro * 100) : null,
    },
    gestacion: { abortos },
    paricion: { nacidos_vivos: nacVivos, nacidos_muertos: nacMuertos, indice_paricion: totPren > 0 ? round1_(nacVivos / totPren * 100) : null },
    destete: { total_destetados: totDest, mortandad_terneros: mortTerneros, indice_destete: nacVivos > 0 ? round1_(totDest / nacVivos * 100) : null },
  };
}
function round1_(n) { return n === null || n === undefined || isNaN(n) ? null : Math.round(n * 10) / 10; }

function buildKpiRow(k) {
  return `<div class="kpi-row">
    <div class="kpi-card accent-green">
      <div class="kpi-icon">⚭</div><div class="kpi-label">Índice de preñez</div>
      <div class="kpi-value">${pct(k.servicio.indice_prenez)}</div>
      <div class="kpi-sub">${fn(k.servicio.total_prenadas)} de ${fn(k.servicio.total_serviciadas||k.servicio.total_tacteadas)} tacteadas</div>
    </div>
    <div class="kpi-card accent-gold">
      <div class="kpi-icon">◔</div><div class="kpi-label">Preñez IATF</div>
      <div class="kpi-value">${pct(k.servicio.indice_prenez_iatf)}</div>
      <div class="kpi-sub">${fn(k.servicio.prenadas_iatf)} de ${fn(k.servicio.total_tacteadas_iatf)} vacas (IATF)</div>
    </div>
    <div class="kpi-card accent-clay">
      <div class="kpi-icon">✦</div><div class="kpi-label">Índice de parición</div>
      <div class="kpi-value">${pct(k.paricion.indice_paricion)}</div>
      <div class="kpi-sub">${fn(k.paricion.nacidos_vivos)} de ${fn(k.servicio.total_prenadas)} vacas parieron</div>
    </div>
    <div class="kpi-card accent-green">
      <div class="kpi-icon">⊞</div><div class="kpi-label">Índice de destete</div>
      <div class="kpi-value">${pct(k.destete.indice_destete)}</div>
      <div class="kpi-sub">${fn(k.destete.total_destetados)} de ${fn(k.paricion.nacidos_vivos)} terneros destetados</div>
    </div>
  </div>`;
}

function buildIndicesReproduccion() {

  const g          = S.indicesData.general;

  const criaTabs2 = [
    { k: 'dashboard',            icon: '◈',  label: 'Dashboard' },
    { k: 'indices_reproduccion', icon: '📈', label: 'Índices de Reproducción' },

    </div>

        📊 Exportar Reproducción por Rodeo (.xlsx)
      </button>
    </div>
  </div>`;

  h += '<div class="section-label">Establecimiento — índices generales</div>';

  h += '<div class="section-label">Filtrar por campo</div>';
  h += '<div class="rodeo-strip">';

  campos.forEach(c => {
    h += `<div class="rodeo-chip ${String(S.selectedCampoId) === String(c.campo_id) ? 'active' : ''}" data-campo="${c.campo_id}"><div class="rc-name">${c.nombre}</div></div>`;
  });
  h += '</div>';

  const rodeosFiltrados = (S.selectedCampoId
    ? rodeosList.filter(r => String(r.rodeo.campo_id) === String(S.selectedCampoId))
    : rodeosList
  ).slice().sort((a, b) => {
    const cmp = campoNombre(a.rodeo.campo_id).localeCompare(campoNombre(b.rodeo.campo_id), 'es', { sensitivity: 'base' });
    return cmp !== 0 ? cmp : a.rodeo.nombre.localeCompare(b.rodeo.nombre, 'es', { sensitivity: 'base' });
  });

  if (S.selectedCampoId) {
    const campoSel = campos.find(c => String(c.campo_id) === String(S.selectedCampoId));
    h += `<div class="panel"><div class="panel-title">${campoSel ? campoSel.nombre : ''} <span class="pill pill-gray">${rodeosFiltrados.length} rodeo${rodeosFiltrados.length===1?'':'s'}</span></div>${buildKpiRow(aggregateKpis_(rodeosFiltrados))}</div>`;
  }

  h += '<div class="section-label">Por rodeo</div>';
  h += '<div class="rodeo-strip">';
  h += `<div class="rodeo-chip ${!S.selectedRodeoId ? 'active' : ''}" data-rodeo=""><div class="rc-name">Todos</div><div class="rc-meta">vista general</div></div>`;
  rodeosFiltrados.forEach(r => {
    h += `<div class="rodeo-chip ${String(S.selectedRodeoId) === String(r.rodeo.rodeo_id) ? 'active' : ''}" data-rodeo="${r.rodeo.rodeo_id}"><div class="rc-name">${r.rodeo.nombre}</div><div class="rc-meta">${campoNombre(r.rodeo.campo_id)}</div></div>`;
  });
  h += '</div>';

  if (S.selectedRodeoId) {
    const sel = rodeosFiltrados.find(r => String(r.rodeo.rodeo_id) === String(S.selectedRodeoId));
    if (sel) h += `<div class="panel"><div class="panel-title">${sel.rodeo.nombre} <span class="pill pill-gray">${campoNombre(sel.rodeo.campo_id)}</span></div>${buildKpiRow(sel.kpis)}</div>`;
  } else {
    h += `<div class="tw"><table class="dt"><thead><tr>
      <th>Rodeo</th><th>Campo</th>
      <th class="tc">Preñez</th><th class="tc">Parición</th><th class="tc">Destete</th>
      <th class="tc">Nacidos vivos</th><th class="tc">Destetados</th>
    </tr></thead><tbody>`;
    rodeosFiltrados.forEach(r => {
      const k = r.kpis;
      h += `<tr>
        <td><strong>${r.rodeo.nombre}</strong></td>
        <td>${campoNombre(r.rodeo.campo_id)}</td>
        <td class="tc">${pct(k.servicio.indice_prenez)}</td>
        <td class="tc">${pct(k.paricion.indice_paricion)}</td>
        <td class="tc">${pct(k.destete.indice_destete)}</td>
        <td class="tc">${fn(k.paricion.nacidos_vivos)}</td>
        <td class="tc">${fn(k.destete.total_destetados)}</td>
      </tr>`;
    });
    h += '</tbody></table></div>';
  }
  return h;
}

function comprasHacGetAll_() {
  return S.cache.compras_hacienda || [];
}

// Devuelve la campaña a precargar por defecto en el formulario de Compras de Hacienda.
// Misma prioridad que en Ventas: primero la marcada como activa, después fallback por fecha.
function ultimaCampanaCompras_() {
  const activa = campanaActivaGet_();
  if (activa) return activa.nombre || '';
  const conCampana = comprasHacGetAll_().filter(c => c.campana);
  if (!conCampana.length) return '';
  const ordenadas = conCampana.slice().sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')));
  return ordenadas[0].campana || '';
}

function buildComprasHacienda() {
  const compras  = comprasHacGetAll_().sort((a,b) => String(b.fecha).localeCompare(String(a.fecha)));

    ...compras.map(c => c.campana),
    ...((S.cache.ventas||[]).map(v => v.campana))
  ].filter(Boolean))].sort((a,b) => b.localeCompare(a));
  const categorias = [...new Set([
    ...compras.map(c => c.categoria).filter(Boolean),

  } else {
    const porCampana = {};
    compras.forEach(c => {

    Object.entries(porCampana).sort((a,b)=>b[0].localeCompare(a[0])).forEach(([camp, items]) => {

          <td style="display:flex;gap:4px">
            <button class="btn btn-secondary btn-sm" onclick="window.compraHacEditar_('${c.compra_id}')" title="Editar">✎</button>
            <button class="btn btn-danger btn-sm" onclick="window.compraHacEliminar_('${c.compra_id}')" title="Eliminar">🗑</button>
          </td>
        </tr>`;
      });
      h += '</tbody></table></div>';
    });
  }
  h += '</div>';
  return h;
}

// Mantiene sincronizado el Movimiento de stock vinculado a una Compra de Hacienda.
// Antes, "Compras de Hacienda" solo quedaba como un registro económico ($) — la
// cantidad comprada nunca sumaba al stock/EF de ningún rodeo porque no existía
// ningún Movimiento asociado. Se identifica el vínculo con el tag [cid:<compra_id>]
// en observaciones, mismo patrón que ya usa el sistema para Pariciones ([pid:...]).
// Se registra como 'Traslado en bloque' SIN rodeo de origen (entrada real desde
// afuera del sistema) — así el stock lo toma exactamente igual que un Saldo inicial
// o una cesión, en todos los cálculos existentes (dashboards, Stock Hacienda, etc.).
async function sincronizarMovimientoCompra_(compraId, c) {
  if (!compraId) return;
  const tag = '[cid:' + compraId + ']';
  await loadEntity('movimientos', true);
  const existente = (S.cache.movimientos || []).find(m => String(m.observaciones || '').indexOf(tag) !== -1);

  if (!c.rodeo_id) {
    // Sin rodeo asignado no hay dónde sumar el stock — si había un vínculo de una
    // edición anterior (se le sacó el rodeo), se borra para no dejar stock fantasma.
    if (existente) {
      try { await apiCall('delete', { body: { entity: 'movimientos', id: existente.movimiento_id } }); } catch (e) {}
    }
    return;
  }

  const rodeo = ((S.catalogs && S.catalogs.rodeos) || []).find(r => String(r.rodeo_id) === String(c.rodeo_id));
  const movData = {
    tipo: 'Traslado en bloque',
    fecha: c.fecha,
    rodeo_origen_id: '',
    campo_origen_id: '',
    rodeo_destino_id: c.rodeo_id,
    campo_destino_id: rodeo ? rodeo.campo_id : (c.campo_id || ''),
    cantidad: c.cantidad,
    precio_cabeza: c.precio_cabeza,
    observaciones: 'Compra de hacienda' + (c.vendedor ? ' — ' + c.vendedor : '') + ' ' + tag,
  };
  try {
    if (existente) {
      await apiCall('update', { body: { entity: 'movimientos', id: existente.movimiento_id, data: movData } });
    } else {
      await apiCall('create', { body: { entity: 'movimientos', data: movData } });
    }
  } catch (err) {
    toast('La compra se guardó, pero no se pudo sincronizar el movimiento de stock: ' + err.message, 'err');
  }
}

// Convierte un importe en ARS a la moneda seleccionada usando cotización de esa fecha
function convertirAMoneda_(importe, fecha, moneda) {
  if (!importe || moneda !== 'USD') return Number(importe) || 0;
  const tc = tipoCambioVigente_(fecha);
  const val = tc ? Number(tc.valor || tc) : null;
  if (!val || val <= 0) return Number(importe) || 0; // sin cotización, devuelve pesos
  return (Number(importe) || 0) / val;
}
// Formatea un valor ya convertido
function fmConv_(importe, fecha, moneda) {
  const val = convertirAMoneda_(importe, fecha, moneda);
  return (moneda === 'USD' ? 'U$S ' : '$ ') + fn(Math.round(val), 0);
}

function buildDashboard() {
  // Mostrar loader mientras cargan los datos
  if (!S.cache.movimientos || !S.cache.ventas) {
    return '<div class="loader"><div class="spinner"></div>Cargando datos del dashboard…</div>';
  }
  const campos   = (S.catalogs && S.catalogs.campos) || [];
  const rodeos   = (S.catalogs && S.catalogs.rodeos) || [];
  // Fecha de corte: por defecto hoy. Todo lo que esté cargado con fecha posterior
  // (ej. una venta o un consumo de mitad de mes que no querés que "manche" todavía
  // el resultado del período que estás analizando) queda afuera del cálculo hasta
  // que muevas la fecha.
  const corteCria = S._corteCria || today();
  const movs     = (S.cache.movimientos || []).filter(m => (m.fecha||'') <= corteCria);
  const ventas   = (S.cache.ventas || []).filter(v => (v.fecha_salida||'') <= corteCria);
  const consumos = (S.cache.consumos_insumos || []).filter(c => (c.fecha||'') <= corteCria);
  const pesadas  = (S.cache.pesadas || []).filter(p => (p.fecha||'') <= corteCria);
  const productos= S.cache.productos || [];
  const comprasH = comprasHacGetAll_().filter(c => (c.fecha||'') <= corteCria);
  const sueldos  = sueldosGetAll_();
  const mortandadCria = (S.cache.mortandad || []).filter(m => (m.fecha||'') <= corteCria);

  // Campañas disponibles
  const _criaMoneda = S.criaMoneda || 'ARS';
  const fmCria_ = p => fmonACorte_(p, _criaMoneda, corteCria);

  // OJO: la lista de campañas se arma con los datos SIN filtrar por fecha de corte
  // (a propósito). Si se armara con `ventas`/`comprasH`/`consumos` ya filtrados,
  // una campaña que todavía no tiene ningún movimiento antes de la fecha de corte
  // desaparecería del combo, y el sistema pasaría a seleccionar otra campaña por
  // default sin avisar — mostrando el margen de una campaña distinta a la que
  // pensás que estás mirando. El corte sigue aplicando sobre los TOTALES de la
  // campaña elegida, pero no debe cambiar CUÁL campaña está disponible/seleccionada.
  const campanas = [...new Set([
    ...(S.cache.ventas||[]).map(v=>v.campana).filter(Boolean),
    ...comprasHacGetAll_().map(c=>c.campana).filter(Boolean),
    ...(S.cache.consumos_insumos||[]).map(c=>c.campana).filter(Boolean),
  ])].sort((a,b)=>b.localeCompare(a));

  const campSelec = S._dashCampana || campanas[0] || '';
  const campSelecField = S._dashCampo || '';

  // Rodeos de Cría
  const rodeosCria = rodeos.filter(r => normAct_(r.actividad)==='cria');

  // ── Header con pestañas ─────────────────────────────────────────────
  const criaTabs = [
    { k: 'dashboard',            icon: '◈',  label: 'Dashboard' },
    { k: 'indices_reproduccion', icon: '📈', label: 'Índices de Reproducción' },
    { k: 'servicios',            icon: '⚭',  label: 'Servicios' },
    { k: 'tactos',               icon: '◔',  label: 'Tactos' },
    { k: 'abortos',              icon: '⊘',  label: 'Abortos' },
    { k: 'pariciones',           icon: '✦',  label: 'Pariciones' },
    { k: 'destetes',             icon: '⊞',  label: 'Destetes' },

  let h = `<div class="page-header">

      ${criaTabs.map(t => `<button class="radio-pill${S.page===t.k?' selected':''}" onclick="goto('${t.k}')">${t.icon} ${t.label}</button>`).join('')}
      <button onclick="S.criaMoneda=S.criaMoneda==='USD'?'ARS':'USD';render()"
        style="margin-left:auto;padding:6px 14px;border-radius:20px;border:none;cursor:pointer;font-size:13px;font-weight:600;background:var(--blue);color:#fff;display:flex;align-items:center;gap:6px">
        💵 ${(S.criaMoneda||'ARS')==='USD'?'Ver en ARS':'Ver en U$S'}
      </button>
    </div>
  </div>`;

  // ── Selector de campaña ─────────────────────────────────────────────
  h += `<div style="display:flex;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:8px">
      <label style="font-size:13px;font-weight:600;white-space:nowrap">Campaña:</label>
      ${campanas.length
        ? `<select style="font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);min-width:140px"
            onchange="S._dashCampana=this.value;render()">
            ${campanas.map(c=>`<option value="${c}" ${c===campSelec?'selected':''}>${c}</option>`).join('')}
          </select>`
        : '<span style="font-size:13px;color:var(--text3)">Sin campañas — asigná campaña en ventas y compras</span>'
      }
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <label style="font-size:13px;font-weight:600;white-space:nowrap">Campo:</label>
      <select style="font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);min-width:160px"
        onchange="S._dashCampo=this.value;render()">

      ${corteCria!==today()?`<button class="btn btn-ghost btn-sm" onclick="S._corteCria=null;render()" title="Volver a hoy">↺ Hoy</button>`:''}
    </div>
    <button class="btn btn-secondary btn-sm" onclick="exportarAuditoriaCriaExcel_()" title="Descarga un Excel con cabezas y $ por rodeo, pariciones, destetes y el detalle crudo de movimientos, para revisar todo sin pasar de pantalla en pantalla">📊 Exportar auditoría a Excel</button>
  </div>`;

  if (!campSelec) {
    h += `<div class="empty-state"><span class="ico">📊</span><div class="msg">Cargá campañas en ventas y compras para ver el dashboard.</div></div>`;
    return h;
  }

  // Selector de campo integrado arriba

  // Advertencia si faltan precios de valorización
  const precios = preciosValGet_();

      </div>

  // ── INGRESOS ────────────────────────────────────────────────────────
  // Filtrar rodeos de Cría por campo si hay selección
  const rodeosCriaFilt = campSelecField
    ? rodeosCria.filter(r => String(r.campo_id) === String(campSelecField))

  // 1. Ventas de la campaña (rodeos de Cría)
