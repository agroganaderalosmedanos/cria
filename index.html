        <div style="font-size:11px;font-weight:700;color:var(--red);text-transform:uppercase">Total</div>
        <div style="font-size:30px;font-weight:800;color:var(--red)">${mortEngTotal} <span style="font-size:13px">bajas</span></div>
      </div></div>
        <div style="font-size:12px;color:var(--red)">⚠ La mortandad no se contabiliza como egreso — su impacto está reflejado en el menor stock al cierre.</div>
      </div>`;
    }
  }

  return h;
}

function egUltimaPesada_(rodeoId) {
  const pesadas = (S.cache.pesadas||[]).filter(p=>String(p.rodeo_id)===String(rodeoId)).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
  if (!pesadas.length) return null;
  return { peso: Number(pesadas[0].peso_prom_kg)||0, fecha: pesadas[0].fecha };
}
function egDiasEngorde_(rodeoId) {
  const movs = (S.cache.movimientos||[]).filter(m=>m.tipo==='Saldo inicial'&&String(m.rodeo_destino_id)===String(rodeoId));
  if (!movs.length) return null;
  const fechaEntrada = movs.sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)))[0].fecha;
  if (!fechaEntrada) return null;
  return Math.floor((new Date(today()) - new Date(fechaEntrada)) / 86400000);
}

function buildEngordeDashboard_(rodeosEng, fm) {
  if (!rodeosEng.length) return '<div class="empty-state"><span class="ico">◌</span><div class="msg">No hay corrales de Engorde. Creá rodeos con actividad "Engorde" en la hoja Rodeos.</div></div>';
  const moneda = S.engordeMoneda || 'ARS';

  const campanas = [...new Set([
    ...(S.cache.ventas||[]).map(v=>v.campana).filter(Boolean),
    ...comprasHacGetAll_().map(c=>c.campana).filter(Boolean),
  ])].sort((a,b)=>b.localeCompare(a));
  const campSelec = S._dashEngCampana || campanas[0] || '';
  const campSelecField = S._dashEngCampo || '';
  const campos = (S.catalogs && S.catalogs.campos) || [];
  const rodeos = (S.catalogs && S.catalogs.rodeos) || [];

  let h = '';

  // ── Selectores campaña + campo ──────────────────────────────────────
  h += `<div style="display:flex;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:8px">
      <label style="font-size:13px;font-weight:600;white-space:nowrap">Campaña:</label>
      ${campanas.length
        ? `<select style="font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);min-width:140px"
            onchange="S._dashEngCampana=this.value;render()">
            ${campanas.map(c=>`<option value="${c}" ${c===campSelec?'selected':''}>${c}</option>`).join('')}
          </select>`
        : '<span style="font-size:13px;color:var(--text3)">Sin campañas</span>'
      }
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <label style="font-size:13px;font-weight:600;white-space:nowrap">Campo:</label>
      <select style="font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);min-width:160px"
        onchange="S._dashEngCampo=this.value;render()">
        <option value="">Todos los campos</option>
        ${campos.map(c=>`<option value="${c.campo_id}" ${String(c.campo_id)===String(campSelecField)?'selected':''}>${c.nombre}</option>`).join('')}
      </select>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <label style="font-size:13px;font-weight:600;white-space:nowrap">Fecha de corte:</label>
      <input type="date" value="${S._corteEng||today()}" style="font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text)"
        onchange="S._corteEng=this.value;render()">
      ${(S._corteEng||today())!==today()?`<button class="btn btn-ghost btn-sm" onclick="S._corteEng=null;render()" title="Volver a hoy">↺ Hoy</button>`:''}
    </div>
    <button class="btn btn-secondary btn-sm" onclick="exportarAuditoriaEngordeExcel_()" title="Descarga un Excel con cabezas y $ por corral, más el detalle crudo de movimientos, para revisar todo sin pasar de pantalla en pantalla">📊 Exportar auditoría a Excel</button>
  </div>`;

  // ── CÁLCULOS ECONÓMICOS ─────────────────────────────────────────────
  const rodeosEngFilt = campSelecField
    ? rodeosEng.filter(r => String(r.campo_id) === String(campSelecField))
    : rodeosEng;
  const rodeosEngIds = new Set(rodeosEngFilt.map(r=>String(r.rodeo_id)));

  // Fecha de corte: por defecto hoy. Ver nota en buildDashboard() (Cría).
  const corteEng = S._corteEng || today();
  // A partir de acá, dentro de ESTE dashboard puntual, fm() convierte a la cotización
  // de la fecha de corte en vez de la de hoy — no afecta a otras pestañas de Terminación
  // (Costos, Comparación, Proyección), que reciben su propio `fm` (today()) sin tocar.
  fm = p => fmonACorte_(p, moneda, corteEng);
  const stockACorteEng = stockPorRodeoACorte_(corteEng);

  // Ventas engorde campaña
  const ventasEng = (S.cache.ventas||[]).filter(v => rodeosEngIds.has(String(v.rodeo_id)) && (v.fecha_salida||'') <= corteEng);
  const totalVentas = ventasEng.reduce((s,v)=>s+(Number(v.importe_liq)||(Number(v.precio_pactado)*(Number(v.peso_campo_kg)||Number(v.cant_animales)))||0),0);

  // Stock valorizado a la fecha de corte (antes: egStock_, que siempre lee S.stock a "hoy")
  const pesadas = S.cache.pesadas || [];
  let stockValEng = 0;
  const stockDetalleRows = [];
  rodeosEngFilt.forEach(r => {
    const stock = Math.max(0, stockACorteEng[String(r.rodeo_id)]||0);
    if (!stock) return;
    const pesoP = ultimaPesadaACorte_(r.rodeo_id, corteEng);
    const val = valorizarRodeo_(r, stock, pesoP);
    stockValEng += val;
    stockDetalleRows.push({ rodeo: r, stock, pesoP, val });
  });

  const totalIngresos = totalVentas + stockValEng;

  // Stock inicial / Cesiones recibidas de Recría
  const movs = (S.cache.movimientos || []).filter(m => (m.fecha||'') <= corteEng);
  const saldosIni = movs.filter(m => m.tipo==='Saldo inicial' && rodeosEngIds.has(String(m.rodeo_destino_id)));
  // Traslados reales a corrales de engorde — esta es ahora la ÚNICA fuente de verdad
  // para el costo de cesiones recibidas (antes del fix, "Cesiones Recría→Terminación"
  // guardaba solo en egresos_recria SIN mover stock real; ahora también genera el
  // Traslado correspondiente en Movimientos, que es lo que efectivamente mueve el stock).
  // Se EXCLUYE explícitamente el caso de origen también dentro de rodeosEngIds: un
  // traslado entre dos corrales de la MISMA Terminación (ej: cerrar un corral y
  // consolidar en otro) es un movimiento interno que no debería contarse como una
  // "cesión recibida" externa — antes se sumaba como costo de todos modos, inflando
  // los egresos totales de la actividad por un simple movimiento entre corrales
  // propios. Mismo criterio que ya usa clasificarTrasladosActividad_ para cabezas.
  const cesionesRecTrasla = movs.filter(m => (m.tipo==='Traslado en bloque'||m.tipo==='Traslado individual') && rodeosEngIds.has(String(m.rodeo_destino_id)) && !rodeosEngIds.has(String(m.rodeo_origen_id)));
  // Registros legacy en egresos_recria que NO tienen su Traslado correspondiente todavía
  // (cesiones cargadas ANTES de este fix, cuando el módulo no generaba el movimiento real).
  // Se identifican por no tener match de fecha+cantidad+rodeo en ningún Traslado — evita
  // sumar dos veces las cesiones nuevas, que sí están en ambos lados.
  const egresosRecRaw = (S.cache.egresos_recria || []).filter(e => (e.fecha||'') <= corteEng);
  const cesionesRec = egresosRecRaw.filter(e => {
    if (e.destino !== 'Engorde' || !rodeosEngIds.has(String(e.rodeo_destino_id||''))) return false;
    const tieneTrasladoReal = cesionesRecTrasla.some(m =>
      String(m.fecha) === String(e.fecha) &&
      String(m.rodeo_origen_id) === String(e.rodeo_id) &&
      String(m.rodeo_destino_id) === String(e.rodeo_destino_id) &&
      Number(m.cantidad) === Number(e.cant_animales)
    );
    return !tieneTrasladoReal;
  });
  const totalSaldoIni = saldosIni.reduce((s,m)=>s+valorMovimientoEntrada_(m).total,0);
  // Egresos legacy (sin Traslado real) + Traslados reales (incluye los nuevos generados
  // por el formulario de Cesiones Recría→Terminación, y los traslados directos legacy)
  const totalCesiones = cesionesRec.reduce((s,e)=>{
    return s + (Number(e.cant_animales)||0)*(Number(e.peso_prom_kg)||0)*(Number(e.precio_kg_cesion)||0);
  },0) + cesionesRecTrasla.reduce((s,m)=>{
    const rodeoOrig = rodeos.find(r=>String(r.rodeo_id)===String(m.rodeo_origen_id));
    const cant = Number(m.cantidad)||0;
    const precioKg = Number(m.precio_kg)||Number(m.precio_cabeza)||0;
    const peso = Number(m.peso_prom_kg)||0;
    if (precioKg && peso) return s + cant*peso*precioKg;
    const pesadasO = pesadas.filter(p=>String(p.rodeo_id)===String(m.rodeo_origen_id)&&String(p.fecha)<=String(m.fecha)).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
    const pesoO = pesadasO[0] ? Number(pesadasO[0].peso_prom_kg)||0 : 0;
    return s + valorizarRodeo_(rodeoOrig||{categoria:'novillo'}, cant, pesoO);
  },0);

  // Compras campaña
  const comprasEng = comprasHacGetAll_().filter(c=>c.campana===campSelec&&(!campSelecField||String(c.campo_id)===String(campSelecField))&&(c.fecha||'')<=corteEng);
  const totalCompras = comprasEng.reduce((s,c)=>s+(Number(c.importe_total)||0),0);

  // Insumos: precalcular costo promedio por producto una sola vez
  const comprasInsumos = S.cache.compras_insumos || [];
  const productosAll   = (S.catalogs && S.catalogs.productos) || (S.cache.productos || []);
  const prodPorId      = Object.fromEntries(productosAll.map(p=>[String(p.producto_id),p]));
  const costoProm      = {};
  comprasInsumos.forEach(c => {
    const pid = String(c.producto_id);
    if (!costoProm[pid]) costoProm[pid] = { cant: 0, costo: 0 };
    costoProm[pid].cant  += Number(c.cantidad)    || 0;
    costoProm[pid].costo += (Number(c.precio_unitario) || 0) * (Number(c.cantidad) || 0);
  });
  const consumos = (S.cache.consumos_insumos||[]).filter(c=>rodeosEngIds.has(String(c.rodeo_id)) && (c.fecha||'')<=corteEng);
  let totalAlim=0, totalVeter=0, totalOtros=0;
  const detalleAlimEng=[], detalleVetEng=[], detalleOtrosEng=[];
  const resumenAlimentos = {}; // pid -> {nombre, unidad, cantidad, costo} — para el resumen de alimentos consumidos
  consumos.forEach(c => {
    const pid = String(c.producto_id);
    const precioU = egPrecioVigenteProducto_(pid, c.fecha);
    const importe = (Number(c.cantidad)||0) * precioU;
    const cat = (prodPorId[pid]?.categoria||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const row = {fecha:c.fecha, prod:prodPorId[pid]?.nombre||'—', cant:Number(c.cantidad)||0, rodeo:rodeoNombre(c.rodeo_id), costo:importe};
    if (cat.includes('veterin')||cat.includes('sanid')) { totalVeter+=importe; detalleVetEng.push(row); }
    else if (cat.includes('aliment'))                   {
      totalAlim+=importe;  detalleAlimEng.push(row);
      if (!resumenAlimentos[pid]) resumenAlimentos[pid] = { nombre: prodPorId[pid]?.nombre||'Producto '+pid, unidad: prodPorId[pid]?.unidad||'', cantidad: 0, costo: 0 };
      resumenAlimentos[pid].cantidad += Number(c.cantidad)||0;
      resumenAlimentos[pid].costo    += importe;
    }
    else                                                { totalOtros+=importe; detalleOtrosEng.push(row); }
  });

  // Sueldos (filtrado por campo si corresponde, y por fecha de corte — ver nota
  // en Cría sobre el mismo bug: antes sumaba todos los sueldos de cualquier mes/año)
  const totalSueldosEng = sueldoTotalActividad_('engorde', s =>
    (!campSelecField || String(s.campo_id)===String(campSelecField)) &&
    String(s.periodo).slice(0,7) <= corteEng.slice(0,7)
  );

  const totalEgresos = totalSaldoIni + totalCesiones + totalCompras + totalAlim + totalVeter + totalOtros + totalSueldosEng;
  const margen = totalIngresos - totalEgresos;

  // Cabezas de EI (saldos iniciales) y EF (stock final) — para el Reporte Directorio.
  const eiCabEng = saldosIni.reduce((s,m) => s+(Number(m.cantidad)||0), 0);
  const efCabEng = stockDetalleRows.reduce((s,r) => s+(Number(r.stock)||0), 0);

  const clasEng = clasificarTrasladosActividad_(rodeosEngIds, movs);
  const ventasCabEng = ventasEng.reduce((s,v) => s + (Number(v.cant_animales)||0), 0);
  const mortCabEng = (S.cache.mortandad||[]).filter(m => rodeosEngIds.has(String(m.rodeo_id)) && (m.fecha||'') <= corteEng).reduce((s,m) => s + (Number(m.cantidad)||1), 0);

  // Guardar resultados para Resultados Económicos
  S._resultEng = {
    ing: totalIngresos, eg: totalEgresos, margen,
    ingVentas: totalVentas, ef: stockValEng,
    ei: totalSaldoIni, egCesiones: totalCesiones, egCompras: totalCompras,
    egAlim: totalAlim, egVet: totalVeter, egOtros: totalOtros, egSueldos: totalSueldosEng,
    eiCab: eiCabEng, efCab: efCabEng, nacCab: 0, nacImp: 0,
    comprasCab: clasEng.compras, cesRecCab: clasEng.cesionesRecibidas, cesEnvCab: clasEng.cesionesEnviadas,
    ventasCab: ventasCabEng, mortCab: mortCabEng,
  };
  const margenColor = margen>=0 ? 'var(--green)' : 'var(--red)';
  const margenBg    = margen>=0 ? 'var(--green-bg)' : 'rgba(220,50,50,0.08)';

  // ── RENDER ECONÓMICO ────────────────────────────────────────────────
  const campoLabel = campSelecField ? ' · ' + campoNombre(campSelecField) : '';

  h += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
    <!-- INGRESOS -->
    <div class="panel" style="margin-bottom:0">
      <div class="panel-title" style="color:var(--green-text)">📈 Ingresos — ${campSelec}${campoLabel}</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
          <div><div style="font-weight:600">💰 Ventas de hacienda</div><div style="font-size:11px;color:var(--text3)">${ventasEng.length} ventas liquidadas</div></div>
          <div style="font-size:18px;font-weight:700;color:var(--green)">${fm(totalVentas)}</div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0">
          <div><div style="font-weight:600">📦 Stock valorizado actual</div><div style="font-size:11px;color:var(--text3)">${stockDetalleRows.length} corrales</div></div>
          <div style="font-size:18px;font-weight:700;color:var(--green)">${fmonACorte_(stockValEng, moneda, corteEng)}</div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--green-bg);border-radius:8px;margin-top:4px">
          <div style="font-weight:700;font-size:14px">TOTAL INGRESOS</div>
          <div style="font-size:28px;font-weight:800;color:var(--green)">${fm(totalIngresos)}</div>
        </div>
      </div>
    </div>
    <!-- EGRESOS -->
    <div class="panel" style="margin-bottom:0">
      <div class="panel-title" style="color:var(--clay-text)">📉 Egresos — ${campSelec}${campoLabel}</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
          <div><div style="font-weight:600">🐄 Stock inicial</div><div style="font-size:11px;color:var(--text3)">${saldosIni.length} rodeos × precio/cab</div></div>
          <div style="font-size:18px;font-weight:700;color:var(--clay)">${fm(totalSaldoIni)}</div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
          <div><div style="font-weight:600">🔄 Cesiones de Recría</div><div style="font-size:11px;color:var(--text3)">${cesionesRec.length + cesionesRecTrasla.length} cesiones desde Recría</div></div>
          <div style="font-size:18px;font-weight:700;color:var(--clay)">${fm(totalCesiones)}</div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
          <div><div style="font-weight:600">🛒 Compras de hacienda</div><div style="font-size:11px;color:var(--text3)">${comprasEng.length} compras campaña</div></div>
          <div style="font-size:18px;font-weight:700;color:var(--clay)">${fm(totalCompras)}</div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
          <div><div style="font-weight:600">🌾 Alimentación</div></div>
          <div style="font-size:18px;font-weight:700;color:var(--clay)">${totalAlim>0?fm(totalAlim):'—'}</div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
          <div><div style="font-weight:600">💉 Veterinaria</div></div>
          <div style="font-size:18px;font-weight:700;color:var(--clay)">${totalVeter>0?fm(totalVeter):'—'}</div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
          <div><div style="font-weight:600">📦 Otros insumos</div></div>
          <div style="font-size:18px;font-weight:700;color:var(--clay)">${totalOtros>0?fm(totalOtros):'—'}</div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
          <div><div style="font-weight:600">👤 Sueldos Engorde</div></div>
          <div style="font-size:18px;font-weight:700;color:var(--clay)">${fm(totalSueldosEng)}</div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--clay-bg);border-radius:8px;margin-top:4px">
          <div style="font-weight:700;font-size:14px">TOTAL EGRESOS</div>
          <div style="font-size:28px;font-weight:800;color:var(--clay)">${fm(totalEgresos)}</div>
        </div>
      </div>
    </div>
  </div>`;

  // Margen
  h += `<div style="background:${margenBg};border-radius:10px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
    <div>
      <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:${margenColor}">Margen Bruto — Terminación ${campSelec}${campoLabel}</div>
      <div style="font-size:11px;color:var(--text2);margin-top:3px">Ingresos − Egresos</div>
    </div>
    <div style="font-size:32px;font-weight:800;color:${margenColor}">${margen>=0?'':'-'}${fm(Math.abs(margen))}</div>
  </div>`;

  // ── RESUMEN DE ALIMENTOS CONSUMIDOS EN EL PERÍODO ────────────────────
  // Agrupa los consumos de categoría "Alimentación" por producto (mismo
  // conjunto de registros que arma el total de "🌾 Alimentación" de arriba),
  // mostrando la cantidad total consumida en la unidad propia de cada insumo
  // (ej: 340 fardos de alfalfa, 1.200 kg de maíz, 45 días de silo, etc.).
  const listaAlimentos = Object.values(resumenAlimentos).sort((a,b)=>b.costo-a.costo);
  if (listaAlimentos.length) {
    h += `<div class="panel">
      <div class="panel-title">🌾 Alimentos consumidos — ${campSelec}${campoLabel}</div>
      <div style="font-size:11px;color:var(--text3);margin-bottom:10px">Total acumulado hasta ${fd(corteEng)} · ${consumos.filter(c=>{const cat=(prodPorId[String(c.producto_id)]?.categoria||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');return cat.includes('aliment');}).length} registros de consumo</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px">
        ${listaAlimentos.map(a => `
          <div style="background:var(--bg2);border-radius:9px;padding:12px 14px">
            <div style="font-weight:600;font-size:13px;margin-bottom:4px">${a.nombre}</div>
            <div style="font-size:20px;font-weight:800;color:var(--gold-text)">${fn(a.cantidad)} <span style="font-size:12px;font-weight:600;color:var(--text2)">${a.unidad||''}</span></div>
            <div style="font-size:11px;color:var(--text3);margin-top:2px">${fm(a.costo)}${totalAlim>0?' · '+fn(a.costo/totalAlim*100,1)+'% del total':''}</div>
          </div>`).join('')}
      </div>
    </div>`;
  }

  // ── EXISTENCIA INICIAL ─────────────────────────────────────────────
  const movs2 = S.cache.movimientos || [];
  const saldosEngIni = movs2.filter(m => m.tipo==='Saldo inicial' && rodeosEngIds.has(String(m.rodeo_destino_id)));
  if (saldosEngIni.length) {
    h += `<div class="panel">
      <div class="panel-title">📥 Existencia Inicial</div>
      <div class="tw"><table class="dt"><thead><tr>
        <th>Rodeo</th><th>Campo</th><th>Categoría</th>
        <th class="tc">Cabezas</th><th class="tr">Precio</th><th class="tr">Valor</th>
      </tr></thead><tbody>`;
    let totCabIni=0, totValIni=0;
    saldosEngIni.forEach(m => {
      const rod = rodeos.find(r=>String(r.rodeo_id)===String(m.rodeo_destino_id));
      const cant = Number(m.cantidad)||0;
      const { total, precioLabel } = valorMovimientoEntrada_(m);
      // OJO: "total" ya viene en ARS crudo (valorMovimientoEntrada_ no convierte
      // moneda). NO usar convertirAMoneda_ acá — fm() más abajo YA hace la
      // conversión ARS→USD al mostrarlo. Antes esto convertía DOS VECES (acá y
      // en fm()), dividiendo por la cotización al cuadrado y mostrando valores
      // ~1300 veces más chicos de lo real (ej: "U$S 1" en vez de "U$S 1.077").
      totCabIni += cant; totValIni += total;
      h += `<tr>
        <td>${rod?.nombre||'—'}</td>
        <td>${campoNombre(rod?.campo_id)}</td>
        <td>${rod?.categoria||'—'}</td>
        <td class="tc">${fn(cant)}</td>
        <td class="tr">${precioLabel || '—'}</td>
        <td class="tr"><strong>${fm(total)}</strong></td>
      </tr>`;
    });
    h += `<tr class="total-row"><td colspan="3"><strong>Total</strong></td>
      <td class="tc"><strong>${fn(totCabIni)}</strong></td><td></td>
      <td class="tr"><strong>${fm(totValIni)}</strong></td></tr>`;
    h += '</tbody></table></div></div>';
  }

  // ── EXISTENCIA FINAL ───────────────────────────────────────────────
  if (stockDetalleRows.length) {
    h += `<div class="panel">
      <div class="panel-title">📦 Existencia Final — Stock valorizado actual</div>
      <div class="tw"><table class="dt"><thead><tr>
        <th>Rodeo</th><th>Campo</th><th>Categoría</th>
        <th class="tc">Stock</th><th class="tr">Peso prom.</th>
        <th class="tr">Método</th><th class="tr">Valor</th>
      </tr></thead><tbody>`;
    stockDetalleRows.forEach(row => {
      const cat = (row.rodeo.categoria||'').toLowerCase().trim();
      const metodo = CATS_POR_CABEZA_.includes(cat) ? 'por cabeza' : (row.pesoP ? 'por kg' : 'por cab. (sin pesada)');
      h += `<tr>
        <td><strong>${row.rodeo.nombre}</strong></td>
        <td>${campoNombre(row.rodeo.campo_id)}</td>
        <td>${row.rodeo.categoria||'—'}</td>
        <td class="tc">${fn(row.stock)}</td>
        <td class="tr">${row.pesoP ? fn(row.pesoP)+' kg' : '—'}</td>
        <td class="tr" style="font-size:11px;color:var(--text3)">${metodo}</td>
        <td class="tr"><strong>${fm(row.val)}</strong></td>
      </tr>`;
    });
    h += `<tr class="total-row"><td colspan="3"><strong>Total</strong></td>
      <td class="tc"><strong>${fn(stockDetalleRows.reduce((s,r)=>s+r.stock,0))} cab.</strong></td>
      <td></td><td></td><td class="tr"><strong>${fmonACorte_(stockValEng, moneda, corteEng)}</strong></td></tr>`;
    h += '</tbody></table></div></div>';
  }

  // ── Conciliación de Existencia (cabezas) — control cruzado EI/EF ────────
  h += buildConciliacionCabezas_('Terminación', {
    ei: eiCabEng, compras: clasEng.compras, cesionesRecibidas: clasEng.cesionesRecibidas,
    nacimientos: 0, cesionesEnviadas: clasEng.cesionesEnviadas,
    ventas: ventasCabEng, mortandad: mortCabEng,
  }, efCabEng);

  // ── Conciliación POR CORRAL — para encontrar en qué corral puntual está el
  // desvío cuando el total no cierra. A diferencia del panel de arriba (que
  // excluye traslados internos entre corrales de Terminación porque se cancelan
  // solos en el agregado), acá SÍ se cuentan — un traslado interno es una
  // entrada real para el corral que recibe y una salida real para el que envía,
  // aunque no afecte el total de la actividad.
  if (efCabEng !== eiCabEng + clasEng.compras + clasEng.cesionesRecibidas - clasEng.cesionesEnviadas - ventasCabEng - mortCabEng) {
    const filasPorCorral = rodeosEngFilt.map(r => {
      const rid = String(r.rodeo_id);
      const eiR = saldosIni.filter(m => String(m.rodeo_destino_id) === rid).reduce((s,m) => s+(Number(m.cantidad)||0), 0);
      const entradasR = movs.filter(m => (m.tipo==='Traslado en bloque'||m.tipo==='Traslado individual') && String(m.rodeo_destino_id) === rid).reduce((s,m) => s+(Number(m.cantidad)||0), 0);
      const salidasR = movs.filter(m => (m.tipo==='Traslado en bloque'||m.tipo==='Traslado individual') && String(m.rodeo_origen_id) === rid).reduce((s,m) => s+(Number(m.cantidad)||0), 0);
      const ventasR = ventasEng.filter(v => String(v.rodeo_id) === rid).reduce((s,v) => s+(Number(v.cant_animales)||0), 0);
      const mortR = (S.cache.mortandad||[]).filter(m => String(m.rodeo_id) === rid && (m.fecha||'')<=corteEng).reduce((s,m) => s+(Number(m.cantidad)||1), 0);
      const efCalcR = eiR + entradasR - salidasR - ventasR - mortR;
      const efRealR = Math.max(0, stockACorteEng[rid]||0);
      return { nombre: r.nombre, eiR, entradasR, salidasR, ventasR, mortR, efCalcR, efRealR, diff: efRealR - efCalcR };
    }).filter(f => f.eiR || f.entradasR || f.salidasR || f.ventasR || f.mortR || f.efRealR)
      .sort((a,b) => Math.abs(b.diff) - Math.abs(a.diff));
    h += `<div class="panel" style="border:1px solid var(--border2)">
      <div class="panel-title">🔎 Conciliación por corral — para encontrar el desvío</div>
      <div class="tw"><table class="dt"><thead><tr>
        <th>Corral</th><th class="tc">EI</th><th class="tc">+ Entradas</th><th class="tc">− Salidas</th>
        <th class="tc">− Ventas</th><th class="tc">− Mort.</th><th class="tc">= EF calc.</th>
        <th class="tc">EF real</th><th class="tc">Diferencia</th>
      </tr></thead><tbody>`;
    filasPorCorral.forEach(f => {
      const ok = f.diff === 0;
      h += `<tr ${ok?'':'style="background:rgba(220,50,50,0.06)"'}>
        <td><strong>${f.nombre}</strong></td>
        <td class="tc">${fn(f.eiR,0)}</td>
        <td class="tc">${fn(f.entradasR,0)}</td>
        <td class="tc">${fn(f.salidasR,0)}</td>
        <td class="tc">${fn(f.ventasR,0)}</td>
        <td class="tc">${fn(f.mortR,0)}</td>
        <td class="tc">${fn(f.efCalcR,0)}</td>
        <td class="tc">${fn(f.efRealR,0)}</td>
        <td class="tc" style="font-weight:700;color:${ok?'var(--green-text)':'var(--red-text)'}">${f.diff>0?'+':''}${fn(f.diff,0)}</td>
      </tr>`;
    });
    h += '</tbody></table></div></div>';
  }

  // NOTA: las tablas de detalle línea por línea de Alimentación/Veterinaria/
  // Otros insumos (un renglón por cada consumo cargado) se movieron a la
  // pestaña "Costos" — acá en el Dashboard quedan solo los totales (arriba,
  // en Egresos) y el resumen agrupado por producto ("🌾 Alimentos consumidos").
  // Antes esta tabla completa se mostraba acá y quedaba larguísima con mucho
  // movimiento cargado.

  // buildEngordeDashboard_ retorna acá — el resto (KPIs, tarjetas, mortandad)
  // se renderiza en el bloque page==='engorde' en el orden correcto:
  // EI → EF → Cesiones → Ventas → KPIs productivos → Tarjetas por corral → Mortandad
  return h;
}

function buildEngordeProductivoYCorreles_(rodeosEngFilt, fm, corte) {
  corte = corte || today();
  const stockACorteCard = stockPorRodeoACorte_(corte);
  const fn_ = (v,d=0) => fn(v,d);
  let totAn=0, totKgI=0, totKgV=0, totKgStk=0, totKgG=0;
  const gdps=[];

  rodeosEngFilt.forEach(r => {
    const rid = r.rodeo_id;
    totAn    += Math.max(0, stockACorteCard[String(rid)]||0);
    totKgI   += egKgIngresados_(rid);
    totKgV   += egKgVend_(rid);
    totKgStk += egKgStockEstimado_(rid, corte, Math.max(0, stockACorteCard[String(rid)]||0));
    totKgG   += egKgGanadosHastaPesada_(rid, corte, Math.max(0, stockACorteCard[String(rid)]||0));
    const gdp = egGanDiaria_(rid);
    if (gdp) gdps.push(gdp);
  });
  const gdpProm = gdps.length ? gdps.reduce((s,v)=>s+v,0)/gdps.length : null;

  let h = `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
    <div style="background:var(--bg2);border-radius:8px;padding:10px 16px">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--text2);letter-spacing:.05em">Animales en stock</div>
      <div style="font-size:18px;font-weight:700">${fn(totAn)}</div>
    </div>
    <div style="background:var(--green-bg);border-radius:8px;padding:10px 16px">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--green-text);letter-spacing:.05em">Kg ingresados</div>
      <div style="font-size:18px;font-weight:700;color:var(--green)">${fn(totKgI)}</div>
    </div>
    <div style="background:var(--gold-bg);border-radius:8px;padding:10px 16px">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--gold-text);letter-spacing:.05em">Kg vendidos</div>
      <div style="font-size:18px;font-weight:700;color:var(--gold)">${fn(totKgV)}</div>
    </div>
    <div style="background:var(--clay-bg);border-radius:8px;padding:10px 16px">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--clay-text);letter-spacing:.05em">Kg en stock</div>
      <div style="font-size:18px;font-weight:700;color:var(--clay)">${fn(totKgStk)}</div>
    </div>
    <div style="background:var(--blue-bg);border-radius:8px;padding:10px 16px">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--blue-text);letter-spacing:.05em">Kg ganados</div>
      <div style="font-size:18px;font-weight:700;color:var(--blue)">${fn(totKgG)}</div>
    </div>
    <div style="background:var(--bg2);border-radius:8px;padding:10px 16px">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--text2);letter-spacing:.05em">GDP promedio</div>
      <div style="font-size:18px;font-weight:700">${gdpProm ? fn(gdpProm,3)+' kg/día' : '—'}</div>
    </div>
  </div>`;

  // Tarjetas por corral
  h += '<div class="section-label">Detalle por corral</div>';
  h += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:20px">';
  rodeosEngFilt.forEach(r => {
    const rid = r.rodeo_id;
    const stock   = Math.max(0, stockACorteCard[String(rid)]||0);
    const kgI     = egKgIngresados_(rid);
    const kgV     = egKgVend_(rid);
    const kgStk   = egKgStockEstimado_(rid, corte, stock);
    const kgG     = egKgGanadosHastaPesada_(rid, corte, stock);
    const gdp     = egGanDiaria_(rid);
    const gpdIntervalos = egGpdIntervalos_(rid);
    const gpdUltimoBajo = gpdIntervalos.length && gpdIntervalos[gpdIntervalos.length - 1].bajo;
    // Antes esto calculaba Alimentación/Veterinaria con un PROMEDIO GLOBAL de
    // todas las compras históricas (sin fecha de corte) — un método distinto al
    // que usan Costos y Comparación (egCostoAlim_, precio vigente a la fecha de
    // cada consumo + respeta el corte). Por eso esta tarjeta y Comparación podían
    // mostrar números distintos para el mismo corral. Ahora usan la misma función.
    const costoTotalAlimVet = egCostoAlim_(rid, corte);
    const costoVet = egCostoAlim_(rid, corte, 'Veterinaria');
    const costoAlim = costoTotalAlimVet - costoVet;
    const ingVentas = egIngVentas_(rid);
    const pesoUltimaCard = egPesadas_(rid).filter(p=>(p.fecha||'')<=corte).slice(-1)[0]?.peso_prom_kg || 0;
    const ivStk     = valorizarRodeo_(r, stock, pesoUltimaCard);
    // Antes faltaban acá los dos lados de una cesión interna entre corrales:
    // el costo de entrada (cc, lo que este corral pagó por lo que recibió —
    // sea de otro corral o de Recría) y la cesión enviada (cesEnv, lo que este
    // corral "cobra" cuando manda animales a otro corral, ej. al cerrarlo).
    // Sin esto, "Resultado" solo restaba alimentación/veterinaria — ignoraba
    // el costo de entrada por completo y no reflejaba nada de las cesiones.
    const cc        = egCostoCompra_(rid);
    const cesEnv    = egIngresoCesionEnviada_(rid, corte).total;
    const resultado = ingVentas + ivStk + cesEnv - costoAlim - costoVet - cc;
    const dias      = egDiasEngorde_(rid);
    const ultimaPes = egUltimaPesada_(rid);
    const convMS_   = egConversionMS_(rid, ultimaPes?.fecha, kgG);

    h += `<div style="background:var(--bg);border:1px solid var(--border2);border-radius:12px;padding:16px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
        <div>
          <div style="font-weight:700;font-size:15px">${r.nombre}</div>
          <div style="font-size:12px;color:var(--text3)">${campoNombre(r.campo_id)} · ${dias ? dias+' días' : 'sin entrada'}</div>
        </div>
        <div style="font-size:22px;font-weight:800;color:var(--blue);text-align:right">
          ${fn(stock)}
          <div style="font-size:10px;font-weight:400;color:var(--text3)">animales</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:12px">
        <div style="color:var(--text2);text-transform:uppercase;font-size:10px;font-weight:700;letter-spacing:.04em">Última pesada</div>
        <div style="text-align:right;font-weight:600">${ultimaPes ? fn(ultimaPes.peso)+' kg' : '—'}</div>
        <div style="color:var(--text2);text-transform:uppercase;font-size:10px;font-weight:700;letter-spacing:.04em">GDP</div>
        <div style="text-align:right;font-weight:600;color:${gpdUltimoBajo?'var(--red-text)':'var(--green)'}" ${gpdUltimoBajo?'title="La GPD entre las dos últimas pesadas bajó respecto al intervalo anterior — ver Pesadas por corral"':''}>${gdp ? fn(gdp,3)+' kg/día' : '—'}${gpdUltimoBajo?' ⚠':''}</div>
        <div style="color:var(--text2);text-transform:uppercase;font-size:10px;font-weight:700;letter-spacing:.04em">Kg ganados</div>
        <div style="text-align:right;font-weight:600">${fn(kgG)}</div>
        ${convMS_.conv?`<div style="color:var(--text2);text-transform:uppercase;font-size:10px;font-weight:700;letter-spacing:.04em">Conversión (MS)</div>
        <div style="text-align:right;font-weight:600;color:var(--gold)">${fn(convMS_.conv,1)} : 1${convMS_.hayAlimSinMS?' ⚠':''}</div>`
        :(convMS_.motivoSinDato && convMS_.motivoSinDato.includes('% de materia seca')?`<div style="color:var(--text2);text-transform:uppercase;font-size:10px;font-weight:700;letter-spacing:.04em">Conversión (MS)</div>
        <div style="text-align:right;font-weight:600;color:var(--text3)" title="${convMS_.motivoSinDato}">⚠ falta % MS</div>`:'')}
        <div style="color:var(--text2);text-transform:uppercase;font-size:10px;font-weight:700;letter-spacing:.04em">Costo entrada</div>
        <div style="text-align:right;font-weight:600">${cc>0?fm(cc):'—'}</div>
        <div style="color:var(--text2);text-transform:uppercase;font-size:10px;font-weight:700;letter-spacing:.04em">Costo alim.</div>
        <div style="text-align:right;font-weight:600">${fm(costoAlim)}</div>
        <div style="color:var(--text2);text-transform:uppercase;font-size:10px;font-weight:700;letter-spacing:.04em">Costo vet.</div>
        <div style="text-align:right;font-weight:600;color:var(--blue)">${fm(costoVet)}</div>
        <div style="color:var(--text2);text-transform:uppercase;font-size:10px;font-weight:700;letter-spacing:.04em">Ingreso ventas</div>
        <div style="text-align:right;font-weight:600">${fm(ingVentas)}</div>
        ${cesEnv>0?`<div style="color:var(--text2);text-transform:uppercase;font-size:10px;font-weight:700;letter-spacing:.04em">Cesión enviada</div>
        <div style="text-align:right;font-weight:600;color:var(--green)">${fm(cesEnv)}</div>`:''}
      </div>
      <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--text2)">Resultado</div>
        <div style="font-size:16px;font-weight:800;color:${resultado>=0?'var(--green)':'var(--red)'}">${fm(resultado)}</div>
      </div>
      <div style="font-size:10px;color:var(--text3);margin-top:4px">
        Ingresados: ${fn(kgI+stock)} cab. &nbsp;·&nbsp; Kg ingr.: ${fn(kgI)} &nbsp;·&nbsp; Kg stock: ${fn(kgStk)}
      </div>
    </div>`;
  });
  h += '</div>';
  return h;
}

function buildEngordeCostos_(rodeoId, fm) {
  if (!rodeoId) {
    // Mostrar resumen de todos los corrales
    const rodeosEngAll = rodeosEngordeValidos_();
    const campFiltro = S._engCampoFiltro || '';
    const rodeosEng = campFiltro ? rodeosEngAll.filter(r => String(r.campo_id) === String(campFiltro)) : rodeosEngAll;
    if (!rodeosEng.length) return `<div class="empty-state"><span class="ico">◌</span><div class="msg">No hay corrales de Engorde${campFiltro ? ' en este campo' : ''}.</div></div>`;
    // Fecha de corte: comparte S._corteEng con el Dashboard, para que ambos muestren
    // lo mismo. Antes esta pestaña ignoraba por completo la fecha de corte y siempre
    // calculaba con TODOS los datos hasta hoy, aunque el Dashboard estuviera mirando
    // un cierre anterior — eso generaba diferencias entre las dos pantallas.
    // OJO: acá se incluyen TODOS los corrales, incluidos los que ya están en stock 0
    // (vendidos del todo) — el total de esta pestaña tiene que coincidir siempre con
    // el del Dashboard, que también suma todos. Los corrales en 0 se ven aparte en
    // Historial, pero sin restarlos de este total.
    const corteCostos = S._corteEng || today();
    const stockACorteCostos = stockPorRodeoACorte_(corteCostos);
    let totalAlim=0,totalVeter=0,totCaHP=0;
    rodeosEng.forEach(r => {
      const cVet = egCostoAlim_(r.rodeo_id, corteCostos, 'Veterinaria');
      const cTot = egCostoAlim_(r.rodeo_id, corteCostos);
      totalVeter += cVet;
      totalAlim  += cTot - cVet;
      // Alimentación acotada a la ÚLTIMA PESADA de CADA corral (no a la fecha de
      // corte) — mismo criterio que "Alim/kg ganado" en Comparación y en la ficha
      // de un corral individual. Se calcula acá, temprano, porque el resumen de
      // "Alimentación" de más abajo ya la muestra como referencia.
      const pesR = egPesadas_(r.rodeo_id).filter(p=>(p.fecha||'')<=corteCostos);
      const ultimaR = pesR.length ? pesR[pesR.length-1] : null;
      totCaHP += egCostoAlim_(r.rodeo_id, ultimaR?.fecha) - egCostoAlim_(r.rodeo_id, ultimaR?.fecha, 'Veterinaria');
    });
    // Calcular ingresos consolidados
    let totalVentas=0, totalStock=0;
    rodeosEng.forEach(r => {
      const ventasCorte = (S.cache.ventas||[]).filter(v=>String(v.rodeo_id)===String(r.rodeo_id) && (v.fecha_salida||'')<=corteCostos);
      totalVentas += ventasCorte.reduce((s,v)=>s+(Number(v.importe_liq)||(Number(v.precio_pactado)*(Number(v.peso_campo_kg)||0))||0),0);
      const pesCorte = (S.cache.pesadas||[]).filter(p=>String(p.rodeo_id)===String(r.rodeo_id) && (p.fecha||'')<=corteCostos)
        .sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));
      const ultima = pesCorte.length ? pesCorte[pesCorte.length-1] : null;
      const pesoP = ultima ? Number(ultima.peso_prom_kg)||0 : 0;
      const stockCorte = Math.max(0, stockACorteCostos[String(r.rodeo_id)]||0);
      totalStock += valorizarRodeo_(r, stockCorte, pesoP);
    });
    // Stock inicial y cesiones
    const movsTodos = (S.cache.movimientos || []).filter(m=>(m.fecha||'')<=corteCostos);
    const rodeosEngIds2 = new Set(rodeosEng.map(r=>String(r.rodeo_id)));
    const saldosIni2 = movsTodos.filter(m=>m.tipo==='Saldo inicial'&&rodeosEngIds2.has(String(m.rodeo_destino_id)));
    const totalSaldoIni = saldosIni2.reduce((s,m)=>s+valorMovimientoEntrada_(m).total,0);
    const rodeosTodosMap = Object.fromEntries(rodeosTodos().map(r=>[String(r.rodeo_id),r]));
    // MISMA fuente de verdad que usa el Dashboard (antes, acá se auto-valorizaba
    // SIEMPRE por categoría/peso del rodeo de origen, ignorando el precio real que
    // se haya cargado en la cesión — por eso el número no coincidía con el Dashboard).
    // Se excluye el origen también dentro de rodeosEngIds2 por el mismo motivo que
    // en buildEngordeDashboard_: un traslado entre dos corrales de la MISMA
    // Terminación es interno y no debe contarse como cesión (costo) del total.
    const cesiones2 = movsTodos.filter(m=>(m.tipo==='Traslado en bloque'||m.tipo==='Traslado individual')&&rodeosEngIds2.has(String(m.rodeo_destino_id))&&!rodeosEngIds2.has(String(m.rodeo_origen_id)));
    const egresosRecRaw2 = (S.cache.egresos_recria || []).filter(e=>(e.fecha||'')<=corteCostos);
    const cesionesRecLegacy2 = egresosRecRaw2.filter(e => {
      if (e.destino !== 'Engorde' || !rodeosEngIds2.has(String(e.rodeo_destino_id||''))) return false;
      const tieneTrasladoReal = cesiones2.some(m =>
        String(m.fecha) === String(e.fecha) &&
        String(m.rodeo_origen_id) === String(e.rodeo_id) &&
        String(m.rodeo_destino_id) === String(e.rodeo_destino_id) &&
        Number(m.cantidad) === Number(e.cant_animales)
      );
      return !tieneTrasladoReal;
    });
    // OJO — mismo bug que egCostoCompra_ y totalSaldoIni (ver comentarios ahí):
    // esto se pre-convertía a moneda acá y DE NUEVO en fm() al mostrarlo, y
    // además mezclaba ARS crudo con ya-convertido en totalEgresos/margen. Ahora
    // todo queda en ARS crudo hasta el display.
    const totalCesiones2 = cesionesRecLegacy2.reduce((s,e)=>{
      return s + (Number(e.cant_animales)||0)*(Number(e.peso_prom_kg)||0)*(Number(e.precio_kg_cesion)||0);
    },0) + cesiones2.reduce((s,m)=>{
      const rodeoO = rodeosTodosMap[String(m.rodeo_origen_id)];
      const cant = Number(m.cantidad)||0;
      const precioKg = Number(m.precio_kg)||Number(m.precio_cabeza)||0;
      const peso = Number(m.peso_prom_kg)||0;
      let costoARS;
      if (precioKg && peso) {
        costoARS = cant*peso*precioKg;
      } else {
        const pesO = (S.cache.pesadas||[]).filter(p=>String(p.rodeo_id)===String(m.rodeo_origen_id)&&String(p.fecha)<=String(m.fecha)).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
        const pesoO = pesO[0]?Number(pesO[0].peso_prom_kg)||0:0;
        costoARS = valorizarRodeo_(rodeoO||{categoria:'novillo'},cant,pesoO);
      }
      return s+costoARS;
    },0);
    const cantCesionesTotal2 = cesiones2.length + cesionesRecLegacy2.length;

    const totalIngresos = totalVentas + totalStock;
    const totalSueldosEngCostos = sueldoTotalActividad_('engorde', s =>
      (!campFiltro || String(s.campo_id)===String(campFiltro)) &&
      String(s.periodo).slice(0,7) <= corteCostos.slice(0,7)
    );
    const totalEgresos  = totalSaldoIni + totalCesiones2 + totalAlim + totalVeter + totalSueldosEngCostos;
    const margen = totalIngresos - totalEgresos;
    const mc = margen>=0?'var(--green)':'var(--red)';
    const mb = margen>=0?'var(--green-bg)':'rgba(220,50,50,0.08)';

    let h = `<div style="font-size:11px;color:var(--text3);margin-bottom:10px">📅 Datos al ${fd(corteCostos)}${corteCostos!==today()?' — mismo corte que el Dashboard':''}</div>`;
    h += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
      <div class="panel" style="margin-bottom:0">
        <div class="panel-title" style="color:var(--green-text)">📈 Ingresos — todos los corrales</div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
            <div style="font-weight:600">💰 Ventas de hacienda</div>
            <div style="font-size:18px;font-weight:700;color:var(--green)">${fm(totalVentas)}</div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0">
            <div style="font-weight:600">📦 Stock valorizado actual</div>
            <div style="font-size:18px;font-weight:700;color:var(--green)">${fm(totalStock)}</div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--green-bg);border-radius:8px;margin-top:4px">
            <div style="font-weight:700;font-size:14px">TOTAL INGRESOS</div>
            <div style="font-size:28px;font-weight:800;color:var(--green)">${fm(totalIngresos)}</div>
          </div>
        </div>
      </div>
      <div class="panel" style="margin-bottom:0">
        <div class="panel-title" style="color:var(--clay-text)">📉 Egresos — todos los corrales</div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
            <div><div style="font-weight:600">🐄 Stock inicial</div><div style="font-size:11px;color:var(--text3)">${saldosIni2.length} rodeos × precio/cab</div></div>
            <div style="font-size:18px;font-weight:700;color:var(--clay)">${fm(totalSaldoIni)}</div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
            <div><div style="font-weight:600">🔄 Cesiones de Recría</div><div style="font-size:11px;color:var(--text3)">${cantCesionesTotal2} cesiones desde Recría</div></div>
            <div style="font-size:18px;font-weight:700;color:var(--clay)">${fm(totalCesiones2)}</div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
            <div><div style="font-weight:600">🌾 Alimentación</div><div style="font-size:11px;color:var(--text3)">total hasta el corte (${fd(corteCostos)}) — suma de todos los corrales, cada uno hasta su última pesada: ${fm(totCaHP)}</div></div>
            <div style="font-size:18px;font-weight:700;color:var(--clay)">${fm(totalAlim)}</div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
            <div style="font-weight:600">💉 Veterinaria</div>
            <div style="font-size:18px;font-weight:700;color:var(--clay)">${fm(totalVeter)}</div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0">
            <div style="font-weight:600">👤 Sueldos Engorde</div>
            <div style="font-size:18px;font-weight:700;color:var(--clay)">${fm(totalSueldosEngCostos)}</div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--clay-bg);border-radius:8px;margin-top:4px">
            <div style="font-weight:700;font-size:14px">TOTAL EGRESOS</div>
            <div style="font-size:28px;font-weight:800;color:var(--clay)">${fm(totalEgresos)}</div>
          </div>
        </div>
      </div>
    </div>
    <div style="background:${mb};border-radius:10px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div>
        <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:${mc}">Margen Bruto — Terminación</div>
        <div style="font-size:11px;color:var(--text2);margin-top:3px">Ingresos − Egresos</div>
      </div>
      <div style="font-size:32px;font-weight:800;color:${mc}">${margen>=0?'':'-'}${fm(Math.abs(margen))}</div>
    </div>`;
    // KPIs productivos consolidados
    let totKgI=0,totKgG=0,totKgV=0,totKgStk=0,totAn=0;

    rodeosEng.forEach(r=>{

      totKgStk+= egKgStockEstimado_(r.rodeo_id, corteCostos, Math.max(0, stockACorteCostos[String(r.rodeo_id)]||0));
      totAn   += Math.max(0, stockACorteCostos[String(r.rodeo_id)]||0);
      const gdp = egGanDiaria_(r.rodeo_id);
      if (gdp) gdpsTodos.push(gdp);

    const gdpPromTodos = gdpsTodos.length ? gdpsTodos.reduce((s,v)=>s+v,0)/gdpsTodos.length : null;

    h += `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">

    rodeosEng.forEach(r => {
      const rid = r.rodeo_id;

      const cVet  = egCostoAlim_(rid, null, 'Veterinaria');

      h += `<tr>

    // ── Detalle de insumos consumidos (un renglón por cada consumo cargado) ──

    // IMPORTANTE: usa la MISMA clasificación que egCostoAlim_ de arriba (solo

    // Alimentación) — no la clasificación por texto libre que usa el Dashboard —
    // para que el total de esta tabla siempre coincida con las tarjetas de Egresos.
    const productosAllC = (S.catalogs && S.catalogs.productos) || (S.cache.productos || []);

    const consumosC = (S.cache.consumos_insumos||[]).filter(c=>rodeosEngIds2.has(String(c.rodeo_id)) && (c.fecha||'')<=corteCostos);
    const detalleAlimC=[], detalleVetC=[];
    consumosC.forEach(c => {

      if (prodPorIdC[pid]?.categoria === 'Veterinaria') detalleVetC.push(row);

    const buildInsumoTableCostos_ = (filas, titulo) => {

    h += '<div class="section-label">Detalle de insumos consumidos</div>';
    h += buildInsumoTableCostos_(detalleAlimC, '🌾 Alimentación — detalle');
    h += buildInsumoTableCostos_(detalleVetC,  '💉 Veterinaria — detalle');

    return h;
  }
  const r = rodeosTodos().find(r => String(r.rodeo_id) === String(rodeoId));
  if (!r) return '';
  // Misma fecha de corte que el Dashboard y el resumen de "todos los corrales" —
  // antes esta ficha de un corral puntual no la tenía en cuenta para nada.
  const corteCostosUno = S._corteEng || today();
  const cfg = egConfig_(rodeoId);
  const stk = Math.max(0, (stockPorRodeoACorte_(corteCostosUno)[String(rodeoId)])||0);
  const pes = egPesadas_(rodeoId).filter(p=>(p.fecha||'')<=corteCostosUno);
  const ultima = pes.length ? pes[pes.length-1] : null;
  const fi = egFechaIngreso_(rodeoId);
  const kgIngProm = egKgIngreso_(rodeoId);
  const cantIng = egCantIngresada_(rodeoId);
  const kgI = egKgIngresados_(rodeoId);
  const ca = egCostoAlim_(rodeoId, corteCostosUno);
  const caHP = egCostoAlim_(rodeoId, ultima?.fecha);
  const caHPAlim = caHP - egCostoAlim_(rodeoId, ultima?.fecha, 'Veterinaria'); // sin veterinaria, para "Alim/kg ganado"
  const caVet  = egCostoAlim_(rodeoId, corteCostosUno, 'Veterinaria');
  const caAlim = ca - caVet; // costo alimentación total (sin veterinaria)
  const cc = egCostoCompra_(rodeoId);
  const iv = (S.cache.ventas||[]).filter(v=>String(v.rodeo_id)===String(rodeoId)&&(v.fecha_salida||'')<=corteCostosUno)
    .reduce((s,v)=>s+(Number(v.importe_liq)||(Number(v.precio_pactado)*(Number(v.peso_campo_kg)||0))||0),0);
  const kgV = egKgVend_(rodeoId);
  const kgG = egKgGanadosHastaPesada_(rodeoId, corteCostosUno, stk);
  // Stock valorizado usando precios de valorización (no precio manual)
  const pesoUltima = ultima ? Number(ultima.peso_prom_kg)||0 : 0;
  const kgStk = stk * (pesoUltima || kgIngProm || 0);
  const ivStockARS = valorizarRodeo_(r, stk, pesoUltima);
  // OJO: mismo problema que egCostoCompra_ — antes esto se pre-convertía a
  // `moneda` acá y DE NUEVO en fm() al mostrarlo (doble conversión en modo
  // U$S), y encima ivTotal sumaba ARS crudo (iv) + ya-convertido (ivStock) en
  // la misma cuenta. Ahora todo queda en ARS crudo hasta el display.
  const ivStock = ivStockARS;
  const stkPrecio = pesoUltima > 0 ? ivStockARS / Math.max(stk * pesoUltima, 1) : 0; // $/kg efectivo
  // Cesión interna enviada a otro corral de Terminación (ej: para cerrar este
  // corral) — ver egIngresoCesionEnviada_. Es la contracara del "Costo de entrada"
  // (cc) que ya se reconoce en el corral que RECIBE.
  const cesEnv = egIngresoCesionEnviada_(rodeoId, corteCostosUno);
  const ivTotal = iv + ivStock + cesEnv.total;
  // Sueldos: se cargan por campo completo, no por corral individual. Para mostrar un
  // costo de sueldos en la ficha de ESTE corral, se prorratea el sueldo de Engorde
  // del campo según la proporción de animales ingresados de este corral sobre el total
  // de animales ingresados a Engorde en ese mismo campo (mismo criterio para todos los corrales).
  const sueldoEngordeCampo = sueldoTotalActividad_('engorde', s =>
    String(s.campo_id) === String(r.campo_id) &&
    String(s.periodo).slice(0,7) <= String(corteCostosUno).slice(0,7)
  );
  const corralesDelMismoCampo = rodeosEngordeValidos_().filter(rr => String(rr.campo_id) === String(r.campo_id));
  const totalAnimEngCampo = corralesDelMismoCampo.reduce((s, rr) => s + egCantIngresada_(rr.rodeo_id), 0);
  const sueldoProrrateado = totalAnimEngCampo > 0 ? sueldoEngordeCampo * (cantIng / totalAnimEngCampo) : 0;
  const costoTotal = cc + ca + sueldoProrrateado;
  const util = ivTotal - costoTotal;
  const dias = fi && ultima ? Math.round((new Date(ultima.fecha) - new Date(fi)) / 86400000) : null;
  const ganDiaria = dias && dias > 0 && kgIngProm > 0 ? (Number(ultima?.peso_prom_kg||0) - kgIngProm) / dias : null;
  const caXkg = kgG > 0 ? caHPAlim / kgG : null;
  const ccXkg = kgG > 0 ? cc / kgG : null;
  // ── CONVERSIÓN ALIMENTICIA FÍSICA ──────────────────────────────────────────
  // kg de MATERIA SECA consumidos por cada kg vivo ganado, hasta la última pesada
  // (el mismo corte que usa "Alim./kg ganado"). Cálculo centralizado en
  // egConversionMS_ — el Dashboard general y el Historial de lotes usan la misma
  // función, así los tres lugares muestran siempre el mismo número.
  const { conv: convAlim, costoKgMS, hayAlimSinMS, motivoSinDato: motivoSinConv } = egConversionMS_(rodeoId, ultima?.fecha, kgG);
  const precVentaProm = kgV > 0 ? iv / kgV : null;
  const totalAnim = (cantIng - stk) + stk;
  const costoARecuperar = costoTotal - iv - cesEnv.total;
  const breakEven = kgStk > 0 ? costoARecuperar / kgStk : null;
  const margenVsBE = breakEven && precVentaProm ? precVentaProm - breakEven : null;

  let h = '';
  h += `<div style="font-size:11px;color:var(--text3);margin-bottom:10px">📅 Datos al ${fd(corteCostosUno)}${corteCostosUno!==today()?' — mismo corte que el Dashboard':''}</div>`;

  // Layout ingresos/egresos como el dashboard
  h += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
    <div class="panel" style="margin-bottom:0">
      <div class="panel-title" style="color:var(--green-text)">📈 Ingresos — ${r.nombre}</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
          <div><div style="font-weight:600">💰 Ventas de hacienda</div><div style="font-size:11px;color:var(--text3)">${fn(kgV,0)} kg vendidos</div></div>
          <div style="font-size:18px;font-weight:700;color:var(--green)">${fm(iv)}</div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0">
          <div><div style="font-weight:600">📦 Stock valorizado</div><div style="font-size:11px;color:var(--text3)">${fn(stk,0)} anim. · ${pesoUltima?fn(pesoUltima,0)+' kg prom. (última pesada)':'sin pesada — precio/cab'}</div></div>
          <div style="font-size:18px;font-weight:700;color:var(--green)">${ivStock>0?fm(ivStock):'—'}</div>
        </div>
        ${cesEnv.total > 0 ? `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--border)">
          <div><div style="font-weight:600">🔄 Cesión interna enviada</div><div style="font-size:11px;color:var(--text3)">${fn(cesEnv.cant,0)} anim. · ${fn(cesEnv.kg,0)} kg → otro corral</div></div>
          <div style="font-size:18px;font-weight:700;color:var(--green)">${fm(cesEnv.total)}</div>
        </div>` : ''}
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--green-bg);border-radius:8px;margin-top:4px">
          <div style="font-weight:700;font-size:14px">TOTAL INGRESOS</div>
          <div style="font-size:22px;font-weight:800;color:var(--green)">${fm(ivTotal)}</div>
        </div>
      </div>
    </div>
    <div class="panel" style="margin-bottom:0">
      <div class="panel-title" style="color:var(--clay-text)">📉 Egresos — ${r.nombre}</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
          <div><div style="font-weight:600">🐄 Stock inicial / Costo entrada</div><div style="font-size:11px;color:var(--text3)">${fn(cantIng,0)} anim. × ${fn(kgIngProm,0)} kg prom.</div></div>
          <div style="font-size:18px;font-weight:700;color:var(--clay)">${cc>0?fm(cc):'—'}</div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
          <div><div style="font-weight:600">🌾 Alimentación</div><div style="font-size:11px;color:var(--text3)">total hasta el corte (${fd(corteCostosUno)})${ultima?`<br>hasta última pesada (${fd(ultima.fecha)}): ${fm(caHPAlim)}`:''}</div></div>
          <div style="font-size:18px;font-weight:700;color:var(--clay)">${fm(caAlim)}</div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
          <div><div style="font-weight:600">💉 Veterinaria</div><div style="font-size:11px;color:var(--text3)">total hasta el corte (${fd(corteCostosUno)})</div></div>
          <div style="font-size:18px;font-weight:700;color:var(--clay)">${fm(caVet)}</div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0">
          <div><div style="font-weight:600">👤 Sueldos (prorrateado)</div><div style="font-size:11px;color:var(--text3)">${totalAnimEngCampo>0?fn(cantIng,0)+' de '+fn(totalAnimEngCampo,0)+' anim. del campo':'sin animales en el campo'}</div></div>

        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--clay-bg);border-radius:8px;margin-top:4px">
          <div style="font-weight:700;font-size:14px">TOTAL EGRESOS</div>
          <div style="font-size:22px;font-weight:800;color:var(--clay)">${fm(costoTotal)}</div>
        </div>
