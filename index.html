function attachMovimientosEvents() {
  // Pre-cargar entidades para el Libro de Movimientos
  const entidadesLibro = ['pariciones', 'mortandad', 'destetes', 'ventas'];
  entidadesLibro.forEach(function(e) {
    if (!S.cache[e] || !S.cache[e].length) loadEntity(e, true).catch(function(){});
  });

  function applyTipoUI(tipo) {
    const esSaldoInicial = tipo === 'Saldo inicial';
    const esIndividual = tipo === 'Traslado individual';
    const esBloque = tipo === 'Traslado en bloque';
    document.getElementById('mv-campo-origen-wrap').style.display = (esIndividual || esBloque) ? 'flex' : 'none';
    document.getElementById('mv-origen-wrap').style.display = (esIndividual || esBloque) ? 'flex' : 'none';
    document.getElementById('mv-caravana-wrap').style.display = esIndividual ? 'flex' : 'none';
    document.getElementById('mv-cantidad-wrap').style.display = esIndividual ? 'none' : 'flex';
    // El precio y el peso se muestran para Saldo inicial y también para Traslados,
    // por si el traslado representa un ingreso de costo (ej: compra que entra directo
    // a un corral de Terminación sin pasar por un Saldo inicial separado).
    document.getElementById('mv-precio-wrap').style.display = 'flex';
    document.getElementById('mv-peso-wrap').style.display = 'flex';
    document.getElementById('mv-precio-label').innerHTML = esSaldoInicial
      ? 'Costo de ingreso <span class="opt">— opcional</span>'
      : 'Costo de ingreso <span class="opt">— opcional, solo si este traslado representa una compra</span>';
    document.getElementById('mv-precio-hint').textContent = esSaldoInicial
      ? 'Se usa para valorizar el stock inicial de la campaña'
      : 'Completalo solo si este traslado representa un ingreso de costo. Si los animales ya tenían costo en el rodeo de origen, dejalo vacío.';
    document.getElementById('mv-destino-label').textContent = esSaldoInicial ? 'Rodeo' : 'Rodeo destino';
  }
  document.querySelectorAll('#mv-precio-modo-group .radio-pill').forEach(p => p.onclick = () => {
    document.querySelectorAll('#mv-precio-modo-group .radio-pill').forEach(x => x.classList.remove('selected'));
    p.classList.add('selected');
    const esKg = p.dataset.modo === 'kg';
    document.getElementById('mv-precio-cabeza').style.display = esKg ? 'none' : '';
    document.getElementById('mv-precio-kg').style.display = esKg ? '' : 'none';
    mvActualizarPreviewCosto_();
  });
  window.mvActualizarPreviewCosto_ = function() {
    const cant = Number(document.getElementById('mv-cantidad')?.value) || 0;
    const peso = Number(document.getElementById('mv-peso-ingreso')?.value) || 0;
    const modo = document.querySelector('#mv-precio-modo-group .selected')?.dataset.modo || 'cabeza';
    const preview = document.getElementById('mv-costo-preview');
    if (!preview) return;
    let total = 0;
    if (modo === 'kg') {
      const pKg = Number(document.getElementById('mv-precio-kg')?.value) || 0;
      total = cant * peso * pKg;
    } else {
      const pCab = Number(document.getElementById('mv-precio-cabeza')?.value) || 0;
      total = cant * pCab;
    }
    if (total > 0) { preview.style.display = 'block'; preview.textContent = '💰 Costo total estimado: $ ' + fn(total); }
    else preview.style.display = 'none';
  };
  document.querySelectorAll('#mv-tipo-group .radio-pill').forEach(p => p.onclick = () => {
    document.querySelectorAll('#mv-tipo-group .radio-pill').forEach(x => x.classList.remove('selected'));
    p.classList.add('selected');
    applyTipoUI(p.dataset.tipo);
  });
  const save = document.getElementById('mv-save');
  if (save) save.onclick = async () => {
    const tipo = document.querySelector('#mv-tipo-group .selected').dataset.tipo;
    const esIndividual = tipo === 'Traslado individual';
    const esSaldoInicial = tipo === 'Saldo inicial';
    let rodeoDestinoId = document.getElementById('mv-destino').value;
    const campoDest = document.getElementById('mv-campo-destino').value;

    // Si eligió "crear rodeo nuevo", crearlo primero
    if (rodeoDestinoId === '__nuevo__') {
      const nombre = document.getElementById('mv-nr-nombre').value.trim();
      const categoria = document.getElementById('mv-nr-categoria').value;
      // OJO: antes esto se adivinaba mirando la actividad de "el primer rodeo que
      // aparezca" en el mismo campo — pero un campo puede tener rodeos de más de
      // una actividad a la vez (ej. Recría y Terminación conviviendo en el mismo
      // campo), y adivinar mal creaba un rodeo con la actividad equivocada, sin
      // ningún aviso. Ahora se elige explícitamente en el formulario.
      const actividad = document.getElementById('mv-nr-actividad')?.value || 'Cría';
      if (!nombre) { toast('Escribí el nombre del rodeo nuevo.', 'err'); return; }
      try {
        const resp = await apiCall('create', { body: { entity: 'rodeos', data: {
          nombre, campo_id: campoDest, categoria, activo: true, actividad,
        }}});
        await loadCatalogs();
        await loadStock();
        const nuevos = (S.catalogs && S.catalogs.rodeos) || [];
        const creado = nuevos.find(r => r.nombre === nombre && String(r.campo_id) === String(campoDest));
        if (!creado) { toast('Error al crear el rodeo.', 'err'); return; }
        rodeoDestinoId = String(creado.rodeo_id);
        toast('Rodeo "' + nombre + '" creado.', 'ok');
      } catch (err) { toast('Error al crear rodeo: ' + err.message, 'err'); return; }
    }

    const modoPrecio = document.querySelector('#mv-precio-modo-group .selected')?.dataset.modo || 'cabeza';
    const data = {
      tipo,
      caravana: esIndividual ? document.getElementById('mv-caravana').value.trim() : '',
      fecha: document.getElementById('mv-fecha').value,
      campo_origen_id: !esSaldoInicial ? document.getElementById('mv-campo-origen').value : '',
      campo_destino_id: campoDest,
      rodeo_origen_id: !esSaldoInicial ? document.getElementById('mv-origen').value : '',
      rodeo_destino_id: rodeoDestinoId,
      cantidad: esIndividual ? 1 : (Number(document.getElementById('mv-cantidad').value) || 0),
      peso_prom_kg: Number(document.getElementById('mv-peso-ingreso').value) || 0,
      precio_cabeza: modoPrecio === 'cabeza' ? (Number(document.getElementById('mv-precio-cabeza').value) || 0) : 0,
      precio_kg: modoPrecio === 'kg' ? (Number(document.getElementById('mv-precio-kg').value) || 0) : 0,
      observaciones: document.getElementById('mv-obs').value.trim(),
    };
    if (!data.fecha || !data.rodeo_destino_id) { toast('Completá fecha y rodeo destino.', 'err'); return; }
    if (esIndividual && !data.caravana) { toast('Ingresá la caravana del animal.', 'err'); return; }
    if (!esIndividual && !data.cantidad) { toast('Ingresá la cantidad.', 'err'); return; }
    if (!esSaldoInicial && data.rodeo_origen_id === data.rodeo_destino_id) { toast('El rodeo de origen y destino no pueden ser el mismo.', 'err'); return; }
    // Validación de coherencia campo-rodeo (solo para rodeos existentes, el nuevo ya fue validado arriba)
    if (!esSaldoInicial) {
      const rodeoOrigObj = rodeosTodos().find(r => String(r.rodeo_id) === String(data.rodeo_origen_id));
      if (!rodeoOrigObj || String(rodeoOrigObj.campo_id) !== String(data.campo_origen_id)) {
        toast('El rodeo origen no corresponde al campo elegido. Volvé a seleccionar el campo y esperá que se actualice la lista de rodeos.', 'err');
        return;
      }
    }
    save.disabled = true;
    try {
      await apiCall('create', { body: { entity: 'movimientos', data } });
      invalidateCache('movimientos');
      toast('Movimiento registrado', 'ok');
      await loadEntity('movimientos', true);
      S.stock = null;
      await loadStock();
      render();
    } catch (err) { toast(err.message, 'err'); } finally { save.disabled = false; }
  };
  attachTableDeleteEvents('movimientos', 'movimiento_id');
  attachTableDeleteEvents('ventas', 'venta_id');
}

function buildRecriaDashboard() {
  const rodeos    = (S.resumenRecria && S.resumenRecria.rodeos) || [];
  const campos    = (S.catalogs && S.catalogs.campos) || [];
  const rodeosAll = (S.catalogs && S.catalogs.rodeos) || [];
  const rodeosPorId = Object.fromEntries(rodeosAll.map(r=>[String(r.rodeo_id),r]));
  const fm = v => '$ ' + fn(Math.round(v||0));

  const campSelec  = S.rcDashCampo || '';
  const moneda     = S.rcDashMoneda || 'ARS';

  // Fecha de corte: por defecto hoy. Ver nota en buildDashboard() (Cría) — evita que
  // datos cargados con fecha posterior contaminen el resultado del período analizado.
  const corteRecria = S._corteRecria || today();
  const fmM = v => fmonACorte_(v, moneda, corteRecria);
  const stockACorteRecria = stockPorRodeoACorte_(corteRecria);

  // Mortandad
  const mortandad = (S.cache.mortandad||[]).filter(m => (m.fecha||'') <= corteRecria);
  const rodeosFiltBase = rodeos.filter(r => !campSelec || String(r.campo_id) === String(campSelec));
  const rodeosIdsFilt  = new Set(rodeosFiltBase.map(r=>String(r.rodeo_id)));
  const mortFilt = mortandad.filter(m=>rodeosIdsFilt.has(String(m.rodeo_id)));
  const mortTotal = mortFilt.reduce((s,m)=>s+(Number(m.cantidad)||1),0);
  const mortPorRodeo = {};
  mortFilt.forEach(m=>{ const rid=String(m.rodeo_id); mortPorRodeo[rid]=(mortPorRodeo[rid]||0)+(Number(m.cantidad)||1); });

  let h = `<div class="page-header">
    <div class="page-title">Dashboard Recría</div>
    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
      <button class="radio-pill selected" onclick="goto('recria_dashboard')">📊 Dashboard</button>
      <button class="radio-pill" onclick="goto('cesiones_cria')">⬇ Cesiones de Cría</button>
      <button class="radio-pill" onclick="goto('cesiones_recria')">⬆ Cesiones a Terminación</button>
      <button onclick="S.rcDashMoneda=S.rcDashMoneda==='USD'?'ARS':'USD';render()"
        style="margin-left:auto;padding:6px 14px;border-radius:20px;border:none;cursor:pointer;font-size:13px;font-weight:600;background:var(--blue);color:#fff">
        💵 ${moneda==='USD'?'Ver en ARS':'Ver en U$S'}
      </button>
    </div>
  </div>`;

  // Filtros
  h += `<div style="display:flex;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:8px">
      <label style="font-size:13px;font-weight:600">Campo:</label>
      <select style="font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text)"
        onchange="S.rcDashCampo=this.value;render()">
        <option value="">Todos los campos</option>
        ${campos.map(c=>`<option value="${c.campo_id}" ${campSelec==c.campo_id?'selected':''}>${c.nombre}</option>`).join('')}
      </select>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <label style="font-size:13px;font-weight:600;white-space:nowrap">Fecha de corte:</label>
      <input type="date" value="${corteRecria}" style="font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text)"
        onchange="S._corteRecria=this.value;render()">
      ${corteRecria!==today()?`<button class="btn btn-ghost btn-sm" onclick="S._corteRecria=null;render()" title="Volver a hoy">↺ Hoy</button>`:''}
    </div>
  </div>`;

  // ── CALCULAR INGRESOS Y EGRESOS ───────────────────────────────────────
  // Todos los rodeos de Recría (incluyendo inactivos/sin stock) para no perder histórico
  const todosRodeosRecria = rodeosAll.filter(r=>normAct_(r.actividad)==='recria'&&
    (!campSelec||String(r.campo_id)===String(campSelec)));
  const todosRodeosRecriaIds = new Set(todosRodeosRecria.map(r=>String(r.rodeo_id)));

  const ventas     = (S.cache.ventas||[]).filter(v=>todosRodeosRecriaIds.has(String(v.rodeo_id)) && (v.fecha_salida||'') <= corteRecria);
  const consumos   = (S.cache.consumos_insumos||[]).filter(c=>todosRodeosRecriaIds.has(String(c.rodeo_id)) && (c.fecha||'') <= corteRecria);
  const movs       = (S.cache.movimientos||[]).filter(m => (m.fecha||'') <= corteRecria);
  const egresos    = (S.cache.egresos_recria||[]).filter(e=>todosRodeosRecriaIds.has(String(e.rodeo_id)) && (e.fecha||'') <= corteRecria);
  const precios    = (S.cache.precios_internos||[]).slice().sort((a,b)=>String(b.fecha_desde||'').localeCompare(String(a.fecha_desde||'')));
  const productos  = (S.catalogs&&S.catalogs.productos)||[];

  function precioInternoEn(fecha) {
    const v = precios.filter(p=>p.fecha_desde<=fecha);
    return v.length ? v[0] : null;
  }

  // INGRESOS
  // 1. Ventas directas de Recría
  let ingVentas = 0;
  const detalleVentas = [];
  ventas.forEach(v=>{
    const imp = Number(v.importe_liq)||(Number(v.precio_pactado)*(Number(v.peso_campo_kg)||Number(v.cant_animales)))||0;
    ingVentas += imp;
    detalleVentas.push({ fecha: v.fecha_salida, rodeo: rodeoNombre(v.rodeo_id), cant: Number(v.cant_animales)||0, importe: imp });
  });

  // 2. Cesiones a Terminación (egresos con destino Engorde, con precio_kg_cesion)
  // Mismo respaldo de 3 niveles que ya usa "Cesión desde Cría" más abajo — antes
  // acá, si faltaba precio_kg_cesion, el ingreso daba directamente $0 en vez de
  // estimarlo. En la práctica el formulario de cesiones exige el precio, así que
  // esto raramente se activa, pero cubre el caso de cesiones cargadas a mano por
  // Movimientos (que no obliga precio).
  let ingCesionEng = 0;
  const detalleCesEng = [];
  egresos.filter(e=>e.destino==='Engorde').forEach(e=>{
    const cant=Number(e.cant_animales)||0;
    let peso=Number(e.peso_prom_kg)||0;
    const precioKg=Number(e.precio_kg_cesion)||0;
    let imp=0;
    if (precioKg&&peso) {
      imp = cant*peso*precioKg;
    } else if (precioKg&&!peso) {
      const pp=(S.cache.pesadas||[]).filter(p=>String(p.rodeo_id)===String(e.rodeo_id)&&String(p.fecha)<=String(e.fecha)).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
      peso=pp[0]?Number(pp[0].peso_prom_kg)||0:0;
      imp = cant*peso*precioKg;
    } else {
      const origen = rodeosTodos().find(r=>String(r.rodeo_id)===String(e.rodeo_id));
      const pp=(S.cache.pesadas||[]).filter(p=>String(p.rodeo_id)===String(e.rodeo_id)&&String(p.fecha)<=String(e.fecha)).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
      peso=pp[0]?Number(pp[0].peso_prom_kg)||0:0;
      imp = valorizarRodeo_(origen||{categoria:'novillito'}, cant, peso);
    }
    const kgTot = cant*peso;
    ingCesionEng += imp;
    detalleCesEng.push({ fecha: e.fecha, rodeo: rodeoNombre(e.rodeo_id), cant, kg: kgTot, importe: imp, sinPrecio: !precioKg });
  });

  // 3. Stock valorizado a la fecha de corte
  let stockValRecria = 0;
  // Antes usaba S.stock (siempre "hoy", calculado por el backend) — ahora usa
  // stockACorteRecria, calculado localmente respetando la fecha de corte elegida.
  // Se sigue recorriendo todosRodeosRecria (no solo resumenRecria) para no perder
  // rodeos que el backend pudiera omitir.
  const stockDetalleRec_ = [];
  todosRodeosRecria.forEach(r=>{
    const stock = Math.max(0, stockACorteRecria[String(r.rodeo_id)]||0);
    if (!stock) return;
    const pesoP = ultimaPesadaACorte_(r.rodeo_id, corteRecria);
    const val = valorizarRodeo_(rodeosAll.find(x=>String(x.rodeo_id)===String(r.rodeo_id))||r, stock, pesoP);
    stockValRecria += val;
    stockDetalleRec_.push({nombre:r.nombre, stock, pesoP, val});
  });

  const totalIngresos = ingVentas + ingCesionEng + stockValRecria;

  // EGRESOS
  // 1. Cesión desde Cría — traslados de Cría a rodeos de Recría con precio/kg
  let egCesionCria = 0;
  const detalleCesCria = [];
  const rodeosAllMap = Object.fromEntries((S.catalogs&&S.catalogs.rodeos||[]).map(r=>[String(r.rodeo_id),r]));
  movs.filter(m=>{
    if(m.tipo!=='Traslado en bloque'&&m.tipo!=='Traslado individual') return false;
    const or = rodeosAllMap[String(m.rodeo_origen_id)];
    const de = rodeosAllMap[String(m.rodeo_destino_id)];
    return or&&(normAct_(or.actividad)==='cria'||normAct_(or.actividad)==='cria')&&de&&normAct_(de.actividad)==='recria'&&todosRodeosRecriaIds.has(String(m.rodeo_destino_id));
  }).forEach(m=>{
    const cant=Number(m.cantidad)||0, peso=Number(m.peso_prom_kg)||0;
    const precioKg=Number(m.precio_kg)||Number(m.precio_cabeza)||0;
    let total=0, pesoUsado=peso;
    if (precioKg&&peso) { total=cant*peso*precioKg; }
    else if (precioKg&&!peso) {
      const pp=(S.cache.pesadas||[]).filter(p=>String(p.rodeo_id)===String(m.rodeo_origen_id)&&String(p.fecha)<=String(m.fecha)).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
      pesoUsado=pp[0]?Number(pp[0].peso_prom_kg)||0:0;
      total=cant*pesoUsado*precioKg;
    } else {
      const or=rodeosAllMap[String(m.rodeo_origen_id)];
      const pp=(S.cache.pesadas||[]).filter(p=>String(p.rodeo_id)===String(m.rodeo_origen_id)).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
      pesoUsado=pp[0]?Number(pp[0].peso_prom_kg)||0:0;
      total=valorizarRodeo_(or||{},cant,pesoUsado);
    }
    egCesionCria += total;
    detalleCesCria.push({ fecha: m.fecha, rodeo: rodeoNombre(m.rodeo_destino_id), total: cant, kg: cant*(pesoUsado||0), importe: total });
  });

  // 2. Compra externa (movimientos hacia rodeos de recría con precio)
  let egCompraExterna = 0;
  movs.filter(m=>rodeosIdsFilt.has(String(m.rodeo_destino_id))&&m.tipo!=='Saldo inicial'&&m.tipo!=='Traslado en bloque'&&m.tipo!=='Traslado individual').forEach(m=>{
    egCompraExterna += (Number(m.cantidad)||0)*(Number(m.precio_cabeza)||0);
  });

  // 3. Alimentación y veterinaria
  let egAlim = 0, egVet = 0;
  const detalleAlim = [], detalleVet = [];
  consumos.forEach(c=>{
    const prod = productos.find(p=>String(p.producto_id)===String(c.producto_id));
    const costo = (Number(c.cantidad)||0)*egPrecioVigenteProducto_(c.producto_id, c.fecha);
    if (prod&&prod.categoria==='Veterinaria') {
      egVet += costo;
      detalleVet.push({fecha:c.fecha,prod:prod.nombre,cant:Number(c.cantidad)||0,rodeo:rodeoNombre(c.rodeo_id),costo});
    } else {
      egAlim += costo;
      detalleAlim.push({fecha:c.fecha,prod:prod?.nombre||'—',cant:Number(c.cantidad)||0,rodeo:rodeoNombre(c.rodeo_id),costo});
    }
  });

  // 4. Sueldos prorrateados a Recría — antes este cálculo solo miraba dist_recria
  // cargado a mano en cada sueldo, ignorando la distribución base por campo cuando
  // no había override, y sumaba TODOS los campos y TODOS los meses sin filtrar
  // (mismo bug que tenía Cría, más este otro: no usaba el fallback a distEfectiva_).
  const egSueldos = sueldoTotalActividad_('recria', s =>
    (!campSelec || String(s.campo_id) === String(campSelec)) &&
    String(s.periodo).slice(0,7) <= corteRecria.slice(0,7)
  );

  // 5. Stock inicial (EI) — saldos iniciales de rodeos de Recría
  const egEI = movs
    .filter(m => m.tipo==='Saldo inicial' && todosRodeosRecriaIds.has(String(m.rodeo_destino_id)))
    .reduce((s,m) => s+valorMovimientoEntrada_(m).total, 0);

  const totalEgresos  = egEI + egCesionCria + egCompraExterna + egAlim + egVet + egSueldos;
  const margen = totalIngresos - totalEgresos;

  // ── MARGEN BRUTO POR HECTÁREA ────────────────────────────────────────────
  // Misma lógica que en Cría: si hay un campo elegido, usa sus hectáreas; si
  // está en "todos los campos", suma las hectáreas de los campos que tienen
  // rodeos de Recría (histórico, no solo con stock hoy).
  const campoPorIdRec_ = Object.fromEntries(campos.map(c => [String(c.campo_id), c]));
  let haRecria = 0, camposRecriaSinHa = false;
  if (campSelec) {
    const ha = Number(campoPorIdRec_[String(campSelec)]?.superficie_ha) || 0;
    if (ha > 0) haRecria = ha; else camposRecriaSinHa = true;
  } else {
    const campoIdsRecria_ = [...new Set(todosRodeosRecria.map(r => String(r.campo_id)).filter(Boolean))];
    campoIdsRecria_.forEach(cid => {
      const ha = Number(campoPorIdRec_[cid]?.superficie_ha) || 0;
      if (ha > 0) haRecria += ha; else camposRecriaSinHa = true;
    });
  }
  const margenPorHaRecria = haRecria > 0 ? margen / haRecria : null;

  // Cabezas de EI (saldos iniciales) y EF (stock final) — para el Reporte Directorio.
  const eiCabRecria = movs
    .filter(m => m.tipo==='Saldo inicial' && todosRodeosRecriaIds.has(String(m.rodeo_destino_id)))
    .reduce((s,m) => s+(Number(m.cantidad)||0), 0);
  const efCabRecria = stockDetalleRec_.reduce((s,r) => s+(Number(r.stock)||0), 0);

  const clasRec = clasificarTrasladosActividad_(todosRodeosRecriaIds, movs);
  const ventasCabRecria = ventas.reduce((s,v) => s + (Number(v.cant_animales)||0), 0);
  const mortCabRecria = mortandad.filter(m => todosRodeosRecriaIds.has(String(m.rodeo_id))).reduce((s,m) => s + (Number(m.cantidad)||1), 0);

  // Guardar resultados para Resultados Económicos
  S._resultRecria = {
    ing: totalIngresos, eg: totalEgresos, margen,
    ingVentas, ingCesEng: ingCesionEng, ef: stockValRecria,
    ei: egEI, egCesionCria, egCompraExt: egCompraExterna, egAlim, egVet, egSueldos,
    eiCab: eiCabRecria, efCab: efCabRecria, nacCab: 0, nacImp: 0,
    comprasCab: clasRec.compras, cesRecCab: clasRec.cesionesRecibidas, cesEnvCab: clasRec.cesionesEnviadas,
    ventasCab: ventasCabRecria, mortCab: mortCabRecria,
  };
  const mc = margen>=0?'var(--green)':'var(--red)';
  const mb = margen>=0?'var(--green-bg)':'rgba(220,50,50,0.08)';

  // KPIs producción
  const pesadas = (S.cache.pesadas||[]).filter(p=>rodeosIdsFilt.has(String(p.rodeo_id)));
  let kgGanadoTotal = 0, cabezasConPesada = 0;
  rodeosIdsFilt.forEach(rid=>{
    const pesR = pesadas.filter(p=>String(p.rodeo_id)===String(rid)).sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));
    if (pesR.length>=2) {
      const cab = Number(pesR[pesR.length-1].cantidad)||0;
      kgGanadoTotal += cab*((Number(pesR[pesR.length-1].peso_prom_kg)||0)-(Number(pesR[0].peso_prom_kg)||0));
      cabezasConPesada += cab;
    }
  });
  const costoPorKg  = kgGanadoTotal>0 ? totalEgresos/kgGanadoTotal : null;
  const margenPorKg = kgGanadoTotal>0 ? margen/kgGanadoTotal : null;

  // ── LAYOUT DOS COLUMNAS ───────────────────────────────────────────────
  h += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px">

    <!-- INGRESOS -->
    <div class="panel" style="margin-bottom:0">
      <div class="panel-title" style="color:var(--green-text)">📈 Ingresos</div>
      <table class="dt" style="margin-bottom:12px"><tbody>
        <tr><td>💵 Ventas directas</td><td class="tr"><strong>${fmM(ingVentas)}</strong></td></tr>
        <tr><td>➡ Cesión a Terminación</td><td class="tr"><strong>${fmM(ingCesionEng)}</strong></td></tr>
        <tr><td>📦 Stock valorizado actual</td><td class="tr"><strong>${fmonACorte_(stockValRecria, moneda, corteRecria)}</strong></td></tr>
        <tr style="background:var(--green-bg);font-weight:700"><td><strong>Total ingresos</strong></td><td class="tr" style="color:var(--green);font-size:20px"><strong>${fmM(totalIngresos)}</strong></td></tr>
      </tbody></table>
    </div>

    <!-- EGRESOS -->
    <div class="panel" style="margin-bottom:0">
      <div class="panel-title" style="color:var(--red)">📉 Egresos</div>
      <table class="dt" style="margin-bottom:12px"><tbody>
        <tr><td>📦 Stock inicial (EI)</td><td class="tr"><strong>${fmM(egEI)}</strong></td></tr>
        <tr><td>⬅ Cesión desde Cría</td><td class="tr"><strong>${fmM(egCesionCria)}</strong></td></tr>
        ${egCompraExterna>0?`<tr><td>🛒 Compra externa</td><td class="tr"><strong>${fmM(egCompraExterna)}</strong></td></tr>`:''}
        <tr><td>🌿 Alimentación</td><td class="tr"><strong>${fmM(egAlim)}</strong></td></tr>
        <tr><td>💉 Veterinaria</td><td class="tr"><strong>${fmM(egVet)}</strong></td></tr>
        <tr><td>👷 Sueldos</td><td class="tr"><strong>${fmM(egSueldos)}</strong></td></tr>
        <tr style="background:rgba(220,50,50,0.08);font-weight:700"><td><strong>Total egresos</strong></td><td class="tr" style="color:var(--red);font-size:20px"><strong>${fmM(totalEgresos)}</strong></td></tr>
      </tbody></table>
    </div>
  </div>`;

  // Margen
  h += `<div class="panel" style="background:${mb};border:2px solid ${mc};margin-bottom:16px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <div style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:${mc}">Margen bruto Recría</div>
        ${margenPorKg!==null?`<div style="font-size:12px;color:${mc};margin-top:2px">${fmM(margenPorKg)}/kg ganado</div>`:''}
      </div>
      <div style="font-size:32px;font-weight:800;color:${mc}">${margen>=0?'':'-'}${fmM(Math.abs(margen))}</div>
    </div>
  </div>`;

  if (margenPorHaRecria !== null || camposRecriaSinHa) {
    h += `<div class="panel" style="background:var(--bg2);margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text2)">Margen Bruto / ha — Recría</div>
          <div style="font-size:11px;color:var(--text3);margin-top:3px">${campSelec?campoNombre(campSelec):'Todos los campos con Recría'} · ${fn(haRecria,0)} ha${camposRecriaSinHa?' · ⚠ hay campos sin hectáreas cargadas, no entran en la suma':''}</div>
        </div>
        <div style="font-size:24px;font-weight:800;color:${mc}">${margenPorHaRecria!==null?(margenPorHaRecria>=0?'':'-')+fmM(Math.abs(margenPorHaRecria)):'—'}</div>
      </div>
    </div>`;
  }
  h += `<div class="panel">
    <div class="panel-title">📊 KPIs de producción</div>
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-icon">🐄</div><div class="kpi-label">Rodeos activos</div><div class="kpi-val">${rodeosIdsFilt.size}</div></div>
      <div class="kpi"><div class="kpi-icon">⚖</div><div class="kpi-label">Kg ganado total</div><div class="kpi-val">${kgGanadoTotal>0?fn(Math.round(kgGanadoTotal))+' kg':'—'}</div><div class="kpi-sub">${cabezasConPesada>0?fn(cabezasConPesada)+' cab. con 2+ pesadas':''}</div></div>
      ${costoPorKg!==null?`<div class="kpi"><div class="kpi-icon">💲</div><div class="kpi-label">Costo/kg ganado</div><div class="kpi-val">${fmM(costoPorKg)}</div></div>`:''}
      ${margenPorKg!==null?`<div class="kpi"><div class="kpi-icon">${margenPorKg>=0?'📈':'📉'}</div><div class="kpi-label">Margen/kg ganado</div><div class="kpi-val ${margenPorKg>=0?'kpi-pos':'kpi-neg'}">${fmM(margenPorKg)}</div></div>`:''}
    </div>
  </div>`;

  // Sueldos KPI
  h += buildSueldoKpiPanel_('recria');

  // ── Detalle EF (Stock final valorizado) ───────────────────────────────────
  const stockDetalleRec = stockDetalleRec_;
  if (stockDetalleRec.length) {
    h += `<div class="panel"><div class="panel-title">📦 Stock final valorizado (EF) — por rodeo</div>
      <div class="tw"><table class="dt"><thead><tr>
        <th>Rodeo</th><th class="tc">Stock</th><th class="tr">Peso prom.</th><th class="tr">Valor total</th>
      </tr></thead><tbody>`;
    stockDetalleRec.forEach(r=>{
      h += `<tr><td><strong>${r.nombre}</strong></td>
        <td class="tc">${fn(r.stock)}</td>
        <td class="tr">${r.pesoP?fn(r.pesoP)+' kg':'—'}</td>
        <td class="tr"><strong>${fmM(r.val)}</strong></td></tr>`;
    });
    h += `<tr style="background:var(--bg2);font-weight:800"><td class="tr">TOTAL EF</td>
      <td class="tc">${fn(stockDetalleRec.reduce((s,r)=>s+r.stock,0))} cab.</td><td></td>
      <td class="tr" style="color:var(--green-text);font-size:15px">${fmonACorte_(stockValRecria, moneda, corteRecria)}</td></tr>`;
    h += `</tbody></table></div></div>`;
  }

  // ── Conciliación de Existencia (cabezas) — control cruzado EI/EF ────────
  h += buildConciliacionCabezas_('Recría', {
    ei: eiCabRecria, compras: clasRec.compras, cesionesRecibidas: clasRec.cesionesRecibidas,
    nacimientos: 0, cesionesEnviadas: clasRec.cesionesEnviadas,
    ventas: ventasCabRecria, mortandad: mortCabRecria,
  }, efCabRecria);

  // ── Detalle EI (Saldo inicial) ────────────────────────────────────────────
  const saldosInicRec = movs.filter(m=>m.tipo==='Saldo inicial'&&rodeosIdsFilt.has(String(m.rodeo_destino_id)));
  if (saldosInicRec.length) {
    h += `<div class="panel"><div class="panel-title">📋 Saldo inicial (EI) — por rodeo</div>
      <div class="tw"><table class="dt"><thead><tr>
        <th>Fecha</th><th>Rodeo</th><th class="tc">Cabezas</th><th class="tr">Precio</th><th class="tr">Total</th>
      </tr></thead><tbody>`;
    let totEI=0;
    saldosInicRec.forEach(m=>{
      const cant=Number(m.cantidad)||0;
      const { total, precioLabel } = valorMovimientoEntrada_(m);
      totEI+=total;
      h += `<tr><td>${fd(m.fecha)}</td><td><strong>${rodeoNombre(m.rodeo_destino_id)}</strong></td>
        <td class="tc">${fn(cant)}</td>
        <td class="tr">${precioLabel || '<span style="color:var(--clay-text);font-size:11px">⚠ sin precio</span>'}</td>
        <td class="tr"><strong>${total?fmM(total):'—'}</strong></td></tr>`;
    });
    h += `<tr style="background:var(--bg2);font-weight:800"><td colspan="4" class="tr">TOTAL EI</td>
      <td class="tr" style="color:var(--clay-text);font-size:15px">${fmM(totEI)}</td></tr>`;
    h += `</tbody></table></div></div>`;
  }

  // ── Detalle Cesiones recibidas de Cría ────────────────────────────────────
  const cesRecCria = movs.filter(m=>{
    if(m.tipo!=='Traslado en bloque'&&m.tipo!=='Traslado individual') return false;
    const or=rodeosAllMap[String(m.rodeo_origen_id)];
    const de=rodeosAllMap[String(m.rodeo_destino_id)];
    return or&&(normAct_(or.actividad)==='cria'||normAct_(or.actividad)==='cria')&&de&&normAct_(de.actividad)==='recria'&&todosRodeosRecriaIds.has(String(m.rodeo_destino_id));
  });
  if (cesRecCria.length) {
    const pesadasAll = S.cache.pesadas||[];
    h += `<div class="panel"><div class="panel-title">⬇ Cesiones recibidas de Cría — detalle</div>
      <div class="tw"><table class="dt"><thead><tr>
        <th>Fecha</th><th>Rodeo origen</th><th>Rodeo destino</th>
        <th class="tc">Cab.</th><th class="tc">Kg prom.</th><th class="tr">$/kg</th><th class="tr">Total</th>
      </tr></thead><tbody>`;
    let totCesRec=0;
    cesRecCria.forEach(m=>{
      const cant=Number(m.cantidad)||0, peso=Number(m.peso_prom_kg)||0;
      const precioKg=Number(m.precio_kg)||Number(m.precio_cabeza)||0;
      let pesoUsado=peso, total=0;
      if (precioKg&&peso) { total=cant*peso*precioKg; }
      else if (precioKg&&!peso) {
        const pp=pesadasAll.filter(p=>String(p.rodeo_id)===String(m.rodeo_origen_id)&&String(p.fecha)<=String(m.fecha)).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
        pesoUsado=pp[0]?Number(pp[0].peso_prom_kg)||0:0;
        total=cant*pesoUsado*precioKg;
      } else {
        const or=rodeosAllMap[String(m.rodeo_origen_id)];
        const pp=pesadasAll.filter(p=>String(p.rodeo_id)===String(m.rodeo_origen_id)).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
        pesoUsado=pp[0]?Number(pp[0].peso_prom_kg)||0:0;
        total=valorizarRodeo_(or||{},cant,pesoUsado);
      }
      totCesRec+=total;
      h += `<tr${!precioKg?' style="background:rgba(200,150,40,0.06)"':''}>
        <td>${fd(m.fecha)}</td><td><strong>${rodeoNombre(m.rodeo_origen_id)}</strong></td><td>${rodeoNombre(m.rodeo_destino_id)}</td>
        <td class="tc">${fn(cant)}</td>
        <td class="tc">${pesoUsado?fn(pesoUsado)+' kg'+(peso?'':' <span style="font-size:10px;color:var(--text3)">(pesada)</span>'):'—'}</td>
        <td class="tr">${precioKg?'$ '+fn(precioKg):'<span style="color:var(--gold-text);font-size:11px">⚠ valor del mes</span>'}</td>
        <td class="tr"><strong>${fmM(total)}</strong></td></tr>`;
    });
    h += `<tr style="background:var(--bg2);font-weight:800"><td colspan="6" class="tr">TOTAL cesiones recibidas</td>
      <td class="tr" style="color:var(--clay-text);font-size:15px">${fmM(totCesRec)}</td></tr>`;
    h += `</tbody></table></div></div>`;
  }

  // ── Detalle Cesiones enviadas a Terminación ───────────────────────────────
  if (egresos.filter(e=>e.destino==='Engorde').length) {
    h += `<div class="panel"><div class="panel-title">⬆ Cesiones enviadas a Terminación — detalle</div>
      <div class="tw"><table class="dt"><thead><tr>
        <th>Fecha</th><th>Rodeo origen</th><th>Rodeo destino</th>
        <th class="tc">Cab.</th><th class="tc">Kg prom.</th><th class="tr">$/kg</th><th class="tr">Total</th>
      </tr></thead><tbody>`;
    let totCesEnv=0;
    egresos.filter(e=>e.destino==='Engorde').forEach(e=>{
      const cant=Number(e.cant_animales)||0, peso=Number(e.peso_prom_kg)||0, precioKg=Number(e.precio_kg_cesion)||0;
      const total=cant*peso*precioKg;
      totCesEnv+=total;
      h += `<tr${!precioKg?' style="background:rgba(200,150,40,0.06)"':''}>
        <td>${fd(e.fecha)}</td><td><strong>${rodeoNombre(e.rodeo_id)}</strong></td><td>${rodeoNombre(e.rodeo_destino_id)}</td>
        <td class="tc">${fn(cant)}</td>
        <td class="tc">${peso?fn(peso)+' kg':'—'}</td>
        <td class="tr">${precioKg?'$ '+fn(precioKg):'<span style="color:var(--gold-text);font-size:11px">⚠ sin precio</span>'}</td>
        <td class="tr"><strong>${total?fmM(total):'—'}</strong></td></tr>`;
    });
    h += `<tr style="background:var(--bg2);font-weight:800"><td colspan="6" class="tr">TOTAL cesiones enviadas</td>
      <td class="tr" style="color:var(--green-text);font-size:15px">${fmM(totCesEnv)}</td></tr>`;
    h += `</tbody></table></div></div>`;
  }

  // ── Detalle Ventas ────────────────────────────────────────────────────────
  if (ventas.length) {
    h += `<div class="panel"><div class="panel-title">💰 Ventas — detalle</div>
      <div class="tw"><table class="dt"><thead><tr>
        <th>Fecha</th><th>Rodeo</th><th class="tc">Cab.</th>
        <th class="tr">Kg campo</th><th class="tr">Precio pactado</th><th class="tr">Importe liq.</th><th class="tr">Total</th>
      </tr></thead><tbody>`;
    let totVent=0;
    ventas.slice().sort((a,b)=>String(a.fecha_salida||'').localeCompare(String(b.fecha_salida||''))).forEach(v=>{
      const cant=Number(v.cant_animales)||0, kg=Number(v.peso_campo_kg)||0;
      const pPact=Number(v.precio_pactado)||0, imLiq=Number(v.importe_liq)||0;
      const total=imLiq||(pPact*kg)||0;
      totVent+=total;
      h += `<tr${!imLiq?' style="background:rgba(200,150,40,0.04)"':''}>
        <td>${fd(v.fecha_salida)}</td><td><strong>${rodeoNombre(v.rodeo_id)}</strong></td>
        <td class="tc">${fn(cant)}</td>
        <td class="tr">${kg?fn(kg)+' kg':'—'}</td>
        <td class="tr">${pPact?'$ '+fn(pPact)+'/kg':'—'}</td>
        <td class="tr">${imLiq?fmM(imLiq):'<span style="color:var(--gold-text);font-size:11px">pendiente</span>'}</td>
        <td class="tr"><strong>${total?fmM(total):'—'}</strong></td></tr>`;
    });
    h += `<tr style="background:var(--bg2);font-weight:800"><td colspan="6" class="tr">TOTAL ventas</td>
      <td class="tr" style="color:var(--green-text);font-size:15px">${fmM(totVent)}</td></tr>`;
    h += `</tbody></table></div></div>`;
  }

  // ── Detalle Alimentación y Veterinaria ───────────────────────────────────
  const buildInsumoTableRec_ = (filas, titulo) => {
    if (!filas.length) return '';
    let t = `<div class="panel"><div class="panel-title">${titulo}</div>
      <div class="tw"><table class="dt"><thead><tr>
        <th>Fecha</th><th>Producto</th><th>Rodeo</th><th class="tc">Cantidad</th><th class="tr">Costo</th>
      </tr></thead><tbody>`;
    let tot=0;
    filas.slice().sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha))).forEach(d=>{
      tot+=d.costo;
      t+=`<tr><td>${fd(d.fecha)}</td><td>${d.prod}</td><td>${d.rodeo}</td>
        <td class="tc">${fn(d.cant)}</td><td class="tr"><strong>${fmM(d.costo)}</strong></td></tr>`;
    });
    t+=`<tr style="background:var(--bg2);font-weight:800"><td colspan="4" class="tr">TOTAL</td>
      <td class="tr" style="color:var(--clay-text);font-size:15px">${fmM(tot)}</td></tr>`;
    return t+'</tbody></table></div></div>';
  };
  if (detalleAlim.length) h += buildInsumoTableRec_(detalleAlim, '🌿 Alimentación e insumos — detalle');
  if (detalleVet.length)  h += buildInsumoTableRec_(detalleVet,  '💉 Veterinaria — detalle');

  // Mortandad — al final del dashboard, destacada en rojo
  if (mortTotal > 0) {
    h += `<div class="panel" style="border:2px solid var(--red);background:rgba(200,50,50,0.06);margin-bottom:16px">
      <div class="panel-title" style="color:var(--red)">💀 Mortandad en Recría</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px">`;
    Object.entries(mortPorRodeo).forEach(([rid,cant])=>{
      const r = rodeosFiltBase.find(x=>String(x.rodeo_id)===String(rid));
      h += `<div style="background:rgba(200,50,50,0.15);border-radius:8px;padding:10px 16px;border:1px solid var(--red)">
        <div style="font-size:11px;font-weight:700;color:var(--red);text-transform:uppercase">${r?.nombre||'Rodeo '+rid}</div>
        <div style="font-size:26px;font-weight:800;color:var(--red)">${cant} <span style="font-size:13px">baja${cant>1?'s':''}</span></div>
      </div>`;
    });
    h += `<div style="background:rgba(200,50,50,0.25);border-radius:8px;padding:10px 16px;border:2px solid var(--red)">
      <div style="font-size:11px;font-weight:700;color:var(--red);text-transform:uppercase">Total</div>
      <div style="font-size:30px;font-weight:800;color:var(--red)">${mortTotal} <span style="font-size:13px">bajas</span></div>
    </div></div>
      <div style="font-size:12px;color:var(--red)">⚠ La mortandad no se contabiliza como egreso — su impacto está reflejado en el menor stock al cierre.</div>
    </div>`;
  }

  return h;
}
