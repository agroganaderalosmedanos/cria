function renderStockHaciendaActual_() {
  const campo = document.getElementById('sh-stock-campo')?.value || '';
  const cat   = document.getElementById('sh-stock-cat')?.value  || '';
  const fecha = document.getElementById('sh-stock-fecha')?.value || today();
  const el    = document.getElementById('sh-stock-actual');
  if (!el) return;

  if (fecha >= today()) {
    // Fecha actual o futura → usar stock en vivo (S.stock)
    const stockList = (S.stock || []).filter(function(s) {
      if (campo && String(s.campo_id) !== String(campo)) return false;
      if (cat && String(s.categoria) !== String(cat)) return false;
      return true;
    });
    el.innerHTML = buildStockTable_(stockList, campo, cat);
    return;
  }

  // Fecha histórica → calcular stock a esa fecha
  // Verificar que las entidades necesarias estén cargadas (null = no cargada; [] vacío es válido)
  const entidades = ['movimientos', 'ventas', 'pariciones', 'mortandad', 'destetes'];
  const faltantes = entidades.filter(function(e){ return S.cache[e] == null; });
  if (faltantes.length) {
    el.innerHTML = '<div class="empty-state"><span class="ico" style="font-size:22px">⏳</span><div class="msg">Cargando datos históricos…</div></div>';
    Promise.all(faltantes.map(function(e){ return loadEntity(e, true).catch(function(){ S.cache[e] = []; }); })).then(function(){
      renderStockHaciendaActual_();
    });
    return;
  }

  // Calcular stock por rodeo a la fecha de corte
  const stockData = calcStockAFecha_(fecha, campo, cat);
  el.innerHTML = buildStockAFechaTable_(stockData, fecha);
}

function calcStockAFecha_(fechaCorte, campoFiltro, catFiltro) {
  const movs       = S.cache.movimientos || [];
  const ventas     = S.cache.ventas      || [];
  const pariciones = S.cache.pariciones  || [];
  const mortandad  = S.cache.mortandad   || [];
  const destetes   = S.cache.destetes    || [];

  // Construir universo de rodeos que tuvieron actividad hasta la fecha de corte
  // (en lugar de usar el catálogo con campo actual, derivamos campo desde los movimientos)
  const rodeosSet = {};

  // De los movimientos ≤ fechaCorte, registrar el campo que corresponde a cada rodeo
  // El campo de un rodeo a una fecha dada = campo_destino del último saldo inicial o traslado_en_bloque con destino ese rodeo
  movs.filter(function(m){ return (m.fecha || '') <= fechaCorte; }).forEach(function(m) {
    const cant = Number(m.cantidad) || 0;
    if (m.rodeo_destino_id) {
      const id = String(m.rodeo_destino_id);
      if (!rodeosSet[id]) rodeosSet[id] = { rodeo_id: id, campo_id: m.campo_destino_id };
      // Actualizar campo destino con el último movimiento que lo "ubica"
      if (m.campo_destino_id) rodeosSet[id].campo_id = m.campo_destino_id;
    }
    if (m.rodeo_origen_id && m.tipo !== 'Saldo inicial') {
      const id = String(m.rodeo_origen_id);
      if (!rodeosSet[id]) rodeosSet[id] = { rodeo_id: id, campo_id: m.campo_origen_id };
    }
  });
  // También incluir rodeos que tengan ventas/pariciones/mortandad/destetes
  ventas.filter(function(v){ return (v.fecha_salida || '') <= fechaCorte && v.rodeo_id; }).forEach(function(v){
    const id = String(v.rodeo_id);
    if (!rodeosSet[id]) rodeosSet[id] = { rodeo_id: id, campo_id: v.campo_id };
  });

  // Completar con info del catálogo (nombre, categoría) para los rodeos que aparecen
  const catalogRodeos = rodeosTodos();
  Object.values(rodeosSet).forEach(function(rs) {
    const cat = catalogRodeos.find(function(r){ return String(r.rodeo_id) === String(rs.rodeo_id); });
    rs.nombre    = cat ? cat.nombre    : ('Rodeo ' + rs.rodeo_id);
    rs.categoria = cat ? cat.categoria : '—';
    // campo_id desde movimiento; si falta, fallback al catálogo
    if (!rs.campo_id && cat) rs.campo_id = cat.campo_id;
  });

  // Aplicar filtros de campo y categoría
  var rodeosFiltrados = Object.values(rodeosSet).filter(function(rs) {
    if (campoFiltro && String(rs.campo_id) !== String(campoFiltro)) return false;
    if (catFiltro && rs.categoria !== catFiltro) return false;
    return true;
  });

  // Calcular stock por rodeo
  var resultado = [];
  rodeosFiltrados.forEach(function(r) {
    var stock = 0;

    // Saldos iniciales con fecha ≤ corte
    movs.filter(function(m){
      return m.tipo === 'Saldo inicial' && String(m.rodeo_destino_id) === String(r.rodeo_id) && (m.fecha || '') <= fechaCorte;
    }).forEach(function(m){ stock += Number(m.cantidad) || 0; });

    // Traslados y otros movimientos ≤ corte
    movs.filter(function(m){ return m.tipo !== 'Saldo inicial' && (m.fecha || '') <= fechaCorte; }).forEach(function(m) {
      if (String(m.rodeo_destino_id) === String(r.rodeo_id)) stock += Number(m.cantidad) || 0;
      if (String(m.rodeo_origen_id)  === String(r.rodeo_id)) stock -= Number(m.cantidad) || 0;
    });
    ventas.filter(function(v){ return (v.fecha_salida || '') <= fechaCorte && String(v.rodeo_id) === String(r.rodeo_id); })
      .forEach(function(v){ stock -= Number(v.cant_animales) || 0; });
    // NOTA: los nacimientos NO se suman acá desde la hoja Pariciones (nacidos_vivos)
    // sobre el rodeo de la VACA — esas cabezas ya están acreditadas, aparte, en el
    // rodeo de terneros vía su propio Saldo inicial (con el tag [pid:...], ver
    // esAltaPorParicion_ más arriba). Sumarlas también acá duplicaba los nacimientos
    // del período (mismo bug ya corregido en calcStockHacienda_ — ver su comentario).
    mortandad.filter(function(m){ return (m.fecha || '') <= fechaCorte && String(m.rodeo_id) === String(r.rodeo_id); })
      .forEach(function(m){ stock -= Number(m.cantidad) || 0; });
    destetes.filter(function(d){ return (d.fecha || '') <= fechaCorte && String(d.rodeo_id) === String(r.rodeo_id); })
      .forEach(function(d){ stock -= Number(d.cantidad) || 0; });

    resultado.push({
      rodeo_id: r.rodeo_id,
      nombre: r.nombre,
      campo_id: r.campo_id,
      campo: campoNombre(r.campo_id),
      campoSaldoInicial: null, // ya no es necesario, campo viene de movimientos
      categoria: r.categoria || '—',
      stock: Math.max(0, stock),
    });
  });
  return resultado;
}

function buildStockAFechaTable_(data, fechaCorte) {
  if (!data.length) return '<div class="empty-state"><div class="msg">Sin rodeos para ese filtro.</div></div>';

  const conStock = data.filter(function(r){ return r.stock > 0; });
  const total    = data.reduce(function(s, r){ return s + r.stock; }, 0);

  // Agrupar por categoría para los pills de resumen
  const porCategoria = {};
  data.forEach(function(r){ porCategoria[r.categoria] = (porCategoria[r.categoria] || 0) + r.stock; });
  const porCampo = {};
  data.forEach(function(r){ porCampo[r.campo] = (porCampo[r.campo] || 0) + r.stock; });

  var h = `<div style="background:var(--gold-bg);border:1px solid var(--border2);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px;color:var(--gold-text);font-weight:600">
    📅 Stock calculado al ${fd(fechaCorte)} — basado en movimientos históricos
  </div>`;

  // Pills de resumen
  h += `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">
    <div style="background:var(--green-bg);color:var(--green-text);border-radius:9px;padding:8px 16px;font-size:14.5px;font-weight:700">⛭ Total: ${fn(total)}</div>
    ${Object.entries(porCategoria).filter(function([,v]){ return v>0; }).map(function([cat,tot]){
      return `<div style="background:var(--bg2);color:var(--text2);border-radius:9px;padding:8px 15px;font-size:14.5px;font-weight:600">${cat}: <strong style="color:var(--text)">${fn(tot)}</strong></div>`;
    }).join('')}
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px">
    ${Object.entries(porCampo).filter(function([,v]){ return v>0; }).map(function([campo,tot]){
      return `<div style="background:var(--bg2);color:var(--text2);border-radius:9px;padding:8px 15px;font-size:14.5px;font-weight:600">📍 ${campo}: <strong style="color:var(--text)">${fn(tot)}</strong></div>`;
    }).join('')}
  </div>`;

  if (!conStock.length) return h + '<div class="empty-state"><div class="msg">Sin stock a esa fecha.</div></div>';

  // Tabla con TODOS los rodeos (con y sin stock) para poder auditar
  const ceroStock = data.filter(function(r){ return r.stock === 0; });

  h += `<div class="tw"><table class="dt"><thead><tr>
    <th>Rodeo</th><th>Campo</th><th>Categoría</th><th class="tc">Stock al ${fd(fechaCorte)}</th>
  </tr></thead><tbody>`;

  conStock.sort(function(a,b){
    if (a.categoria < b.categoria) return -1;
    if (a.categoria > b.categoria) return 1;
    return b.stock - a.stock;
  }).forEach(function(r){
    var campoCell = r.campo;
    var aviso = '';
    if (r.campoSaldoInicial) {
      aviso = ` <span title="Saldo inicial cargado en '${r.campoSaldoInicial}' pero el rodeo está en '${r.campo}' en el catálogo. Verificar si hubo traslado registrado." style="cursor:help;color:var(--clay-text);font-size:12px;font-weight:700">⚠ SI en ${r.campoSaldoInicial}</span>`;
    }
    h += `<tr>
      <td><strong>${r.nombre}</strong></td>
      <td style="color:var(--text2)">${campoCell}${aviso}</td>
      <td><span class="pill pill-gray">${r.categoria}</span></td>
      <td class="tc"><strong style="color:var(--green-text)">${fn(r.stock)}</strong></td>
    </tr>`;
  });

  // Rodeos con stock 0 en gris
  if (ceroStock.length) {
    h += `<tr><td colspan="4" style="padding:8px 12px;background:var(--bg2);font-size:12px;color:var(--text3);font-weight:600;border-top:1px solid var(--border)">
      Rodeos sin stock a esa fecha (${ceroStock.length})
    </td></tr>`;
    ceroStock.forEach(function(r){
      h += `<tr style="opacity:.55">
        <td>${r.nombre}</td>
        <td style="color:var(--text2)">${r.campo}</td>
        <td><span class="pill pill-gray">${r.categoria}</span></td>
        <td class="tc" style="color:var(--text3)">0</td>
      </tr>`;
    });
  }

  h += '</tbody></table></div>';
  return h;
}

function calcStockHacienda_(desde, hasta, campoFiltro, mensual) {
  const rodeos = rodeosTodos().filter(function(r){ return campoFiltro ? String(r.campo_id) === String(campoFiltro) : true; });
  const movs = (S.cache.movimientos || []);
  const ventas = (S.cache.ventas || []);
  const pariciones = (S.cache.pariciones || []);
  const mortandad = (S.cache.mortandad || []);
  const destetes = (S.cache.destetes || []);

  // Categorias en orden logico
  const CATS = ['Toro', 'Vaca', 'Vaquillona', 'Vaquillona proximo servicio', 'Vaquilloncita', 'Novillito', 'Ternero', 'Ternera', 'Novillo'];

  function getCat(r) {
    const c = String(r.categoria || '').trim();
    const cLower = c.toLowerCase();
    // Las categorías "de venta" (ej: "vaca venta", "vaquillona venta") son categorías propias,
    // no deben agruparse dentro de su categoría base por matching de substring.
    if (cLower.indexOf('venta') !== -1) return c || 'Otros';
    for (var i=0; i<CATS.length; i++) {
      if (cLower.indexOf(CATS[i].toLowerCase()) !== -1) return CATS[i];
    }
    return c || 'Otros';
  }

  function getMonths(d1, d2) {
    var meses = [];
    // d1 y d2 pueden ser 'YYYY-MM-DD' o 'YYYY-MM' — tomar solo YYYY-MM
    var cur = new Date(d1.slice(0,7) + '-01T12:00:00');
    var end = new Date(d2.slice(0,7) + '-01T12:00:00');
    while (cur <= end) {
      meses.push(cur.getFullYear() + '-' + String(cur.getMonth()+1).padStart(2,'0'));
      cur.setMonth(cur.getMonth()+1);
    }
    return meses;
  }

  // Calcular stock inicial de cada rodeo (movs con fecha < desde)
  function stockInicial(rodeoId) {
    // El Saldo inicial es el punto de partida del sistema — no tiene fecha historica real.
    // Existencia inicial = suma de todos los Saldos iniciales "reales" del rodeo
    //   + altas por Parición (nacimientos) ANTERIORES a "desde" — ya son parte
    //     del stock con el que arranca el período, así que van al mismo bucket
    //   + movimientos de entrada ANTES de "desde" (excepto Saldo inicial)
    //   - movimientos de salida ANTES de "desde"
    //   - ventas/muertes/destetes antes de "desde"
    // Nota: antes acá también se sumaban los nacidos_vivos de la hoja Pariciones
    // directamente sobre el rodeo de la VACA (donde se registra la parición) —
    // eso duplicaba los terneros nacidos, porque el alta real de esas cabezas
    // ya se acredita, aparte, en el rodeo de terneros vía su propio Saldo inicial
    // (con el tag [pid:...]). Se saca esa suma de acá y se maneja más abajo,
    // atribuida al rodeo que realmente corresponde.
    var saldoBase = 0;
    movs.filter(function(m){ return m.tipo === 'Saldo inicial' && String(m.rodeo_destino_id) === String(rodeoId) && !esAltaPorParicion_(m); })
      .forEach(function(m){ saldoBase += Number(m.cantidad) || 0; });
    movs.filter(function(m){ return m.tipo === 'Saldo inicial' && String(m.rodeo_destino_id) === String(rodeoId) && esAltaPorParicion_(m) && m.fecha < desde; })
      .forEach(function(m){ saldoBase += Number(m.cantidad) || 0; });

    var ajuste = 0;
    movs.filter(function(m){ return m.fecha < desde && m.tipo !== 'Saldo inicial'; }).forEach(function(m) {
      if (String(m.rodeo_destino_id) === String(rodeoId)) ajuste += Number(m.cantidad) || 0;
      if (String(m.rodeo_origen_id) === String(rodeoId)) ajuste -= Number(m.cantidad) || 0;
    });
    ventas.filter(function(v){ return v.fecha_salida < desde && String(v.rodeo_id) === String(rodeoId); })
      .forEach(function(v){ ajuste -= Number(v.cant_animales) || 0; });
    mortandad.filter(function(m){ return m.fecha < desde && String(m.rodeo_id) === String(rodeoId); })
      .forEach(function(m){ ajuste -= Number(m.cantidad) || 0; });
    destetes.filter(function(d){ return d.fecha < desde && String(d.rodeo_id) === String(rodeoId); })
      .forEach(function(d){ ajuste -= Number(d.cantidad) || 0; });
    return Math.max(0, saldoBase + ajuste);
  }

  function movsPeriodo(rodeoId, fDesde, fHasta) {
    var compras=0, ventas_=0, nacimientos=0, muertes=0, destetar=0, traslados_e=0, traslados_s=0, ajustes=0;
    movs.filter(function(m){ return m.fecha >= fDesde && m.fecha <= fHasta; }).forEach(function(m) {
      const cant = Number(m.cantidad) || 0;
      if (m.tipo === 'Saldo inicial') {
        // Altas por Parición ocurridas DENTRO del período: se acreditan como
        // "Nacimientos" del rodeo que las recibió (el rodeo de terneros), no
        // como Saldo inicial. Las anteriores a "desde" ya se sumaron en stockInicial().
        if (esAltaPorParicion_(m) && String(m.rodeo_destino_id) === String(rodeoId)) nacimientos += cant;
        return;
      }
      if (String(m.rodeo_destino_id) === String(rodeoId)) {
        if (m.tipo === 'Traslado en bloque' || m.tipo === 'Traslado individual') traslados_e += cant;
        else compras += cant;
      }
      if (String(m.rodeo_origen_id) === String(rodeoId)) {
        if (m.tipo === 'Traslado en bloque' || m.tipo === 'Traslado individual') traslados_s += cant;
        else ajustes += cant;
      }
    });
    ventas.filter(function(v){ return v.fecha_salida >= fDesde && v.fecha_salida <= fHasta && String(v.rodeo_id) === String(rodeoId); })
      .forEach(function(v){ ventas_ += Number(v.cant_animales) || 0; });
    mortandad.filter(function(m){ return m.fecha >= fDesde && m.fecha <= fHasta && String(m.rodeo_id) === String(rodeoId); })
      .forEach(function(m){ muertes += Number(m.cantidad) || 0; });
    destetes.filter(function(d){ return d.fecha >= fDesde && d.fecha <= fHasta && String(d.rodeo_id) === String(rodeoId); })
      .forEach(function(d){ destetar += Number(d.cantidad) || 0; });
    return { compras, ventas: ventas_, nacimientos, muertes, destetes: destetar, traslados_e, traslados_s, ajustes };
  }

  // Agrupar por categoria
  var result = {};
  var cats = [...new Set(rodeos.map(getCat))].sort(function(a,b){
    return CATS.indexOf(a) - CATS.indexOf(b);
  });

  var meses = mensual ? getMonths(desde, hasta) : [null];

  cats.forEach(function(cat) {
    var rodeoscat = rodeos.filter(function(r){ return getCat(r) === cat; });
    var fila = { categoria: cat, si: 0, compras:0, ventas:0, nacimientos:0, muertes:0, destetes:0, traslados_e:0, traslados_s:0, ajustes:0, sf:0 };
    if (mensual) { fila.meses = {}; meses.forEach(function(m){ fila.meses[m] = {compras:0,ventas:0,nacimientos:0,muertes:0,destetes:0,traslados_e:0,traslados_s:0}; }); }

    rodeoscat.forEach(function(r) {
      fila.si += stockInicial(r.rodeo_id);
      var mp = movsPeriodo(r.rodeo_id, desde, hasta);
      fila.compras += mp.compras; fila.ventas += mp.ventas; fila.nacimientos += mp.nacimientos;
      fila.muertes += mp.muertes; fila.destetes += mp.destetes;
      fila.traslados_e += mp.traslados_e; fila.traslados_s += mp.traslados_s; fila.ajustes += mp.ajustes;

      if (mensual) {
        meses.forEach(function(mes) {
          var fd = mes + '-01', fh = mes + '-' + new Date(mes.slice(0,4), mes.slice(5,7), 0).getDate().toString().padStart(2,'0');
          var mp2 = movsPeriodo(r.rodeo_id, fd, fh);
          fila.meses[mes].compras += mp2.compras; fila.meses[mes].ventas += mp2.ventas;
          fila.meses[mes].nacimientos += mp2.nacimientos; fila.meses[mes].muertes += mp2.muertes;
          fila.meses[mes].destetes += mp2.destetes; fila.meses[mes].traslados_e += mp2.traslados_e;
          fila.meses[mes].traslados_s += mp2.traslados_s;
        });
      }
    });
    // Nota: los nacimientos NO se suman al stock final del rodeo donde se registró
    // la parición (rodeo de la vaca) — los terneros nacidos ya se acreditan aparte,
    // vía el "Saldo inicial" que registrarParicionConTerneros() crea en el rodeo de
    // terneros. Sumarlos acá también duplicaba esas cabezas en el stock total.
    fila.sf = fila.si + fila.compras + fila.nacimientos + fila.traslados_e - fila.ventas - fila.muertes - fila.destetes - fila.traslados_s + fila.ajustes;
    result[cat] = fila;
  });
  return { filas: result, meses };
}

function buildStockHaciendaTable_(data, desde, hasta, campoLabel, mensual) {
  const { filas, meses } = data;
  const cats = Object.keys(filas);
  if (!cats.length) return '<div class="empty-state"><span class="ico">◌</span><div class="msg">Sin datos para el periodo seleccionado.</div></div>';

  var thead = '<tr><th>Categoria</th><th class="tc">Exist. Inicial</th>';
  if (mensual) {
    meses.forEach(function(m){ thead += '<th class="tc" style="background:var(--green-bg)">Cierre ' + m + '</th>'; });
  } else {
    thead += '<th class="tc">Compras</th><th class="tc">Nacimientos</th><th class="tc">Trasl. entrada</th><th class="tc">Ventas</th><th class="tc">Muertes</th><th class="tc">Destetes</th><th class="tc">Trasl. salida</th><th class="tc">Ajustes</th>';
  }
  thead += '<th class="tc" style="background:var(--green-bg)">Exist. Final</th></tr>';

  var tbody = '';
  var totSI=0, totComp=0, totNac=0, totTE=0, totVta=0, totMu=0, totDe=0, totTS=0, totAj=0, totSF=0;
  cats.forEach(function(cat) {
    var f = filas[cat];
    tbody += '<tr><td><strong>' + cat + '</strong></td><td class="tc">' + fn(f.si,0) + '</td>';
    if (mensual) {
      // Calcular cierre de cada mes acumulando desde el inicio
      var stockAcum = f.si;
      meses.forEach(function(m){
        var mm = f.meses[m];
        stockAcum += mm.compras + mm.nacimientos + mm.traslados_e - mm.ventas - mm.muertes - mm.destetes - mm.traslados_s;
        tbody += '<td class="tc" style="font-weight:600;color:var(--green-text)">' + fn(stockAcum,0) + '</td>';
      });
    } else {
      tbody += '<td class="tc">' + (f.compras||'-') + '</td><td class="tc">' + (f.nacimientos||'-') + '</td><td class="tc">' + (f.traslados_e||'-') + '</td>';
      tbody += '<td class="tc" style="color:var(--clay-text)">' + (f.ventas||'-') + '</td><td class="tc" style="color:var(--clay-text)">' + (f.muertes||'-') + '</td><td class="tc" style="color:var(--clay-text)">' + (f.destetes||'-') + '</td><td class="tc" style="color:var(--clay-text)">' + (f.traslados_s||'-') + '</td><td class="tc">' + (f.ajustes||'-') + '</td>';
    }
    tbody += '<td class="tc" style="font-weight:700;color:var(--green-text)">' + fn(f.sf,0) + '</td></tr>';
    totSI+=f.si; totComp+=f.compras; totNac+=f.nacimientos; totTE+=f.traslados_e;
    totVta+=f.ventas; totMu+=f.muertes; totDe+=f.destetes; totTS+=f.traslados_s; totAj+=f.ajustes; totSF+=f.sf;
  });

  // Total row
  tbody += '<tr style="background:var(--bg2);font-weight:700"><td>TOTAL</td><td class="tc">' + fn(totSI,0) + '</td>';
  if (!mensual) {
    tbody += '<td class="tc">' + (totComp||'-') + '</td><td class="tc">' + (totNac||'-') + '</td><td class="tc">' + (totTE||'-') + '</td>';
    tbody += '<td class="tc">' + (totVta||'-') + '</td><td class="tc">' + (totMu||'-') + '</td><td class="tc">' + (totDe||'-') + '</td><td class="tc">' + (totTS||'-') + '</td><td class="tc">' + (totAj||'-') + '</td>';
  } else {
    // Total cierre por mes = suma de cierres de todas las categorias
    meses.forEach(function(mes) {
      var totalCierre = 0;
      cats.forEach(function(cat) {
        var f = filas[cat];
        var stockAcum = f.si;
        meses.slice(0, meses.indexOf(mes)+1).forEach(function(m) {
          var mm = f.meses[m];
          stockAcum += mm.compras + mm.nacimientos + mm.traslados_e - mm.ventas - mm.muertes - mm.destetes - mm.traslados_s;
        });
        totalCierre += stockAcum;
      });
      tbody += '<td class="tc" style="font-weight:700;color:var(--green-text)">' + fn(totalCierre,0) + '</td>';
    });
  }
  tbody += '<td class="tc" style="font-weight:700;color:var(--green-text)">' + fn(totSF,0) + '</td></tr>';

  var titulo = 'Stock de Hacienda — ' + (campoLabel || 'Todos los campos') + ' — ' + desde + ' al ' + hasta;
  return '<div class="section-label" style="margin-top:16px">' + titulo + '</div><div class="tw"><table class="dt"><thead>' + thead + '</thead><tbody>' + tbody + '</tbody></table></div>';
}

function exportStockHaciendaXLSX_(data, desde, hasta, campoLabel, mensual) {
  const { filas, meses } = data;
  const cats = Object.keys(filas);
  const XLSX = window.XLSX;
  if (!XLSX) { toast('SheetJS no disponible', 'err'); return; }

  var wb = XLSX.utils.book_new();
  var campos_ = (S.catalogs && S.catalogs.campos) || [];

  function makeSheet(data2, titulo) {
    var rows = [];
    // Titulo
    rows.push([titulo]);
    rows.push([]);
    // Header
    var hdr = ['Categoria', 'Exist. Inicial'];
    if (mensual) {
      meses.forEach(function(m){ hdr.push('Cierre ' + m); });
    } else {
      hdr = hdr.concat(['Compras','Nacimientos','Trasl. entrada','Ventas','Muertes','Destetes','Trasl. salida','Ajustes']);
    }
    hdr.push('Exist. Final');
    rows.push(hdr);

    var totSI=0,totSF=0;
    Object.keys(data2).forEach(function(cat) {
      var f = data2[cat];
      var row = [cat, f.si];
      if (mensual) {
        var stockAcumXlsx = f.si;
        meses.forEach(function(m){
          var mm = f.meses[m];
          stockAcumXlsx += mm.compras + mm.nacimientos + mm.traslados_e - mm.ventas - mm.muertes - mm.destetes - mm.traslados_s;
          row.push(stockAcumXlsx);
        });
      } else {
        row = row.concat([f.compras,f.nacimientos,f.traslados_e,f.ventas,f.muertes,f.destetes,f.traslados_s,f.ajustes]);
      }
      row.push(f.sf);
      rows.push(row);
      totSI+=f.si; totSF+=f.sf;
    });
    // Total
    var totRow = ['TOTAL', totSI];
    if (mensual) {
      meses.forEach(function(mes) {
        var totalCierreXlsx = 0;
        Object.keys(data2).forEach(function(cat) {
          var f2 = data2[cat];
          var sa = f2.si;
          meses.slice(0, meses.indexOf(mes)+1).forEach(function(m) {
            var mm = f2.meses && f2.meses[m];
            if (mm) sa += mm.compras + mm.nacimientos + mm.traslados_e - mm.ventas - mm.muertes - mm.destetes - mm.traslados_s;
          });
          totalCierreXlsx += sa;
        });
        totRow.push(totalCierreXlsx);
      });
    } else {
      var tComp=0,tNac=0,tTE=0,tVta=0,tMu=0,tDe=0,tTS=0,tAj=0;
      Object.keys(data2).forEach(function(cat){ var f=data2[cat]; tComp+=f.compras; tNac+=f.nacimientos; tTE+=f.traslados_e; tVta+=f.ventas; tMu+=f.muertes; tDe+=f.destetes; tTS+=f.traslados_s; tAj+=f.ajustes; });
      totRow=totRow.concat([tComp,tNac,tTE,tVta,tMu,tDe,tTS,tAj]);
    }
    totRow.push(totSF);
    rows.push(totRow);

    return XLSX.utils.aoa_to_sheet(rows);
  }

  // Hoja total
  var titulo = 'Stock Hacienda ' + (campoLabel || 'Todos') + ' ' + desde + ' al ' + hasta;
  var ws = makeSheet(filas, titulo);
  ws['!cols'] = [{wch:28},{wch:14},{wch:12},{wch:12},{wch:12},{wch:12},{wch:12},{wch:12},{wch:12},{wch:12},{wch:14}];
  XLSX.utils.book_append_sheet(wb, ws, 'Stock Hacienda');

  // Hoja por campo si es "todos"
  if (!campoLabel) {
    campos_.forEach(function(c) {
      var rodeosC = rodeosTodos().filter(function(r){ return String(r.campo_id) === String(c.campo_id); });
      if (!rodeosC.length) return;
      var dataC = calcStockHacienda_(desde, hasta, c.campo_id, mensual);
      if (!Object.keys(dataC.filas).length) return;
      var wsC = makeSheet(dataC.filas, 'Stock ' + c.nombre + ' ' + desde + ' al ' + hasta);
      XLSX.utils.book_append_sheet(wb, wsC, c.nombre.slice(0,28));
    });
  }

  XLSX.writeFile(wb, 'Stock_Hacienda_' + desde + '_' + hasta + '.xlsx');
  toast('Excel descargado', 'ok');
}

function attachStockHaciendaEvents() {
  // Cargar entidades necesarias si no están en cache
  const entidades = ['movimientos', 'ventas', 'pariciones', 'mortandad', 'destetes'];
  Promise.all(entidades.map(function(e) {
    return (S.cache[e] && S.cache[e].length) ? Promise.resolve() : loadEntity(e, true);
  })).then(function() {
    // Re-render para mostrar el reporte si ya habia parametros
    const el = document.getElementById('sh-resultado');
    if (el && el.innerHTML) render();
  }).catch(function(){});

  function getParams() {
    return {
      desde: document.getElementById('sh-desde')?.value || '',
      hasta: document.getElementById('sh-hasta')?.value || '',
      campoId: document.getElementById('sh-campo')?.value || '',
      catFiltro: document.getElementById('sh-cat')?.value || '',
      mensual: document.getElementById('sh-mensual')?.value === 'si',
    };
  }

  function calcConFiltro_(p) {
    let data = calcStockHacienda_(p.desde, p.hasta, p.campoId, p.mensual);
    if (p.catFiltro) {
      const norm_ = s => String(s || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
      const objetivo = norm_(p.catFiltro);
      data = { ...data, filas: Object.fromEntries(Object.entries(data.filas).filter(function([k]){ return norm_(k) === objetivo; })) };
    }
    return data;
  }

  const prevBtn = document.getElementById('sh-preview');
  if (prevBtn) prevBtn.onclick = function() {
    const p = getParams();
    if (!p.desde || !p.hasta) { toast('Ingresa las fechas', 'err'); return; }
    const campos_ = (S.catalogs && S.catalogs.campos) || [];
    const campo = campos_.find(function(c){ return String(c.campo_id) === String(p.campoId); });
    const data = calcConFiltro_(p);
    const el = document.getElementById('sh-resultado');
    if (el) el.innerHTML = buildStockHaciendaTable_(data, p.desde, p.hasta, campo?.nombre || '', p.mensual);
  };

}

// Limpia un SVG generado por la IA antes de inyectarlo a la página: elimina
// <script>, <foreignObject>, atributos de eventos (onload, onclick, onerror, ...)
// y URLs javascript:. Los gráficos (path, rect, circle, text, etc.) pasan intactos.
function sanitizarSvgIA_(s) {
  return String(s || '')
    .replace(/<script[\s\S]*?<\/script\s*>/gi, '')
    .replace(/<script[^>]*\/?>/gi, '')
    .replace(/<foreignObject[\s\S]*?<\/foreignObject\s*>/gi, '')
    .replace(/\son[a-z]+\s*=\s*"[^"]*"/gi, '')
    .replace(/\son[a-z]+\s*=\s*'[^']*'/gi, '')
    .replace(/\son[a-z]+\s*=\s*[^\s>]+/gi, '')
    .replace(/(href|xlink:href)\s*=\s*(['"])\s*javascript:[^'"]*\2/gi, '$1=$2#$2');
}

function iaContexto_() {
  // Armar resumen de datos para pasarle a Claude
  const rodeos = rodeosTodos();
  const campos = (S.catalogs && S.catalogs.campos) || [];
  const pesadas = (S.cache.pesadas || []).slice().sort((a,b) => String(a.fecha).localeCompare(String(b.fecha)));
  const consumos = (S.cache.consumos_insumos || []);
  const compras = (S.cache.compras_insumos || []);
  const ventas = (S.cache.ventas || []);
  const movimientos = (S.cache.movimientos || []);
  const productos = (S.catalogs && S.catalogs.productos) || [];
  const rodeosEng = rodeosEngordeValidos_();

  // Calcular KPIs por corral de engorde
  const corralesData = rodeosEng.map(function(r) {
    const rid = r.rodeo_id;
    const pes = egPesadas_(rid);
    const ultima = pes.length ? pes[pes.length-1] : null;
    const gd = egGanDiaria_(rid);
    const fi = egFechaIngreso_(rid);
    const dias = fi ? Math.round((new Date() - new Date(fi)) / 86400000) : null;
    return {
      nombre: r.nombre,
      campo: campoNombre(r.campo_id),
      stock: egStock_(rid),
      kgIngreso: egKgIngreso_(rid),
      ultimaPesada: ultima ? { fecha: ultima.fecha, peso: ultima.peso_prom_kg } : null,
      gdp: gd,
      diasEnCorral: dias,
      kgGanados: egKgGanadosHastaPesada_(rid),
      costoAlim: egCostoAlim_(rid),
      costoCompra: egCostoCompra_(rid),
      ingVentas: egIngVentas_(rid),
      ingCesionEnviada: egIngresoCesionEnviada_(rid, null).total,
    };
  });

  const ctx = {
    fecha_hoy: today(),
    campos: campos.map(function(c){ return { id: c.campo_id, nombre: c.nombre }; }),
    rodeos: rodeos.map(function(r){ return { id: r.rodeo_id, nombre: r.nombre, campo: campoNombre(r.campo_id), actividad: r.actividad }; }),
    corrales_engorde: corralesData,
    pesadas_recientes: pesadas.slice(-50).map(function(p){ return { fecha: p.fecha, rodeo: rodeoNombre(p.rodeo_id), campo: campoNombre(p.campo_id), cantidad: p.cantidad, peso_prom_kg: p.peso_prom_kg }; }),
    consumos_recientes: consumos.slice(-100).map(function(c){ const prod = productos.find(function(p){ return String(p.producto_id)===String(c.producto_id); }); return { fecha: c.fecha, producto: prod ? prod.nombre : c.producto_id, unidad: prod ? prod.unidad : '', cantidad: c.cantidad, rodeo: rodeoNombre(c.rodeo_id), campo: campoNombre(c.campo_id) }; }),
    ventas: ventas.map(function(v){ return { fecha: v.fecha_salida, rodeo: rodeoNombre(v.rodeo_id), cant_animales: v.cant_animales, kg_campo: v.peso_campo_kg, precio_kg: v.precio_pactado, importe: v.importe_liq || (v.precio_pactado * v.peso_campo_kg) }; }),
    stock_insumos: (S.stockProductos || []).map(function(p){ return { producto: p.nombre, unidad: p.unidad, stock: p.stock }; }),
  };
  return JSON.stringify(ctx, null, 1);
}

function attachIAEvents() {
  const sendBtn = document.getElementById('ia-send');
  const clearBtn = document.getElementById('ia-clear');
  const input = document.getElementById('ia-input');
  if (!S.iaMsgs) S.iaMsgs = [];

  // Enter to send
  if (input) input.onkeydown = function(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn && sendBtn.click(); }
  };

  if (clearBtn) clearBtn.onclick = function() {
    S.iaMsgs = [];
    render();
  };

  if (sendBtn) sendBtn.onclick = async function() {
    const txt = (input ? input.value.trim() : '');
    if (!txt) return;
    if (input) input.value = '';
    if (!S.iaMsgs) S.iaMsgs = [];

    // Add user message
    S.iaMsgs.push({ role: 'user', content: txt });
    render();

    // Scroll to bottom
    setTimeout(function() {
      const chat = document.getElementById('ia-chat');
      if (chat) chat.scrollTop = chat.scrollHeight;
    }, 100);

    // Show thinking indicator
    const thinkId = 'thinking-' + Date.now();
    S.iaMsgs.push({ role: 'assistant', id: thinkId, content: '', html: '<span style="color:var(--text3);font-size:12px">Analizando datos...</span>' });
    render();

    try {
      const contexto = iaContexto_();
      const historial = S.iaMsgs
        .filter(function(m){ return m.id !== thinkId; })
        .slice(-10)
        .map(function(m){ return { role: m.role, content: m.content || '' }; });

      // La consulta a la IA ahora viaja por el backend (acción 'ia' del Apps Script,
      // función consultarIA), que guarda la clave de Anthropic en las Propiedades del
      // script — el navegador nunca ve la clave. La llamada directa anterior a
      // api.anthropic.com no funcionaba en producción: iba sin clave (daba error 401)
      // y el navegador además la bloqueaba por CORS. El backend arma el mismo prompt
      // de sistema que se armaba acá, así que la respuesta es equivalente.
      const data = await apiCall('ia', { body: { mensajes: historial, contexto: contexto } });
      const respText = (data && data.texto) || 'Sin respuesta.';

      // Replace thinking with real response
      const idx = S.iaMsgs.findIndex(function(m){ return m.id === thinkId; });
      if (idx !== -1) {
        // Render SVG inline if present
        let html;
        if (respText.includes('<svg')) {
          // Respuesta con SVG — se renderiza, pero SANITIZADA primero: como es HTML
          // generado por un modelo e inyectado directo a la página, se le quitan
          // etiquetas <script>, atributos de eventos (onload, onclick, etc.),
          // enlaces javascript: y <foreignObject>, que podrían ejecutar código.
          html = sanitizarSvgIA_(respText);
        } else {
          // Texto plano — escapar HTML y convertir saltos de linea
          html = respText
            .replace(/&/g,'&amp;')
            .replace(/</g,'&lt;')
            .replace(/>/g,'&gt;')
            .split('\n').join('<br>');
        }
        S.iaMsgs[idx] = { role: 'assistant', id: thinkId, content: respText, html: html };
      }
      render();
      setTimeout(function() {
        const chat = document.getElementById('ia-chat');
        if (chat) chat.scrollTop = chat.scrollHeight;
      }, 100);

    } catch(err) {
      const idx = S.iaMsgs.findIndex(function(m){ return m.id === thinkId; });
      if (idx !== -1) S.iaMsgs[idx] = { role: 'assistant', id: thinkId, content: 'Error: ' + err.message, html: '<span style="color:var(--clay-text)">Error: ' + err.message + '</span>' };
      render();
    }
  };
}

// Calcula, para una lista de pesadas a mostrar (puede venir filtrada por campo/
// rodeo), la GPD contra la pesada ANTERIOR de ese mismo rodeo — usando siempre
// el historial COMPLETO de cada rodeo (egGpdIntervalos_), nunca la lista
// filtrada, para que el intervalo sea correcto aunque la pesada anterior no
// esté visible en la tabla filtrada actual.
function buildPesadasHistorial_(pes) {
  if (!pes.length) return '<div class="empty-state"><span class="ico">◌</span><div class="msg">No hay pesadas registradas.</div></div>';
  const rodeoIds = [...new Set(pes.map(p => String(p.rodeo_id)))];
  const gpdPorPesadaId = {};
  rodeoIds.forEach(rid => {
    egGpdIntervalos_(rid).forEach(it => { gpdPorPesadaId[String(it.pesada_id)] = it; });
  });
  return buildEntityTable(pes, [
    { key: 'fecha', label: 'Fecha', render: v => fd(v) },
    { key: 'rodeo_id', label: 'Rodeo', render: v => rodeoNombre(v) },
    { key: 'campo_id', label: 'Campo', render: v => v ? campoNombre(v) : '—' },
    { key: 'cantidad', label: 'Cant.', render: v => fn(v) },
    { key: 'peso_prom_kg', label: 'Peso prom. (kg)', render: v => fn(v) },
    { key: 'pesada_id', label: 'GPD vs. pesada ant.', render: id => {
        const it = gpdPorPesadaId[String(id)];
        if (!it || it.gpd == null) return '<span style="color:var(--text3)">—</span>';
        const txt = fn(it.gpd, 3) + ' kg/día';
        if (it.bajo) return `<span style="color:var(--red-text);font-weight:700" title="Bajó respecto al intervalo anterior (${fn(it.gpdAnterior,3)} kg/día)">⚠ ${txt}</span>`;
        return `<span style="color:var(--green-text)">${txt}</span>`;
      } },
    { key: 'observacion', label: 'Obs.', render: v => v || '—' },
  ], 'pesadas', 'pesada_id');
}

// ══════════════════════════════════════════════════════════════════════
// MÓDULO SUELDOS — por campo y actividad
// ══════════════════════════════════════════════════════════════════════

// Estructura de datos:
// Sueldos — leen de S.cache.sueldos (Sheets) y escriben via apiCall

function sueldosGetAll_() {
  return S.cache.sueldos || [];
}

// Distribución base por campo — viene del catálogo (Sheets)
function distBaseCampoGet_(campo_id) {
  const dist = (S.catalogs && S.catalogs.sueldos_dist || [])
    .find(d => String(d.campo_id) === String(campo_id));
  if (!dist) return { cria: 0, recria: 0, engorde: 0, estructura: 0 };
  return {
    cria:       Number(dist.cria)       || 0,
    recria:     Number(dist.recria)     || 0,
    engorde:    Number(dist.engorde)    || 0,
    estructura: Number(dist.estructura) || 0,
  };
}

// Distribución efectiva de un registro de sueldo
// Los campos dist_cria etc vienen de Sheets como campos planos
function distEfectiva_(s) {
  if (s.dist_cria !== undefined && s.dist_cria !== null && s.dist_cria !== '') {
    return {
      cria:       Number(s.dist_cria)       || 0,
      recria:     Number(s.dist_recria)     || 0,
      engorde:    Number(s.dist_engorde)    || 0,
      estructura: Number(s.dist_estructura) || 0,
    };
  }
  return distBaseCampoGet_(s.campo_id);
}

// Importe imputado a una actividad para un registro
function sueldoImporteActividad_(s, actividad) {
  const monto = Number(s.monto) || 0;
  const d = distEfectiva_(s);
  return monto * (d[actividad] || 0) / 100;
}

// Total imputado a una actividad (todos los campos, todos los períodos)
function sueldoTotalActividad_(actividad, filtro) {
  return sueldosGetAll_()
    .filter(s => !filtro || filtro(s))
    .reduce((sum, s) => sum + sueldoImporteActividad_(s, actividad), 0);
}

  const sueldos  = sueldosGetAll_().sort((a,b) => b.periodo.localeCompare(a.periodo) || String(a.campo_id).localeCompare(String(b.campo_id)));

  const mesActual = today().slice(0,7);

  const totalAnio = sueldos.filter(s => String(s.periodo).slice(0,4) === anio).reduce((sum,s) => sum+(Number(s.monto)||0), 0);
  const totCria   = sueldoTotalActividad_('cria');
  const totRecria = sueldoTotalActividad_('recria');
  const totEng    = sueldoTotalActividad_('engorde');
  const totEstr   = sueldoTotalActividad_('estructura');

  let h = `<div class="page-header">
    <div class="page-title">👤 Sueldos y Cargas</div>

  </div>`;

  // KPIs

  // PLACEHOLDER to find end of old kpi grid

  if (!campos.length) {
    h += '<div class="empty-state"><span class="ico">🏡</span><div class="msg">No hay campos cargados en el sistema.</div></div>';

    h += '<div style="display:flex;flex-direction:column;gap:12px">';
    campos.forEach(campo => {

            <label style="color:var(--blue-text)">🏗️ Estructura %</label>
            <input type="number" id="sd-estructura-${campo.campo_id}" value="${d.estructura||0}" min="0" max="100" step="1"
              oninput="window.sdPreview_('${campo.campo_id}')">
          </div>
          <div class="fg" style="min-width:80px;display:flex;flex-direction:column;justify-content:flex-end">
            <label>Total</label>
            <div id="sd-suma-${campo.campo_id}" style="font-size:16px;font-weight:700;padding:8px 0;color:${suma===100?'var(--green)':'var(--red)'}">
              ${suma}%
            </div>
          </div>
          <div class="fg" style="min-width:100px;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:2px">
            <button class="btn btn-primary btn-sm" onclick="window.sdDistGuardar_('${campo.campo_id}')">💾 Guardar</button>
            <span id="sd-msg-dist-${campo.campo_id}" style="font-size:11px;color:var(--green);margin-top:4px"></span>
          </div>
        </div>
      </div>`;
    });
    h += '</div>';
  }
  h += '</div></div>';
  // ── Panel: Historial de imputación ────────────────────────────
  h += `<div class="panel">
    <div class="panel-title">📊 Historial de imputación por campo</div>`;

  if (!sueldos.length) {
    h += '<div class="empty-state"><span class="ico">💰</span><div class="msg">Cargá el primer sueldo mensual para ver la imputación.</div></div>';
  } else {
    // Agrupar por período
    const periodos = [...new Set(sueldos.map(s=>String(s.periodo).slice(0,7)))].sort((a,b)=>b.localeCompare(a));
    periodos.forEach(periodo => {
      const regs = sueldos.filter(s=>String(s.periodo).slice(0,7)===periodo);
      const totPer = regs.reduce((sum,s)=>sum+(Number(s.monto)||0),0);
      const totCriaPer    = regs.reduce((sum,s)=>sum+sueldoImporteActividad_(s,'cria'),0);
      const totRecriaPer  = regs.reduce((sum,s)=>sum+sueldoImporteActividad_(s,'recria'),0);
      const totEngPer     = regs.reduce((sum,s)=>sum+sueldoImporteActividad_(s,'engorde'),0);
      const totEstrPer    = regs.reduce((sum,s)=>sum+sueldoImporteActividad_(s,'estructura'),0);

      h += `<div style="margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;padding:8px 4px 4px;border-top:1px solid var(--border)">
        <span style="font-weight:700;font-size:14px">${periodo}</span>
        <span style="font-size:13px;color:var(--text2)">Total: <strong>$ ${fn(totPer)}</strong> &nbsp;·&nbsp;
          <span style="color:var(--green-text)">Cría $ ${fn(totCriaPer)}</span> &nbsp;·&nbsp;
          <span style="color:var(--gold-text)">Rec. $ ${fn(totRecriaPer)}</span> &nbsp;·&nbsp;
          <span style="color:var(--clay-text)">Eng. $ ${fn(totEngPer)}</span> &nbsp;·&nbsp;
          <span style="color:var(--blue-text)">Estr. $ ${fn(totEstrPer)}</span>
        </span>
      </div>`;

      h += `<div class="tw" style="margin-bottom:12px"><table class="dt"><thead><tr>
        <th>Campo</th><th class="tr">Monto</th>
        <th class="tr" style="color:var(--green-text)">🐄 Cría</th>
        <th class="tr" style="color:var(--gold-text)">🐃 Recría</th>
        <th class="tr" style="color:var(--clay-text)">🥩 Engorde</th>
        <th class="tr" style="color:var(--blue-text)">🏗️ Estructura</th>
        <th style="font-size:10px;color:var(--text3)">% usados</th><th></th>
      </tr></thead><tbody>`;

      regs.forEach((s,i) => {
        const idx = sueldos.indexOf(s);
        const d = distEfectiva_(s);
        const campo = campos.find(c=>String(c.campo_id)===String(s.campo_id));
        const monto = Number(s.monto)||0;
        const distBase = distBaseCampoGet_(s.campo_id);
        const hasOverride = s.dist_cria !== undefined && s.dist_cria !== null && s.dist_cria !== '' &&
          (Number(s.dist_cria) !== distBase.cria || Number(s.dist_recria) !== distBase.recria ||
           Number(s.dist_engorde) !== distBase.engorde || Number(s.dist_estructura) !== distBase.estructura);
        h += `<tr>
          <td>
            <strong>${campo ? campo.nombre : s.campo_id}</strong>

            ${s.observacion ? `<div style="font-size:11px;color:var(--text3)">${s.observacion}</div>` : ''}

          <td class="tr"><strong>$ ${fn(monto)}</strong></td>

          <td class="tr" style="color:var(--clay-text)">$ ${fn(sueldoImporteActividad_(s,'engorde'))}</td>
          <td class="tr" style="color:var(--blue-text)">$ ${fn(sueldoImporteActividad_(s,'estructura'))}</td>

          </td>
        </tr>`;
      });
      h += '</tbody></table></div>';
    });

  }
  h += '</div>';
  return h;
}

function attachSueldosEvents() {

  // Preview suma distribución base por campo
  window.sdPreview_ = function(campo_id) {
    const c = parseInt(document.getElementById('sd-cria-'+campo_id)?.value||0);
    const r = parseInt(document.getElementById('sd-recria-'+campo_id)?.value||0);
    const e = parseInt(document.getElementById('sd-engorde-'+campo_id)?.value||0);
    const s = parseInt(document.getElementById('sd-estructura-'+campo_id)?.value||0);
    const suma = c+r+e+s;
    const el = document.getElementById('sd-suma-'+campo_id);
    if (el) { el.textContent = suma+'%'; el.style.color = suma===100?'var(--green)':'var(--red)'; }
  };

  // Guardar distribución base de un campo
  window.sdDistGuardar_ = async function(campo_id) {
    const c = parseInt(document.getElementById('sd-cria-'+campo_id)?.value||0);
    const r = parseInt(document.getElementById('sd-recria-'+campo_id)?.value||0);
    const e = parseInt(document.getElementById('sd-engorde-'+campo_id)?.value||0);
    const s = parseInt(document.getElementById('sd-estructura-'+campo_id)?.value||0);
    const suma = c+r+e+s;
    const msg = document.getElementById('sd-msg-dist-'+campo_id);
    if (suma !== 100) { if(msg) msg.textContent='⚠ Suman '+suma+'%'; return; }
    try {
      // Buscar si ya existe registro para este campo
      const existing = (S.catalogs && S.catalogs.sueldos_dist || []).find(d => String(d.campo_id) === String(campo_id));
      if (existing) {
        await apiCall('update', { body: { entity: 'sueldos_dist', id: existing.dist_id, data: { ...existing, cria:c, recria:r, engorde:e, estructura:s } } });
      } else {
        await apiCall('create', { body: { entity: 'sueldos_dist', data: { campo_id, cria:c, recria:r, engorde:e, estructura:s } } });
      }
      await loadCatalogs();
      if(msg) { msg.textContent='✅ Guardado'; setTimeout(()=>{ if(msg) msg.textContent=''; },2500); }
      toast('Distribución guardada', 'ok');
      render();
    } catch(err) { toast('Error: '+err.message, 'err'); }
  };

  // Al cambiar campo en el form, cargar su distribución base en el preview
  window.sdLoadDist_ = function() {
    const campo_id = document.getElementById('sd-campo')?.value;
    if (!campo_id) return;
    const d = distBaseCampoGet_(campo_id);
    const preview = document.getElementById('sd-dist-preview');
    const periodo = document.getElementById('sd-periodo')?.value || '';
    // Si ya existe un registro para este período+campo, cargar sus valores
    const existing = sueldosGetAll_().find(s => s.periodo===periodo && String(s.campo_id)===String(campo_id));
    if (existing) {
      document.getElementById('sd-monto').value         = existing.monto || '';
      document.getElementById('sd-obs').value           = existing.observacion || '';
      document.getElementById('sd-ov-cria').value       = existing.dist_cria       !== '' && existing.dist_cria       != null ? existing.dist_cria       : d.cria;
      document.getElementById('sd-ov-recria').value     = existing.dist_recria     !== '' && existing.dist_recria     != null ? existing.dist_recria     : d.recria;
      document.getElementById('sd-ov-engorde').value    = existing.dist_engorde    !== '' && existing.dist_engorde    != null ? existing.dist_engorde    : d.engorde;
      document.getElementById('sd-ov-estructura').value = existing.dist_estructura !== '' && existing.dist_estructura != null ? existing.dist_estructura : d.estructura;
    } else {
      document.getElementById('sd-monto').value         = '';
      document.getElementById('sd-obs').value           = '';
      document.getElementById('sd-ov-cria').value       = d.cria||0;
      document.getElementById('sd-ov-recria').value     = d.recria||0;
      document.getElementById('sd-ov-engorde').value    = d.engorde||0;
      document.getElementById('sd-ov-estructura').value = d.estructura||0;
    }
    window.sdOvPreview_();
    if (preview) preview.style.display = 'block';
    window.sdCalcPreview_();
    window.sdMesInfo_ && window.sdMesInfo_();
  };

  // Preview de importes al escribir el monto
  window.sdCalcPreview_ = function() {
    const campo_id = document.getElementById('sd-campo')?.value;
    const monto = Number(document.getElementById('sd-monto')?.value)||0;
    if (!campo_id || !monto) return;
    const d = {
      cria:      parseInt(document.getElementById('sd-ov-cria')?.value||0),
      recria:    parseInt(document.getElementById('sd-ov-recria')?.value||0),
      engorde:   parseInt(document.getElementById('sd-ov-engorde')?.value||0),
      estructura:parseInt(document.getElementById('sd-ov-estructura')?.value||0),
    };
    const valsEl = document.getElementById('sd-dist-preview-vals');
    if (valsEl) valsEl.innerHTML =
      `<span style="color:var(--green-text)">🐄 Cría: <strong>$ ${fn(monto*d.cria/100)}</strong> (${d.cria}%)</span>` +
      `<span style="color:var(--gold-text)">🐃 Recría: <strong>$ ${fn(monto*d.recria/100)}</strong> (${d.recria}%)</span>` +
      `<span style="color:var(--clay-text)">🥩 Engorde: <strong>$ ${fn(monto*d.engorde/100)}</strong> (${d.engorde}%)</span>` +
      `<span style="color:var(--blue-text)">🏗️ Estructura: <strong>$ ${fn(monto*d.estructura/100)}</strong> (${d.estructura}%)</span>`;
  };

  // Preview suma del override
  window.sdOvPreview_ = function() {
    const c = parseInt(document.getElementById('sd-ov-cria')?.value||0);
    const r = parseInt(document.getElementById('sd-ov-recria')?.value||0);
    const e = parseInt(document.getElementById('sd-ov-engorde')?.value||0);
    const s = parseInt(document.getElementById('sd-ov-estructura')?.value||0);
    const suma = c+r+e+s;
    const el = document.getElementById('sd-ov-suma');
    if (el) { el.textContent = suma+'%'; el.style.color = suma===100?'var(--green)':'var(--red)'; }
    window.sdCalcPreview_();
  };

  // Inicializar preview al cargar la página
  setTimeout(() => {
    window.sdLoadDist_ && window.sdLoadDist_();
    window.sdMesInfo_  && window.sdMesInfo_();
  }, 50);

  // Guardar sueldo
  window.sueldoGuardar_ = async function() {
    const periodo    = document.getElementById('sd-periodo')?.value || '';
    const campo_id   = document.getElementById('sd-campo')?.value || '';
    const monto      = Number(document.getElementById('sd-monto')?.value) || 0;
    const obs        = document.getElementById('sd-obs')?.value.trim() || '';
    const msg        = document.getElementById('sd-msg');
    if (!periodo)  { if(msg) msg.textContent='⚠ Seleccioná el período.'; return; }
    if (!campo_id) { if(msg) msg.textContent='⚠ Seleccioná el campo.'; return; }
    if (!monto)    { if(msg) msg.textContent='⚠ Ingresá el monto.'; return; }
    const cria      = parseInt(document.getElementById('sd-ov-cria')?.value||0);
    const recria    = parseInt(document.getElementById('sd-ov-recria')?.value||0);
    const engorde   = parseInt(document.getElementById('sd-ov-engorde')?.value||0);
    const estructura= parseInt(document.getElementById('sd-ov-estructura')?.value||0);
    const suma = cria+recria+engorde+estructura;
    if (suma !== 100) {
      if (!confirm('⚠ Los porcentajes suman '+suma+'% (no 100%). ¿Guardás igual?')) return;
    }
    try {
      // Buscar si ya existe para este período+campo
      const existing = sueldosGetAll_().find(s => String(s.periodo).slice(0,7)===periodo && String(s.campo_id)===String(campo_id));
      const data = { periodo, campo_id, monto, observacion: obs, fecha_carga: today(),
        dist_cria: cria, dist_recria: recria, dist_engorde: engorde, dist_estructura: estructura };
      if (existing) {
        await apiCall('update', { body: { entity: 'sueldos', id: existing.sueldo_id, data: { ...existing, ...data } } });
      } else {
        await apiCall('create', { body: { entity: 'sueldos', data } });
      }
      invalidateCache('sueldos');
      await loadEntity('sueldos', true);
      if(msg) { msg.textContent='✅ Guardado'; setTimeout(()=>{ if(msg) msg.textContent=''; },2500); }
      toast('Sueldo guardado — '+periodo+' · $ '+fn(monto), 'ok');
      render(); // render re-crea el botón habilitado
    } catch(err) {
      toast('Error: '+err.message, 'err');
      const btnE = document.getElementById('sd-guardar-btn');
      if (btnE) { btnE.disabled = false; btnE.textContent = '💾 Guardar sueldo'; }
    }
  };

  window.sueldoEditar_ = function(periodo, campo_id) {
    // Normalizar período: Sheets devuelve YYYY-MM-DD, el input necesita YYYY-MM
    const periodoNorm = String(periodo).slice(0, 7);
    const el_periodo = document.getElementById('sd-periodo');
    const el_campo   = document.getElementById('sd-campo');
    if (el_periodo) el_periodo.value = periodoNorm;
    if (el_campo)   el_campo.value   = String(campo_id);
    // Esperar a que el DOM procese los valores antes de cargar la distribución
    setTimeout(() => {
      // Cargar directamente el registro sin depender del período del input
      const existing = sueldosGetAll_().find(s => String(s.periodo).slice(0,7) === periodoNorm && String(s.campo_id) === String(campo_id));
      if (existing) {
        const montoEl = document.getElementById('sd-monto');
        const obsEl   = document.getElementById('sd-obs');
        const criEl   = document.getElementById('sd-ov-cria');
        const recEl   = document.getElementById('sd-ov-recria');
        const engEl   = document.getElementById('sd-ov-engorde');
        const estrEl  = document.getElementById('sd-ov-estructura');
        const preview = document.getElementById('sd-dist-preview');
        if (montoEl) montoEl.value = existing.monto || '';
        if (obsEl)   obsEl.value   = existing.observacion || '';
        const d = distBaseCampoGet_(campo_id);
        if (criEl)  criEl.value  = existing.dist_cria       !== '' && existing.dist_cria       != null ? existing.dist_cria       : d.cria;
        if (recEl)  recEl.value  = existing.dist_recria     !== '' && existing.dist_recria     != null ? existing.dist_recria     : d.recria;
        if (engEl)  engEl.value  = existing.dist_engorde    !== '' && existing.dist_engorde    != null ? existing.dist_engorde    : d.engorde;
        if (estrEl) estrEl.value = existing.dist_estructura !== '' && existing.dist_estructura != null ? existing.dist_estructura : d.estructura;
        if (preview) preview.style.display = 'block';
        window.sdOvPreview_   && window.sdOvPreview_();
        window.sdCalcPreview_ && window.sdCalcPreview_();
        window.sdMesInfo_     && window.sdMesInfo_();
      }
      // Scroll al formulario y focus en monto
      const panel = document.getElementById('sueldo-form-panel');
      if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
      const montoEl = document.getElementById('sd-monto');
      if (montoEl) montoEl.focus();
    }, 50);
  };

  window.sueldoEliminar_ = async function(i) {
    if (!confirm('¿Eliminar este registro?')) return;
    const lista = sueldosGetAll_().sort((a,b)=>b.periodo.localeCompare(a.periodo)||String(a.campo_id).localeCompare(String(b.campo_id)));
    const reg = lista[i];
    if (!reg) return;
    try {
      await apiCall('delete', { body: { entity: 'sueldos', id: reg.sueldo_id } });
      invalidateCache('sueldos');
      await loadEntity('sueldos', true);
      toast('Registro eliminado','ok');
      render();
    } catch(err) { toast('Error: '+err.message, 'err'); }
  };
}

function attachCotizacionEvents() {

  // Guardar una cotización individual
  window.cotizGuardar_ = async function() {
    const fecha  = document.getElementById('tc-fecha')?.value || '';
    const valor  = Number(document.getElementById('tc-valor')?.value) || 0;
    const fuente = document.getElementById('tc-fuente')?.value || 'Manual';
    const btn    = document.getElementById('tc-guardar-btn');
    const resetBtn = () => { if(btn) { btn.disabled=false; btn.textContent='💾 Guardar'; } };
    if (!fecha) { resetBtn(); toast('Ingresá la fecha', 'err'); return; }
    if (!valor) { resetBtn(); toast('Ingresá el valor', 'err'); return; }
    try {
      const lista = S.catalogs && S.catalogs.tipo_cambio || [];
      const existing = lista.find(t => String(t.fecha).slice(0,10) === fecha);
      if (existing) {
        await apiCall('update', { body: { entity: 'tipo_cambio', id: existing.tc_id, data: { ...existing, fecha, valor, fuente } } });
      } else {
        await apiCall('create', { body: { entity: 'tipo_cambio', data: { fecha, valor, fuente } } });
      }
      await loadCatalogs();
      S.corralesTipoCambio = (S.catalogs.tipo_cambio||[]).map(t=>({fecha:t.fecha,valor:Number(t.valor)}));
      toast('Cotización guardada: ' + fd(fecha) + ' → $ ' + fn(valor), 'ok');
      resetBtn();
      render();
    } catch(err) { resetBtn(); toast('Error: ' + err.message, 'err'); }
  };

  // Importar múltiples cotizaciones pegadas desde Excel
  window.cotizBulkGuardar_ = async function() {
    const raw  = document.getElementById('tc-bulk')?.value || '';
    const btn  = document.getElementById('tc-bulk-btn');
    const msg  = document.getElementById('tc-msg');
    const resetBtn = () => { if(btn) { btn.disabled=false; btn.textContent='📥 Importar cotizaciones'; } };
    const lineas = raw.split('\n').map(l=>l.trim()).filter(Boolean);
    if (!lineas.length) { resetBtn(); toast('Pegá al menos una línea', 'err'); return; }
    const registros = [];
    const errores = [];
    lineas.forEach((l, i) => {
      const partes = l.split(/[	;,]/).map(p=>p.trim());
      const fecha = partes[0];
      const valor = Number(partes[1]?.replace(',','.'));
      if (!fecha || !valor || isNaN(valor)) { errores.push('Línea '+(i+1)+': formato inválido'); return; }
      // Validar formato fecha
      if (!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(fecha)) { errores.push('Línea '+(i+1)+': fecha debe ser YYYY-MM-DD'); return; }
      registros.push({ fecha, valor });
    });
    if (errores.length) { resetBtn(); toast(errores[0], 'err'); return; }
    try {
      const lista = S.catalogs && S.catalogs.tipo_cambio || [];
      let guardados = 0;
      for (const r of registros) {
        const existing = lista.find(t => String(t.fecha).slice(0,10) === r.fecha);
        if (existing) {
          await apiCall('update', { body: { entity: 'tipo_cambio', id: existing.tc_id, data: { ...existing, fecha: r.fecha, valor: r.valor, fuente: 'Manual' } } });
        } else {
          await apiCall('create', { body: { entity: 'tipo_cambio', data: { fecha: r.fecha, valor: r.valor, fuente: 'Manual' } } });
        }
        guardados++;
        if (msg) msg.textContent = '⏳ Guardando ' + guardados + '/' + registros.length + '…';
      }
      await loadCatalogs();
      S.corralesTipoCambio = (S.catalogs.tipo_cambio||[]).map(t=>({fecha:t.fecha,valor:Number(t.valor)}));
      toast(guardados + ' cotizaciones guardadas', 'ok');
      if (document.getElementById('tc-bulk')) document.getElementById('tc-bulk').value = '';
      resetBtn();
      render();
    } catch(err) { resetBtn(); toast('Error: ' + err.message, 'err'); }
  };

  // Editar cotización — carga valores en el formulario
  window.cotizEditar_ = function(tc_id) {
    const lista = S.catalogs && S.catalogs.tipo_cambio || [];
    const t = lista.find(x => String(x.tc_id) === String(tc_id));
    if (!t) return;
    const fechaEl  = document.getElementById('tc-fecha');
    const valorEl  = document.getElementById('tc-valor');
    const fuenteEl = document.getElementById('tc-fuente');
    const btn      = document.getElementById('tc-guardar-btn');
    if (fechaEl)  fechaEl.value  = String(t.fecha).slice(0,10);
    if (valorEl)  valorEl.value  = t.valor;
    if (fuenteEl) fuenteEl.value = t.fuente || 'BNA';
    if (btn)      btn.textContent = '✏️ Actualizar';
    const panel = document.getElementById('tc-guardar-btn')?.closest('.panel');
    if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    if (valorEl) valorEl.focus();
  };

  // Eliminar cotización
  window.cotizEliminar_ = async function(tc_id) {
    if (!confirm('¿Eliminar esta cotización?')) return;
    try {
      await apiCall('delete', { body: { entity: 'tipo_cambio', id: tc_id } });
      await loadCatalogs();
      S.corralesTipoCambio = (S.catalogs.tipo_cambio||[]).map(t=>({fecha:t.fecha,valor:Number(t.valor)}));
      toast('Cotización eliminada', 'ok');
      render();
    } catch(err) { toast('Error: ' + err.message, 'err'); }
  };

  // Descargar cotización de hoy automáticamente
  window.actualizarCotizacion_ = async function() {
    try {
      const res = await fetch('https://dolarapi.com/v1/dolares/oficial', { cache: 'no-store' });
      if (!res.ok) throw new Error('Sin respuesta de la API');
      const data = await res.json();
      const valor = data.venta || data.promedio || null;
      if (!valor) throw new Error('Sin valor en la respuesta');
      const hoy = today();
      const lista = S.catalogs && S.catalogs.tipo_cambio || [];
      const existing = lista.find(t => String(t.fecha).slice(0,10) === hoy);
      if (existing) {
        await apiCall('update', { body: { entity: 'tipo_cambio', id: existing.tc_id, data: { ...existing, valor: Number(valor), fuente: 'BNA' } } });
      } else {
        await apiCall('create', { body: { entity: 'tipo_cambio', data: { fecha: hoy, valor: Number(valor), fuente: 'BNA' } } });
      }
      await loadCatalogs();
      S.corralesTipoCambio = (S.catalogs.tipo_cambio||[]).map(t=>({fecha:t.fecha,valor:Number(t.valor)}));
      toast('Cotización BNA: $ ' + fn(valor) + ' / U$S — guardada', 'ok');
      render();
    } catch (err) {
      toast('No se pudo descargar: ' + err.message, 'err');
    }
  };
}


// ── Precios de valorización por actividad (localStorage) ──────────────
// Retorna los precios vigentes a una fecha dada (YYYY-MM-DD o YYYY-MM)
// Si no se pasa fecha, usa el registro más reciente
function preciosValGet_(fecha) {
  const lista = ((S.catalogs && S.catalogs.precios_valorizacion) || [])
    .filter(p => p.fecha)
    .sort((a,b) => String(b.fecha).localeCompare(String(a.fecha)));
  if (!lista.length) return {};
  let row;
  if (fecha) {
    const f = String(fecha).slice(0,7);
    row = lista.find(p => String(p.fecha).slice(0,7) <= f) || lista[0];
  } else {
    row = lista[0];
  }
  return {
    vaca:                  Number(row.vaca)                  || 0,
    toro:                  Number(row.toro)                  || 0,
    torito:                Number(row.torito)                || 0,
    ternero:               Number(row.ternero)               || 0,
    ternera:               Number(row.ternera)               || 0,
    vaquillona:            Number(row.vaquillona)            || 0,
    vaquillona_venta:      Number(row.vaquillona_venta)      || 0,
    novillito:             Number(row.novillito)             || 0,
    novillo:               Number(row.novillo)               || 0,
    vaca_venta:            Number(row.vaca_venta)            || 0,
    ternero_cab:           Number(row.ternero_cab)           || 0,
    ternera_cab:           Number(row.ternera_cab)           || 0,
    vaquillona_cab:        Number(row.vaquillona_cab)        || 0,
    vaquillona_venta_cab:  Number(row.vaquillona_venta_cab)  || 0,
    novillito_cab:         Number(row.novillito_cab)         || 0,
    novillo_cab:           Number(row.novillo_cab)           || 0,
    vaca_venta_cab:        Number(row.vaca_venta_cab)        || 0,
    _fecha: row.fecha,
  };
}

// Verifica si hay precios para un período dado, retorna null si no hay
function preciosValParaPeriodo_(periodo) {
  const lista = ((S.catalogs && S.catalogs.precios_valorizacion) || [])
    .filter(p => p.fecha)
    .sort((a,b) => String(b.fecha).localeCompare(String(a.fecha)));
  if (!lista.length) return null;
  const f = String(periodo).slice(0,7);
  return lista.find(p => String(p.fecha).slice(0,7) <= f) || null;
}

  return (S.cache.campanas || []).find(c => esPorCampo_(c.activa)) || null;
}

      <td><div class="row-actions">
        <button class="icon-btn" data-edit="${c.campana_id}" data-entity="campanas" data-idcol="campana_id" title="Editar">✎</button>
        <button class="icon-btn danger" data-del="${c.campana_id}" data-entity="campanas" data-idcol="campana_id" title="Eliminar">✕</button>
      </div></td>
    </tr>`;
  });
  h += `</tbody></table></div>`;
  return h;
}

function attachCampanasEvents() {
  const btn = document.getElementById('camp-save');
  if (!btn) return;
  btn.onclick = async () => {
    const nombre = document.getElementById('camp-nombre').value.trim();
    const inicio = document.getElementById('camp-inicio').value;
    const fin    = document.getElementById('camp-fin').value;
    const desc   = document.getElementById('camp-desc').value.trim();
    if (!nombre) { toast('Ingresá el nombre de la campaña', 'err'); return; }
    btn.disabled = true; btn.textContent = '⏳ Guardando...';
    try {
      await apiCall('create', { body: { entity: 'campanas', data: { nombre, fecha_inicio: inicio, fecha_fin: fin, descripcion: desc } } });
      invalidateCache('campanas');
      await loadEntity('campanas', true);
      toast('Campaña agregada', 'ok');
      render();
    } catch(err) { toast(err.message, 'err'); }
    finally { btn.disabled = false; btn.textContent = '➕ Agregar campaña'; }
  };
  attachTableDeleteEvents('campanas', 'campana_id');

  document.querySelectorAll('[data-marcar-activa]').forEach(b => {
    b.onclick = async () => {
      const campanaId = b.dataset.marcarActiva;
      b.disabled = true;
      b.textContent = '⏳...';
      try {
        await apiCall('marcarCampanaActiva', { body: { campana_id: campanaId } });
        invalidateCache('campanas');
        await loadEntity('campanas', true);
        toast('Campaña activa actualizada', 'ok');
        render();
      } catch (err) {
        b.disabled = false;
        b.textContent = 'Marcar activa';
        toast(err.message, 'err');
      }
    };
  });
}

function buildABMCorrales_() {
  const corrales = rodeosEngordeValidos_();
  const campos = (S.catalogs && S.catalogs.campos) || [];

  let h = `<div class="panel">
    <div class="panel-title">➕ Nuevo corral de Terminación</div>
    <div class="fgrid">
      <div class="fg"><label>Nombre</label><input type="text" id="cf-corral-nombre" placeholder="Ej: Novillos Corral 3"></div>
      <div class="fg"><label>Campo</label>
        <select id="cf-corral-campo">
          ${campos.map(c => `<option value="${c.campo_id}">${c.nombre}</option>`).join('')}
        </select>
      </div>
      <div class="fg"><label>Categoría</label>
        <select id="cf-corral-cat">
          <option value="novillo">Novillo</option>
          <option value="novillito">Novillito</option>
          <option value="vaquillona venta">Vaquillona venta</option>
          <option value="vaca venta">Vaca venta</option>
        </select>
      </div>
    </div>
    <button class="btn btn-primary" id="cf-corral-save" style="margin-top:8px">➕ Crear corral</button>
  </div>`;

  if (!corrales.length) {
    h += '<div class="empty-state"><span class="ico">🏭</span><div class="msg">Todavía no hay corrales de Terminación. Creá el primero arriba.</div></div>';
    return h;
  }

  h += `<div style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12.5px;color:var(--text2)">
    <strong>👉 Uso normal: no hace falta tocar nada acá.</strong> El orden es: 1) creás el corral arriba (una vez) → 2) cargás el Traslado o Saldo inicial real en <strong>Movimientos</strong>, con cantidad/peso/precio. Listo. Los campos grises (🔒) de abajo se completan solos con eso.<br><br>
    Esta pantalla es solo para <strong>casos excepcionales</strong>: un corral viejo sin movimiento cargado, o para fijar "Peso objetivo" y "$/kg estimado de venta" (que no vienen de ningún movimiento). Si tocás un campo gris y le ponés un valor manual, ese valor pasa a mandar en TODOS los cálculos del corral (Dashboard, Costos, Comparación, Proyecciones) — aunque después corrijas el movimiento real, este valor manual lo sigue tapando hasta que lo vacíes acá.<br><br>
    <strong>Si el dato está mal, la regla es: corregilo en Movimientos, no acá</strong> — y si ya habías cargado una excepción manual antes, no te olvides de venir a vaciarla después de corregir el movimiento.
  </div>`;

  // Tabla de parámetros por corral
  corrales.forEach(r => {
    const rid = r.rodeo_id;
    const cfg = egConfig_(rid);
    const stock = egStock_(rid);
    const campoNom = campos.find(c => String(c.campo_id) === String(r.campo_id))?.nombre || '—';

    // Valores del movimiento de entrada (para mostrar como referencia) — se piden
    // ignorando cualquier excepción manual ya activa (ignorarOverride=true), sino
    // esta misma referencia quedaba mostrando el valor ya pisado por la excepción
    // en vez del dato real del movimiento — que es justo lo que pasó con Corral 1:
    // decía "Movimiento: $ 4.800/cab." cuando en realidad ese $4.800 YA era la
    // excepción manual, no el movimiento (que después se corrigió a $1.600.000).
    const fechaMov = egFechaIngreso_(rid);
    const cantMov  = egCantIngresada_(rid);
    const kgMov    = egKgIngreso_(rid, true);
    const costoMov = egCostoCompra_(rid, true);
    const precioCabMov = cantMov > 0 ? costoMov / cantMov : 0;

    // Si alguno de los 3 campos con excepción manual (stockInicial/kgIngreso/
    // precioCompra) tiene un valor cargado Y distinto al del movimiento real, se
    // marca acá arriba — para que se note de un vistazo sin tener que leer cada
    // campo, que es justo lo que pasó con Corral 1 (la excepción de $4.800 quedó
    // invisible entre el resto de los campos, todos grises y correctos).
    const tieneExcepcion =
      (cfg.stockInicial && Number(cfg.stockInicial) !== Number(cantMov)) ||
      (cfg.kgIngreso && Number(cfg.kgIngreso) !== Number(kgMov)) ||
      (cfg.precioCompra && Math.round(Number(cfg.precioCompra)) !== Math.round(precioCabMov));

    h += `<div class="panel" data-corral-row="${rid}" style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div>
          <div style="font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px">${r.nombre}${tieneExcepcion?'<span style="font-size:10px;font-weight:700;color:#92400e;background:#fef3c7;border-radius:4px;padding:2px 7px">⚠ excepción manual activa</span>':''}</div>
          <div style="font-size:12px;color:var(--text3)">${campoNom} · Stock actual: <strong>${fn(stock)}</strong> cab.</div>
        </div>
        <button class="btn btn-primary abm-corral-save" data-rid="${rid}" style="font-size:11px;padding:5px 14px">💾 Guardar</button>
      </div>
      <div class="fgrid" style="gap:10px">

        <div class="fg"><label style="font-size:11px">Fecha de inicio</label>
          <div style="display:flex;align-items:center;gap:4px">
            <input type="date" class="abm-corral-input" data-rid="${rid}" data-field="fechaInicio" data-ref="${fechaMov||''}"
              value="${cfg.fechaInicio||fechaMov||''}" ${(!cfg.fechaInicio && fechaMov)?'disabled':''} style="font-size:13px;padding:4px 6px">
            ${(!cfg.fechaInicio && fechaMov)?`<button type="button" class="abm-corral-unlock" data-field="fechaInicio" title="Cargar una fecha manual distinta a la del movimiento" style="font-size:11px;padding:3px 7px;cursor:pointer;border:1px solid var(--border);border-radius:4px;background:var(--bg2)">✏️</button>`:''}
          </div>
          ${fechaMov?`<div style="font-size:10px;color:var(--text3);margin-top:2px">Movimiento: ${fd(fechaMov)}${(!cfg.fechaInicio)?' (en uso)':''}</div>`:''}
          ${(cfg.fechaInicio && fechaMov && cfg.fechaInicio!==fechaMov)?`<div style="font-size:10px;font-weight:700;color:#92400e;background:#fef3c7;border-radius:4px;padding:2px 6px;margin-top:3px;display:flex;align-items:center;gap:6px">⚠ Reemplaza al movimiento (${fd(fechaMov)}) <button type="button" class="abm-corral-revert" data-rid="${rid}" data-field="fechaInicio" title="Volver a usar el valor del movimiento" style="font-size:10px;padding:2px 6px;cursor:pointer;border:1px solid #92400e;border-radius:4px;background:#fff;color:#92400e">↺ usar movimiento</button></div>`:''}
        </div>

        <div class="fg"><label style="font-size:11px">Cantidad ingresada</label>
          <div style="display:flex;align-items:center;gap:4px">
            <input type="number" class="abm-corral-input" data-rid="${rid}" data-field="stockInicial" data-ref="${cantMov||''}"
              value="${cfg.stockInicial||''}" placeholder="${cantMov||'—'}" ${(!cfg.stockInicial && cantMov)?'disabled':''} style="font-size:13px;padding:4px 6px;width:90px">
            ${(!cfg.stockInicial && cantMov)?`<button type="button" class="abm-corral-unlock" data-field="stockInicial" title="Cargar una cantidad manual distinta a la del movimiento" style="font-size:11px;padding:3px 7px;cursor:pointer;border:1px solid var(--border);border-radius:4px;background:var(--bg2)">✏️</button>`:''}
          </div>
          ${cantMov?`<div style="font-size:10px;color:var(--text3);margin-top:2px">Movimiento: ${fn(cantMov)} cab.${(!cfg.stockInicial)?' (en uso)':''}</div>`:''}
          ${(cfg.stockInicial && cantMov && Number(cfg.stockInicial)!==Number(cantMov))?`<div style="font-size:10px;font-weight:700;color:#92400e;background:#fef3c7;border-radius:4px;padding:2px 6px;margin-top:3px;display:flex;align-items:center;gap:6px">⚠ Reemplaza al movimiento (${fn(cantMov)} cab.) <button type="button" class="abm-corral-revert" data-rid="${rid}" data-field="stockInicial" title="Volver a usar el valor del movimiento" style="font-size:10px;padding:2px 6px;cursor:pointer;border:1px solid #92400e;border-radius:4px;background:#fff;color:#92400e">↺ usar movimiento</button></div>`:''}
        </div>

        <div class="fg"><label style="font-size:11px">Kg prom. de ingreso</label>
          <div style="display:flex;align-items:center;gap:4px">
            <input type="number" class="abm-corral-input" data-rid="${rid}" data-field="kgIngreso" data-ref="${kgMov||''}"
              value="${cfg.kgIngreso||''}" placeholder="${kgMov||'—'}" ${(!cfg.kgIngreso && kgMov)?'disabled':''} style="font-size:13px;padding:4px 6px;width:90px">
            ${(!cfg.kgIngreso && kgMov)?`<button type="button" class="abm-corral-unlock" data-field="kgIngreso" title="Cargar un peso manual distinto al del movimiento" style="font-size:11px;padding:3px 7px;cursor:pointer;border:1px solid var(--border);border-radius:4px;background:var(--bg2)">✏️</button>`:''}
          </div>
          ${kgMov?`<div style="font-size:10px;color:var(--text3);margin-top:2px">Movimiento: ${fn(kgMov)} kg${(!cfg.kgIngreso)?' (en uso)':''}</div>`:''}
          ${(cfg.kgIngreso && kgMov && Number(cfg.kgIngreso)!==Number(kgMov))?`<div style="font-size:10px;font-weight:700;color:#92400e;background:#fef3c7;border-radius:4px;padding:2px 6px;margin-top:3px;display:flex;align-items:center;gap:6px">⚠ Reemplaza al movimiento (${fn(kgMov)} kg) <button type="button" class="abm-corral-revert" data-rid="${rid}" data-field="kgIngreso" title="Volver a usar el valor del movimiento" style="font-size:10px;padding:2px 6px;cursor:pointer;border:1px solid #92400e;border-radius:4px;background:#fff;color:#92400e">↺ usar movimiento</button></div>`:''}

          </div>

          ${(cfg.precioCompra && precioCabMov && Math.round(Number(cfg.precioCompra))!==Math.round(precioCabMov))?`<div style="font-size:10px;font-weight:700;color:#92400e;background:#fef3c7;border-radius:4px;padding:2px 6px;margin-top:3px;display:flex;align-items:center;gap:6px">⚠ Reemplaza al movimiento ($ ${fn(Math.round(precioCabMov))}/cab.) <button type="button" class="abm-corral-revert" data-rid="${rid}" data-field="precioCompra" title="Volver a usar el valor del movimiento" style="font-size:10px;padding:2px 6px;cursor:pointer;border:1px solid #92400e;border-radius:4px;background:#fff;color:#92400e">↺ usar movimiento</button></div>`:''}
        </div>

        <div class="fg"><label style="font-size:11px">Peso objetivo (kg)</label>
          <input type="number" class="abm-corral-input" data-rid="${rid}" data-field="pesoObjetivo"

          <input type="number" class="abm-corral-input" data-rid="${rid}" data-field="precioProyectado"
            value="${cfg.precioProyectado||''}" placeholder="Ej: 3500" style="font-size:13px;padding:4px 6px;width:110px">
        </div>

      </div>
    </div>`;

  return h;
