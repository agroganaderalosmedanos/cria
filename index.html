function attachABMCorralesEvents_() {
  // Botón "↺ usar movimiento": limpia UN campo puntual y guarda al toque, sin
  // tener que seleccionar y borrar texto a mano — justo la fricción que generó
  // que Corral 1 y Corral 2 quedaran con excepciones manuales desactualizadas
  // sin que nadie se diera cuenta hasta comparar contra el Dashboard.
  document.querySelectorAll('.abm-corral-revert').forEach(btn => {
    btn.onclick = async () => {
      const rid = btn.dataset.rid, field = btn.dataset.field;
      btn.disabled = true; btn.textContent = '⏳';
      await egSaveConfig_(rid, { [field]: '' });
      toast('Vuelto a usar el valor del movimiento', 'ok');
      render();
    };
  });

  const btnNuevo = document.getElementById('cf-corral-save');
  if (btnNuevo) btnNuevo.onclick = async () => {
    const nombre = document.getElementById('cf-corral-nombre').value.trim();
    const campo_id = document.getElementById('cf-corral-campo').value;
    const categoria = document.getElementById('cf-corral-cat').value;
    if (!nombre) { toast('Ingresá el nombre del corral', 'err'); return; }
    btnNuevo.disabled = true;
    btnNuevo.textContent = '⏳ Creando…';
    try {
      await apiCall('create', { body: { entity: 'rodeos', data: { nombre, campo_id, categoria, actividad: 'Engorde', activo: 'TRUE' } } });
      await loadCatalogs();
      toast('Corral creado — ahora cargá su Saldo inicial en Movimientos de Hacienda', 'ok');
      render();
    } catch (err) {
      btnNuevo.disabled = false;
      btnNuevo.textContent = '➕ Crear corral';
      toast(err.message, 'err');
    }
  };

  document.querySelectorAll('.abm-corral-save').forEach(btn => {
    btn.onclick = async () => {
      const rid = btn.dataset.rid;
      const row = document.querySelector(`[data-corral-row="${rid}"]`);
      if (!row) return;
      const cfg = {};
      const FIELD_LABELS_CORRAL_ = { fechaInicio: 'Fecha de inicio', stockInicial: 'Cantidad ingresada', kgIngreso: 'Kg prom. de ingreso', precioCompra: 'Precio entrada' };
      const divergencias = [];
      row.querySelectorAll('.abm-corral-input').forEach(inp => {
        cfg[inp.dataset.field] = inp.value;
        const ref = inp.dataset.ref;
        // Si el campo tiene un valor Y ese valor difiere del que trae el movimiento/cesión
        // (data-ref), es una excepción manual activa — se avisa antes de guardar.
        if (inp.value && ref && String(inp.value) !== String(ref)) {
          const refTxt = inp.type === 'date' ? fd(ref) : (inp.dataset.field==='precioCompra' ? '$ '+fn(ref) : fn(ref));
          divergencias.push(`• ${FIELD_LABELS_CORRAL_[inp.dataset.field] || inp.dataset.field}: vas a guardar "${inp.value}" en vez de "${refTxt}" (el valor del movimiento/cesión)`);
        }
      });
      if (divergencias.length) {
        const ok = confirm(
          `Estás por guardar valores manuales que reemplazan a los del movimiento/cesión:\n\n` +
          divergencias.join('\n') +
          `\n\nA partir de ahora, el sistema va a usar estos valores manuales en TODOS los cálculos de este corral (Dashboard, Costos, Comparación, Proyecciones), y no los del movimiento.\n\n¿Confirmás que querés guardar así?`
        );
        if (!ok) return;
      }
      btn.disabled = true;
      btn.textContent = 'Guardando...';
      await egSaveConfig_(rid, cfg);
      btn.disabled = false;
      btn.textContent = '✓ Guardado';
      setTimeout(() => { btn.textContent = '💾 Guardar'; }, 1500);
      toast('Configuración del corral actualizada', 'ok');
    };
  });
}
// POR CABEZA: vaca, toro, torito
// POR KG:     vaca venta, ternero, ternera, vaquillona, vaquillona venta, novillito, novillo
const CATS_POR_CABEZA_ = ['vaca', 'toro', 'torito'];
const CATS_POR_KG_     = ['vaca venta', 'ternero', 'ternera', 'vaquillona', 'vaquillona venta', 'novillito', 'novillo'];

// Devuelve el valor de un rodeo dado su stock y última pesada
function valorizarRodeo_(rodeo, stock, pesadaProm) {
  const p = preciosValGet_();
  const cat = (rodeo.categoria || '').toLowerCase().trim();
  const cant = Number(stock) || 0;
  if (!cant) return 0;
  if (CATS_POR_CABEZA_.includes(cat)) {
    const precio = cat === 'toro'   ? (p.toro   || 0)
                 : cat === 'torito' ? (p.torito || 0)
                 : (p.vaca || 0);
    return cant * precio;
  }
  // precio por kg
  const kg = Number(pesadaProm) || 0;
  const precioPorKg = cat === 'ternero'          ? (p.ternero          || 0)
                    : cat === 'ternera'          ? (p.ternera          || 0)
                    : cat === 'vaquillona'       ? (p.vaquillona       || 0)
                    : cat === 'vaquillona venta' ? (p.vaquillona_venta || 0)
                    : cat === 'novillito'        ? (p.novillito        || 0)
                    : cat === 'novillo'          ? (p.novillo          || 0)
                    : cat === 'vaca venta'       ? (p.vaca_venta       || 0)
                    : 0;
  if (kg && precioPorKg) return cant * kg * precioPorKg;

  // Fallback: precio por cabeza si no hay pesada
  const precioCab = cat === 'ternero'          ? (p.ternero_cab          || 0)
                  : cat === 'ternera'          ? (p.ternera_cab          || 0)
                  : cat === 'vaquillona'       ? (p.vaquillona_cab       || 0)
                  : cat === 'vaquillona venta' ? (p.vaquillona_venta_cab || 0)
                  : cat === 'novillito'        ? (p.novillito_cab        || 0)
                  : cat === 'novillo'          ? (p.novillo_cab          || 0)
                  : cat === 'vaca venta'       ? (p.vaca_venta_cab       || 0)
                  : 0;
  return cant * precioCab;
}

// Retorna el método de valorización usado para mostrar en tabla
function metodoValorizacion_(rodeo, pesadaProm) {
  const p = preciosValGet_();
  const cat = (rodeo.categoria || '').toLowerCase().trim();
  if (CATS_POR_CABEZA_.includes(cat)) return 'por cabeza';
  const kg = Number(pesadaProm) || 0;
  const precioPorKg = cat === 'ternero' ? p.ternero : cat === 'ternera' ? p.ternera
    : cat === 'vaquillona' ? p.vaquillona : cat === 'vaquillona venta' ? p.vaquillona_venta
    : cat === 'novillito' ? p.novillito : cat === 'novillo' ? p.novillo
    : cat === 'vaca venta' ? p.vaca_venta : 0;
  if (kg && precioPorKg) return 'por kg';
  return 'por cabeza (sin pesada)';
}

    set('pv-torito',           p.torito);
    set('pv-ternero',          p.ternero);
    set('pv-ternera',          p.ternera);
    set('pv-vaquillona',       p.vaquillona);
    set('pv-vaquillona-venta', p.vaquillona_venta);
    set('pv-novillito',        p.novillito);
    set('pv-novillo',          p.novillo);
    set('pv-vaca-venta',           p.vaca_venta);
    set('pv-ternero-cab',          p.ternero_cab);
    set('pv-ternera-cab',          p.ternera_cab);
    set('pv-vaquillona-cab',       p.vaquillona_cab);
    set('pv-vaquillona-venta-cab', p.vaquillona_venta_cab);
    set('pv-novillito-cab',        p.novillito_cab);
    set('pv-novillo-cab',          p.novillo_cab);
    set('pv-vaca-venta-cab',       p.vaca_venta_cab);
    // Scroll al formulario
    const panel = document.querySelector('.panel');
    if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    const btn = document.getElementById('pv-guardar-btn');
    if (btn) btn.textContent = '✏️ Actualizar precios de ' + fecha;
    toast('Editando precios de ' + fecha, 'ok');

  window.preciosValEliminar_ = async function(precio_id) {
    if (!confirm('¿Eliminar este registro de precios?')) return;

      await apiCall('delete', { body: { entity: 'precios_valorizacion', id: precio_id } });

      toast('Registro eliminado', 'ok');
      render();

  };

function buildEntityTable(items, cols, entity, idCol) {
  if (!items.length) {
    return '<div class="empty-state"><span class="ico">◌</span><div class="msg">Todavía no hay registros. Cargá el primero arriba.</div></div>';
  }
  if (!S.sort) S.sort = {};
  const sortState = S.sort[entity];
  let sortedItems = items;
  if (sortState) {
    sortedItems = [...items].sort((a, b) => {
      let va = a[sortState.key], vb = b[sortState.key];
      if (va == null) va = '';
      if (vb == null) vb = '';
      const na = Number(va), nb = Number(vb);
      const numeric = va !== '' && vb !== '' && !isNaN(na) && !isNaN(nb);
      const cmp = numeric ? (na - nb) : String(va).localeCompare(String(vb), 'es', { sensitivity: 'base' });
      return sortState.dir === 'asc' ? cmp : -cmp;
    });
  }
  let h = `<div class="section-label">Historial <span class="count-badge" style="margin-left:6px">${items.length}</span></div>
  <div class="tw"><table class="dt"><thead><tr>`;
  cols.forEach(c => {
    const activo = sortState && sortState.key === c.key;
    const flecha = activo ? (sortState.dir === 'asc' ? ' ▲' : ' ▼') : '';
    h += `<th class="sortable-th" onclick="sortEntityTable('${entity}','${c.key}')" style="cursor:pointer;user-select:none" title="Ordenar por ${c.label}">${c.label}${flecha}</th>`;
  });
  h += '<th class="col-actions-sticky"></th></tr></thead><tbody>';
  sortedItems.forEach(item => {
    h += '<tr>';
    cols.forEach(c => h += `<td>${c.render ? c.render(item[c.key]) : (item[c.key] != null ? item[c.key] : '—')}</td>`);
    h += `<td class="col-actions-sticky"><div class="row-actions">
      <button class="icon-btn" data-edit="${item[idCol]}" data-entity="${entity}" data-idcol="${idCol}" title="Editar">✎</button>
      <button class="icon-btn danger" data-del="${item[idCol]}" data-entity="${entity}" data-idcol="${idCol}" title="Eliminar">✕</button>
    </div></td>`;
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  return h;
}

function sortEntityTable(entity, key) {
  if (!S.sort) S.sort = {};
  const current = S.sort[entity];
  if (current && current.key === key) {
    current.dir = current.dir === 'asc' ? 'desc' : 'asc';
  } else {
    S.sort[entity] = { key, dir: 'asc' };
  }
  render();
}
function attachTableDeleteEvents(entity, idCol) {
  document.querySelectorAll('[data-del][data-entity="' + entity + '"]').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm('¿Eliminar este registro?')) return;
      try {
        await apiCall('delete', { body: { entity, id: btn.dataset.del } });
        invalidateCache(entity);
        toast('Registro eliminado', 'ok');
        await loadEntity(entity, true);
        const ENTIDADES_AFECTAN_DASHBOARD_ = ['servicios', 'tactos', 'pariciones', 'destetes', 'abortos', 'mortandad'];
        if (ENTIDADES_AFECTAN_DASHBOARD_.includes(entity)) { await loadDashboard(); }
        if (entity === 'movimientos' || entity === 'ventas' || entity === 'mortandad') { S.stock = null; await loadStock(); }
        if (entity === 'pariciones') {
          // El backend borra en cascada el Movimiento (Saldo inicial) asociado a
          // los terneros nacidos de esta parición — hay que refrescar movimientos
          // y stock acá también, para que no quede desactualizado en el navegador.
          invalidateCache('movimientos');
          await loadEntity('movimientos', true);
          S.stock = null; await loadStock();
        }
        if (entity === 'abortos') {
          // A diferencia de Pariciones (que tiene su propio endpoint de backend
          // "registrarParicion" con cascada incluida), el traslado a Vacas Venta de
          // un aborto se crea desde el frontend — así que la cascada de borrado
          // también se resuelve acá: buscamos el Movimiento con el tag [abid:<id>]
          // de este aborto y lo borramos, para no dejarlo huérfano.
          if (!S.cache.movimientos) { try { await loadEntity('movimientos'); } catch(e) {} }
          const movLigado = (S.cache.movimientos||[]).find(m => (m.observaciones||'').includes(`[abid:${btn.dataset.del}]`));
          if (movLigado) {
            try {
              await apiCall('delete', { body: { entity: 'movimientos', id: movLigado.movimiento_id } });
              toast('Traslado a Vacas Venta vinculado también eliminado', 'ok');
            } catch(e) { toast('No se pudo borrar el traslado vinculado — revisalo manualmente en Movimientos.', 'err'); }
          }
          invalidateCache('movimientos');
          await loadEntity('movimientos', true);
          S.stock = null; await loadStock();
        }
        if (entity === 'compras_insumos' || entity === 'consumos_insumos') { S.stockProductos = null; await loadStockProductos(); }
        if (entity === 'precios_internos' || entity === 'destetes' || entity === 'ventas') { S.margenBruto = null; S._resultCria = null; S._resultRecria = null; S._resultEng = null; }
        if (entity === 'productos') { await loadCatalogs(); S.stockProductos = null; await loadStockProductos(); }
        if (entity === 'campos' || entity === 'rodeos' || entity === 'compradores') { await loadCatalogs(); }
        render();
      } catch (err) { toast(err.message, 'err'); }
    };
  });
  document.querySelectorAll('[data-edit][data-entity="' + entity + '"]').forEach(btn => {
    btn.onclick = () => openEditModal(entity, idCol, btn.dataset.edit);
  });
}

// ── EDICIÓN GENÉRICA DE REGISTROS ───────────────────────────────────────
// Construye un modal de edición a partir del item crudo en S.cache[entity],
// infiriendo el tipo de campo por el nombre/valor de la clave.
function fieldInputType_(key, value) {
  if (key.includes('fecha')) return 'date';
  if (key === 'rodeo_id' || key === 'rodeo_origen_id' || key === 'rodeo_destino_id') return 'rodeo';
  if (key === 'campo_id' || key === 'campo_origen_id' || key === 'campo_destino_id') return 'campo';
  if (key === 'producto_id') return 'producto';
  if (key === 'activo' || key === 'por_campo') return 'boolean';
  if (key === 'tipo' || key === 'tipo_tacto' || key === 'tipo_venta' || key === 'estado') return 'text';
  if (typeof value === 'number' || (!isNaN(value) && value !== '' && value !== null)) return 'number';
  return 'text';
}
function openEditModal(entity, idCol, id) {
  // Buscar en cache o en catalogs (para campos, rodeos, compradores)
  const catalogMap = { campos: 'campos', rodeos: 'rodeos', compradores: 'compradores' };
  const items = S.cache[entity] || (S.catalogs && catalogMap[entity] ? S.catalogs[catalogMap[entity]] : []) || [];
  const item = items.find(i => String(i[idCol]) === String(id));
  if (!item) { toast('No se encontró el registro.', 'err'); return; }
  // Asegurarse que precio_cabeza, precio_kg y peso_prom_kg siempre estén disponibles
  // para editar, incluso en movimientos viejos cargados antes de habilitar estos campos.
  if (entity === 'productos') {
    // Productos cargados antes de habilitar la materia seca: mostrar el campo igual.
    if (item.materia_seca_pct === undefined) item.materia_seca_pct = '';
  }
  if (entity === 'campos') {
    // Campos cargados antes de habilitar las hectáreas: mostrar el campo igual.
    if (item.superficie_ha === undefined) item.superficie_ha = '';
  }
  if (entity === 'compras_insumos') {
    // Registros viejos, o cargados desde el botón "Actualizar" de Precios, pueden
    // no traer alguna de estas claves en el objeto crudo — sin esto, el campo
    // directamente no aparecía en el modal (no es que estuviera vacío, faltaba entero).
    if (!('precio_unitario' in item)) item.precio_unitario = 0;
    if (!('cantidad' in item))        item.cantidad = 0;
    if (!('proveedor' in item))       item.proveedor = '';
    if (!('observaciones' in item))   item.observaciones = '';
  }
  if (entity === 'consumos_insumos') {
    if (!('cantidad' in item))        item.cantidad = 0;
    if (!('observaciones' in item))   item.observaciones = '';
  }
  if (entity === 'movimientos') {
    if (!('precio_cabeza' in item)) item.precio_cabeza = 0;
    if (!('precio_kg' in item)) item.precio_kg = 0;
    if (!('peso_prom_kg' in item)) item.peso_prom_kg = 0;
  }
  const keys = Object.keys(item).filter(k => k !== idCol);
  const rodeosL = rodeosTodos();
  const camposL = (S.catalogs && S.catalogs.campos) || [];
  const productosL = (S.catalogs && S.catalogs.productos) || [];

  // Etiquetas amigables para el modal de edición
  const FIELD_LABELS_ = {
    tipo: 'Tipo', caravana: 'Caravana', fecha: 'Fecha', fecha_salida: 'Fecha salida',
    campo_origen_id: 'Campo origen', campo_destino_id: 'Campo destino',
    rodeo_origen_id: 'Rodeo origen', rodeo_destino_id: 'Rodeo destino',
    cantidad: 'Cantidad', observaciones: 'Observación', precio_cabeza: '💲 Precio por cabeza ($)',
    precio_kg: '💲 Precio por kg ($)', peso_prom_kg: '⚖️ Peso prom. de ingreso (kg)',
    cant_animales: 'Cantidad animales', comprador: 'Comprador', peso_campo_kg: 'Kg campo',
    precio_pactado: '$/kg pactado', campana: 'Campaña', estado: 'Estado',
    materia_seca_pct: 'Materia seca (%) — opcional, para conversión alimenticia', por_campo: 'Por campo', activo: 'Activo',
    superficie_ha: 'Hectáreas — opcional, para Margen Bruto/ha', nombre: 'Nombre',
    precio_unitario: '💲 Precio unitario ($)', proveedor: 'Proveedor', producto_id: 'Producto',
  };

  let fieldsHtml = '';
  // Para Saldo inicial, los campos de origen no se usan en ningún cálculo del sistema
  // (siempre se ignoran). Ocultarlos evita confusión — sino parece que el saldo inicial
  // "viene de" otro rodeo, cuando en realidad es un ingreso directo sin origen.
  const ocultarOrigenSaldoInicial = entity === 'movimientos' && item.tipo === 'Saldo inicial';
  const camposAOcultar = ocultarOrigenSaldoInicial ? ['campo_origen_id', 'rodeo_origen_id'] : [];
  keys.forEach(k => {
    if (camposAOcultar.includes(k)) return;
    const type = fieldInputType_(k, item[k]);
    const fid = 'edit-' + k;
    const labelText = FIELD_LABELS_[k] || k;
    if (type === 'rodeo') {
      fieldsHtml += `<div class="fg"><label>${labelText}</label>
        <select id="${fid}">${rodeosL.map(r => `<option value="${r.rodeo_id}" ${String(r.rodeo_id)===String(item[k])?'selected':''}>${r.nombre}</option>`).join('')}</select></div>`;
    } else if (type === 'campo') {
      fieldsHtml += `<div class="fg"><label>${labelText}</label>
        <select id="${fid}"><option value="">—</option>${camposL.map(c => `<option value="${c.campo_id}" ${String(c.campo_id)===String(item[k])?'selected':''}>${c.nombre}</option>`).join('')}</select></div>`;
    } else if (type === 'producto') {
      fieldsHtml += `<div class="fg"><label>${labelText}</label>
        <select id="${fid}">${productosL.map(p => `<option value="${p.producto_id}" ${String(p.producto_id)===String(item[k])?'selected':''}>${p.nombre}</option>`).join('')}</select></div>`;
    } else if (type === 'boolean') {
      const esTrue = esPorCampo_(item[k]);
      fieldsHtml += `<div class="fg"><label>${labelText}</label>
        <select id="${fid}"><option value="true" ${esTrue?'selected':''}>Sí</option><option value="false" ${!esTrue?'selected':''}>No</option></select></div>`;
    } else if (type === 'date') {
      fieldsHtml += `<div class="fg"><label>${labelText}</label><input type="date" id="${fid}" value="${item[k]||''}"></div>`;
    } else if (type === 'number') {
      fieldsHtml += `<div class="fg"><label>${labelText}</label><input type="number" id="${fid}" value="${item[k]!=null?item[k]:''}"></div>`;
    } else {
      fieldsHtml += `<div class="fg"><label>${labelText}</label><input type="text" id="${fid}" value="${(item[k]!=null?item[k]:'').toString().replace(/"/g,'&quot;')}"></div>`;
    }
  });

  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-overlay" id="edit-modal-overlay">
      <div class="modal">
        <div class="modal-header"><h3>Editar registro</h3><button class="modal-close" id="edit-modal-close">✕</button></div>
        <div class="modal-body">
          <div class="fgrid">${fieldsHtml}</div>
          ${entity === 'movimientos' && ('precio_cabeza' in item) && ('precio_kg' in item) ? `
          <div id="edit-modal-precio-hint" style="margin-top:8px;padding:8px 10px;background:#fef3c7;border-radius:6px;font-size:11px;color:#92400e">
            ⚠ Cargá <strong>uno solo</strong> de los dos precios (por cabeza <em>o</em> por kg) — el que dejes en 0 se ignora. El campo que no vas a usar se pone gris solo.
          </div>` : ''}
          ${entity === 'movimientos' && (item.tipo === 'Saldo inicial' || item.tipo === 'Traslado en bloque' || item.tipo === 'Traslado individual') ? `
          <div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)">
            <button type="button" class="btn btn-ghost btn-sm" id="edit-modal-usar-precio-mes" style="font-size:12px;padding:4px 10px">💲 Completar precio desde Valorización de Stock</button>
            <span style="font-size:11px;color:var(--text3);margin-left:8px">${item.tipo === 'Saldo inicial' ? 'Usa el precio del mes de la fecha del saldo inicial según la categoría del rodeo' : 'Para traslados internos sin precio real de compra — usa el precio de mercado del mes'}</span>
          </div>` : ''}
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="edit-modal-cancel">Cancelar</button>
          <button class="btn btn-primary" id="edit-modal-save">Guardar cambios</button>
        </div>
      </div>
    </div>`);

  const closeModal = () => document.getElementById('edit-modal-overlay')?.remove();
  document.getElementById('edit-modal-close').onclick = closeModal;
  document.getElementById('edit-modal-cancel').onclick = closeModal;

  // Bloqueo mutuo entre "Precio por cabeza" y "Precio por kg": cargar uno de los
  // dos deja el otro gris y en 0, para que no quede ambigüedad de cuál está "en
  // uso" al mirar el registro después (era justo lo que generó el corral con el
  // precio equivocado — un valor viejo en el campo que no correspondía).
  const elCab = document.getElementById('edit-precio_cabeza');
  const elKg  = document.getElementById('edit-precio_kg');
  if (elCab && elKg) {
    const sync = (changed) => {
      if (changed === 'cab' && Number(elCab.value) > 0) {
        elKg.value = ''; elKg.disabled = true; elCab.disabled = false;
      } else if (changed === 'kg' && Number(elKg.value) > 0) {
        elCab.value = ''; elCab.disabled = true; elKg.disabled = false;
      } else {
        elKg.disabled = false; elCab.disabled = false;
      }
    };
    elCab.oninput = () => sync('cab');
    elKg.oninput = () => sync('kg');
    // Estado inicial según lo que ya tenga cargado el registro
    if (Number(item.precio_cabeza) > 0) elKg.disabled = true;
    else if (Number(item.precio_kg) > 0) elCab.disabled = true;
  }

  // Botón "Usar precio del mes" en modal de edición de Traslados
  const btnPrecioModal = document.getElementById('edit-modal-usar-precio-mes');
  if (btnPrecioModal) {
    btnPrecioModal.onclick = () => {
      const fecha = document.getElementById('edit-fecha')?.value || item.fecha;
      const rodeoDestinoId = document.getElementById('edit-rodeo_destino_id')?.value || item.rodeo_destino_id;
      const rodeo = rodeosTodos().find(r => String(r.rodeo_id) === String(rodeoDestinoId));
      if (!rodeo) { toast('No se pudo identificar el rodeo destino.', 'err'); return; }
      const cat = (rodeo.categoria || '').toLowerCase().trim();
      const p = preciosValGet_(fecha);
      const mapaKg  = { ternero:'ternero', ternera:'ternera', vaquillona:'vaquillona', 'vaquillona venta':'vaquillona_venta', novillito:'novillito', novillo:'novillo', 'vaca venta':'vaca_venta' };
      const mapaCab = { vaca:'vaca', toro:'toro', torito:'torito', ternero:'ternero_cab', ternera:'ternera_cab', vaquillona:'vaquillona_cab', 'vaquillona venta':'vaquillona_venta_cab', novillito:'novillito_cab', novillo:'novillo_cab', 'vaca venta':'vaca_venta_cab' };
      const precioKgEl  = document.getElementById('edit-precio_kg');
      const precioCabEl = document.getElementById('edit-precio_cabeza');

      if (item.tipo === 'Saldo inicial') {
        // Saldo inicial → priorizar $/cabeza
        const valorCab = p[mapaCab[cat]] || 0;
        const valorKg  = p[mapaKg[cat]]  || 0;
        if (valorCab > 0 && precioCabEl) {
          precioCabEl.value = valorCab;
          if (precioKgEl) precioKgEl.value = 0;
          toast('Precio/cabeza cargado: ' + fn(valorCab) + ' (' + cat + ' — ' + fd(fecha) + ')', 'ok');
        } else if (valorKg > 0) {
          // Categorías que solo tienen $/kg → estimamos $/cabeza con el peso si está disponible
          const peso = Number(document.getElementById('edit-peso_prom_kg')?.value) || 0;
          if (peso > 0 && precioCabEl) {
            precioCabEl.value = Math.round(valorKg * peso);
            if (precioKgEl) precioKgEl.value = 0;
            toast('Precio/cabeza estimado: ' + fn(valorKg) + ' $/kg × ' + fn(peso) + ' kg = ' + fn(Math.round(valorKg*peso)) + ' — verificalo', 'ok');
          } else if (precioKgEl) {
            precioKgEl.value = valorKg;
            if (precioCabEl) precioCabEl.value = 0;
            toast('Cargado ' + fn(valorKg) + ' $/kg — si preferís $/cabeza, ingresá el peso primero y volvé a tocar el botón', 'ok');
          }
        } else {
          toast('No hay precio cargado para "' + (rodeo.categoria||'—') + '" en Precios de Valorización para esa fecha.', 'err');
        }
      } else {
        // Traslados → priorizar $/kg
        const valorKg  = p[mapaKg[cat]]  || 0;
        const valorCab = p[mapaCab[cat]] || 0;
        if (valorKg > 0 && precioKgEl) {
          precioKgEl.value = valorKg;
          if (precioCabEl) precioCabEl.value = 0;
          toast('Precio/kg cargado: ' + fn(valorKg) + ' (' + cat + ' — ' + fd(fecha) + ')', 'ok');
        } else if (valorCab > 0 && precioCabEl) {
          precioCabEl.value = valorCab;
          if (precioKgEl) precioKgEl.value = 0;
          toast('Precio/cabeza cargado: ' + fn(valorCab) + ' (' + cat + ' — ' + fd(fecha) + ')', 'ok');
        } else {
          toast('No hay precio cargado para "' + (rodeo.categoria||'—') + '" en Precios de Valorización para esa fecha.', 'err');
        }
      }
    };
  }
  document.getElementById('edit-modal-save').onclick = async () => {
    const data = {};
    keys.forEach(k => {
      const el = document.getElementById('edit-' + k);
      if (!el) return;
      const type = fieldInputType_(k, item[k]);
      if (type === 'boolean') { data[k] = el.value === 'true'; return; }
      data[k] = el.tagName === 'SELECT' ? el.value : (el.type === 'number' ? Number(el.value) : el.value.trim());
    });
    // Si es Saldo inicial, limpiar explícitamente los campos de origen (no se editaron
    // porque están ocultos, pero pueden tener un valor sobrante de antes — se borra
    // para que la planilla no quede con un dato confuso e inerte).
    camposAOcultar.forEach(k => { data[k] = ''; });
    const saveBtn = document.getElementById('edit-modal-save');
    saveBtn.disabled = true;
    try {
      await apiCall('update', { body: { entity, id, data } });
      invalidateCache(entity);
      toast('Registro actualizado', 'ok');
      await loadEntity(entity, true);
      // El Dashboard general solo depende de Servicios/Tactos/Pariciones/Destetes/Abortos/Mortandad
      // (KPIs de Cría) — recargarlo en CADA edición, sin importar la entidad, es un viaje de
      // ida y vuelta a Apps Script innecesario y lento. Solo se recarga si la entidad editada
      // realmente puede afectar esos KPIs.
      const ENTIDADES_AFECTAN_DASHBOARD_ = ['servicios', 'tactos', 'pariciones', 'destetes', 'abortos', 'mortandad'];
      if (ENTIDADES_AFECTAN_DASHBOARD_.includes(entity)) { await loadDashboard(); }
      if (entity === 'movimientos') { S.stock = null; await loadStock(); S.margenBruto = null; S._resultCria = null; S._resultRecria = null; S._resultEng = null; }
      if (entity === 'precios_internos' || entity === 'destetes' || entity === 'ventas') { S.margenBruto = null; S._resultCria = null; S._resultRecria = null; S._resultEng = null; }
      if (entity === 'compras_insumos' || entity === 'consumos_insumos') { S.stockProductos = null; await loadStockProductos(); }
      if (entity === 'productos') { await loadCatalogs(); S.stockProductos = null; await loadStockProductos(); }
      if (entity === 'campos' || entity === 'rodeos' || entity === 'compradores') { await loadCatalogs(); }
      closeModal();
      render();
    } catch (err) { toast(err.message, 'err'); saveBtn.disabled = false; }
  };
}

      </div>
      <div style="margin-bottom:14px">
        <label style="display:block;font-size:12px;font-weight:600;color:#7a5c3a;margin-bottom:5px">Contraseña</label>
        <input type="password" id="li-pass" placeholder="••••••••" autocomplete="current-password"
          style="width:100%;padding:10px 13px;border:1px solid rgba(74,46,26,0.22);border-radius:9px;font-size:14px;font-family:inherit;background:#F0EAD8;color:#4A2E1A;outline:none">
      </div>
      <button id="li-btn" style="width:100%;padding:11px;background:#631627;color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:6px">Ingresar</button>
      <div id="li-err" style="font-size:12.5px;color:#b3261e;margin-top:10px;text-align:center;min-height:18px"></div>
    </div>`;
  document.body.appendChild(overlay);
  const btn = document.getElementById('li-btn');
  const userEl = document.getElementById('li-user');
  const passEl = document.getElementById('li-pass');
  const errEl  = document.getElementById('li-err');
  async function doLogin() {
    const usuario = userEl.value.trim();
    const password = passEl.value;
    if (!usuario || !password) { errEl.textContent = 'Completá usuario y contraseña.'; return; }
    btn.disabled = true; btn.textContent = 'Verificando…'; errEl.textContent = '';
    try {
      const url = LOGIN_API_URL + '?action=login&token=' + encodeURIComponent(LOGIN_TOKEN);
      const res = await fetch(url, { method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ usuario, password }) });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'Error al conectar');
      loginSetSession(json.data);
      overlay.remove();
      onSuccess(json.data);
    } catch(err) {
      errEl.textContent = err.message;
      btn.disabled = false; btn.textContent = 'Ingresar';
    }
  }
  btn.onclick = doLogin;
  passEl.onkeydown = e => { if (e.key === 'Enter') doLogin(); }

  userEl.onkeydown = e => { if (e.key === 'Enter') passEl.focus(); }
  setTimeout(() => userEl.focus(), 100);
}
loginRequired(session => {
  window.__lmSession = session;
  window.S = S;
  window.goto = goto;
  window.render = render;
  init();
});
</script>
</body>
</html>
