  const ventasCria = ventas.filter(v => rodeosCriaIds.has(String(v.rodeo_id)));
  const totalVentas = ventasCria.reduce((s,v) => s + (Number(v.importe_liq)||(Number(v.precio_pactado)*(Number(v.peso_campo_kg)||Number(v.cant_animales)))||0), 0);

  // 2. Cesiones a Recría/Engorde (movimientos de traslado desde rodeos Cría a Recría/Engorde)
  const rodeosPorId = Object.fromEntries(rodeos.map(r=>[String(r.rodeo_id),r]));
  const cesiones = movs.filter(m => {
    if (m.tipo !== 'Traslado en bloque' && m.tipo !== 'Traslado individual') return false;
    const origen  = rodeosPorId[String(m.rodeo_origen_id)];
    const destino = rodeosPorId[String(m.rodeo_destino_id)];
    return origen && normAct_(origen.actividad)==='cria' &&
           destino && (normAct_(destino.actividad)==='recria'||normAct_(destino.actividad)==='engorde'||normAct_(destino.actividad)==='terminacion');
  });
  // Valorizar cesiones — misma lógica que el panel de detalle para que coincidan
  // Prioridad: precio_kg → precio_cabeza (como $/kg en cesiones) → valorización del mes
  const totalCesiones = cesiones.reduce((s,m) => {
    const cant     = Number(m.cantidad)||0;
    const peso     = Number(m.peso_prom_kg)||0;
    const precioKg = Number(m.precio_kg)||Number(m.precio_cabeza)||0;
    if (precioKg && peso) {
      return s + cant * peso * precioKg;
    } else if (precioKg && !peso) {
      // Tiene precio pero no peso — buscar peso de última pesada del rodeo
      const pesadasRodeo = pesadas.filter(p=>String(p.rodeo_id)===String(m.rodeo_origen_id)&&String(p.fecha)<=String(m.fecha)).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
      const pesoFallback = pesadasRodeo[0] ? Number(pesadasRodeo[0].peso_prom_kg)||0 : 0;
      return s + cant * pesoFallback * precioKg;
    } else {
      // Sin precio — valorizar con precios de stock del mes
      const rodeo = rodeosPorId[String(m.rodeo_origen_id)];
      const cat = (rodeo?.categoria||'').toLowerCase().trim();
      const pesadasRodeo = pesadas.filter(p=>String(p.rodeo_id)===String(m.rodeo_origen_id)).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
      const pesoP = pesadasRodeo[0] ? Number(pesadasRodeo[0].peso_prom_kg)||0 : 0;
      return s + valorizarRodeo_(rodeo||{categoria:cat}, cant, pesoP);
    }
  }, 0);

  // 3. Stock valorizado actual (rodeos Cría)
  const stockPorRodeo = {};
  movs.forEach(m => {
    const cant = Number(m.cantidad)||0;
    if (m.tipo==='Saldo inicial') {
      stockPorRodeo[String(m.rodeo_destino_id)] = (stockPorRodeo[String(m.rodeo_destino_id)]||0) + cant;
    } else if (m.tipo==='Traslado en bloque'||m.tipo==='Traslado individual') {
      if (m.rodeo_origen_id)  stockPorRodeo[String(m.rodeo_origen_id)]  = (stockPorRodeo[String(m.rodeo_origen_id)] ||0) - cant;
      if (m.rodeo_destino_id) stockPorRodeo[String(m.rodeo_destino_id)] = (stockPorRodeo[String(m.rodeo_destino_id)]||0) + cant;
    }
  });
  ventas.forEach(v => {
    stockPorRodeo[String(v.rodeo_id)] = (stockPorRodeo[String(v.rodeo_id)]||0) - (Number(v.cant_animales)||0);
  });
  // Restar mortandad — igual que el backend getStockTodos, respetando la fecha de corte
  mortandadCria.forEach(m => {
    stockPorRodeo[String(m.rodeo_id)] = (stockPorRodeo[String(m.rodeo_id)]||0) - (Number(m.cantidad)||1);
  });

  let stockValCria = 0;
  const stockDetalleRows = [];
  rodeosCriaFilt.forEach(r => {
    const stock = Math.max(0, stockPorRodeo[String(r.rodeo_id)]||0);
    if (!stock) return;
    const pesadasR = pesadas.filter(p=>String(p.rodeo_id)===String(r.rodeo_id)).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
    const pesoP = pesadasR[0] ? Number(pesadasR[0].peso_prom_kg)||0 : 0;
    const val = valorizarRodeo_(r, stock, pesoP);
    stockValCria += val;
    if (val > 0 || stock > 0) stockDetalleRows.push({ rodeo: r, stock, pesoP, val });
  });

  const totalIngresos = totalVentas + totalCesiones + stockValCria;

  // ── EGRESOS ─────────────────────────────────────────────────────────
  // 1. Stock inicial (saldos iniciales de rodeos Cría, filtrado por campo)
  // Se excluyen acá los "Saldo inicial" que en realidad son altas por Parición
  // (identificados por el tag [pid:...] en observaciones) — esos no son carga
  // inicial de stock, son nacimientos del período, y se muestran aparte más
  // abajo para que el Existencia (EI + Nacimientos − Ventas − Mortandad = EF)
  // cierre de forma intuitiva en los reportes.
  const saldosIniciales = movs.filter(m => {
    if (m.tipo !== 'Saldo inicial') return false;
    if (esAltaPorParicion_(m)) return false;
    if (!rodeosCriaIds.has(String(m.rodeo_destino_id))) return false;
    if (campSelecField && String(m.campo_destino_id) !== String(campSelecField)) return false;
    return true;
  });
  const totalSaldoInicial = saldosIniciales.reduce((s,m) => s + valorMovimientoEntrada_(m).total, 0);

  // Altas por Parición (nacimientos) del período — mismo universo de rodeos/campo
  // que saldosIniciales, pero solo los que tienen el tag [pid:...].
  const altasParicionCria = movs.filter(m => {
    if (!esAltaPorParicion_(m)) return false;
    if (!rodeosCriaIds.has(String(m.rodeo_destino_id))) return false;
    if (campSelecField && String(m.campo_destino_id) !== String(campSelecField)) return false;
    return true;
  });
  const nacCabCria = altasParicionCria.reduce((s,m) => s+(Number(m.cantidad)||0), 0);
  // Valor de esos nacimientos — se valorizan igual que el stock (Precios de
  // Valorización del rodeo de terneros/as que los recibió), no a precio de
  // costo (que es 0, un ternero recién nacido no tiene "precio de compra").
  const nacImpCria = altasParicionCria.reduce((s,m) => {
    const rodeoDest = rodeosPorId[String(m.rodeo_destino_id)];
    if (!rodeoDest) return s;
    const pesadasDest = pesadas.filter(p=>String(p.rodeo_id)===String(rodeoDest.rodeo_id)).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
    const pesoDest = pesadasDest[0] ? Number(pesadasDest[0].peso_prom_kg)||0 : 0;
    return s + valorizarRodeo_(rodeoDest, Number(m.cantidad)||0, pesoDest);
  }, 0);

  // 2. Compras hacienda de la campaña (rodeos Cría)
  const comprasCria = comprasH.filter(c => c.campana===campSelec && (!campSelecField || String(c.campo_id)===String(campSelecField)));
  const totalCompras = comprasCria.reduce((s,c) => s+(Number(c.importe_total)||0), 0);

  // 3. Insumos consumidos campaña (alimentación y veterinaria) en rodeos Cría
  const prodPorId = Object.fromEntries((productos||[]).map(p=>[String(p.producto_id),p]));
  const consumosCria = consumos.filter(c => rodeosCriaIds.has(String(c.rodeo_id)) && (!campSelecField || String(c.campo_id)===String(campSelecField)));
  let totalAlim = 0, totalVeter = 0;
  const detalleAlimCria = [], detalleVetCria = [];
  consumosCria.forEach(c => {
    const prod = prodPorId[String(c.producto_id)];
    const cat = (prod?.categoria||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const costo = (Number(c.cantidad)||0) * egPrecioVigenteProducto_(c.producto_id, c.fecha);
    if (cat.includes('veterin')||cat.includes('sanid')) {
      totalVeter += costo;
      detalleVetCria.push({fecha:c.fecha,prod:prod?.nombre||'—',cant:Number(c.cantidad)||0,rodeo:rodeoNombre(c.rodeo_id),costo});
    } else {
      totalAlim += costo;
      detalleAlimCria.push({fecha:c.fecha,prod:prod?.nombre||'—',cant:Number(c.cantidad)||0,rodeo:rodeoNombre(c.rodeo_id),costo});
    }
  });

  // 4. Sueldos imputados a Cría (filtrado por campo si corresponde, y por fecha de
  // corte — antes sumaba TODOS los sueldos cargados alguna vez, de cualquier mes
  // o año, igual que Compras/Alimentación/Veterinaria deben respetar el corte).
  const totalSueldosCria = sueldoTotalActividad_('cria', s =>
    (!campSelecField || String(s.campo_id) === String(campSelecField)) &&
    String(s.periodo).slice(0,7) <= corteCria.slice(0,7)
  );

  const totalEgresos = totalSaldoInicial + totalCompras + totalAlim + totalVeter + totalSueldosCria;
  const margen = totalIngresos - totalEgresos;

  // ── MARGEN BRUTO POR HECTÁREA ────────────────────────────────────────────
  // Hectáreas: si hay un campo elegido en el filtro, se usan las hectáreas de
  // ESE campo. Si el filtro está en "todos los campos", se suman las hectáreas
  // de todos los campos que tienen al menos un rodeo de Cría (aunque hoy no
  // tenga stock) — son las hectáreas dedicadas a esta actividad. Los campos sin
  // hectáreas cargadas quedan afuera de la suma y se avisa en pantalla.
  const camposTodos_ = (S.catalogs && S.catalogs.campos) || [];
  const campoPorId_ = Object.fromEntries(camposTodos_.map(c => [String(c.campo_id), c]));
  let haCria = 0, camposCriaSinHa = false;
  if (campSelecField) {
    const c = campoPorId_[String(campSelecField)];
    const ha = c ? Number(c.superficie_ha) || 0 : 0;
    if (ha > 0) haCria = ha; else camposCriaSinHa = true;
  } else {
    const campoIdsCria_ = [...new Set(rodeosCria.map(r => String(r.campo_id)).filter(Boolean))];
    campoIdsCria_.forEach(cid => {
      const ha = Number(campoPorId_[cid]?.superficie_ha) || 0;
      if (ha > 0) haCria += ha; else camposCriaSinHa = true;
    });
  }
  const margenPorHa = haCria > 0 ? margen / haCria : null;

  // Cabezas de EI (saldos iniciales) y EF (stock final) — para el Reporte Directorio,
  // que muestra la Existencia tanto en cabezas como en importe.
  const eiCabCria = saldosIniciales.reduce((s,m) => s+(Number(m.cantidad)||0), 0);
  const efCabCria = stockDetalleRows.reduce((s,r) => s+(Number(r.stock)||0), 0);

  // Términos en cabezas para la Conciliación de Existencia (EI+Compras+Cesiones
  // recibidas+Nacimientos-Cesiones enviadas-Ventas-Mortandad=EF) — se calculan
  // acá para poder guardarlos y reutilizarlos también en el control consolidado
  // del Margen Bruto, sin recalcular todo de nuevo ahí.
  const clasCria = clasificarTrasladosActividad_(rodeosCriaIds, movs);
  const ventasCabCria = ventasCria.reduce((s,v) => s + (Number(v.cant_animales)||0), 0);
  const mortCabCria = mortandadCria.filter(m => rodeosCriaIds.has(String(m.rodeo_id))).reduce((s,m) => s + (Number(m.cantidad)||1), 0);

  // Guardar resultados para que Resultados Económicos los lea directamente
  S._resultCria = {
    ing: totalIngresos, eg: totalEgresos, margen,
    ingVentas: totalVentas, ingCesiones: totalCesiones, ef: stockValCria,
    ei: totalSaldoInicial, compras: totalCompras, egAlim: totalAlim, egVet: totalVeter, egSueldos: totalSueldosCria,
    cantVentas: ventasCria.length,
    eiCab: eiCabCria, efCab: efCabCria, nacCab: nacCabCria, nacImp: nacImpCria,
    comprasCab: clasCria.compras, cesRecCab: clasCria.cesionesRecibidas, cesEnvCab: clasCria.cesionesEnviadas,
    ventasCab: ventasCabCria, mortCab: mortCabCria,
  };

  // ── RENDER ──────────────────────────────────────────────────────────
  // Panel ingresos/egresos
  h += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px">

    <!-- INGRESOS -->
    <div class="panel" style="margin-bottom:0">
      <div class="panel-title" style="color:var(--green-text)">📈 Ingresos — Campaña ${campSelec}${campSelecField ? ' · '+campoNombre(campSelecField) : ''}</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
          <div>
            <div style="font-weight:600">💰 Ventas de hacienda</div>
            <div style="font-size:11px;color:var(--text3)">${ventasCria.length} ventas liquidadas</div>
          </div>
          <div style="font-size:18px;font-weight:700;color:var(--green)">${fmCria_(totalVentas)}</div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
          <div>
            <div style="font-weight:600">🔄 Cesiones a Recría/Engorde</div>
            <div style="font-size:11px;color:var(--text3)">${cesiones.length} traslados valorizados</div>
          </div>
          <div style="font-size:18px;font-weight:700;color:var(--green)">${fmCria_(totalCesiones)}</div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0">
          <div>
            <div style="font-weight:600">📦 Stock valorizado actual</div>
            <div style="font-size:11px;color:var(--text3)">${haPrecios ? (stockDetalleRows.length + ' rodeos') : '⚠ Sin precios configurados'}</div>
          </div>
          <div style="font-size:18px;font-weight:700;color:var(--green)">${fmonACorte_(stockValCria, _criaMoneda, corteCria)}</div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--green-bg);border-radius:8px;margin-top:4px">
          <div style="font-weight:700;font-size:14px">TOTAL INGRESOS</div>
          <div style="font-size:28px;font-weight:800;color:var(--green)">${fmCria_(totalIngresos)}</div>
        </div>
      </div>
    </div>

    <!-- EGRESOS -->
    <div class="panel" style="margin-bottom:0">
      <div class="panel-title" style="color:var(--clay-text)">📉 Egresos — Campaña ${campSelec}${campSelecField ? ' · '+campoNombre(campSelecField) : ''}</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
          <div>
            <div style="font-weight:600">🐄 Stock inicial</div>
            <div style="font-size:11px;color:var(--text3)">${saldosIniciales.length} rodeos — precio/cabeza cargado</div>
          </div>
          <div style="font-size:18px;font-weight:700;color:var(--clay)">${fmCria_(totalSaldoInicial)}</div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
          <div>
            <div style="font-weight:600">🛒 Compras de hacienda</div>
            <div style="font-size:11px;color:var(--text3)">${comprasCria.length} compras campaña ${campSelec}</div>
          </div>
          <div style="font-size:18px;font-weight:700;color:var(--clay)">${fmCria_(totalCompras)}</div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
          <div><div style="font-weight:600">🌿 Alimentación e insumos</div></div>
          <div style="font-size:18px;font-weight:700;color:var(--clay)">${totalAlim>0?fmCria_(totalAlim):'—'}</div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
          <div><div style="font-weight:600">💉 Veterinaria</div></div>
          <div style="font-size:18px;font-weight:700;color:var(--clay)">${totalVeter>0?fmCria_(totalVeter):'—'}</div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
          <div>
            <div style="font-weight:600">👤 Sueldos imputados a Cría</div>
            <div style="font-size:11px;color:var(--text3)">histórico total de sueldos × % Cría</div>
          </div>
          <div style="font-size:18px;font-weight:700;color:var(--clay)">${fmCria_(totalSueldosCria)}</div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--clay-bg);border-radius:8px;margin-top:4px">
          <div style="font-weight:700;font-size:14px">TOTAL EGRESOS</div>
          <div style="font-size:28px;font-weight:800;color:var(--clay)">${fmCria_(totalEgresos)}</div>
        </div>
      </div>
    </div>
  </div>`;

  // ── MARGEN ──────────────────────────────────────────────────────────
  const margenColor = margen >= 0 ? 'var(--green)' : 'var(--red)';
  const margenBg    = margen >= 0 ? 'var(--green-bg)' : 'rgba(220,50,50,0.08)';
  h += `<div style="background:${margenBg};border-radius:10px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
    <div>
      <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:${margenColor}">Margen Bruto — Cría ${campSelec}</div>
      <div style="font-size:11px;color:var(--text2);margin-top:3px">Ingresos − Egresos (excluye insumos por configurar)</div>
    </div>
    <div style="font-size:32px;font-weight:800;color:${margenColor}">${margen>=0?'':'-'}${fmCria_(Math.abs(margen))}</div>
  </div>`;

  if (margenPorHa !== null || camposCriaSinHa) {
    h += `<div style="background:var(--bg2);border-radius:10px;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <div>
        <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text2)">Margen Bruto / ha</div>
        <div style="font-size:11px;color:var(--text3);margin-top:3px">${campSelecField?campoNombre(campSelecField):'Todos los campos con Cría'} · ${fn(haCria,0)} ha${camposCriaSinHa?' · ⚠ hay campos sin hectáreas cargadas, no entran en la suma':''}</div>
      </div>
      <div style="font-size:24px;font-weight:800;color:${margenColor}">${margenPorHa!==null?(margenPorHa>=0?'':'-')+fmCria_(Math.abs(margenPorHa)):'—'}</div>
    </div>`;
  }

  // ── Detalle stock valorizado (EF) ─────────────────────────────────────────
  if (stockDetalleRows.length) {
    h += `<div class="panel">
      <div class="panel-title">📦 Stock final valorizado (EF) — por rodeo</div>
      <div class="tw"><table class="dt"><thead><tr>
        <th>Rodeo</th><th>Campo</th><th>Categoría</th>
        <th class="tc">Stock</th><th class="tr">Peso prom.</th>
        <th class="tr">Método</th><th class="tr">Valor total</th>
      </tr></thead><tbody>`;
    stockDetalleRows.forEach(row => {
      const metodo = metodoValorizacion_(row.rodeo, row.pesoP);
      h += `<tr>
        <td><strong>${row.rodeo.nombre}</strong></td>
        <td>${campoNombre(row.rodeo.campo_id)}</td>
        <td>${row.rodeo.categoria||'—'}</td>
        <td class="tc">${fn(row.stock)}</td>
        <td class="tr">${row.pesoP ? fn(row.pesoP)+' kg' : '—'}</td>
        <td class="tr" style="font-size:11px;color:var(--text3)">${metodo}</td>
        <td class="tr"><strong>${fmCria_(row.val)}</strong></td>
      </tr>`;
    });
    h += `<tr style="background:var(--bg2);font-weight:800">
      <td colspan="3" class="tr">TOTAL EF</td>
      <td class="tc">${fn(stockDetalleRows.reduce((s,r)=>s+r.stock,0))} cab.</td>
      <td colspan="2"></td>
      <td class="tr" style="color:var(--green-text);font-size:15px">${fmonACorte_(stockValCria, _criaMoneda, corteCria)}</td>
    </tr>`;
    h += '</tbody></table></div></div>';
  }

  // ── Conciliación de Existencia (cabezas) — control cruzado EI/EF ────────
  h += buildConciliacionCabezas_('Cría', {
    ei: eiCabCria, compras: clasCria.compras, cesionesRecibidas: clasCria.cesionesRecibidas,
    nacimientos: nacCabCria, cesionesEnviadas: clasCria.cesionesEnviadas,
    ventas: ventasCabCria, mortandad: mortCabCria,
  }, efCabCria);
  if (saldosIniciales.length) {
    h += `<div class="panel">
      <div class="panel-title">📋 Saldo inicial (EI) — por rodeo</div>
      <div class="tw"><table class="dt"><thead><tr>
        <th>Fecha</th><th>Rodeo</th><th class="tc">Cabezas</th>
        <th class="tr">Precio</th><th class="tr">Total</th>
      </tr></thead><tbody>`;
    let totEI = 0;
    saldosIniciales.forEach(m => {
      const cant = Number(m.cantidad)||0;
      const { total, precioLabel } = valorMovimientoEntrada_(m);
      totEI += total;
      const rodeo = rodeosPorId[String(m.rodeo_destino_id)];
      h += `<tr>
        <td>${fd(m.fecha)}</td>
        <td><strong>${rodeo?.nombre||'—'}</strong></td>
        <td class="tc">${fn(cant)}</td>
        <td class="tr">${precioLabel || '<span style="color:var(--clay-text);font-size:11px">⚠ sin precio</span>'}</td>
        <td class="tr"><strong>${total ? fmCria_(total) : '—'}</strong></td>
      </tr>`;
    });
    h += `<tr style="background:var(--bg2);font-weight:800">
      <td colspan="4" class="tr">TOTAL EI</td>
      <td class="tr" style="color:var(--clay-text);font-size:15px">${fmCria_(totEI)}</td>
    </tr>`;
    h += '</tbody></table></div></div>';
  }

  // ── Detalle Cesiones enviadas a Recría ─────────────────────────────────────────
  if (cesiones.length) {
    h += `<div class="panel">
      <div class="panel-title">⬆ Cesiones enviadas a Recría — detalle</div>
      <div class="tw"><table class="dt"><thead><tr>
        <th>Fecha</th><th>Rodeo origen</th><th>Rodeo destino</th>
        <th class="tc">Cab.</th><th class="tc">Kg prom.</th>
        <th class="tr">$/kg</th><th class="tr">Total</th>
      </tr></thead><tbody>`;
    let totCes = 0;
    cesiones.forEach(m => {
      const cant = Number(m.cantidad)||0;
      const peso = Number(m.peso_prom_kg)||0;
      const precioKg = Number(m.precio_kg)||Number(m.precio_cabeza)||0;
      let total = 0, pesoUsado = peso;
      if (precioKg && peso) {
        total = cant * peso * precioKg;
      } else if (precioKg && !peso) {
        // Precio pero sin peso — busca peso de última pesada antes de la fecha
        const pesadasR = pesadas.filter(p=>String(p.rodeo_id)===String(m.rodeo_origen_id)&&String(p.fecha)<=String(m.fecha)).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
        pesoUsado = pesadasR[0] ? Number(pesadasR[0].peso_prom_kg)||0 : 0;
        total = cant * pesoUsado * precioKg;
      } else {
        const rodeo = rodeosPorId[String(m.rodeo_origen_id)];
        const pesadasR = pesadas.filter(p=>String(p.rodeo_id)===String(m.rodeo_origen_id)).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
        pesoUsado = pesadasR[0] ? Number(pesadasR[0].peso_prom_kg)||0 : 0;
        total = valorizarRodeo_(rodeo||{}, cant, pesoUsado);
      }
      totCes += total;
      const or = rodeosPorId[String(m.rodeo_origen_id)];
      const de = rodeosPorId[String(m.rodeo_destino_id)];
      const sinPrecio = !precioKg;
      h += `<tr${sinPrecio?' style="background:rgba(200,150,40,0.06)"':''}>
        <td>${fd(m.fecha)}</td>
        <td><strong>${or?.nombre||'—'}</strong></td>
        <td>${de?.nombre||'—'}</td>
        <td class="tc">${fn(cant)}</td>
        <td class="tc">${pesoUsado?fn(pesoUsado)+' kg'+(peso?'':' <span style="font-size:10px;color:var(--text3)">(pesada)</span>'):'—'}</td>
        <td class="tr">${precioKg?'$ '+fn(precioKg):'<span style="color:var(--gold-text);font-size:11px">⚠ valor del mes</span>'}</td>
        <td class="tr"><strong>${fmCria_(total)}</strong></td>
      </tr>`;
    });
    h += `<tr style="background:var(--bg2);font-weight:800">
      <td colspan="6" class="tr">TOTAL cesiones</td>
      <td class="tr" style="color:var(--green-text);font-size:15px">${fmCria_(totCes)}</td>
    </tr>`;
    h += '</tbody></table></div></div>';
  }

  // ── Detalle Ventas ─────────────────────────────────────────
  if (ventasCria.length) {
    h += `<div class="panel">
      <div class="panel-title">💰 Ventas — detalle</div>
      <div class="tw"><table class="dt"><thead><tr>
        <th>Fecha</th><th>Rodeo</th><th class="tc">Cab.</th>
        <th class="tr">Kg campo</th><th class="tr">Precio pactado</th>
        <th class="tr">Importe liq.</th><th class="tr">Total</th>
      </tr></thead><tbody>`;
    let totVentas = 0;
    ventasCria.slice().sort((a,b)=>String(a.fecha_salida||'').localeCompare(String(b.fecha_salida||''))).forEach(v => {
      const cant = Number(v.cant_animales)||0;
      const kg = Number(v.peso_campo_kg)||0;
      const pPact = Number(v.precio_pactado)||0;
      const imLiq = Number(v.importe_liq)||0;
      const total = imLiq || (pPact * kg) || 0;
      totVentas += total;
      const rodeo = rodeosPorId[String(v.rodeo_id)];
      const sinLiq = !imLiq;
      h += `<tr${sinLiq?' style="background:rgba(200,150,40,0.04)"':''}>
        <td>${fd(v.fecha_salida)}</td>
        <td><strong>${rodeo?.nombre||'—'}</strong></td>
        <td class="tc">${fn(cant)}</td>
        <td class="tr">${kg?fn(kg)+' kg':'—'}</td>
        <td class="tr">${pPact?'$ '+fn(pPact)+'/kg':'—'}</td>
        <td class="tr">${imLiq?fmCria_(imLiq):'<span style="color:var(--gold-text);font-size:11px">pendiente</span>'}</td>
        <td class="tr"><strong>${total?fmCria_(total):'—'}</strong></td>
      </tr>`;
    });
    h += `<tr style="background:var(--bg2);font-weight:800">
      <td colspan="6" class="tr">TOTAL ventas</td>
      <td class="tr" style="color:var(--green-text);font-size:15px">${fmCria_(totVentas)}</td>
    </tr>`;
    h += '</tbody></table></div></div>';
  }

  // ── Detalle Alimentación e Insumos ────────────────────────────────────────
  const buildInsumoTableCria_ = (filas, titulo) => {
    if (!filas.length) return '';
    let t = `<div class="panel"><div class="panel-title">${titulo}</div>
      <div class="tw"><table class="dt"><thead><tr>
        <th>Fecha</th><th>Producto</th><th>Rodeo</th><th class="tc">Cantidad</th><th class="tr">Costo</th>
      </tr></thead><tbody>`;
    let tot = 0;
    filas.slice().sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha))).forEach(d=>{
      tot+=d.costo;
      t+=`<tr><td>${fd(d.fecha)}</td><td>${d.prod}</td><td>${d.rodeo}</td>
        <td class="tc">${fn(d.cant)}</td><td class="tr"><strong>${fmCria_(d.costo)}</strong></td></tr>`;
    });
    t+=`<tr style="background:var(--bg2);font-weight:800"><td colspan="4" class="tr">TOTAL</td>
      <td class="tr" style="color:var(--clay-text);font-size:15px">${fmCria_(tot)}</td></tr>`;
    return t+'</tbody></table></div></div>';
  };
  if (detalleAlimCria.length) h += buildInsumoTableCria_(detalleAlimCria, '🌿 Alimentación e insumos — detalle');
  if (detalleVetCria.length)  h += buildInsumoTableCria_(detalleVetCria,  '💉 Veterinaria — detalle');

  // Mortandad y Abortos — al final del dashboard: título + cantidad por rodeo
  // en renglones (el detalle registro por registro, si hace falta, se ve en
  // la pantalla de Mortandad/Abortos, no acá).
  const mortandadCriaFilt = (S.cache.mortandad || []).filter(m => rodeosCriaIds.has(String(m.rodeo_id)));
  const mortCriaTotal = mortandadCriaFilt.reduce((s, m) => s + (Number(m.cantidad) || 1), 0);
  const abortosCriaFilt2 = (S.cache.abortos || []).filter(a => rodeosCriaIds.has(String(a.rodeo_id)));
  const abortosCriaTotal2 = abortosCriaFilt2.length;

  const buildResumenPorRodeo_ = (porRodeo, titulo, color, colorBg, total, unidadSing, unidadPlural) => {
    let t = `<div class="panel" style="border:2px solid ${color};background:${colorBg}">
      <div class="panel-title" style="color:${color}">${titulo}</div>`;
    Object.entries(porRodeo).forEach(([rid,cant])=>{
      const r = rodeosCria.find(x=>String(x.rodeo_id)===String(rid));
      t += `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid ${color}">
        <div style="font-weight:600">${r?.nombre||'Rodeo '+rid}</div>
        <div style="font-size:16px;font-weight:700;color:${color}">${cant} ${cant===1?unidadSing:unidadPlural}</div>
      </div>`;
    });
    t += `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;margin-top:4px">
      <div style="font-weight:800">TOTAL</div>
      <div style="font-size:18px;font-weight:800;color:${color}">${total} ${total===1?unidadSing:unidadPlural}</div>
    </div></div>`;
    return t;
  };

  if (mortCriaTotal > 0) {
    const mortCriaPorRodeo = {};
    mortandadCriaFilt.forEach(m => { mortCriaPorRodeo[m.rodeo_id] = (mortCriaPorRodeo[m.rodeo_id] || 0) + (Number(m.cantidad) || 1); });
    h += buildResumenPorRodeo_(mortCriaPorRodeo, '💀 Muertes en Cría', 'var(--red)', 'rgba(200,50,50,0.06)', mortCriaTotal, 'baja', 'bajas');
    h += `<div style="font-size:12px;color:var(--red);margin:-10px 0 16px">⚠ Su impacto está reflejado en el menor stock al cierre.</div>`;
  }

  if (abortosCriaTotal2 > 0) {
    const abortosPorRodeo2 = {};
    abortosCriaFilt2.forEach(a => { abortosPorRodeo2[a.rodeo_id] = (abortosPorRodeo2[a.rodeo_id]||0) + 1; });
    h += buildResumenPorRodeo_(abortosPorRodeo2, '⊘ Abortos en Cría', 'var(--clay-text)', 'rgba(180,100,30,0.06)', abortosCriaTotal2, 'aborto', 'abortos');
  }

  return h;
}

function buildServicios() {  const _criaTabs = [
    { k: 'dashboard', icon: '◈', label: 'Dashboard' },
    { k: 'indices_reproduccion', icon: '📈', label: 'Índices de Reproducción' },
    { k: 'compras_hacienda', icon: '🛒', label: 'Compras de hacienda' },
    { k: 'servicios', icon: '⚭', label: 'Servicios' },
    { k: 'tactos', icon: '◔', label: 'Tactos' },
    { k: 'abortos', icon: '⊘', label: 'Abortos' },
    { k: 'pariciones', icon: '✦', label: 'Pariciones' },
    { k: 'destetes', icon: '⊞', label: 'Destetes' },
  ];
  const _criaTabsHtml = `<div class="page-header"><div class="page-title">Cría</div><div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">${_criaTabs.map(t=>`<button class="radio-pill${S.page===t.k?' selected':''}" onclick="goto('${t.k}')">${t.icon} ${t.label}</button>`).join('')}</div></div>`;
  let h = _criaTabsHtml;
  const items = S.cache.servicios || [];
  const campos = (S.catalogs && S.catalogs.campos) || [];
  const rodeosAptos = rodeosCriaPorCampo(campos[0]?.campo_id);
  h += `<div class="panel">
    <div class="panel-title">Registrar servicio</div>
    <div class="fgrid">
      <div class="fg" style="min-width:200px">
        <label>Tipo de servicio</label>
        <div class="radio-group" id="sv-tipo-group">
          <div class="radio-pill selected" data-tipo="IATF">IATF</div>
          <div class="radio-pill" data-tipo="Toros a campo">Toros a campo</div>
        </div>
      </div>
      <div class="fg"><label>Campo</label>
        <select id="sv-campo" onchange="document.getElementById('sv-rodeo').innerHTML = rodeoOptionsHtml(rodeosCriaPorCampo(this.value))">${campos.map(c => `<option value="${c.campo_id}">${c.nombre}</option>`).join('')}</select>
      </div>
      <div class="fg"><label>Rodeo</label>
        <select id="sv-rodeo">${rodeoOptionsHtml(rodeosAptos)}</select>
      </div>
      <div class="fg"><label>Fecha inicio</label><input type="date" id="sv-fecha-ini" value="${today()}"></div>
      <div class="fg"><label>Fecha fin <span class="opt">(opcional)</span></label><input type="date" id="sv-fecha-fin"></div>
    </div>

    <!-- IATF: múltiples toros con cantidad -->
    <div id="sv-iatf-wrap">
      <div style="margin:12px 0 6px;font-size:13px;font-weight:600;color:var(--text)">
        Toros / semen utilizado
        <span class="opt" style="font-weight:400;margin-left:6px">Cargá uno o más toros con su cantidad de vacas</span>
      </div>
      <div id="sv-toros-list">
        <div class="sv-toro-row" data-idx="0" style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
          <input type="number" class="sv-cant" placeholder="Cant. vacas" min="1" style="width:120px;padding:7px 10px;border:1px solid var(--border2);border-radius:8px;font-size:13px;background:var(--bg)">
          <input type="text" class="sv-toro-id" placeholder="Identificación toro (nombre o caravana)" style="flex:1;padding:7px 10px;border:1px solid var(--border2);border-radius:8px;font-size:13px;background:var(--bg)">
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;margin-top:4px">
        <button class="btn" id="sv-add-toro" style="padding:5px 14px;font-size:12px;background:var(--bg2);color:var(--text)">+ Agregar otro toro</button>
        <span id="sv-total-label" style="font-size:12.5px;color:var(--text2)"></span>
      </div>
    </div>

    <!-- Toros a campo: un solo toro, sin cantidad -->
    <div id="sv-toro-wrap" style="display:none;margin-top:12px">
      <div class="fg"><label>Identificación del toro <span class="opt">(nombre o caravana)</span></label>
        <input type="text" id="sv-toro" placeholder="Ej: Don Pedro / 982000...">
      </div>
    </div>

    <div class="fg" style="margin-top:12px;max-width:400px">
      <label>Observación <span class="opt">(opcional)</span></label>
      <input type="text" id="sv-obs" placeholder="Opcional">
    </div>
    <button class="btn btn-primary" id="sv-save" style="margin-top:10px">Registrar servicio</button>
  </div>`;

  // Historial — agrupar filas IATF del mismo rodeo/fecha para mostrarlas juntas
  const grupos = [];
  const vistos = new Set();
  items.forEach(item => {
    if (item.tipo === 'IATF') {
      const key = item.rodeo_id + '|' + item.fecha_inicio;
      if (!vistos.has(key)) {
        vistos.add(key);
        const grupo = items.filter(i => i.tipo === 'IATF' && i.rodeo_id === item.rodeo_id && i.fecha_inicio === item.fecha_inicio);
        grupos.push({ ...item, _toros: grupo.map(g => `${g.identificacion_toro || '—'}${g.cantidad ? ' ('+g.cantidad+' vacas)' : ''}`).join(' / ') });
      }
    } else {
      grupos.push({ ...item, _toros: item.identificacion_toro || '—' });
    }
  });

  h += buildEntityTable(grupos, [
    { key: 'fecha_inicio', label: 'Inicio', render: v => fd(v) },
    { key: 'fecha_fin', label: 'Fin', render: v => v ? fd(v) : '—' },
    { key: 'tipo', label: 'Tipo', render: v => `<span class="pill ${v === 'IATF' ? 'pill-gold' : 'pill-green'}">${v}</span>` },
    { key: 'rodeo_id', label: 'Rodeo', render: v => rodeoNombre(v) },
    { key: '_toros', label: 'Toro / Cantidad', render: v => v || '—' },
    { key: 'observacion', label: 'Obs.', render: v => v || '—' },
  ], 'servicios', 'servicio_id');

  return h;
}

function attachServiciosEvents() {
  // Guard: si los elementos no están en el DOM no hacer nada
  if (!document.getElementById('sv-save')) return;

  // Toggle IATF vs Toros a campo
  document.querySelectorAll('#sv-tipo-group .radio-pill').forEach(p => p.onclick = () => {
    document.querySelectorAll('#sv-tipo-group .radio-pill').forEach(x => x.classList.remove('selected'));
    p.classList.add('selected');
    const esIATF = p.dataset.tipo === 'IATF';
    const iatfWrap = document.getElementById('sv-iatf-wrap');
    const toroWrap = document.getElementById('sv-toro-wrap');
    if (iatfWrap) iatfWrap.style.display = esIATF ? 'block' : 'none';
    if (toroWrap) toroWrap.style.display = esIATF ? 'none' : 'block';
  });

  // Actualizar total de vacas IATF
  function actualizarTotal() {
    const filas = document.querySelectorAll('.sv-cant');
    let total = 0;
    filas.forEach(f => { const v = parseInt(f.value); if (!isNaN(v) && v > 0) total += v; });
    const lbl = document.getElementById('sv-total-label');
    if (lbl) lbl.textContent = total > 0 ? `Total: ${total} vacas` : '';
  }

  // Agregar fila de toro
  const addToroBtn = document.getElementById('sv-add-toro');
  if (addToroBtn) addToroBtn.onclick = () => {
    const list = document.getElementById('sv-toros-list');
    if (!list) return;
    const div = document.createElement('div');
    div.className = 'sv-toro-row';
    div.style.cssText = 'display:flex;gap:8px;align-items:center;margin-bottom:8px';
    div.innerHTML = `
      <input type="number" class="sv-cant" placeholder="Cant. vacas" min="1" style="width:120px;padding:7px 10px;border:1px solid var(--border2);border-radius:8px;font-size:13px;background:var(--bg)">
      <input type="text" class="sv-toro-id" placeholder="Identificación toro" style="flex:1;padding:7px 10px;border:1px solid var(--border2);border-radius:8px;font-size:13px;background:var(--bg)">
      <button class="sv-del-row btn" style="padding:5px 10px;font-size:12px;background:var(--bg2);color:var(--red)" title="Quitar fila">✕</button>`;
    div.querySelector('.sv-del-row').onclick = () => { div.remove(); actualizarTotal(); };
    div.querySelector('.sv-cant').oninput = actualizarTotal;
    list.appendChild(div);
    div.querySelector('.sv-cant').focus();
  };

  // Escuchar cambios en la primera fila de cantidad
  document.querySelectorAll('.sv-cant').forEach(el => el.oninput = actualizarTotal);

  // Guardar
  const save = document.getElementById('sv-save');
  save.onclick = async () => {
    const tipoEl = document.querySelector('#sv-tipo-group .selected');
    if (!tipoEl) return;
    const tipo = tipoEl.dataset.tipo;
    const rodeoEl = document.getElementById('sv-rodeo');
    const fechaIniEl = document.getElementById('sv-fecha-ini');
    const fechaFinEl = document.getElementById('sv-fecha-fin');
    const obsEl = document.getElementById('sv-obs');
    const rodeo_id = rodeoEl ? rodeoEl.value : '';
    const fecha_inicio = fechaIniEl ? fechaIniEl.value : '';
    const fecha_fin = fechaFinEl ? fechaFinEl.value : '';
    const observacion = obsEl ? obsEl.value.trim() : '';
    if (!fecha_inicio || !rodeo_id) { toast('Completá fecha y rodeo.', 'err'); return; }

    if (tipo === 'IATF') {
      const filas = [];
      document.querySelectorAll('.sv-toro-row').forEach(row => {
        const cantEl = row.querySelector('.sv-cant');
        const toroEl = row.querySelector('.sv-toro-id');
        if (!cantEl || !toroEl) return;
        const cant = parseInt(cantEl.value);
        const toro = toroEl.value.trim();
        if (toro && cant > 0) filas.push({ cantidad: cant, identificacion_toro: toro });
      });
      if (filas.length === 0) { toast('Completá al menos un toro con cantidad.', 'err'); return; }
      save.disabled = true;
      try {
        for (const fila of filas) {
          await apiCall('create', { body: { entity: 'servicios', data: {
            tipo, rodeo_id, fecha_inicio, fecha_fin, observacion,
            identificacion_toro: fila.identificacion_toro,
            cantidad: fila.cantidad,
          }}});
        }
        invalidateCache('servicios');
        toast(`Servicio IATF registrado — ${filas.length} toro${filas.length > 1 ? 's' : ''}`, 'ok');
        await loadEntity('servicios', true);
        render();
      } catch (err) { toast(err.message, 'err'); } finally { save.disabled = false; }

    } else {
      const toroEl = document.getElementById('sv-toro');
      const data = {
        tipo, rodeo_id, fecha_inicio, fecha_fin, observacion,
        identificacion_toro: toroEl ? toroEl.value.trim() : '',
      };
      save.disabled = true;
      try {
        await apiCall('create', { body: { entity: 'servicios', data } });
        invalidateCache('servicios');
        toast('Servicio registrado', 'ok');
        await loadEntity('servicios', true);
        render();
      } catch (err) { toast(err.message, 'err'); } finally { save.disabled = false; }
    }
  };

  attachTableDeleteEvents('servicios', 'servicio_id');
}

window.updateTactoCalc = function() {
  const total = Number(document.getElementById('tc-total') && document.getElementById('tc-total').value) || 0;
  const pren = Number(document.getElementById('tc-prenadas') && document.getElementById('tc-prenadas').value) || 0;
  const calcEl = document.getElementById('tc-calc');
  if (!calcEl) return;
  if (total > 0) {
    const vacias = total - pren;
    if (vacias < 0) { calcEl.innerHTML = '<div class="live-calc red">Las preñadas no pueden superar el total tacteadas.</div>'; return; }
    const indice = (pren / total * 100).toFixed(1);
    calcEl.innerHTML = '<div class="live-calc green">→ Vacías: ' + vacias + ' · Índice de preñez de este tacto: ' + indice + '%</div>';
  } else { calcEl.innerHTML = ''; }
};
function attachTactosEvents() {
  document.querySelectorAll('#tc-tipo-group .radio-pill').forEach(p => p.onclick = () => {

    if (!total) { toast('Ingresá el total tacteadas.', 'err'); return; }

    const data = {
      tipo_tacto: tipo,
      rodeo_id: document.getElementById('tc-rodeo').value,
      fecha: document.getElementById('tc-fecha').value,

// Columnas del historial de Abortos — se usan tanto en el render inicial como
// en el refiltrado por campo/rodeo, para que ambos pasen por buildEntityTable
// (con orden por columna clickeable) en vez de una tabla armada a mano sin sort.
const ABORTOS_COLS_ = [
  { key: 'fecha', label: 'Fecha', render: v => fd(v) },
  { key: 'rodeo_id', label: 'Rodeo', render: v => rodeoNombre(v) },
  { key: 'caravana_vaca', label: 'Caravana', render: v => v || '—' },
  { key: 'observacion', label: 'Obs.', render: v => v || '—' },
];
function attachAbortosEvents() {
  window.abFiltrarHistorial_ = function() {
    const campoId = document.getElementById('ab-hist-campo')?.value || '';
    const rodeoId = document.getElementById('ab-hist-rodeo')?.value || '';
    const items = (S.cache.abortos || []).filter(a => {
      if (rodeoId && String(a.rodeo_id) !== rodeoId) return false;
      if (campoId && !rodeoId) {
        const r = (S.catalogs?.rodeos||[]).find(x=>String(x.rodeo_id)===String(a.rodeo_id));
        if (!r || String(r.campo_id) !== campoId) return false;
      }
      return true;
    }).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
    const el = document.getElementById('ab-hist-tabla');
    if (el) { el.innerHTML = buildEntityTable(items, ABORTOS_COLS_, 'abortos', 'aborto_id'); attachTableDeleteEvents('abortos', 'aborto_id'); }
  };

  const save = document.getElementById('ab-save');
  if (save) save.onclick = async () => {
    const fecha = document.getElementById('ab-fecha').value;
    const rodeoId = document.getElementById('ab-rodeo').value;
    const obs = document.getElementById('ab-obs').value.trim();
    if (!fecha || !rodeoId) { toast('Completá fecha y rodeo.', 'err'); return; }

    // Parsear caravanas del textarea (una por línea o separadas por coma)
    const bulk = document.getElementById('ab-caravanas-bulk')?.value || '';
    const caravanas = bulk
      ? bulk.split(/[\n,]+/).map(s => s.trim()).filter(Boolean)
      : [''];  // array con un string vacío → un aborto sin caravana

    save.disabled = true;
    save.textContent = '⏳ Registrando...';
    let ok = 0, errores = 0;
    try {
      for (const caravana of caravanas) {
        const data = { fecha, rodeo_id: rodeoId, caravana_vaca: caravana, observacion: obs };
        try {
          const abResult = await apiCall('create', { body: { entity: 'abortos', data } });
          const abortoId = abResult && abResult.id;
          ok++;
          // Traslado automático a Vacas Venta
          const rodeoOrigen = rodeosTodos().find(r => String(r.rodeo_id) === String(rodeoId));
          const campoId = rodeoOrigen?.campo_id;
          const norm = s => String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
          const rodeoVacaVenta = rodeosTodos().find(r =>
            String(r.campo_id) === String(campoId) &&
            (norm(r.categoria) === 'vaca venta' || norm(r.categoria) === 'vacas venta')
          );
          if (rodeoVacaVenta) {
            const movData = {
              tipo: 'Traslado individual',
              fecha,
              rodeo_origen_id: rodeoId,
              campo_origen_id: campoId,
              rodeo_destino_id: rodeoVacaVenta.rodeo_id,
              campo_destino_id: rodeoVacaVenta.campo_id,
              cantidad: 1,
              // Tag [abid:<id>] — mismo patrón que [cid:...]/[pid:...]/[erid:...] — para
              // poder encontrar y borrar este traslado en cascada si se borra el aborto.
              // Antes no llevaba ningún tag: borrar un aborto dejaba el traslado huérfano.
              observaciones: `[abid:${abortoId}] Traslado por aborto` + (caravana ? ' — caravana ' + caravana : '') + (obs ? ' — ' + obs : ''),
            };
            await apiCall('create', { body: { entity: 'movimientos', data: movData } });
          } else {
            // Antes esto quedaba en silencio — el aborto se registraba pero la vaca
            // no se trasladaba a ningún lado sin que Crist se enterara del motivo.
            errores++;
            toast(`Aborto registrado, pero no encontré un rodeo "Vacas Venta" en el campo de "${rodeoOrigen?.nombre||rodeoId}" — la vaca no se trasladó. Creá ese rodeo o movela manualmente.`, 'err');
          }
        } catch(e) { errores++; }
      }
      invalidateCache('abortos');
      invalidateCache('movimientos');
      await loadEntity('abortos', true);
      await loadEntity('movimientos', true);
      S.stock = null; await loadStock();
      S.dashboard = null; S._resultCria = null;
      const msg = ok === 1 ? 'Aborto registrado' : ok + ' abortos registrados';
      toast(msg + (errores ? ` (${errores} con error)` : ''), ok > 0 ? 'ok' : 'err');
      if (document.getElementById('ab-caravanas-bulk')) document.getElementById('ab-caravanas-bulk').value = '';
      render();
    } catch(err) { toast(err.message, 'err'); }
    finally { save.disabled = false; save.textContent = 'Registrar aborto(s)'; }
  };
  attachTableDeleteEvents('abortos', 'aborto_id');
}

    </div>
  </div>
  <div id="mo-hist-tabla">`;

}

window.deActualizarAvisoNacimientos_ = function() {
  const aviso = document.getElementById('de-aviso-nacimientos');
  if (!aviso) return;
  const rodeoId = document.getElementById('de-rodeo')?.value;
  if (!rodeoId) { aviso.style.display = 'none'; return; }
  const { nacidos, yaDestetados, disponibles } = ternerosDisponiblesParaDestete_(rodeoId);
  const machos = Number(document.getElementById('de-machos')?.value) || 0;
  const hembras = Number(document.getElementById('de-hembras')?.value) || 0;
  const total = machos + hembras;

  if (nacidos === 0) {
    aviso.style.display = 'block';
    aviso.innerHTML = `<div style="background:rgba(200,50,50,0.1);border:1px solid var(--red);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--red);font-weight:600">
      ⚠ Este rodeo no tiene ningún nacimiento (Parición) registrado todavía. Cargá la Parición antes de destetar, o vas a estar destetando terneros que el sistema no sabe que nacieron.
    </div>`;
  } else if (total > disponibles) {
    aviso.style.display = 'block';
    aviso.innerHTML = `<div style="background:rgba(200,150,40,0.1);border:1px solid var(--clay);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--clay-text);font-weight:600">
      ⚠ Estás destetando ${fn(total)} terneros, pero este rodeo tiene ${fn(disponibles)} disponibles (${fn(nacidos)} nacidos${yaDestetados>0?' − '+fn(yaDestetados)+' ya destetados':''}). Revisá si falta cargar alguna Parición.
    </div>`;
  } else {
    aviso.style.display = 'block';
    aviso.innerHTML = `<div style="background:var(--green-bg);border:1px solid var(--green);border-radius:8px;padding:8px 14px;font-size:12.5px;color:var(--green-text)">
      ✓ ${fn(disponibles)} terneros disponibles para destetar en este rodeo (${fn(nacidos)} nacidos${yaDestetados>0?', '+fn(yaDestetados)+' ya destetados':''}).
    </div>`;
  }
};

function attachDestetesEvents() {
  deActualizarAvisoNacimientos_();
  const save = document.getElementById('de-save');
  if (save) save.onclick = async () => {
    const machos = Number(document.getElementById('de-machos').value) || 0;
    const hembras = Number(document.getElementById('de-hembras').value) || 0;
    if (machos === 0 && hembras === 0) { toast('Ingresá machos o hembras destetados.', 'err'); return; }
    const peso = Number(document.getElementById('de-peso').value) || 0;
    if (peso <= 0) { toast('El peso promedio es obligatorio — se usa para calcular la cesión interna a Recría. Si no pesaste, cargá una estimación.', 'err'); return; }
    const data = {
      fecha: document.getElementById('de-fecha').value,
      rodeo_id: document.getElementById('de-rodeo').value,
      machos, hembras, total: machos + hembras,
      peso_prom_kg: peso,
      observacion: document.getElementById('de-obs').value.trim(),
    };
    if (!data.fecha || !data.rodeo_id) { toast('Completá fecha y rodeo.', 'err'); return; }

    // Validación: no permitir destetar más terneros de los que realmente nacieron
    // (o sin ningún nacimiento registrado) — evita un destete "fantasma" por olvido
    // de cargar la Parición correspondiente.
    const { nacidos, disponibles } = ternerosDisponiblesParaDestete_(data.rodeo_id);
    if (nacidos === 0) {
      const continuar = confirm('⚠ Este rodeo no tiene ningún nacimiento (Parición) registrado. ¿Seguro que querés registrar el destete igual?\n\nSi todavía no cargaste la Parición, cancelá y cargala primero.');
      if (!continuar) return;
    } else if (data.total > disponibles) {
      const continuar = confirm('⚠ Estás destetando ' + data.total + ' terneros, pero solo hay ' + disponibles + ' disponibles en este rodeo (según las Pariciones cargadas).\n\n¿Seguro que querés continuar igual?');
      if (!continuar) return;
    }

    const trasladar = document.getElementById('de-trasladar-check')?.checked;
    const rodeoDestRecria = document.getElementById('de-trasl-rodeo')?.value;
    if (trasladar && !rodeoDestRecria) { toast('Elegí el rodeo de Recría destino, o destildá "Trasladar a Recría".', 'err'); return; }

    save.disabled = true;
    try {
      await apiCall('create', { body: { entity: 'destetes', data } });
      invalidateCache('destetes');

      if (trasladar && rodeoDestRecria) {
        const rodeoOrigen = rodeosTodos().find(r => String(r.rodeo_id) === String(data.rodeo_id));
        const rodeoDestino = rodeosTodos().find(r => String(r.rodeo_id) === String(rodeoDestRecria));
        const movData = {
          tipo: 'Traslado en bloque',
          fecha: data.fecha,
          campo_origen_id: rodeoOrigen ? rodeoOrigen.campo_id : '',
          rodeo_origen_id: data.rodeo_id,
          campo_destino_id: rodeoDestino ? rodeoDestino.campo_id : document.getElementById('de-trasl-campo')?.value,
          rodeo_destino_id: rodeoDestRecria,
          cantidad: data.total,
          peso_prom_kg: peso,
          observaciones: 'Traslado por destete — ' + data.total + ' terneros (' + machos + ' machos, ' + hembras + ' hembras)',
        };
        await apiCall('create', { body: { entity: 'movimientos', data: movData } });
        invalidateCache('movimientos');
        await loadEntity('movimientos', true);
        S.stock = null; await loadStock();
        toast('✓ Destete registrado y trasladado a "' + (rodeoDestino?.nombre || 'Recría') + '"', 'ok');
      } else {
        toast('Destete registrado — ' + data.total + ' terneros', 'ok');
      }

      await loadEntity('destetes', true);
      S.dashboard = null; S._resultCria = null;
      S.margenBruto = null; S._resultCria = null; S._resultRecria = null; S._resultEng = null;
      render();
    } catch (err) { toast(err.message, 'err'); } finally { save.disabled = false; }
  };
  attachTableDeleteEvents('destetes', 'destete_id');
}

function actividadPorCategoria_(categoria) {
  const c = String(categoria || '').trim().toLowerCase();
  const mapa = {
    'vaca': 'Cría',
    'vacas': 'Cría',
    'vaca venta': 'Venta',
    'vacas venta': 'Venta',
    'vaquillona': 'Cría',
    'vaquillonas': 'Cría',
    'vaquillona próximo servicio': 'Recría',
    'vaquillonas próximo servicio': 'Recría',
    'vaquillona venta': 'Venta',
    'vaquillonas venta': 'Venta',
    'vaquillona para venta': 'Venta',
    'vaquillonas para venta': 'Venta',
    'novillito': 'Recría',
    'novillitos': 'Recría',
    'vaquilloncita': 'Recría',
    'vaquilloncitas': 'Recría',
    'ternero': 'Recría',
    'terneros': 'Recría',
    'ternera': 'Recría',
    'terneras': 'Recría',
    'novillo': 'Engorde',
    'novillos': 'Engorde',
  };
  return mapa[c] || 'Otra';
}

function buildStockTable_(stockList, campoFiltro, categoriaFiltro) {
  let filtrado = campoFiltro ? stockList.filter(s => String(s.campo_id) === String(campoFiltro)) : stockList;
  if (categoriaFiltro) filtrado = filtrado.filter(s => s.categoria === categoriaFiltro);
  if (!stockList.length) {
    return `<div class="empty-state"><span class="ico">◌</span><div class="msg">Cargando stock…</div></div>`;
  }
  const incluirCorralesPorCategoria = !categoriaFiltro || categoriaFiltro === 'engorde (Corrales)';
  const corralesDisponible = S.corralesStock && typeof S.corralesStock === 'object' && incluirCorralesPorCategoria;
  const corralesPorCampo = corralesDisponible ? corralesStockPorCampoNombre_() : {};
  const nombreCampoFiltro = campoFiltro ? campoNombre(campoFiltro) : null;
  const corralesEnEsteFiltro = corralesDisponible
    ? (campoFiltro ? (corralesPorCampo[nombreCampoFiltro] || 0) : Object.values(corralesPorCampo).reduce((s, x) => s + x, 0))
    : 0;
  const corralesFilas = corralesDisponible
    ? Object.entries(S.corralesStock)
        .map(([cid, stock]) => ({
          nombre: `Corral ${cid} (Corrales)`,
          campo: CORRAL_CAMPO_NOMBRE_[cid] || 'Sin campo asignado',
          categoria: 'engorde (Corrales)',
          stock,
        }))
        .filter(c => !campoFiltro || c.campo === nombreCampoFiltro)
    : [];

  const totalGeneral = filtrado.reduce((s, x) => s + (Number(x.stock) || 0), 0) + corralesEnEsteFiltro;
  const porCategoria = {};
  filtrado.forEach(s => { porCategoria[s.categoria] = (porCategoria[s.categoria] || 0) + (Number(s.stock) || 0); });
  const porCampo = {};
  filtrado.forEach(s => {
    const nombreCampo = campoNombre(s.campo_id);
    porCampo[nombreCampo] = (porCampo[nombreCampo] || 0) + (Number(s.stock) || 0);
  });
  if (!campoFiltro && corralesDisponible) {
    Object.entries(corralesPorCampo).forEach(([campo, tot]) => {
      porCampo[campo] = (porCampo[campo] || 0) + tot;
    });
  }
  const ordenActividad = ['Cría', 'Recría', 'Engorde', 'Venta', 'Otra'];
  const porActividad = {};
  filtrado.forEach(s => {
    const act = actividadPorCategoria_(s.categoria);
    porActividad[act] = (porActividad[act] || 0) + (Number(s.stock) || 0);
  });
  if (corralesDisponible) {
    porActividad['Engorde'] = (porActividad['Engorde'] || 0) + corralesEnEsteFiltro;
  }
  const porActividadOrdenado = ordenActividad.filter(a => porActividad[a]);
  const notaCorrales = !incluirCorralesPorCategoria ? '' : (S.corralesStock === undefined
    ? '<div style="font-size:12.5px;color:var(--text2);margin-bottom:8px">Cargando stock de Corrales…</div>'
    : (S.corralesStock === null
      ? '<div style="font-size:12.5px;color:var(--clay-text);margin-bottom:8px">⚠ No se pudo traer el stock de Corrales en este momento.</div>'
      : (corralesDisponible ? `<div style="font-size:12.5px;color:var(--text2);margin-bottom:8px">El total y Engorde incluyen ${fn(corralesEnEsteFiltro)} animales de Corrales (dato en vivo)${campoFiltro ? ' en este campo' : ''}.</div>` : '')));

  let h = `<div style="margin-bottom:16px">
    ${notaCorrales}
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px">
      <div style="background:var(--green-bg);color:var(--green-text);border-radius:9px;padding:8px 15px;font-size:14.5px;font-weight:700;white-space:nowrap">
        ⛭ Total: ${fn(totalGeneral)}
      </div>
      ${porActividadOrdenado.map(act => `
        <div style="background:var(--gold-bg, var(--bg2));color:var(--gold-text, var(--text2));border-radius:9px;padding:8px 15px;font-size:14.5px;font-weight:700;white-space:nowrap">
          ${act}: <strong>${fn(porActividad[act])}</strong>
        </div>
      `).join('')}
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px">
      ${Object.entries(porCategoria).filter(([cat, tot]) => tot).map(([cat, tot]) => `
        <div style="background:var(--bg2);color:var(--text2);border-radius:9px;padding:8px 15px;font-size:14.5px;font-weight:600;white-space:nowrap">
          ${cat}: <strong style="color:var(--text)">${fn(tot)}</strong>
        </div>
      `).join('')}
    </div>
    ${!campoFiltro ? `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px">
      ${Object.entries(porCampo).filter(([campo, tot]) => tot).map(([campo, tot]) => `
        <div style="background:var(--bg2);color:var(--text2);border-radius:9px;padding:8px 15px;font-size:14.5px;font-weight:600;white-space:nowrap">
          📍 ${campo}: <strong style="color:var(--text)">${fn(tot)}</strong>
        </div>
      `).join('')}
    </div>` : ''}
    ${corralesFilas.filter(c => c.stock).length ? `<div style="display:flex;flex-wrap:wrap;gap:8px">
      ${corralesFilas.filter(c => c.stock).map(c => `
        <div style="background:var(--gold-bg);color:var(--gold-text);border-radius:9px;padding:8px 15px;font-size:14.5px;font-weight:600;white-space:nowrap">
          🐂 ${c.nombre}: <strong>${fn(c.stock)}</strong>
        </div>
      `).join('')}
    </div>` : ''}
  </div>`;
  let filasStock = [
    ...filtrado.filter(s => (Number(s.stock) || 0) !== 0).map(s => ({ nombre: s.nombre, campo: campoNombre(s.campo_id), categoria: s.categoria, stock: Number(s.stock) || 0, esCorral: false })),
    ...corralesFilas.filter(c => (Number(c.stock) || 0) !== 0).map(c => ({ nombre: c.nombre, campo: c.campo, categoria: c.categoria, stock: Number(c.stock) || 0, esCorral: true })),
  ];
  const filasStockCero = filtrado.filter(s => (Number(s.stock) || 0) === 0).map(s => ({ nombre: s.nombre, campo: campoNombre(s.campo_id), categoria: s.categoria, stock: 0, esCorral: false }));

  if (!S.sort) S.sort = {};
  const sortStateStock = S.sort.stockRodeos || { key: 'stock', dir: 'desc' };
  filasStock = [...filasStock].sort((a, b) => {
    let va = a[sortStateStock.key], vb = b[sortStateStock.key];
    if (va == null) va = ''; if (vb == null) vb = '';
    const na = Number(va), nb = Number(vb);
    const numeric = va !== '' && vb !== '' && !isNaN(na) && !isNaN(nb);
    const cmp = numeric ? (na - nb) : String(va).localeCompare(String(vb), 'es', { sensitivity: 'base' });
    return sortStateStock.dir === 'asc' ? cmp : -cmp;
  });
  const colsStock = [{ key: 'nombre', label: 'Rodeo' }, { key: 'campo', label: 'Campo' }, { key: 'categoria', label: 'Categoría' }, { key: 'stock', label: 'Stock' }];
  h += `<div class="tw"><table class="dt"><thead><tr>`;
  colsStock.forEach(c => {
    const activo = sortStateStock.key === c.key;
    const flecha = activo ? (sortStateStock.dir === 'asc' ? ' ▲' : ' ▼') : '';
    h += `<th class="sortable-th${c.key === 'stock' ? ' tc' : ''}" style="cursor:pointer;user-select:none" onclick="sortStockRodeos('${c.key}')" title="Ordenar por ${c.label}">${c.label}${flecha}</th>`;
  });
  h += `</tr></thead><tbody>`;
  filasStock.forEach(s => {
    h += `<tr><td><strong>${s.nombre}</strong></td><td style="color:var(--text2)">${s.campo}</td>
      <td><span class="pill ${s.esCorral ? 'pill-gold' : 'pill-gray'}">${s.categoria}</span></td>
      <td class="tc"><strong style="color:var(--green-text)">${fn(s.stock)}</strong></td></tr>`;
  });
  if (filasStockCero.length) {
    h += `<tr><td colspan="4" style="padding:8px 12px;background:var(--bg2);font-size:12px;color:var(--text3);font-weight:600;border-top:1px solid var(--border)">

    filasStockCero.sort((a,b) => a.categoria.localeCompare(b.categoria,'es')).forEach(s => {

  return h;
}

function buildMovimientosHistorial_(movimientos, ventas, corralesVentas, campoId, rodeoId, soloPendientesParam) {
  let movsF = movimientos;
  if (campoId) movsF = movsF.filter(m => String(m.campo_origen_id) === String(campoId) || String(m.campo_destino_id) === String(campoId));
  if (rodeoId) movsF = movsF.filter(m => String(m.rodeo_origen_id) === String(rodeoId) || String(m.rodeo_destino_id) === String(rodeoId));

  let ventasF = ventas || [];
  if (campoId) ventasF = ventasF.filter(v => String(v.campo_id) === String(campoId));
  if (rodeoId) ventasF = ventasF.filter(v => String(v.rodeo_id) === String(rodeoId));

  // Ventas/bajas cargadas en la app de Corrales (novillos en engorde) — no tienen rodeo de Cría, así que se excluyen si hay filtro de rodeo
  const norm_ = s => String(s || '').trim().toLowerCase();
  let corralesF = corralesVentas || [];
  const nombreCampoSeleccionado = campoId ? norm_(campoNombre(campoId)) : '';
  if (rodeoId) corralesF = [];
  else if (campoId) corralesF = corralesF.filter(v => norm_(CORRAL_CAMPO_NOMBRE_[String(v.cid)]) === nombreCampoSeleccionado);

  const rodeosPorId_ = Object.fromEntries(rodeosTodos().map(r=>[String(r.rodeo_id),r]));
  // Normalizamos las 3 fuentes a una misma forma de fila, así se pueden ordenar todas juntas por cualquier columna
  let filas = [
    ...movsF.map(m => {
      const tieneCosto = (Number(m.precio_cabeza) || 0) > 0 || ((Number(m.precio_kg) || 0) > 0 && (Number(m.peso_prom_kg) || 0) > 0);
      const esEntrada = m.tipo === 'Saldo inicial' || m.tipo === 'Traslado en bloque' || m.tipo === 'Traslado individual';
      // Solo marcar "sin costo" si el traslado cruza entre actividades distintas
      // (Cría→Recría, Recría→Terminación) — los traslados internos dentro de la misma
      // actividad no necesitan precio porque no afectan el Margen Bruto de ninguna actividad.
      const esCesionInterActividad = (() => {
        if (m.tipo === 'Saldo inicial') return true; // saldo inicial siempre necesita precio
        const or = rodeosPorId_[String(m.rodeo_origen_id)];
        const de = rodeosPorId_[String(m.rodeo_destino_id)];
        if (!or || !de) return false;
        return or.actividad !== de.actividad;
      })();
      return {
        fecha: m.fecha || '',
        tipoLabel: m.tipo, tipoClass: m.tipo === 'Saldo inicial' ? 'pill-gold' : m.tipo === 'Traslado individual' ? 'pill-clay' : 'pill-green',
        caravana: m.caravana || '—',
        campoOrigen: m.campo_origen_id ? campoNombre(m.campo_origen_id) : '—',
        rodeoOrigen: m.rodeo_origen_id ? rodeoNombre(m.rodeo_origen_id) : '—',
        campoDestino: campoNombre(m.campo_destino_id), rodeoDestino: rodeoNombre(m.rodeo_destino_id),
        cantidad: Number(m.cantidad) || 0, obs: m.observaciones || '—',
        precio_cabeza: Number(m.precio_cabeza) || 0,
        precio_kg: Number(m.precio_kg) || 0,
        peso_prom_kg: Number(m.peso_prom_kg) || 0,
        sinCosto: esEntrada && !tieneCosto && esCesionInterActividad,
        entity: 'movimientos', idCol: 'movimiento_id', id: m.movimiento_id, editable: true,
      };
    }),
    ...ventasF.map(v => ({
      fecha: v.fecha_salida || '',
      tipoLabel: 'Venta', tipoClass: 'pill-red',
      caravana: '—',
      campoOrigen: v.campo_id ? campoNombre(v.campo_id) : '—', rodeoOrigen: v.rodeo_id ? rodeoNombre(v.rodeo_id) : '—',
      campoDestino: '—', rodeoDestino: '—',
      cantidad: Number(v.cant_animales) || 0, obs: v.comprador ? 'Venta a ' + v.comprador : (v.observaciones || '—'),
      precio_cabeza: 0, precio_kg: 0, peso_prom_kg: 0, sinCosto: false,
      entity: 'ventas', idCol: 'venta_id', id: v.venta_id, editable: true,
    })),
    ...corralesF.map(v => {
      const esBaja = !!v.baja;
      return {
        fecha: v.fecha || '',
        tipoLabel: (esBaja ? 'Baja' : 'Venta') + ' (Corrales)', tipoClass: esBaja ? 'pill-clay' : 'pill-red',
        caravana: '—',
        campoOrigen: CORRAL_CAMPO_NOMBRE_[String(v.cid)] || 'Sin campo asignado', rodeoOrigen: 'Corral ' + v.cid,
        campoDestino: '—', rodeoDestino: '—',
        cantidad: Number(v.cant) || 0, obs: esBaja ? 'Baja registrada en Corrales' : (v.precio ? `Venta en Corrales — $${fn(v.precio)}/kg` : 'Venta en Corrales'),
        precio_cabeza: 0, precio_kg: 0, peso_prom_kg: 0, sinCosto: false,
        entity: null, idCol: null, id: null, editable: false,
      };
    }),
  ];

  if (!filas.length) {
    return '<div class="empty-state"><span class="ico">◌</span><div class="msg">Todavía no hay registros. Cargá el primero arriba.</div></div>';
  }

  if (!S.sort) S.sort = {};
  const sortState = S.sort.historialMov || { key: 'fecha', dir: 'desc' };
  filas = [...filas].sort((a, b) => {
    let va = a[sortState.key], vb = b[sortState.key];
    if (va == null) va = ''; if (vb == null) vb = '';
    const na = Number(va), nb = Number(vb);
    const numeric = va !== '' && vb !== '' && !isNaN(na) && !isNaN(nb);
    const cmp = numeric ? (na - nb) : String(va).localeCompare(String(vb), 'es', { sensitivity: 'base' });
    return sortState.dir === 'asc' ? cmp : -cmp;
  });

  const cols = [
    { key: 'fecha', label: 'Fecha' }, { key: 'tipoLabel', label: 'Tipo' }, { key: 'caravana', label: 'Caravana' },
    { key: 'campoOrigen', label: 'Campo origen' }, { key: 'rodeoOrigen', label: 'Rodeo origen' },
    { key: 'campoDestino', label: 'Campo destino' }, { key: 'rodeoDestino', label: 'Rodeo destino' },
    { key: 'cantidad', label: 'Cant.' }, { key: 'peso_prom_kg', label: 'Peso (kg)' }, { key: 'costoMostrar', label: 'Costo ingreso' }, { key: 'obs', label: 'Obs.' },
  ];

  const pendientes = filas.filter(f => f.sinCosto).length;
  let h = `<div class="section-label">Historial <span class="count-badge" style="margin-left:6px">${filas.length}</span></div>`;
  if (pendientes > 0) {
    h += `<div style="display:flex;align-items:center;gap:10px;background:var(--gold-bg);border:1px solid var(--border2);border-radius:8px;padding:9px 14px;margin-bottom:10px;font-size:13px;color:var(--gold-text);font-weight:600">
      ⚠ ${pendientes} movimiento${pendientes!==1?'s':''} de entrada sin costo cargado (resaltados abajo) — tocá ✎ para completar peso y precio.
      <label style="display:flex;align-items:center;gap:5px;margin-left:auto;font-weight:500;cursor:pointer">
        <input type="checkbox" id="mv-hist-solo-pendientes" onchange="window.renderHistorialFiltrado ? window.renderHistorialFiltrado() : render()"> Ver solo pendientes
      </label>
    </div>`;
  }

  const soloPendientes = soloPendientesParam || false;
  const filasVista = soloPendientes ? filas.filter(f => f.sinCosto) : filas;

  h += `<div class="tw"><table class="dt"><thead><tr>`;
  cols.forEach(c => {
    const activo = sortState.key === c.key;
    const flecha = activo ? (sortState.dir === 'asc' ? ' ▲' : ' ▼') : '';
    h += `<th class="sortable-th" onclick="sortHistorialMov('${c.key}')" style="cursor:pointer;user-select:none" title="Ordenar por ${c.label}">${c.label}${flecha}</th>`;
  });
  h += '<th></th></tr></thead><tbody>';

  filasVista.forEach(f => {
    const costoTxt = f.precio_kg > 0 && f.peso_prom_kg > 0
      ? `$ ${fn(f.precio_kg)}/kg`
      : f.precio_cabeza > 0
        ? `$ ${fn(f.precio_cabeza)}/cab.`
        : (f.sinCosto
            ? (f.tipoLabel === 'Saldo inicial'
                ? '<span style="color:var(--clay-text);font-weight:700">⚠ Sin precio de compra</span>'
                : '<span style="color:var(--gold-text);font-weight:700">⚠ Sin valorizar — usar precio del mes ✎</span>')
            : '—');
    const trStyle = f.sinCosto ? ' style="background:rgba(200,150,40,0.07)"' : '';
    h += `<tr${trStyle}>
      <td>${fd(f.fecha)}</td>
      <td><span class="pill ${f.tipoClass}">${f.tipoLabel}</span></td>
      <td>${f.caravana}</td>
      <td>${f.campoOrigen}</td>
      <td>${f.rodeoOrigen}</td>
      <td>${f.campoDestino}</td>
      <td>${f.rodeoDestino}</td>
      <td class="tc">${fn(f.cantidad)}</td>
      <td class="tc">${f.peso_prom_kg ? fn(f.peso_prom_kg) : '—'}</td>
      <td class="tr">${costoTxt}</td>
      <td>${f.obs}</td>
      <td>${f.editable ? `<div class="row-actions">
        <button class="icon-btn" data-edit="${f.id}" data-entity="${f.entity}" data-idcol="${f.idCol}" title="Editar">✎</button>
        <button class="icon-btn danger" data-del="${f.id}" data-entity="${f.entity}" data-idcol="${f.idCol}" title="Eliminar">✕</button>
      </div>` : ''}</td>
    </tr>`;
  });
  h += '</tbody></table></div>';
  return h;
}
window.sortHistorialMov = function(key) {
  if (!S.sort) S.sort = {};
  const current = S.sort.historialMov;
  if (current && current.key === key) {
    current.dir = current.dir === 'asc' ? 'desc' : 'asc';
  } else {
    S.sort.historialMov = { key, dir: 'asc' };
  }
  window.renderHistorialFiltrado ? window.renderHistorialFiltrado() : render();

function buildLibroMovimientos_(rodeoId, campoId, desde, hasta) {
  const movs   = S.cache.movimientos || [];
  const ventas = S.cache.ventas      || [];
  const pariciones = S.cache.pariciones || [];
  const mortandad  = S.cache.mortandad  || [];
  const destetes   = S.cache.destetes   || [];

  // Helper: el campo de un rodeo SIEMPRE se toma del catálogo (fuente de verdad).
  // El campo_id suelto guardado en cada registro (venta, movimiento, etc.) puede estar
  // desincronizado por errores de carga — por eso no se usa como prioridad, solo como fallback
  // si el rodeo no está en catálogo (rodeo eliminado, por ejemplo).
  function campoDe_(rodeoCatId, campoMovId) {
    const cat = (S.catalogs && S.catalogs.rodeos || []).find(function(r){ return String(r.rodeo_id) === String(rodeoCatId); });
    if (cat && cat.campo_id) return cat.campo_id;
    return campoMovId || null;
  }

  // Construir líneas unificadas
  var lineas = [];

  // Saldos iniciales → siempre son ENTRADA al rodeo destino
  movs.forEach(function(m) {
    if (m.tipo === 'Saldo inicial') {
      lineas.push({
        fecha: m.fecha || '',
        tipo: 'Saldo inicial',
        pill: 'pill-gold',
        desc: 'Saldo inicial',
        rodeo: m.rodeo_destino_id ? rodeoNombre(m.rodeo_destino_id) : '—',
        campo: campoNombre(campoDe_(m.rodeo_destino_id, m.campo_destino_id)),
        rodeo_id: m.rodeo_destino_id,
        campo_id: campoDe_(m.rodeo_destino_id, m.campo_destino_id),
        entrada: Number(m.cantidad) || 0,
        salida: 0,
        obs: m.observaciones || '',
      });
    } else if (m.tipo === 'Traslado en bloque' || m.tipo === 'Traslado individual') {
      const campoOrigenId  = campoDe_(m.rodeo_origen_id,  m.campo_origen_id);
      const campoDestinoId = campoDe_(m.rodeo_destino_id, m.campo_destino_id);
      // Línea de SALIDA para el origen
      lineas.push({
        fecha: m.fecha || '',
        tipo: m.tipo,
        pill: 'pill-clay',
        desc: 'Traslado → ' + (m.rodeo_destino_id ? rodeoNombre(m.rodeo_destino_id) : '—'),
        rodeo: m.rodeo_origen_id ? rodeoNombre(m.rodeo_origen_id) : '—',
        campo: campoOrigenId ? campoNombre(campoOrigenId) : '—',
        rodeo_id: m.rodeo_origen_id,
        campo_id: campoOrigenId,
        entrada: 0,
        salida: Number(m.cantidad) || 0,
        obs: m.observaciones || '',
      });
      // Línea de ENTRADA para el destino
      lineas.push({
        fecha: m.fecha || '',
        tipo: m.tipo,
        pill: 'pill-green',
        desc: 'Traslado ← ' + (m.rodeo_origen_id ? rodeoNombre(m.rodeo_origen_id) : '—'),
        rodeo: m.rodeo_destino_id ? rodeoNombre(m.rodeo_destino_id) : '—',
        campo: campoDestinoId ? campoNombre(campoDestinoId) : '—',
        rodeo_id: m.rodeo_destino_id,
        campo_id: campoDestinoId,
        entrada: Number(m.cantidad) || 0,
        salida: 0,
        obs: m.observaciones || '',
      });
    }
  });

  ventas.forEach(function(v) {
    lineas.push({
      fecha: v.fecha_salida || '',
      tipo: 'Venta',
      pill: 'pill-red',
      desc: v.comprador ? 'Venta a ' + v.comprador : 'Venta',
      rodeo: v.rodeo_id ? rodeoNombre(v.rodeo_id) : '—',
      campo: campoNombre(campoDe_(v.rodeo_id, v.campo_id)),
      rodeo_id: v.rodeo_id,
      campo_id: campoDe_(v.rodeo_id, v.campo_id),
      entrada: 0,
      salida: Number(v.cant_animales) || 0,
      obs: v.observaciones || '',
    });
  });

  pariciones.forEach(function(p) {
    if (!p.nacidos_vivos) return;
    lineas.push({
      fecha: p.fecha || '',
      tipo: 'Parición',
      pill: 'pill-green',
      desc: 'Nacimientos',
      rodeo: p.rodeo_id ? rodeoNombre(p.rodeo_id) : '—',
      campo: campoNombre(campoDe_(p.rodeo_id, p.campo_id || null)),
      rodeo_id: p.rodeo_id,
      campo_id: campoDe_(p.rodeo_id, p.campo_id || null),
      entrada: Number(p.nacidos_vivos) || 0,
      salida: 0,
      obs: '',
    });
  });

  mortandad.forEach(function(m) {
    lineas.push({
      fecha: m.fecha || '',
      tipo: 'Mortandad',
      pill: 'pill-clay',
      desc: 'Mortandad',
      rodeo: m.rodeo_id ? rodeoNombre(m.rodeo_id) : '—',
      campo: campoNombre(campoDe_(m.rodeo_id, m.campo_id || null)),
      rodeo_id: m.rodeo_id,
      campo_id: campoDe_(m.rodeo_id, m.campo_id || null),
      entrada: 0,
      salida: Number(m.cantidad) || 0,
      obs: m.observaciones || '',
    });
  });

  destetes.forEach(function(d) {
    lineas.push({
      fecha: d.fecha || '',
      tipo: 'Destete',
      pill: 'pill-clay',
      desc: 'Destete',
      rodeo: d.rodeo_id ? rodeoNombre(d.rodeo_id) : '—',
      campo: campoNombre(campoDe_(d.rodeo_id, d.campo_id || null)),
      rodeo_id: d.rodeo_id,
      campo_id: campoDe_(d.rodeo_id, d.campo_id || null),
      entrada: 0,
      salida: Number(d.cantidad) || 0,
      obs: '',
    });
  });

  // Filtrar
  if (rodeoId) lineas = lineas.filter(function(l){ return String(l.rodeo_id) === String(rodeoId); });
  else if (campoId) lineas = lineas.filter(function(l){ return String(l.campo_id) === String(campoId); });
  if (desde) lineas = lineas.filter(function(l){ return l.fecha >= desde; });
  if (hasta) lineas = lineas.filter(function(l){ return l.fecha <= hasta; });

  // Ordenar cronológico
  lineas.sort(function(a,b){ return a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0; });

  if (!lineas.length) {
    return '<div class="empty-state"><span class="ico">📖</span><div class="msg">Sin movimientos para los filtros seleccionados.</div></div>';
  }

  // Calcular saldo acumulado
  var saldo = 0;
  var totEntradas = 0, totSalidas = 0;
  var filas = lineas.map(function(l) {
    saldo += l.entrada - l.salida;
    totEntradas += l.entrada;
    totSalidas  += l.salida;
    return Object.assign({}, l, { saldo: saldo });
  });

  var rodeoLabel = rodeoId ? rodeoNombre(rodeoId) : (campoId ? campoNombre(campoId) : 'Todos los rodeos');
  var resumen = `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">
    <div style="background:var(--green-bg);color:var(--green-text);border-radius:9px;padding:8px 16px;font-size:14px;font-weight:700">
      Entradas: ${fn(totEntradas)}
    </div>
    <div style="background:var(--red-bg);color:var(--red-text);border-radius:9px;padding:8px 16px;font-size:14px;font-weight:700">
      Salidas: ${fn(totSalidas)}
    </div>
    <div style="background:var(--gold-bg);color:var(--gold-text);border-radius:9px;padding:8px 16px;font-size:14px;font-weight:700">
      Saldo final: ${fn(saldo)}
    </div>
  </div>`;

  var h = `<div class="section-label">📖 Libro — ${rodeoLabel} <span class="count-badge" style="margin-left:6px">${filas.length}</span></div>
  ${resumen}
  <div class="tw"><table class="dt"><thead><tr>
    <th>Fecha</th><th>Tipo</th><th>Descripción</th><th>Rodeo</th><th>Campo</th>
    <th class="tc" style="color:var(--green-text)">Entradas</th>
    <th class="tc" style="color:var(--red-text)">Salidas</th>
    <th class="tc" style="font-weight:700">Saldo</th>
    <th>Obs.</th>
  </tr></thead><tbody>`;

  filas.forEach(function(f) {
    var saldoColor = f.saldo < 0 ? 'var(--red-text)' : f.saldo === 0 ? 'var(--text3)' : 'var(--green-text)';
    h += `<tr>
      <td>${fd(f.fecha)}</td>
      <td><span class="pill ${f.pill}">${f.tipo}</span></td>
      <td>${f.desc}</td>
      <td><strong>${f.rodeo}</strong></td>
      <td style="color:var(--text2)">${f.campo}</td>
      <td class="tc" style="color:var(--green-text)">${f.entrada ? '<strong>+'+fn(f.entrada)+'</strong>' : ''}</td>
      <td class="tc" style="color:var(--red-text)">${f.salida ? '<strong>−'+fn(f.salida)+'</strong>' : ''}</td>
      <td class="tc" style="font-weight:700;color:${saldoColor}">${fn(f.saldo)}</td>
      <td style="color:var(--text2);font-size:12px">${f.obs || ''}</td>
    </tr>`;
  });

  h += '</tbody></table></div>';
  return h;
}

async function loadTipoCambio() {
  // Si ya tenemos cotización de hoy, no volvemos a buscar
  const hoy = today();
  const yaHoy = (S.corralesTipoCambio || []).find(t => t.fecha === hoy);
  if (yaHoy) return;
  try {
    const res = await fetch('https://dolarapi.com/v1/dolares/oficial', { cache: 'no-store' });
    if (!res.ok) throw new Error('Sin respuesta');
    const data = await res.json();
    const valor = data.venta || data.promedio || null;
    if (!valor) throw new Error('Sin valor');
    // Agregamos la cotización de hoy a la lista (mantenemos historial para cálculos anteriores)
    const lista = (S.corralesTipoCambio || []).filter(t => t.fecha !== hoy);
    lista.push({ fecha: hoy, valor: Number(valor) });
    S.corralesTipoCambio = lista;
  } catch (err) {
    // Si falla, dejamos lo que había (puede haber cotizaciones anteriores)
    if (!S.corralesTipoCambio) S.corralesTipoCambio = [];
  }
}
// Busca la cotización BNA vigente a una fecha (la última cargada en Corrales con fecha <= fecha dada)
function tipoCambioVigente_(fecha) {
  // Unificar: Sheets (catalogs.tipo_cambio) + corralesStock
  const deCatalogs = (S.catalogs && S.catalogs.tipo_cambio || []).map(t => ({ fecha: t.fecha, valor: Number(t.valor) }));
  const deCorral   = (S.corralesTipoCambio || []);
  // Merge, Sheets tiene prioridad
  const todas = [...deCatalogs];
  deCorral.forEach(t => { if (!todas.find(x => x.fecha === t.fecha)) todas.push(t); });
  const lista = todas
    .filter(t => t.fecha && String(t.fecha) <= String(fecha))
    .sort((a, b) => String(a.fecha).localeCompare(String(b.fecha)));
  return lista.length ? lista[lista.length - 1] : null;
}
// Mapeo de cada corral al campo donde está físicamente ubicado.
// Si se agrega un corral nuevo, avisar para sumarlo acá.
const CORRAL_CAMPO_NOMBRE_ = { '1': 'El Cencerro', '2': 'El Misterio', '3': 'El Misterio' };

function corralesStockPorCampoNombre_() {
  const out = {};
  if (S.corralesStock && typeof S.corralesStock === 'object') {
    Object.entries(S.corralesStock).forEach(([cid, stock]) => {
      const campo = CORRAL_CAMPO_NOMBRE_[cid] || 'Corral sin campo asignado';
      out[campo] = (out[campo] || 0) + stock;
    });
  }
  return out;
}
