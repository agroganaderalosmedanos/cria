        const campos_ = S.catalogs?.campos || [];
        stockStr = Object.entries(sp.stock_por_campo)
          .map(([cid, cant]) => { const c = campos_.find(x => String(x.campo_id) === String(cid)); return `${c?.nombre||cid}: ${Number(cant).toLocaleString('es-AR')}`; })
          .join(' / ');
      } else {
        stockStr = sp.stock !== null && sp.stock !== undefined ? Number(sp.stock).toLocaleString('es-AR') + ' ' + (p.unidad||'') : '—';
      }
    }
    return { ...p, _stock: stockStr };
  });
  h += buildEntityTable(productosConStock, [
    { key: 'nombre', label: 'Nombre' },
    { key: 'categoria', label: 'Categoría' },
    { key: 'unidad', label: 'Unidad' },
    { key: 'materia_seca_pct', label: 'MS %', render: v => (v !== '' && v != null && Number(v) > 0) ? fn(Number(v), 0) + ' %' : '—' },
    { key: 'por_campo', label: 'Por campo', render: v => esPorCampo_(v) ? '<span class="pill pill-gold">Sí, por campo</span>' : '<span class="pill pill-green">Pozo común</span>' },
    { key: '_stock', label: 'Stock actual', render: v => `<span style="font-weight:600;color:var(--gold)">${v}</span>` },
    { key: 'activo', label: 'Activo', render: v => String(v).toUpperCase() === 'TRUE' || v === true ? 'Sí' : 'No' },
  ], 'productos', 'producto_id');

  h += `<div class="section-label">Historial de insumos</div>
  <div class="fgrid" style="margin-bottom:10px">
    <div class="fg"><label>Filtrar por categoría</label>
      <select id="in-hist-filtro-categoria" onchange="document.getElementById('in-hist-filtro-producto').innerHTML = productoFiltroOptionsHtml_(this.value ? (S.catalogs.productos||[]).filter(p => p.categoria === this.value) : (S.catalogs.productos||[])); renderInsumosHistorialFiltrado()">
        <option value="">Todas las categorías</option>
        ${categoriasIns.map(c => `<option value="${c}">${c}</option>`).join('')}
      </select>
    </div>
    <div class="fg"><label>Filtrar por producto</label>
      <select id="in-hist-filtro-producto" onchange="actualizarFiltroCampoHistorial_(); renderInsumosHistorialFiltrado()">${productoFiltroOptionsHtml_(productos)}</select>
    </div>
    <div class="fg"><label>Campo</label>
      <select id="in-hist-filtro-campo" onchange="
        const ri=document.getElementById('in-hist-filtro-rodeo');
        const rods=(S.catalogs.rodeos||[]).filter(r=>!this.value||String(r.campo_id)===this.value);
        ri.innerHTML='<option value=\'\'>Todos los rodeos</option>'+rodeoOptionsHtml(rods);
        renderInsumosHistorialFiltrado()">
        <option value="">Todos los campos</option>
        ${campos.map(c => `<option value="${c.campo_id}">${c.nombre}</option>`).join('')}
      </select>
    </div>
    <div class="fg"><label>Rodeo</label>
      <select id="in-hist-filtro-rodeo" onchange="renderInsumosHistorialFiltrado()">
        <option value="">Todos los rodeos</option>
        ${(S.catalogs?.rodeos||[]).map(r=>`<option value="${r.rodeo_id}">${r.nombre}</option>`).join('')}
      </select>
    </div>
    <div class="fg"><label>Desde</label><input type="date" id="in-hist-desde" onchange="renderInsumosHistorialFiltrado()"></div>
    <div class="fg"><label>Hasta</label><input type="date" id="in-hist-hasta" onchange="renderInsumosHistorialFiltrado()"></div>
  </div>
  </div>
  <div id="in-historial-tabla">${buildInsumosHistorial_(compras, consumos, '', '')}</div>`;

  return h;
}

function buildInsumosHistorial_(compras, consumos, productoFiltro, categoriaFiltro, desde, hasta, campoFiltro, rodeoFiltro) {
  const productosMap = {};
  ((S.catalogs && S.catalogs.productos) || []).forEach(p => { productosMap[p.producto_id] = p; });

  let comprasF = compras || [];
  let consumosF = consumos || [];
  if (productoFiltro) {
    comprasF = comprasF.filter(c => String(c.producto_id) === String(productoFiltro));
    consumosF = consumosF.filter(c => String(c.producto_id) === String(productoFiltro));
  }
  if (categoriaFiltro) {
    comprasF = comprasF.filter(c => (productosMap[c.producto_id] || {}).categoria === categoriaFiltro);
    consumosF = consumosF.filter(c => (productosMap[c.producto_id] || {}).categoria === categoriaFiltro);
  }
  if (campoFiltro) {
    comprasF = comprasF.filter(c => String(c.campo_id || '') === String(campoFiltro));
    consumosF = consumosF.filter(c => String(c.campo_id || '') === String(campoFiltro));
  }
  if (rodeoFiltro) {
    // Las compras no tienen rodeo, solo los consumos
    consumosF = consumosF.filter(c => String(c.rodeo_id || '') === String(rodeoFiltro));
    comprasF = []; // si filtrás por rodeo, no tiene sentido mostrar compras que son por campo
  }
  if (desde) { comprasF = comprasF.filter(c => String(c.fecha || '') >= desde); consumosF = consumosF.filter(c => String(c.fecha || '') >= desde); }
  if (hasta) { comprasF = comprasF.filter(c => String(c.fecha || '') <= hasta); consumosF = consumosF.filter(c => String(c.fecha || '') <= hasta); }

  let filas = [
    ...comprasF.map(c => {
      const p = productosMap[c.producto_id] || {};
      // Un registro con cantidad 0 no es una compra real — es solo un cambio de
      // precio vigente desde una fecha (lo carga el botón "Actualizar" de la
      // pantalla de Precios). Se etiqueta distinto para no confundirlo con una
      // compra de verdad.
      const esSoloPrecio = !(Number(c.cantidad) > 0);
      const detalle = esSoloPrecio
        ? 'Precio actualizado a $ ' + fn(Number(c.precio_unitario)||0) + ' desde esta fecha'
        : [c.precio_unitario ? 'P.Unit: $ ' + fn(c.precio_unitario) + (c.cantidad ? ' × ' + fn(c.cantidad) + ' = $ ' + fn((Number(c.precio_unitario)||0)*(Number(c.cantidad)||0)) : '') : '', c.proveedor ? 'Prov: ' + c.proveedor : '', c.observaciones || ''].filter(Boolean).join(' — ') || '—';
      return {
        fecha: c.fecha || '',
        tipoLabel: esSoloPrecio ? 'Cambio de precio' : 'Compra',
        tipoClass: esSoloPrecio ? 'pill-gold' : 'pill-green',
        producto: p.nombre || '(producto eliminado)', campo: '—', rodeo: '—',
        cantidad: Number(c.cantidad) || 0, unidad: p.unidad || '', detalle,
        entity: 'compras_insumos', idCol: 'compra_id', id: c.compra_id,
      };
    }),
    ...consumosF.map(c => {
      const p = productosMap[c.producto_id] || {};
      const detalle = (c.campana ? '<span class="pill pill-gold" style="margin-right:6px">' + c.campana + '</span>' : '') + (c.observaciones || (c.campana ? '' : '—'));
      return {
        fecha: c.fecha || '', tipoLabel: 'Consumo', tipoClass: 'pill-clay',
        producto: p.nombre || '(producto eliminado)',
        campo: c.campo_id ? campoNombre(c.campo_id) : '—', rodeo: c.rodeo_id ? rodeoNombre(c.rodeo_id) : '—',
        cantidad: Number(c.cantidad) || 0, unidad: p.unidad || '', detalle: detalle || '—',
        entity: 'consumos_insumos', idCol: 'consumo_id', id: c.consumo_id,
      };
    }),
  ];

  if (!filas.length) {
    const todaviaCargando = S.cache.compras_insumos === undefined || S.cache.consumos_insumos === undefined;
    if (todaviaCargando) {
      return '<div class="empty-state"><span class="ico">◌</span><div class="msg">Cargando datos…</div></div>';
    }
    return '<div class="empty-state"><span class="ico">◌</span><div class="msg">Todavía no hay registros. Cargá el primero arriba.</div></div>';
  }

  if (!S.sort) S.sort = {};
  const sortState = S.sort.historialInsumos || { key: 'fecha', dir: 'desc' };
  filas = [...filas].sort((a, b) => {
    let va = a[sortState.key], vb = b[sortState.key];
    if (va == null) va = ''; if (vb == null) vb = '';
    const na = Number(va), nb = Number(vb);
    const numeric = va !== '' && vb !== '' && !isNaN(na) && !isNaN(nb);
    const cmp = numeric ? (na - nb) : String(va).localeCompare(String(vb), 'es', { sensitivity: 'base' });
    return sortState.dir === 'asc' ? cmp : -cmp;
  });

  const cols = [
    { key: 'fecha', label: 'Fecha' }, { key: 'tipoLabel', label: 'Tipo' }, { key: 'producto', label: 'Producto' },
    { key: 'campo', label: 'Campo' }, { key: 'rodeo', label: 'Rodeo' }, { key: 'cantidad', label: 'Cantidad' }, { key: 'detalle', label: 'Detalle' },
  ];
  let h = `<div class="section-label">Historial <span class="count-badge" style="margin-left:6px">${filas.length}</span></div>
  <div class="tw"><table class="dt"><thead><tr>`;
  cols.forEach(c => {
    const activo = sortState.key === c.key;
    const flecha = activo ? (sortState.dir === 'asc' ? ' ▲' : ' ▼') : '';
    h += `<th class="sortable-th" onclick="sortHistorialInsumos('${c.key}')" style="cursor:pointer;user-select:none" title="Ordenar por ${c.label}">${c.label}${flecha}</th>`;
  });
  h += '<th class="col-actions-sticky"></th></tr></thead><tbody>';
  filas.forEach(f => {
    h += `<tr>
      <td>${fd(f.fecha)}</td>
      <td><span class="pill ${f.tipoClass}">${f.tipoLabel}</span></td>
      <td>${f.producto}</td>
      <td>${f.campo}</td>
      <td>${f.rodeo}</td>
      <td>${fn(f.cantidad)} ${f.unidad}</td>
      <td>${f.detalle}</td>
      <td class="col-actions-sticky"><div class="row-actions">
        <button class="icon-btn" data-edit="${f.id}" data-entity="${f.entity}" data-idcol="${f.idCol}" title="Editar">✎</button>
        <button class="icon-btn danger" data-del="${f.id}" data-entity="${f.entity}" data-idcol="${f.idCol}" title="Eliminar">✕</button>
      </div></td>
    </tr>`;
  });
  h += '</tbody></table></div>';
  return h;
}
window.sortHistorialInsumos = function(key) {
  if (!S.sort) S.sort = {};
  const current = S.sort.historialInsumos;
  if (current && current.key === key) { current.dir = current.dir === 'asc' ? 'desc' : 'asc'; }
  else { S.sort.historialInsumos = { key, dir: 'asc' }; }
  window.renderInsumosHistorialFiltrado ? window.renderInsumosHistorialFiltrado() : render();
};
function buildStockSeleccionado_(productoFiltro, campoFiltro) {
  if (!productoFiltro) return '';
  const row = (S.stockProductos || []).find(p => String(p.producto_id) === String(productoFiltro));
  if (!row) return '';
  const colores = row.categoria === 'Veterinaria' ? ['var(--blue-bg)', 'var(--blue-text)']
    : row.categoria === 'Reproducción' ? ['var(--gold-bg)', 'var(--gold-text)']
    : ['var(--green-bg)', 'var(--green-text)'];
  let stockLabel;
  if (esPorCampo_(row.por_campo)) {
    if (campoFiltro && row.stock_por_campo) {
      const cant = row.stock_por_campo[campoFiltro] || 0;
      stockLabel = `${fn(cant)} ${row.unidad || ''} en ${campoNombre(campoFiltro)}`;
    } else {
      // Mostrar todos los campos
      const partes = Object.entries(row.stock_por_campo || {}).map(([cid, cant]) => `${campoNombre(cid)}: ${fn(cant)}`).join(' · ');
      stockLabel = (partes || '0') + ' ' + (row.unidad || '');
    }
  } else {
    stockLabel = `${fn(row.stock)} ${row.unidad || ''}`;
  }
  return `<div style="background:${colores[0]};color:${colores[1]};border-radius:9px;padding:10px 16px;font-size:16px;font-weight:700;display:inline-block;margin-bottom:12px">Stock actual de ${row.nombre}: ${stockLabel}</div>`;
}
function buildInsumosKardex_(compras, consumos, productoId, desde, hasta, campoFiltro) {
  const p = ((S.catalogs && S.catalogs.productos) || []).find(x => String(x.producto_id) === String(productoId));
  if (!p) return '';
  const porCampo = esPorCampo_(p.por_campo);

  let comprasP = (compras || []).filter(c => String(c.producto_id) === String(productoId));
  let consumosP = (consumos || []).filter(c => String(c.producto_id) === String(productoId));

  // Si el producto es por campo y hay filtro de campo, restringir ambas listas
  if (porCampo && campoFiltro) {
    comprasP = comprasP.filter(c => String(c.campo_id) === String(campoFiltro));
    consumosP = consumosP.filter(c => String(c.campo_id) === String(campoFiltro));
  }

  // Saldo inicial: resultado de todo lo anterior a la fecha "Desde" (si no hay fecha "Desde", arranca en 0 desde el principio de todo)
  let saldoInicial = 0;
  if (desde) {
    comprasP.forEach(c => { if (String(c.fecha || '') < desde) saldoInicial += Number(c.cantidad) || 0; });
    consumosP.forEach(c => { if (String(c.fecha || '') < desde) saldoInicial -= Number(c.cantidad) || 0; });
  }

  let movs = [
    ...comprasP.map(c => ({
      fecha: c.fecha || '', tipoLabel: 'Compra', tipoClass: 'pill-green', entrada: Number(c.cantidad) || 0, salida: 0,
      detalle: [c.precio_unitario ? 'P.Unit: $ ' + fn(c.precio_unitario) + (c.cantidad ? ' × ' + fn(c.cantidad) + ' = $ ' + fn((Number(c.precio_unitario)||0)*(Number(c.cantidad)||0)) : '') : '', c.proveedor ? 'Prov: ' + c.proveedor : '', c.observaciones || ''].filter(Boolean).join(' — ') || '—',
      entity: 'compras_insumos', idCol: 'compra_id', id: c.compra_id,
    })),
    ...consumosP.map(c => ({
      fecha: c.fecha || '', tipoLabel: 'Consumo', tipoClass: 'pill-clay', entrada: 0, salida: Number(c.cantidad) || 0,
      detalle: [c.campo_id ? campoNombre(c.campo_id) : '', c.rodeo_id ? rodeoNombre(c.rodeo_id) : '', c.observaciones || ''].filter(Boolean).join(' — ') || '—',
      entity: 'consumos_insumos', idCol: 'consumo_id', id: c.consumo_id,
    })),
  ];
  if (desde) movs = movs.filter(m => String(m.fecha) >= desde);
  if (hasta) movs = movs.filter(m => String(m.fecha) <= hasta);
  movs.sort((a, b) => String(a.fecha).localeCompare(String(b.fecha))); // ascendente: el saldo corrido solo tiene sentido en orden cronológico

  let saldo = saldoInicial;
  const filas = movs.map(m => { saldo += m.entrada - m.salida; return { ...m, saldoCorrido: saldo }; });
  const saldoFinal = saldo;

  let h = `<div style="background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:10px 16px;font-size:14px;font-weight:600;margin-bottom:10px">
    Saldo inicial${desde ? ' al ' + fd(desde) : ''}: <strong>${fn(saldoInicial)} ${p.unidad || ''}</strong>
  </div>`;

  if (!filas.length) {
    h += '<div class="empty-state"><span class="ico">◌</span><div class="msg">No hay movimientos de este producto en el rango elegido.</div></div>';
    return h;
  }

  h += `<div class="tw"><table class="dt"><thead><tr>
    <th>Fecha</th><th>Tipo</th><th>Detalle</th><th class="tc">Entrada</th><th class="tc">Salida</th><th class="tc">Saldo</th><th></th>
  </tr></thead><tbody>`;
  filas.forEach(f => {
    h += `<tr>
      <td>${fd(f.fecha)}</td>
      <td><span class="pill ${f.tipoClass}">${f.tipoLabel}</span></td>
      <td>${f.detalle}</td>
      <td class="tc">${f.entrada ? fn(f.entrada) : '—'}</td>
      <td class="tc">${f.salida ? fn(f.salida) : '—'}</td>
      <td class="tc"><strong>${fn(f.saldoCorrido)}</strong></td>
      <td><div class="row-actions">
        <button class="icon-btn" data-edit="${f.id}" data-entity="${f.entity}" data-idcol="${f.idCol}" title="Editar">✎</button>
        <button class="icon-btn danger" data-del="${f.id}" data-entity="${f.entity}" data-idcol="${f.idCol}" title="Eliminar">✕</button>
      </div></td>
    </tr>`;
  });
  h += `</tbody></table></div>
  <div style="background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:10px 16px;font-size:14px;font-weight:600;margin-top:10px">
    Saldo final${hasta ? ' al ' + fd(hasta) : ''}: <strong>${fn(saldoFinal)} ${p.unidad || ''}</strong>
  </div>`;
  return h;
}
window.actualizarFiltroCampoHistorial_ = function() {
  const productoId = document.getElementById('in-hist-filtro-producto')?.value || '';
  const wrap = document.getElementById('in-hist-campo-wrap');
  if (!wrap) return;
  const producto = ((S.catalogs && S.catalogs.productos) || []).find(p => String(p.producto_id) === String(productoId));
  wrap.style.display = (productoId && producto && esPorCampo_(producto.por_campo)) ? 'flex' : 'none';
  if (wrap.style.display === 'none') {
    const sel = document.getElementById('in-hist-filtro-campo');

window.renderInsumosHistorialFiltrado = function() {
  const productoFiltro   = document.getElementById('in-hist-filtro-producto')?.value || '';
  const categoriaFiltro  = document.getElementById('in-hist-filtro-categoria')?.value || '';
  let campoFiltro = document.getElementById('in-hist-filtro-campo')?.value || '';
  // Blindaje: si el valor del selector de Campo no corresponde a ningún campo_id
  // real (por ejemplo, si el navegador mostró/guardó un valor corrompido en vez
  // del esperado), no lo uses como filtro — de lo contrario, comparar contra un
  // valor imposible vacía la tabla entera en silencio, sin ningún aviso.
  if (campoFiltro && !((S.catalogs && S.catalogs.campos) || []).some(c => String(c.campo_id) === String(campoFiltro))) {
    campoFiltro = '';
  }
  const rodeoFiltro      = document.getElementById('in-hist-filtro-rodeo')?.value || '';
  const desde = document.getElementById('in-hist-desde')?.value || '';
  const hasta = document.getElementById('in-hist-hasta')?.value || '';
  // La caja de "Stock actual de [producto]" se sacó — usaba una fuente de datos
  // (S.stockProductos) que no siempre coincidía con el stock real mostrado más
  // arriba en la pantalla, y generaba confusión. El stock general ya se ve bien
  // en el bloque "Stock actual de insumos" de arriba, sin necesidad de este duplicado.
  const el = document.getElementById('in-historial-tabla');
  if (el) {
    if (productoFiltro) {
      el.innerHTML = buildInsumosKardex_(S.cache.compras_insumos || [], S.cache.consumos_insumos || [], productoFiltro, desde, hasta, campoFiltro);
    } else {
      el.innerHTML = buildInsumosHistorial_(S.cache.compras_insumos || [], S.cache.consumos_insumos || [], productoFiltro, categoriaFiltro, desde, hasta, campoFiltro, rodeoFiltro);
    }
    attachTableDeleteEvents('compras_insumos', 'compra_id');
    attachTableDeleteEvents('consumos_insumos', 'consumo_id');
  }
};

window.actualizarCampoCompraInsumo_ = function() {

function attachInsumosEvents() {
  // Autocorrección del selector de Campo del historial: después de una extensa
  // investigación (probado en 3 navegadores y 2 PCs distintas) no se encontró
  // la causa exacta de por qué a veces este selector termina con una opción
  // corrompida (texto tipo "${r.nombre}" en vez de un nombre real de campo).
  // Como no se pudo hallar el origen, se detecta y se repara acá directamente:
  // si alguna opción no corresponde a un campo_id real, se reconstruye toda la
  // lista de opciones desde el catálogo, que siempre está limpio.
  (function repararSelectorCampoHistorial_() {
    const sel = document.getElementById('in-hist-filtro-campo');
    if (!sel) return;
    const camposReales = (S.catalogs && S.catalogs.campos) || [];
    const idsValidos = new Set(camposReales.map(c => String(c.campo_id)));
    const opciones = [...sel.options];
    const hayOpcionRota = opciones.some(o => o.value !== '' && !idsValidos.has(o.value));
    if (hayOpcionRota) {
      const valorPrevio = idsValidos.has(sel.value) ? sel.value : '';
      sel.innerHTML = '<option value="">Todos los campos</option>' +
        camposReales.map(c => `<option value="${c.campo_id}">${c.nombre}</option>`).join('');
      sel.value = valorPrevio;
    }
  })();

  function applyInsumoTipoUI(tipo) {

    const kw = document.getElementById('in-campo-wrap'), rw = document.getElementById('in-rodeo-wrap');

    rw.style.display = esCompra ? 'none' : 'flex';
    if (cnw) cnw.style.display = esCompra ? 'none' : 'flex';
    actualizarCampoCompraInsumo_();
  }
  document.querySelectorAll('#in-tipo-group .radio-pill').forEach(p => p.onclick = () => {
    document.querySelectorAll('#in-tipo-group .radio-pill').forEach(x => x.classList.remove('selected'));
    p.classList.add('selected');
    applyInsumoTipoUI(p.dataset.tipo);
  });
  applyInsumoTipoUI('Consumo'); // default es Consumo — mostrar campo/rodeo desde el inicio

  const npSave = document.getElementById('np-save');
  if (npSave) npSave.onclick = async () => {
    const nombre = document.getElementById('np-nombre').value.trim();
    const categoria = document.getElementById('np-categoria').value;
    const unidad = document.getElementById('np-unidad').value.trim();
    const porCampo = document.getElementById('np-por-campo').checked;
    const msPct = document.getElementById('np-ms') ? document.getElementById('np-ms').value.trim() : '';

    if (msPct !== '' && (Number(msPct) <= 0 || Number(msPct) > 100)) { toast('La materia seca debe ser un porcentaje entre 0 y 100.', 'err'); return; }

    try {
      await apiCall('create', { body: { entity: 'productos', data: { nombre, categoria, unidad, activo: true, por_campo: porCampo, materia_seca_pct: msPct } } });
      await loadCatalogs();
      const sel = document.getElementById('in-producto');
      if (sel) {
        sel.innerHTML = productoOptionsHtml(S.catalogs.productos || []);
        const nuevo = (S.catalogs.productos || []).find(p => p.nombre === nombre);
        if (nuevo) sel.value = nuevo.producto_id;
      }
      actualizarCampoCompraInsumo_();
      document.getElementById('np-nombre').value = '';
      document.getElementById('np-unidad').value = '';
      if (document.getElementById('np-ms')) document.getElementById('np-ms').value = '';
      document.getElementById('np-por-campo').checked = false;
      document.getElementById('in-nuevo-producto-panel').style.display = 'none';
      toast('Producto creado: ' + nombre, 'ok');
    } catch (err) { toast(err.message, 'err'); } finally { npSave.disabled = false; }
  };

  const save = document.getElementById('in-save');
  if (save) save.onclick = async () => {
    const tipo = document.querySelector('#in-tipo-group .selected').dataset.tipo;
    const esCompra = tipo === 'Compra';
    const productoId = document.getElementById('in-producto').value;
    if (!productoId) { toast('Creá o seleccioná un producto primero.', 'err'); return; }
    const cantidad = Number(document.getElementById('in-cantidad').value) || 0;
    const fecha = document.getElementById('in-fecha').value;
    if (!fecha || !cantidad) { toast('Completá fecha y cantidad.', 'err'); return; }
    save.disabled = true;
    try {
      if (esCompra) {
        const producto = ((S.catalogs && S.catalogs.productos) || []).find(p => String(p.producto_id) === String(productoId));
        const esPorCampo = producto && esPorCampo_(producto.por_campo);
        const campoCompraId = document.getElementById('in-compra-campo')?.value;
        if (esPorCampo && !campoCompraId) { toast('Este producto se guarda por separado en cada campo — elegí a cuál entra esta compra.', 'err'); save.disabled = false; return; }
        const data = {
          fecha, producto_id: productoId, cantidad,
          precio_unitario: Number(document.getElementById('in-costo').value) || '',
          proveedor: document.getElementById('in-proveedor').value.trim(),
          observaciones: document.getElementById('in-obs').value.trim(),
          campo_id: esPorCampo ? campoCompraId : '',
        };
        await apiCall('create', { body: { entity: 'compras_insumos', data } });
        invalidateCache('compras_insumos');
      } else {
        const rodeoId = document.getElementById('in-rodeo').value;
        if (!rodeoId) { toast('Seleccioná el rodeo que consume.', 'err'); save.disabled = false; return; }
        // Validar que el producto no esté inactivo para este rodeo a la fecha del consumo
        if (!egEsProductoActivo_(rodeoId, productoId, fecha)) {
          const rp = egRodeoProductosTodos_().find(x => String(x.rodeo_id) === String(rodeoId) && String(x.producto_id) === String(productoId));
          const prod = (S.catalogs?.productos || []).find(p => String(p.producto_id) === String(productoId));
          toast(`"${prod?.nombre || 'Este insumo'}" está inactivo para este rodeo desde ${rp?.fecha_baja || 'una fecha anterior'}.`, 'err');
          save.disabled = false;
          return;
        }
        const data = {
          fecha, producto_id: productoId,

          cantidad, observaciones: document.getElementById('in-obs').value.trim(),
          campana: document.getElementById('in-campana').value.trim(),
        };
        await apiCall('create', { body: { entity: 'consumos_insumos', data } });
        invalidateCache('consumos_insumos');
        S.margenBruto = null; S._resultCria = null; S._resultRecria = null; S._resultEng = null;
      }
      S.stockProductos = null;
      await loadStockProductos();
      toast((esCompra ? 'Compra' : 'Consumo') + ' registrado', 'ok');
      await loadEntity(esCompra ? 'compras_insumos' : 'consumos_insumos', true);

  };

  attachTableDeleteEvents('compras_insumos', 'compra_id');
  attachTableDeleteEvents('consumos_insumos', 'consumo_id');
  attachTableDeleteEvents('productos', 'producto_id');

  // Botones "Actualizar precio" del panel Precios Vigentes
  document.querySelectorAll('.pv-guardar').forEach(btn => {
    btn.onclick = async () => {
      const pid = btn.dataset.pid;
      const nombre = btn.dataset.nombre || 'producto';
      const precio = Number(document.querySelector(`.pv-nuevo-precio[data-pid="${pid}"]`)?.value) || 0;
      const fecha = document.querySelector(`.pv-nueva-fecha[data-pid="${pid}"]`)?.value;
      if (!precio || precio <= 0) { toast('Ingresá el nuevo precio unitario.', 'err'); return; }
      if (!fecha) { toast('Ingresá la fecha desde la que rige este precio.', 'err'); return; }
      // Si ya existe un registro de precio con fecha MÁS RECIENTE que la que estás
      // por cargar, avisar antes de guardar — porque el sistema siempre usa el precio
      // de la fecha más nueva, así que este precio nuevo (más viejo) no va a aparecer
      // como "vigente" aunque se guarde bien. Esto es justo lo que confunde: el
      // registro se crea, pero no se ve reflejado porque uno más reciente le gana.
      const comprasExistentes = (S.cache.compras_insumos||[])
        .filter(c => String(c.producto_id)===String(pid) && Number(c.precio_unitario)>0)
        .sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
      const masReciente = comprasExistentes[0];
      if (masReciente && String(masReciente.fecha) > String(fecha)) {
        const ok = confirm(
          `Ya hay un precio cargado para "${nombre}" con fecha ${fd(masReciente.fecha)} ($ ${fn(Number(masReciente.precio_unitario))}), que es MÁS RECIENTE que ${fd(fecha)}.\n\n` +
          `El sistema siempre usa el precio de la fecha más nueva — así que este precio que estás por cargar (con fecha anterior) NO va a mostrarse como el vigente, aunque se guarde igual.\n\n` +
          `¿Igual querés guardarlo? (Sirve para completar el historial, pero no cambia el precio que se usa hoy.)`
        );
        if (!ok) return;
      }
      btn.disabled = true; btn.textContent = '⏳...';
      try {
        // Registra una compra de 1 unidad con el nuevo precio — sirve como registro de precio vigente
        // sin afectar el stock significativamente (cantidad = 0.001 para no distorsionar inventario)
        await apiCall('create', { body: { entity: 'compras_insumos', data: {
          fecha,
          producto_id: pid,
          cantidad: 0,
          precio_unitario: precio,
          proveedor: '',
          observaciones: 'Actualización de precio vigente',
          campo_id: '',
        }}});
        invalidateCache('compras_insumos');
        await loadStockProductos();
        await loadEntity('compras_insumos', true);
        toast('✓ Precio de "' + nombre + '" actualizado a $ ' + fn(precio) + ' desde ' + fd(fecha), 'ok');
        render();
      } catch(err) {
        btn.disabled = false; btn.textContent = '✓ Actualizar';
        toast(err.message, 'err');
      }
    };
  });
}

function periodoPreset_(preset) {
  const hoy = new Date();
  const y = hoy.getFullYear();
  const pad = n => String(n).padStart(2, '0');
  if (preset === 'mes') {
    return { desde: `${y}-${pad(hoy.getMonth() + 1)}-01`, hasta: today() };
  }
  if (preset === 'anio_pasado') {
    return { desde: `${y - 1}-01-01`, hasta: `${y - 1}-12-31` };
  }
  // 'anio' (default)
  return { desde: `${y}-01-01`, hasta: today() };
}

async function calcularMargenBruto_() {
  const { desde, hasta } = S.margenBrutoPeriodo;
  S.margenBruto = await apiCall('margenBruto', { params: { desde, hasta } });
}

// Convierte ventas e insumos a dólares usando la cotización BNA vigente en la fecha de CADA línea
// (la cesión por destete ya viene resuelta en dólares desde el backend, con el precio interno guardado en su momento).
function vistaUsdMargenBruto_(mb) {
  let ventasUsd = 0, ventasSinCotizacion = 0;
  const detalleVentas = (mb.ingresos.detalle_ventas || []).map(v => {
    const tc = tipoCambioVigente_(v.fecha);
    const importeUsd = tc ? v.importe / Number(tc.valor) : null;
    const precioUsd = tc && v.cant_animales ? v.precio_pactado / Number(tc.valor) : null;
    if (importeUsd == null) ventasSinCotizacion++; else ventasUsd += importeUsd;
    return Object.assign({}, v, { importe_usd: importeUsd, precio_pactado_usd: precioUsd });
  });

  let cesionUsd = 0;
  (mb.ingresos.detalle_destetes || []).forEach(d => { cesionUsd += d.valor_usd || 0; });

  let insumosUsd = 0, consumosSinCotizacion = 0;
  const porProductoUsd = {};
  (mb.egresos.detalle_consumos || []).forEach(c => {
    const tc = tipoCambioVigente_(c.fecha);
    if (tc) {
      const usd = c.costo_ars / Number(tc.valor);
      insumosUsd += usd;
      porProductoUsd[c.producto] = (porProductoUsd[c.producto] || 0) + usd;
    } else {
      consumosSinCotizacion++;
    }
  });

  const totalIngresosUsd = ventasUsd + cesionUsd;
  return {
    ventas: ventasUsd, ventasSinCotizacion,
    cesion: cesionUsd,
    total: totalIngresosUsd,
    insumos: insumosUsd, consumosSinCotizacion,
    detalle_por_producto: Object.keys(porProductoUsd).map(n => ({ producto: n, costo: porProductoUsd[n] })).sort((a, b) => b.costo - a.costo),
    detalle_ventas: detalleVentas,
    resultado: totalIngresosUsd - insumosUsd,
  };
}

function calcMargenCria_(campana, desde, hasta) {
  const movs      = S.cache.movimientos || [];
  const ventas    = S.cache.ventas || [];
  const consumos  = S.cache.consumos_insumos || [];
  const comprasH  = comprasHacGetAll_();
  const productos = (S.catalogs && S.catalogs.productos) || [];
  const rodeosAll = (S.catalogs && S.catalogs.rodeos) || [];
  const rodeosCria = rodeosAll.filter(r => normAct_(r.actividad)==='cria');
  const rodeosIds  = new Set(rodeosCria.map(r => String(r.rodeo_id)));
  const prodPorId  = Object.fromEntries(productos.map(p => [String(p.producto_id), p]));

  // Ventas del período
  const ventasFilt = ventas.filter(v =>
    rodeosIds.has(String(v.rodeo_id)) &&
    (!desde || String(v.fecha_salida) >= desde) &&
    (!hasta || String(v.fecha_salida) <= hasta)
  );
  const ingVentas = ventasFilt.reduce((s,v) =>
    s + (Number(v.importe_liq)||(Number(v.precio_pactado)*(Number(v.peso_campo_kg)||Number(v.cant_animales)))||0), 0);

  // Cesiones a Recría (traslados de Cría a Recría con precio/kg)
  const rodeosPorId = Object.fromEntries(rodeosAll.map(r=>[String(r.rodeo_id),r]));
  const cesiones = movs.filter(m => {
    if (m.tipo!=='Traslado en bloque'&&m.tipo!=='Traslado individual') return false;
    const or = rodeosPorId[String(m.rodeo_origen_id)];
    const de = rodeosPorId[String(m.rodeo_destino_id)];
    return or&&(normAct_(or.actividad)==='cria'||normAct_(or.actividad)==='cria')&&de&&normAct_(de.actividad)==='recria' &&
      (!desde||String(m.fecha)>=desde) && (!hasta||String(m.fecha)<=hasta);
  });
  const pesadas = S.cache.pesadas||[];
  let ingCesiones = 0;
  const filasEI = [], filasEF = [], filesCes = [];
  cesiones.forEach(m => {
    const cant = Number(m.cantidad)||0;
    const peso = Number(m.peso_prom_kg)||(()=>{
      const pp=pesadas.filter(p=>String(p.rodeo_id)===String(m.rodeo_origen_id)&&String(p.fecha)<=String(m.fecha)).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
      return Number(pp[0]?.peso_prom_kg)||0;
    })();
    // Priorizar precio_kg, luego precio_cabeza (como $/kg), luego valorización del mes
    const precioKg = Number(m.precio_kg)||Number(m.precio_cabeza)||0;
    let total = 0;
    if (precioKg) { total = cant * peso * precioKg; ingCesiones += total; }
    else {
      const p = preciosValGet_(m.fecha);
      const cat = (rodeosPorId[String(m.rodeo_origen_id)]?.categoria||'ternero').toLowerCase();
      const mapaKg = {ternero:'ternero',ternera:'ternera',vaquillona:'vaquillona','vaquillona venta':'vaquillona_venta',novillito:'novillito',novillo:'novillo'};
      total = cant * peso * (p[mapaKg[cat]]||0);
      ingCesiones += total;
    }
    filesCes.push({ fecha: m.fecha, rodeo: rodeosPorId[String(m.rodeo_origen_id)]?.nombre||'—', destino: rodeosPorId[String(m.rodeo_destino_id)]?.nombre||'—', cant, peso, precioKg: precioKg || (total/cant/peso||0), total });
  });

  // EF — stock valorizado actual
  // Copia exacta del cálculo de buildDashboard para garantizar que coincidan.
  const stockPorRodeoMB = {};
  movs.forEach(m => {
    const cant = Number(m.cantidad)||0;
    if (m.tipo==='Saldo inicial') {
      stockPorRodeoMB[String(m.rodeo_destino_id)] = (stockPorRodeoMB[String(m.rodeo_destino_id)]||0) + cant;
    } else if (m.tipo==='Traslado en bloque'||m.tipo==='Traslado individual') {
      if (m.rodeo_origen_id)  stockPorRodeoMB[String(m.rodeo_origen_id)]  = (stockPorRodeoMB[String(m.rodeo_origen_id)] ||0) - cant;
      if (m.rodeo_destino_id) stockPorRodeoMB[String(m.rodeo_destino_id)] = (stockPorRodeoMB[String(m.rodeo_destino_id)]||0) + cant;
    }
  });
  // Restar ventas exactamente igual que buildDashboard — sin filtrar por rodeosIds,
  // para que stockPorRodeoMB sea idéntico al stockPorRodeo del dashboard.
  (S.cache.ventas||[]).forEach(v => {
    stockPorRodeoMB[String(v.rodeo_id)] = (stockPorRodeoMB[String(v.rodeo_id)]||0) - (Number(v.cant_animales)||0);
  });
  let ef = 0;
  rodeosCria.forEach(r => {
    const stock = Math.max(0, stockPorRodeoMB[String(r.rodeo_id)]||0);
    if (!stock) return;
    const pesadasR = pesadas.filter(p=>String(p.rodeo_id)===String(r.rodeo_id)).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
    const pesoP = pesadasR[0] ? Number(pesadasR[0].peso_prom_kg)||0 : 0;
    const val = valorizarRodeo_(r, stock, pesoP);
    ef += val;
    filasEF.push({ rodeo: r.nombre, cant: stock, precio: pesoP?val/stock/pesoP:val/stock||0, total: val });
  });

  const ing = ingVentas + ingCesiones + ef;

  // EI — saldos iniciales
  const movEI = movs.filter(m => m.tipo==='Saldo inicial' && rodeosIds.has(String(m.rodeo_destino_id)));
  const ei = movEI.reduce((s,m) => {
    const cant = Number(m.cantidad)||0;
    const { total, precioLabel } = valorMovimientoEntrada_(m);
    const precio = cant ? total/cant : 0;
    filasEI.push({ fecha: m.fecha, rodeo: rodeosPorId[String(m.rodeo_destino_id)]?.nombre||'—', cant, precio, total });
    return s + total;
  }, 0);

  // Compras campaña
  const compras = comprasH
    .filter(c => (!campana||c.campana===campana) &&
      (!desde||String(c.fecha)>=desde) && (!hasta||String(c.fecha)<=hasta))
    .reduce((s,c) => s+(Number(c.importe_total)||0), 0);

  // Consumos de Cría
  const consumosFilt = consumos.filter(c => rodeosIds.has(String(c.rodeo_id)));
  let egAlim=0, egVet=0;
  consumosFilt.forEach(c => {
    const prod = prodPorId[String(c.producto_id)];
    const costo = (Number(c.cantidad)||0)*egPrecioVigenteProducto_(c.producto_id, c.fecha);
    if (prod&&prod.categoria==='Veterinaria') egVet+=costo; else egAlim+=costo;
  });

  const egSueldos = sueldoTotalActividad_('cria', s => !hasta || String(s.periodo).slice(0,7) <= String(hasta).slice(0,7));
  const eg = ei + compras + egAlim + egVet + egSueldos;
  const margen = ing - eg;

  return { ing, eg, margen, detalle: { ingVentas, ingCesiones, ef, ei, compras, egAlim, egVet, egSueldos, cantVentas: ventasFilt.length, filasEI, filasEF, filesCes } };
}

function calcMargenRecria_(campana, desde, hasta) {
  const rodeosAll  = (S.catalogs&&S.catalogs.rodeos)||[];
  // Usar TODOS los rodeos de Recría del catálogo (no solo los con stock actual)
  // para capturar EI, cesiones y ventas de rodeos que ya vaciaron su stock.
  const rodeosRec  = rodeosAll.filter(r=>normAct_(r.actividad)==='recria');
  const rodeosIds  = new Set(rodeosRec.map(r=>String(r.rodeo_id)));
  const productos  = (S.catalogs&&S.catalogs.productos)||[];
  const movs       = S.cache.movimientos||[];
  const ventas     = (S.cache.ventas||[]).filter(v=>rodeosIds.has(String(v.rodeo_id))&&(!desde||String(v.fecha_salida)>=desde)&&(!hasta||String(v.fecha_salida)<=hasta));
  const egresos    = (S.cache.egresos_recria||[]).filter(e=>rodeosIds.has(String(e.rodeo_id))&&e.destino==='Engorde'&&(!desde||String(e.fecha)>=desde)&&(!hasta||String(e.fecha)<=hasta));
  const consumos   = (S.cache.consumos_insumos||[]).filter(c=>rodeosIds.has(String(c.rodeo_id)));

  let ingVentas=0;
  ventas.forEach(v=>{ ingVentas+=Number(v.importe_liq)||(Number(v.precio_pactado)*(Number(v.peso_campo_kg)||Number(v.cant_animales)))||0; });

  // Cesiones a Terminación:
  // 1) Las registradas en egresos_recria (módulo de Cesiones)
  // 2) Traslados directos Recría→Engorde cargados como Traslado sin pasar por el módulo
  //    (detectados por la actividad de los rodeos: origen Recría, destino Engorde)
  let ingCesEng = 0;
  egresos.forEach(e => {
    const cant = Number(e.cant_animales)||0, peso = Number(e.peso_prom_kg)||0, precio = Number(e.precio_kg_cesion)||0;
    ingCesEng += cant * peso * precio;
  });
  // Traslados directos Recría→Engorde sin egresos_recria correspondiente
  const rodeosMap_ = Object.fromEntries(rodeosAll.map(r=>[String(r.rodeo_id),r]));
  movs.filter(m => {
    if (m.tipo !== 'Traslado en bloque' && m.tipo !== 'Traslado individual') return false;
    const or = rodeosMap_[String(m.rodeo_origen_id)];
    const de = rodeosMap_[String(m.rodeo_destino_id)];
    if (!or || !de) return false;
    if (!(normAct_(or.actividad)==='recria') || !(normAct_(de.actividad)==='engorde')) return false;
    if (desde && String(m.fecha) < desde) return false;
    if (hasta && String(m.fecha) > hasta) return false;
    // Excluir si ya tiene registro en egresos_recria para evitar doble conteo
    return !egresos.some(e =>
      String(e.rodeo_id) === String(m.rodeo_origen_id) &&
      String(e.rodeo_destino_id) === String(m.rodeo_destino_id) &&
      String(e.fecha) === String(m.fecha) &&
      Number(e.cant_animales) === Number(m.cantidad)
    );
  }).forEach(m => {
    const cant = Number(m.cantidad)||0;
    const peso = Number(m.peso_prom_kg)||0;
    const precioKg = Number(m.precio_kg)||Number(m.precio_cabeza)||0;
    // Si tiene precio explícito, usarlo; si no, valorizar con precio del mes
    if (precioKg && peso) { ingCesEng += cant * peso * precioKg; return; }
    const p = preciosValGet_(m.fecha);
    const cat = (rodeosMap_[String(m.rodeo_origen_id)]?.categoria||'novillo').toLowerCase();
    const mapaKg = {ternero:'ternero',ternera:'ternera',vaquillona:'vaquillona','vaquillona venta':'vaquillona_venta',novillito:'novillito',novillo:'novillo','vaca venta':'vaca_venta'};
    ingCesEng += cant * peso * (p[mapaKg[cat]]||0);
  });

  // EF valorizado — usa resumenRecria igual que el dashboard de Recría
  const pesadasAll = S.cache.pesadas||[];
  let ef=0;
  const filasEF_R = [];
  const rodeosResumen = (S.resumenRecria&&S.resumenRecria.rodeos)||[];
  rodeosResumen.forEach(r=>{
    const stk=Math.max(0,r.stock||0); if(!stk)return;
    const pp=r.ultima_pesada?Number(r.ultima_pesada.peso_prom_kg)||0:
      (pesadasAll.filter(p=>String(p.rodeo_id)===String(r.rodeo_id)).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)))[0]?.peso_prom_kg||0);
    const rodeoObj=rodeosAll.find(x=>String(x.rodeo_id)===String(r.rodeo_id))||{};
    const val=valorizarRodeo_(rodeoObj,stk,Number(pp));
    ef+=val;
    filasEF_R.push({ rodeo: r.nombre, cant: stk, peso: Number(pp), precio: pp&&stk?val/stk/Number(pp):val/stk||0, total: val });
  });

  const ing = ingVentas + ingCesEng + ef;

  // EI — saldos iniciales de recría
  const filasEI_R = [];
  const ei = movs.filter(m=>m.tipo==='Saldo inicial'&&rodeosIds.has(String(m.rodeo_destino_id))).reduce((s,m)=>{
    const cant=Number(m.cantidad)||0;
    const { total } = valorMovimientoEntrada_(m);
    const precio = cant ? total/cant : 0;
    const rd=rodeosAll.find(r=>String(r.rodeo_id)===String(m.rodeo_destino_id));
    filasEI_R.push({ fecha: m.fecha, rodeo: rd?.nombre||'—', cant, precio, total });
    return s+total;
  },0);

  // Cesión recibida desde Cría
  const rodeosPorId = Object.fromEntries(rodeosAll.map(r=>[String(r.rodeo_id),r]));
  const pesadas = S.cache.pesadas||[];
  let egCesionCria=0;
  const filasCesRec_R = [];
  movs.filter(m=>{
    if(m.tipo!=='Traslado en bloque'&&m.tipo!=='Traslado individual') return false;
    const or=rodeosPorId[String(m.rodeo_origen_id)];
    const de=rodeosPorId[String(m.rodeo_destino_id)];
    return or&&(normAct_(or.actividad)==='cria'||normAct_(or.actividad)==='cria')&&de&&normAct_(de.actividad)==='recria'&&
      (!desde||String(m.fecha)>=desde)&&(!hasta||String(m.fecha)<=hasta);
  }).forEach(m=>{
    const cant=Number(m.cantidad)||0;
    const peso=Number(m.peso_prom_kg)||0;
    const precioKg=Number(m.precio_kg)||Number(m.precio_cabeza)||0;
    let total=0;
    if (precioKg && peso) { total=cant*peso*precioKg; egCesionCria+=total; }
    else {
      const or=rodeosPorId[String(m.rodeo_origen_id)];
      const p=preciosValGet_(m.fecha);
      const cat=(or?.categoria||'ternero').toLowerCase();
      const mapaKg={ternero:'ternero',ternera:'ternera',vaquillona:'vaquillona','vaquillona venta':'vaquillona_venta',novillito:'novillito',novillo:'novillo'};
      const pesadasO=pesadas.filter(p2=>String(p2.rodeo_id)===String(m.rodeo_origen_id)&&String(p2.fecha)<=String(m.fecha)).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
      const pesoFinal=peso||Number(pesadasO[0]?.peso_prom_kg)||0;
      total=cant*pesoFinal*(p[mapaKg[cat]]||0);
      egCesionCria+=total;
    }
    filasCesRec_R.push({ fecha: m.fecha, rodeo: rodeosPorId[String(m.rodeo_origen_id)]?.nombre||'—', destino: rodeosPorId[String(m.rodeo_destino_id)]?.nombre||'—', cant, peso, precioKg: total/cant/(peso||1)||0, total });
  });

  let egCompraExt=0;
  movs.filter(m=>rodeosIds.has(String(m.rodeo_destino_id))&&m.tipo!=='Saldo inicial'&&m.tipo!=='Traslado en bloque'&&m.tipo!=='Traslado individual'&&(!desde||String(m.fecha)>=desde)&&(!hasta||String(m.fecha)<=hasta))
    .forEach(m=>{ egCompraExt+=(Number(m.cantidad)||0)*(Number(m.precio_cabeza)||0); });

  let egAlim=0, egVet=0;
  // CAMBIO (decisión de negocio): los consumos se valorizan al precio vigente a la
  // fecha de cada consumo (igual que Cría), no al promedio histórico de compras.
  consumos.forEach(c=>{ const prod=productos.find(p=>String(p.producto_id)===String(c.producto_id)); const costo=(Number(c.cantidad)||0)*egPrecioVigenteProducto_(c.producto_id, c.fecha); if(prod&&prod.categoria==='Veterinaria') egVet+=costo; else egAlim+=costo; });

  // Filas de cesiones enviadas a Engorde (para detalle)
  const filasCesEng_R = egresos.map(e=>({
    fecha: e.fecha, rodeo: rodeosAll.find(r=>String(r.rodeo_id)===String(e.rodeo_id))?.nombre||'—',
    destino: rodeosAll.find(r=>String(r.rodeo_id)===String(e.rodeo_destino_id))?.nombre||'—',
    cant: Number(e.cant_animales)||0, peso: Number(e.peso_prom_kg)||0,
    precioKg: Number(e.precio_kg_cesion)||0,
    total: (Number(e.cant_animales)||0)*(Number(e.peso_prom_kg)||0)*(Number(e.precio_kg_cesion)||0),
  }));

  const egSueldos=sueldoTotalActividad_('recria', s => !hasta || String(s.periodo).slice(0,7) <= String(hasta).slice(0,7));
  const eg=ei+egCesionCria+egCompraExt+egAlim+egVet+egSueldos;
  return { ing, eg, margen: ing-eg, detalle: { ingVentas, ingCesEng, ef, ei, egCesionCria, egCompraExt, egAlim, egVet, egSueldos, filasEI: filasEI_R, filasEF: filasEF_R, filesCesRec: filasCesRec_R, filesCesEnv: filasCesEng_R } };
}

function calcMargenTerminacion_(campana, desde, hasta) {
  // Antes se excluían acá los corrales con activo=false, lo que dejaba afuera
  // hacienda que sigue con stock cargado en corrales ya desactivados —
  // generando una Existencia Final más baja que la de Stock de Hacienda
  // (que sí cuenta todos los rodeos, activos e inactivos). Se saca ese filtro
  // para que ambos módulos coincidan; Cría y Recría tampoco filtran por activo.
  const rodeosEng = rodeosEngordeValidos_();
  const rodeosIds = new Set(rodeosEng.map(r=>String(r.rodeo_id)));
  const movs      = S.cache.movimientos||[];
  const productos = (S.catalogs&&S.catalogs.productos)||[];
  const stockList = S.stock||[];
  const pesadas   = S.cache.pesadas||[];

  // Ventas con fallback precio_pactado.
  // CAMBIO (decisión de negocio): ahora las ventas respetan el período desde/hasta
  // elegido, igual que ya lo hacían Cría y Recría — antes sumaban TODO el historial
  // del corral aunque se eligiera un período, mezclando ingresos de un ciclo con
  // costos de otro.
  let ingVentas=0;
  (S.cache.ventas||[]).filter(v=>rodeosIds.has(String(v.rodeo_id))&&(!desde||String(v.fecha_salida)>=desde)&&(!hasta||String(v.fecha_salida)<=hasta)).forEach(v=>{
    ingVentas+=Number(v.importe_liq)||(Number(v.precio_pactado)*(Number(v.peso_campo_kg)||Number(v.cant_animales)))||0;
  });

  // EF — valorizado igual que el dashboard individual (con peso de última pesada)
  let ef=0;
  const filasEF_E = [];
  rodeosEng.forEach(r=>{
    const stk = stockList.find(s=>String(s.rodeo_id)===String(r.rodeo_id));
    if (!stk||stk.stock<=0) return;
    const pesR = pesadas.filter(p=>String(p.rodeo_id)===String(r.rodeo_id)).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
    const pesoP = pesR[0] ? Number(pesR[0].peso_prom_kg)||0 : 0;
    const val = valorizarRodeo_(r, stk.stock, pesoP);
    ef += val;
    filasEF_E.push({ rodeo: r.nombre, cant: stk.stock, peso: pesoP, precio: pesoP?val/stk.stock/pesoP:val/stk.stock||0, total: val });
  });

  const ing=ingVentas+ef;

  // EI — saldos iniciales × precio/cabeza
  const filasEI_E = [];
  const ei=movs.filter(m=>m.tipo==='Saldo inicial'&&rodeosIds.has(String(m.rodeo_destino_id)))
    .reduce((s,m)=>{
      const cant=Number(m.cantidad)||0;
      const { total } = valorMovimientoEntrada_(m);
      const precio = cant ? total/cant : 0;
      const rd=rodeosEng.find(r=>String(r.rodeo_id)===String(m.rodeo_destino_id));
      filasEI_E.push({ fecha: m.fecha, rodeo: rd?.nombre||'—', cant, precio, total });
      return s+total;
    },0);

  // Cesión recibida desde Recría
  let egCesionRec=0;
  const filasCesRec_E = [];
  const rodeosAll_ = (S.catalogs&&S.catalogs.rodeos)||[];
  (S.cache.egresos_recria||[]).filter(e=>e.destino==='Engorde'&&(!desde||String(e.fecha)>=desde)&&(!hasta||String(e.fecha)<=hasta)).forEach(e=>{
    const total=(Number(e.cant_animales)||0)*(Number(e.peso_prom_kg)||0)*(Number(e.precio_kg_cesion)||0);
    egCesionRec+=total;
    filasCesRec_E.push({ fecha: e.fecha, rodeo: rodeosAll_.find(r=>String(r.rodeo_id)===String(e.rodeo_id))?.nombre||'—', destino: rodeosAll_.find(r=>String(r.rodeo_id)===String(e.rodeo_destino_id))?.nombre||'—', cant: Number(e.cant_animales)||0, peso: Number(e.peso_prom_kg)||0, precioKg: Number(e.precio_kg_cesion)||0, total });
  });

  // Nota: los traslados reales en movimientos NO se suman acá — el registro en
  // egresos_recria ya cubre el costo de la cesión. El traslado existe solo para
  // mover el stock, no para duplicar el cálculo económico.

  // Compras externas de hacienda (compras_hacienda, no saldos iniciales ni cesiones)
  const egCompra = comprasHacGetAll_()
    .filter(c=>(rodeosIds.has(String(c.rodeo_id||''))||rodeosEng.some(r=>String(r.campo_id)===String(c.campo_id)))&&
      (!campana||c.campana===campana)&&(!desde||String(c.fecha)>=desde)&&(!hasta||String(c.fecha)<=hasta))
    .reduce((s,c)=>s+(Number(c.importe_total)||0),0);

  // Consumos — sin filtro de campaña si no tienen campaña cargada
  const consumos = (S.cache.consumos_insumos||[]).filter(c=>
    rodeosIds.has(String(c.rodeo_id)) &&
    (!campana || !c.campana || c.campana===campana) // incluir consumos sin campaña
  );
  let egAlim=0, egVet=0;
  consumos.forEach(c=>{
    const prod=productos.find(p=>String(p.producto_id)===String(c.producto_id));
    // CAMBIO (decisión de negocio): precio vigente a la fecha del consumo, igual
    // que Cría y Recría — antes acá se usaba el promedio histórico de compras.
    const costo=(Number(c.cantidad)||0)*egPrecioVigenteProducto_(c.producto_id, c.fecha);
    if(prod&&prod.categoria==='Veterinaria') egVet+=costo; else egAlim+=costo;
  });

  const egSueldos=sueldoTotalActividad_('engorde', s => !hasta || String(s.periodo).slice(0,7) <= String(hasta).slice(0,7));
  const eg=ei+egCesionRec+egCompra+egAlim+egVet+egSueldos;
  return { ing, eg, margen: ing-eg, detalle: { ingVentas, ef, ei, egCesionRec, egCompra, egAlim, egVet, egSueldos, filasEI: filasEI_E, filasEF: filasEF_E, filesCesRec: filasCesRec_E } };
}

// Panel de verificación de valuación — reutilizable para Cría, Recría y Terminación.
// Muestra EI, Cesiones recibidas, Cesiones enviadas y EF con resumen y detalle expandible.
function buildVerificacionValuacion_(titulo, detalle, fmFn, idPrefix) {
  const { filasEI=[], filasEF=[], filesCes=[], filesCesRec=[], filesCesEnv=[] } = detalle || {};
  const cesEnv  = filesCes.length ? filesCes : (filesCesEnv.length ? filesCesEnv : []);
  const cesRec  = filesCesRec.length ? filesCesRec : [];

  function tablaFilas_(filas, cols) {
    if (!filas.length) return '<div style="color:var(--text3);font-size:12px;padding:6px">Sin registros</div>';
    let t = `<div class="tw" style="margin-top:6px"><table class="dt" style="font-size:12px"><thead><tr>${cols.map(c=>`<th>${c.label}</th>`).join('')}</tr></thead><tbody>`;
    let tot = 0;
    filas.forEach(f => {
      t += `<tr>${cols.map(c => {
        const v = f[c.key];
        if (c.key==='total') { tot+=Number(v)||0; return `<td class="tr"><strong>${fmFn(v)}</strong></td>`; }
        if (c.fmt==='num') return `<td class="tc">${fn(v||0)}</td>`;
        if (c.fmt==='$') return `<td class="tc">$ ${fn(v||0)}</td>`;
        if (c.fmt==='date') return `<td>${fd(v)}</td>`;
        return `<td>${v||'—'}</td>`;
      }).join('')}</tr>`;
    });
    t += `<tr style="background:var(--bg2);font-weight:700"><td colspan="${cols.length-1}">TOTAL</td><td class="tr">${fmFn(tot)}</td></tr>`;
    t += `</tbody></table></div>`;
    return t;
  }

  const colsEI   = [{key:'fecha',label:'Fecha',fmt:'date'},{key:'rodeo',label:'Rodeo'},{key:'cant',label:'Cabezas',fmt:'num'},{key:'precio',label:'Precio/cab',fmt:'$'},{key:'total',label:'Total'}];
  const colsEF   = [{key:'rodeo',label:'Rodeo'},{key:'cant',label:'Cabezas',fmt:'num'},{key:'precio',label:'Precio/cab est.',fmt:'$'},{key:'total',label:'Total'}];
  const colsCes  = [{key:'fecha',label:'Fecha',fmt:'date'},{key:'rodeo',label:'Rodeo origen'},{key:'destino',label:'Rodeo destino'},{key:'cant',label:'Cab.',fmt:'num'},{key:'peso',label:'Kg prom',fmt:'num'},{key:'precioKg',label:'$/kg',fmt:'$'},{key:'total',label:'Total'}];

  const totEI  = filasEI.reduce((s,f)=>s+f.total,0);
  const totEF  = filasEF.reduce((s,f)=>s+f.total,0);
  const totCEn = cesEnv.reduce((s,f)=>s+f.total,0);
  const totCRe = cesRec.reduce((s,f)=>s+f.total,0);

  let h = `<div class="panel" style="border:1px solid var(--border2)">
    <div class="panel-title" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center" onclick="document.getElementById('${idPrefix}-det').classList.toggle('hidden')">
      🔍 ${titulo} — Verificación de valuación
      <span style="font-size:12px;color:var(--text3)">▾ expandir / colapsar</span>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px">
      <div style="background:var(--bg2);border-radius:8px;padding:7px 14px;font-size:13px"><span style="color:var(--text3)">EI:</span> <strong>${fmFn(totEI)}</strong> <span style="color:var(--text3);font-size:11px">(${filasEI.length} reg.)</span></div>
      ${cesRec.length?`<div style="background:var(--bg2);border-radius:8px;padding:7px 14px;font-size:13px"><span style="color:var(--text3)">Ces. recibidas:</span> <strong>${fmFn(totCRe)}</strong> <span style="color:var(--text3);font-size:11px">(${cesRec.length} reg.)</span></div>`:''}
      ${cesEnv.length?`<div style="background:var(--bg2);border-radius:8px;padding:7px 14px;font-size:13px"><span style="color:var(--text3)">Ces. enviadas:</span> <strong>${fmFn(totCEn)}</strong> <span style="color:var(--text3);font-size:11px">(${cesEnv.length} reg.)</span></div>`:''}
      <div style="background:var(--bg2);border-radius:8px;padding:7px 14px;font-size:13px"><span style="color:var(--text3)">EF:</span> <strong>${fmFn(totEF)}</strong> <span style="color:var(--text3);font-size:11px">(${filasEF.length} rodeos)</span></div>
    </div>
    <div id="${idPrefix}-det" class="hidden">
      ${filasEI.length?`<div style="font-weight:600;font-size:12.5px;margin-top:8px">📋 Saldo inicial (EI)</div>${tablaFilas_(filasEI, colsEI)}`:''}
      ${cesRec.length?`<div style="font-weight:600;font-size:12.5px;margin-top:8px">⬇ Cesiones recibidas</div>${tablaFilas_(cesRec, colsCes)}`:''}
      ${cesEnv.length?`<div style="font-weight:600;font-size:12.5px;margin-top:8px">⬆ Cesiones enviadas</div>${tablaFilas_(cesEnv, colsCes)}`:''}
      ${filasEF.length?`<div style="font-weight:600;font-size:12.5px;margin-top:8px">📦 Stock final valorizado (EF)</div>${tablaFilas_(filasEF, colsEF)}`:''}
    </div>
  </div>`;
  return h;
}

function buildMargenBruto() {
  const tabMB   = S.mbTab   || 'reporte';
  const moneda  = S.margenBrutoMoneda || 'ARS';

  // Fecha de corte GLOBAL: se propaga a Cría, Recría y Terminación para que el
  // consolidado sea coherente — las tres actividades cierran a la misma fecha.
  // Antes acá había un filtro de "Campaña" y otro de "Período desde/hasta" que
  // en realidad no se usaban en ningún cálculo (quedaron de una versión anterior) —
  // se sacaron para no mostrar controles que no hacen nada.
  const corteGlobal = S._corteGlobal || today();

  function fmMB(v) {
    if (moneda==='USD') return 'U$D '+fn(convertirAMoneda_(v,corteGlobal,'USD'),2);
    return '$ '+fn(Math.round(v||0));
  }

  let h = `<div class="page-header no-print">
    <div class="page-title">📊 Margen Bruto Ganadero</div>
    <div class="page-sub">Resultado económico consolidado de las tres actividades</div>
  </div>`;

  const tabs = [{ k:'reporte', label:'📄 Reporte Directorio' }, { k:'resultado', label:'💰 Resultado económico' }, { k:'productivo', label:'📋 Resultados productivos' }];
  h += `<div class="no-print" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center">`;
  tabs.forEach(t => { h += `<button class="btn ${tabMB===t.k?'btn-primary':'btn-secondary'}" onclick="S.mbTab='${t.k}';render()">${t.label}</button>`; });
  h += `<button class="no-print" onclick="S.margenBrutoMoneda=S.margenBrutoMoneda==='USD'?'ARS':'USD';render()"
    style="margin-left:auto;padding:6px 14px;border-radius:20px;border:none;cursor:pointer;font-size:13px;font-weight:600;background:var(--blue);color:#fff">
    💵 ${moneda==='USD'?'Ver en ARS':'Ver en U$S'}
  </button></div>`;

  // Filtro: fecha de corte global (única, funcional)
  h += `<div class="panel no-print" style="padding:14px 16px;margin-bottom:16px">
    <div class="fgrid" style="margin:0;align-items:flex-end">
      <div class="fg" style="max-width:220px;min-width:0;flex:0 0 auto">
        <label>Fecha de corte <span style="font-size:11px;color:var(--text3)">(aplica a Cría, Recría y Terminación por igual)</span></label>
        <input type="date" id="mb-corte" value="${corteGlobal}" style="max-width:220px"
          onchange="S._corteGlobal=this.value;S._corteCria=this.value;S._corteRecria=this.value;S._corteEng=this.value;render()">
      </div>
      ${corteGlobal!==today()?`<div class="fg" style="flex:0 0 auto"><button class="btn btn-ghost btn-sm"
          onclick="S._corteGlobal=null;S._corteCria=null;S._corteRecria=null;S._corteEng=null;render()">↺ Volver a hoy</button></div>`:''}
    </div>
  </div>`;

  if (!S.cache.movimientos||!S.cache.ventas) {
    h += '<div class="empty-state"><span class="ico">◌</span><div class="msg">Cargando datos…</div></div>';
    return h;
  }

  // Recalcular las tres actividades con la fecha de corte global. Antes había que
  // visitar cada dashboard a mano para que calculara S._resultCria/_resultRecria/
  // _resultEng; ahora se llaman directamente acá (solo por su efecto de guardar esos
  // resultados) y se descarta el HTML que devuelven — no hace falta navegar a cada uno.
  buildDashboard();
  buildRecriaDashboard();
  buildEngordeDashboard_(rodeosEngordeValidos_(), p => egFmon_(p, S.engordeMoneda||'ARS'));

  // Si igual falta alguno (ej. Cría sin ninguna campaña cargada todavía), avisamos.
  if (!S._resultCria || !S._resultRecria || !S._resultEng) {
    h += `<div class="panel" style="border:2px solid var(--gold);background:var(--gold-bg);padding:16px">
      <div style="font-weight:700;font-size:15px;color:var(--gold-text);margin-bottom:8px">⚠ Datos pendientes de cálculo</div>
      <div style="font-size:13px;color:var(--text2);margin-bottom:12px">
        Faltan datos para calcular alguna actividad a esta fecha de corte:
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${!S._resultCria?`<button class="btn btn-primary" onclick="goto('dashboard')">🐄 Ir a Dashboard Cría</button>`:'<span style="color:var(--green-text)">✓ Cría</span>'}
        ${!S._resultRecria?`<button class="btn btn-primary" onclick="goto('recria_dashboard')">🌱 Ir a Dashboard Recría</button>`:'<span style="color:var(--green-text)">✓ Recría</span>'}
        ${!S._resultEng?`<button class="btn btn-primary" onclick="goto('engorde')">🏭 Ir a Dashboard Terminación</button>`:'<span style="color:var(--green-text)">✓ Terminación</span>'}
      </div>
    </div>`;
    return h;
  }

  const rCria = { ing: S._resultCria.ing, eg: S._resultCria.eg, margen: S._resultCria.margen, detalle: S._resultCria };
  const rRec  = { ing: S._resultRecria.ing, eg: S._resultRecria.eg, margen: S._resultRecria.margen, detalle: S._resultRecria };
  const rEng  = { ing: S._resultEng.ing, eg: S._resultEng.eg, margen: S._resultEng.margen, detalle: S._resultEng };

  const ingTotal = rCria.ing+rRec.ing+rEng.ing;
  const egTotal  = rCria.eg+rRec.eg+rEng.eg;
  const marTotal = rCria.margen+rRec.margen+rEng.margen;
  const mc  = marTotal>=0?'var(--green)':'var(--red)';
  const mb2 = marTotal>=0?'var(--green-bg)':'rgba(220,50,50,0.08)';

  const mortandad = S.cache.mortandad||[];
  const abortos   = S.cache.abortos||[];
  const rodeosAll = (S.catalogs&&S.catalogs.rodeos)||[];
  const rodeosRec = new Set(((S.resumenRecria&&S.resumenRecria.rodeos)||[]).map(r=>String(r.rodeo_id)));
  const rodeosEng = new Set(rodeosEngordeValidos_().map(r=>String(r.rodeo_id)));
  const mortCria  = mortandad.filter(m=>{ const r=rodeosAll.find(x=>String(x.rodeo_id)===String(m.rodeo_id)); return r&&normAct_(r.actividad)==='cria'; }).reduce((s,m)=>s+(Number(m.cantidad)||1),0);
  const mortRec   = mortandad.filter(m=>rodeosRec.has(String(m.rodeo_id))).reduce((s,m)=>s+(Number(m.cantidad)||1),0);
  const mortEng   = mortandad.filter(m=>rodeosEng.has(String(m.rodeo_id))).reduce((s,m)=>s+(Number(m.cantidad)||1),0);
  const mortTot   = mortCria+mortRec+mortEng;
  const abortCria = abortos.filter(a=>{ const r=rodeosAll.find(x=>String(x.rodeo_id)===String(a.rodeo_id)); return r&&normAct_(r.actividad)==='cria'; }).length;
  const abortRec  = abortos.filter(a=>rodeosRec.has(String(a.rodeo_id))).length;
  const abortTot  = abortCria+abortRec;

  // ── CONVERSIÓN ALIMENTICIA (MS) PONDERADA — TODA LA TERMINACIÓN ────────────
  // Es un promedio PONDERADO por kg producidos de cada corral (suma de kg MS de
  // todos los corrales / suma de kg ganados de todos los corrales), no un promedio
  // simple de las conversiones individuales — así un corral grande no queda
  // subrepresentado frente a uno chico. Al mezclar corrales con raciones distintas
  // es un número de panorama general; para el detalle real de cada corral, la
  // ficha de Costos de Terminación sigue siendo la referencia.
  let kgMSTerm = 0, costoMSTerm = 0, kgGTerm = 0, hayAlimSinMSTerm = false;
  rodeosEngordeValidos_().forEach(r => {
    const kgG_r = egKgGanadosHastaPesada_(r.rodeo_id, corteGlobal);
    const cm_r = egConversionMS_(r.rodeo_id, corteGlobal, kgG_r);
    kgMSTerm += cm_r.kgMS; costoMSTerm += cm_r.costoTotal; kgGTerm += Math.max(0, kgG_r);
    if (cm_r.hayAlimSinMS) hayAlimSinMSTerm = true;
  });
  const convTermPonderada = (kgGTerm > 0 && kgMSTerm > 0) ? kgMSTerm / kgGTerm : null;
  const costoKgMSTermPonderado = (kgMSTerm > 0 && !hayAlimSinMSTerm) ? costoMSTerm / kgMSTerm : null;

  if (tabMB === 'reporte') {
    const acts = [
      { nombre: 'Cría',        ing: rCria.ing, eg: rCria.eg, margen: rCria.margen, color: 'var(--green)', colorHex: getComputedStyle(document.documentElement).getPropertyValue('--green').trim()||'#2f6b3f', emoji: '🐄' },
      { nombre: 'Recría',      ing: rRec.ing,  eg: rRec.eg,  margen: rRec.margen,  color: 'var(--gold)',  colorHex: getComputedStyle(document.documentElement).getPropertyValue('--gold').trim()||'#b8860b', emoji: '🌱' },
      { nombre: 'Terminación', ing: rEng.ing,  eg: rEng.eg,  margen: rEng.margen,  color: 'var(--clay)',  colorHex: getComputedStyle(document.documentElement).getPropertyValue('--clay').trim()||'#a8512f', emoji: '🏭' },
    ];
    const margenPct = ingTotal>0 ? (marTotal/ingTotal*100) : 0;
    const uidCh = 'ch'+Math.random().toString(36).slice(2,8);

    // ── Gráfico de barras: Utilidad por actividad (flat, sin sombras) ──────
    const maxAbsMargen = Math.max(1, ...acts.map(a=>Math.abs(a.margen)));
    const barW = 120, barGap = 60, chartH = 210, baseY = 230, chartW = acts.length*(barW+barGap)+barGap;
    let barsSvg = `<svg viewBox="0 0 ${chartW} 290" style="width:100%;height:auto;max-width:480px">`;
    barsSvg += `<defs>`;
    acts.forEach((a,i)=>{
      barsSvg += `<linearGradient id="gradBar${uidCh}${i}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${a.colorHex}"/>
        <stop offset="100%" stop-color="${a.colorHex}" stop-opacity="0.78"/>
      </linearGradient>`;
    });
    barsSvg += `<linearGradient id="gradBarNeg${uidCh}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#b3261e"/>
        <stop offset="100%" stop-color="#8c1d17"/>
      </linearGradient>
    </defs>`;
    for (let g=1; g<=3; g++) {
      const gy = baseY - (chartH*g/3);
      barsSvg += `<line x1="0" y1="${gy}" x2="${chartW}" y2="${gy}" stroke="var(--border)" stroke-width="1"/>`;
    }
    barsSvg += `<line x1="0" y1="${baseY}" x2="${chartW}" y2="${baseY}" stroke="var(--border2)" stroke-width="1.5"/>`;
    acts.forEach((a,i)=>{
      const x = barGap + i*(barW+barGap);
      const h = Math.round(Math.abs(a.margen)/maxAbsMargen*chartH);
      const y = a.margen>=0 ? baseY-h : baseY;
      const fillUrl = a.margen>=0 ? `url(#gradBar${uidCh}${i})` : `url(#gradBarNeg${uidCh})`;
      barsSvg += `<rect x="${x}" y="${y}" width="${barW}" height="${Math.max(h,2)}" rx="6" fill="${fillUrl}" stroke="${a.margen>=0?a.colorHex:'#8c1d17'}" stroke-width="1"/>`;
      barsSvg += `<text x="${x+barW/2}" y="${a.margen>=0?y-11:y+h+24}" text-anchor="middle" font-size="15" font-weight="700" fill="var(--text)">${a.margen>=0?'':'-'}${fmMB(Math.abs(a.margen))}</text>`;
      barsSvg += `<text x="${x+barW/2}" y="${baseY+26}" text-anchor="middle" font-size="14" font-weight="600" fill="var(--text2)">${a.emoji} ${a.nombre}</text>`;
    });
    barsSvg += `</svg>`;

    // ── Gráfico de dona: participación de cada actividad en los ingresos ───
    const totalIngDona = acts.reduce((s,a)=>s+Math.max(a.ing,0),0) || 1;
    const cx=110, cy=110, rOut=95, rIn=58;
    const gapDeg = 3; // separación visual entre segmentos
    let anguloAcum = -90; // empezar arriba
    let donaSvg = `<svg viewBox="0 0 220 220" style="width:100%;height:auto;max-width:230px">`;
    donaSvg += `<defs>`;
    acts.forEach((a,i)=>{
      donaSvg += `<linearGradient id="gradDona${uidCh}${i}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="${a.colorHex}"/>
        <stop offset="100%" stop-color="${a.colorHex}" stop-opacity="0.82"/>
      </linearGradient>`;
    });
    donaSvg += `</defs>`;
    const etiquetasDona = [];
    acts.forEach((a,i)=>{
      const frac = Math.max(a.ing,0)/totalIngDona;
      if (frac<=0) return;
      const anguloIni = anguloAcum + (frac*360>gapDeg ? gapDeg/2 : 0);
      const anguloFin = anguloAcum + frac*360 - (frac*360>gapDeg ? gapDeg/2 : 0);
      const anguloMed = (anguloIni+anguloFin)/2;
      anguloAcum += frac*360;
      const rad = g => g*Math.PI/180;
      const x1o=cx+rOut*Math.cos(rad(anguloIni)), y1o=cy+rOut*Math.sin(rad(anguloIni));
      const x2o=cx+rOut*Math.cos(rad(anguloFin)), y2o=cy+rOut*Math.sin(rad(anguloFin));
      const x1i=cx+rIn*Math.cos(rad(anguloFin)),  y1i=cy+rIn*Math.sin(rad(anguloFin));
      const x2i=cx+rIn*Math.cos(rad(anguloIni)),  y2i=cy+rIn*Math.sin(rad(anguloIni));
      const largeArc = (anguloFin-anguloIni)>180?1:0;
      donaSvg += `<path d="M${x1o},${y1o} A${rOut},${rOut} 0 ${largeArc} 1 ${x2o},${y2o} L${x1i},${y1i} A${rIn},${rIn} 0 ${largeArc} 0 ${x2i},${y2i} Z" fill="url(#gradDona${uidCh}${i})" stroke="#fff" stroke-width="1.5"/>`;
      if (frac>=0.08) {
        const rMid = (rOut+rIn)/2;
        const xL=cx+rMid*Math.cos(rad(anguloMed)), yL=cy+rMid*Math.sin(rad(anguloMed));
        etiquetasDona.push(`<text x="${xL}" y="${yL+4}" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">${Math.round(frac*100)}%</text>`);
      }
    });
    donaSvg += etiquetasDona.join('');
    donaSvg += `<circle cx="${cx}" cy="${cy}" r="${rIn-3}" fill="var(--bg)"/>`;
    donaSvg += `<text x="${cx}" y="${cy-6}" text-anchor="middle" font-size="12" fill="var(--text3)" font-weight="600">INGRESOS</text>`;
    donaSvg += `<text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="15" fill="var(--text)" font-weight="800">${fmMB(ingTotal)}</text>`;
    donaSvg += `</svg>`;

    h += `<div class="print-cover" style="flex-direction:column;border-bottom:4px solid #2f6b3f;padding-bottom:22px;margin-bottom:26px;page-break-after:avoid">
      <div style="display:flex;align-items:center;gap:18px;margin-bottom:14px">
        <img src="https://agroganaderalosmedanos.github.io/isologo.png" style="width:64px;height:64px;object-fit:contain">
        <div>
          <div style="font-family:'Aptos','Calibri','Segoe UI',-apple-system,sans-serif;font-size:26px;font-weight:800;letter-spacing:.01em;color:#1f2a17">AGROGANADERA LOS MÉDANOS</div>
          <div style="font-size:15px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#b8860b;margin-top:2px">Margen Bruto Ganadero</div>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:#6b6357">
        <span>Informe consolidado · Cría · Recría · Terminación</span>
        <span>Resultado al <strong style="color:#2b261f">${fd(corteGlobal)}</strong> · Moneda: <strong style="color:#2b261f">${moneda}</strong></span>
      </div>
    </div>`;

    h += `<div class="no-print" style="background:linear-gradient(135deg,var(--sidebar-bg),#2d4020);border-radius:16px;padding:28px 32px;margin-bottom:20px;color:#f3efe6;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap">
      <div>
        <div style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:0.75;margin-bottom:6px">Informe ejecutivo · Agroganadera Los Médanos</div>
        <div style="font-size:22px;font-weight:800;margin-bottom:2px">Resultado consolidado al ${fd(corteGlobal)}</div>
        <div style="font-size:13px;opacity:0.8">Cría · Recría · Terminación</div>
      </div>
      <button class="btn" onclick="window.print()" title="Se abre el diálogo de impresión — elegí 'Guardar como PDF' como destino"
        style="background:#fff;color:var(--sidebar-bg);border:none;border-radius:8px;padding:10px 18px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap">
        📥 Descargar PDF
      </button>
    </div>`;

    h += `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px">
      <div class="panel" style="margin-bottom:0;text-align:center;padding:18px 12px">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text3);letter-spacing:.04em">Ingresos totales</div>
        <div style="font-size:22px;font-weight:800;color:var(--green-text);margin-top:6px">${fmMB(ingTotal)}</div>
      </div>
      <div class="panel" style="margin-bottom:0;text-align:center;padding:18px 12px">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text3);letter-spacing:.04em">Egresos totales</div>
        <div style="font-size:22px;font-weight:800;color:var(--clay-text);margin-top:6px">${fmMB(egTotal)}</div>
      </div>
      <div class="panel" style="margin-bottom:0;text-align:center;padding:18px 12px;background:${mb2};border:2px solid ${mc}">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:${mc};letter-spacing:.04em">Utilidad total</div>
        <div style="font-size:22px;font-weight:800;color:${mc};margin-top:6px">${marTotal>=0?'':'-'}${fmMB(Math.abs(marTotal))}</div>
      </div>
      <div class="panel" style="margin-bottom:0;text-align:center;padding:18px 12px">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text3);letter-spacing:.04em">Margen s/ ingresos</div>
        <div style="font-size:22px;font-weight:800;color:${mc};margin-top:6px">${margenPct.toFixed(1)}%</div>
      </div>
    </div>`;

    if (convTermPonderada !== null) {
      h += `<div class="panel" style="margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;background:var(--gold-bg)">
        <div>
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--gold-text);letter-spacing:.04em">🏭 Conversión alimenticia — Terminación (promedio ponderado, todos los corrales)</div>
          <div style="font-size:11px;color:var(--text3);margin-top:2px">${costoKgMSTermPonderado?fmMB(costoKgMSTermPonderado)+' por kg de materia seca':hayAlimSinMSTerm?'⚠ hay corrales con alimentos sin % MS cargado':''}</div>
        </div>
        <div style="font-size:24px;font-weight:800;color:var(--gold)">${fn(convTermPonderada,1)} : 1</div>
      </div>`;
    }

    h += `<div style="display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:20px;align-items:stretch">
      <div class="panel" style="margin-bottom:0;display:flex;flex-direction:column">
        <div class="panel-title">📊 Utilidad por actividad</div>
        <div style="flex:1;display:flex;align-items:center;justify-content:center;padding-top:8px">${barsSvg}</div>
      </div>
      <div class="panel" style="margin-bottom:0;display:flex;flex-direction:column">
        <div class="panel-title">🥧 Participación en ingresos</div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-top:8px">
          ${donaSvg}
          <div style="display:flex;flex-direction:column;gap:6px;width:100%">
            ${acts.map(a=>{ const pct = ingTotal>0?(Math.max(a.ing,0)/totalIngDona*100):0; return `
            <div style="display:flex;align-items:center;gap:8px;font-size:12.5px">
              <span style="width:10px;height:10px;border-radius:3px;background:${a.colorHex};flex-shrink:0"></span>
              <span style="color:var(--text2);flex:1">${a.emoji} ${a.nombre}</span>
              <strong>${pct.toFixed(0)}%</strong>
            </div>`; }).join('')}
          </div>
        </div>
      </div>
    </div>`;

    h += `<div class="panel">
      <div class="panel-title">📋 Resumen por actividad</div>
      <table class="dt"><thead><tr><th>Actividad</th><th class="tc">Ingresos</th><th class="tc">Egresos</th><th class="tc">Utilidad</th><th class="tc">% Margen</th></tr></thead><tbody>
        ${acts.map(a=>{
          const pctA = a.ing>0?(a.margen/a.ing*100):0;
          const colorA = a.margen>=0?'var(--green-text)':'var(--red-text)';
          return `<tr>
            <td style="font-weight:600">${a.emoji} ${a.nombre}</td>
            <td class="tc">${fmMB(a.ing)}</td>
            <td class="tc">${fmMB(a.eg)}</td>
            <td class="tc" style="font-weight:700;color:${colorA}">${a.margen>=0?'':'-'}${fmMB(Math.abs(a.margen))}</td>
            <td class="tc" style="color:${colorA}">${pctA.toFixed(1)}%</td>
          </tr>`;
        }).join('')}
        <tr style="background:var(--bg2);font-weight:800">
          <td>Total consolidado</td>
          <td class="tc">${fmMB(ingTotal)}</td>
          <td class="tc">${fmMB(egTotal)}</td>
          <td class="tc" style="color:${mc}">${marTotal>=0?'':'-'}${fmMB(Math.abs(marTotal))}</td>
          <td class="tc" style="color:${mc}">${margenPct.toFixed(1)}%</td>
        </tr>
      </tbody></table>
    </div>`;

    // ── EXISTENCIAS (EI/EF consolidado — cabezas e importe) ────────────────
    // EI ya NO incluye los nacimientos del período (antes quedaban escondidos
    // adentro del "Saldo inicial" que se crea automáticamente al registrar una
    // Parición, lo que hacía que EI + Ventas + Mortandad no cerrara contra EF
    // para quien mira el informe desde afuera). Se muestran aparte, como una
    // línea propia, para que la cuenta cierre de forma intuitiva.
    const eiCabTotal = (rCria.detalle.eiCab||0) + (rRec.detalle.eiCab||0) + (rEng.detalle.eiCab||0);
    const efCabTotal = (rCria.detalle.efCab||0) + (rRec.detalle.efCab||0) + (rEng.detalle.efCab||0);
    const nacCabTotal = (rCria.detalle.nacCab||0) + (rRec.detalle.nacCab||0) + (rEng.detalle.nacCab||0);
    const nacImpTotal = (rCria.detalle.nacImp||0) + (rRec.detalle.nacImp||0) + (rEng.detalle.nacImp||0);
    const eiImpTotal = (rCria.detalle.ei||0) + (rRec.detalle.ei||0) + (rEng.detalle.ei||0);
    const efImpTotal = (rCria.detalle.ef||0) + (rRec.detalle.ef||0) + (rEng.detalle.ef||0);
    const deltaCab = efCabTotal - eiCabTotal;
    const deltaCabPct = eiCabTotal>0 ? (deltaCab/eiCabTotal*100) : null;
    const deltaImp = efImpTotal - eiImpTotal;
    const deltaColor = deltaCab>=0 ? 'var(--green-text)' : 'var(--red-text)';
    const uidChart = 'mb'+Math.random().toString(36).slice(2,8);

    const maxCab = Math.max(1, eiCabTotal, efCabTotal);
    const cbW=110, cbGap=70, cbH=170, cbBase=200, cbChartW = cbGap*3+cbW*2;
    const hEI = Math.round(eiCabTotal/maxCab*cbH), hEF = Math.round(efCabTotal/maxCab*cbH);
    const xEI = cbGap, xEF = cbGap*2+cbW;
    let existSvg = `<svg viewBox="0 0 ${cbChartW} 240" style="width:100%;height:auto;max-width:300px">
      <defs>
        <linearGradient id="gradEI${uidChart}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--gold)" stop-opacity="1"/><stop offset="100%" stop-color="var(--gold)" stop-opacity="0.55"/>
        </linearGradient>
        <linearGradient id="gradEF${uidChart}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--green)" stop-opacity="1"/><stop offset="100%" stop-color="var(--green)" stop-opacity="0.55"/>
        </linearGradient>
        <filter id="softShadowEx${uidChart}" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.18"/>
        </filter>
      </defs>
      <line x1="0" y1="${cbBase}" x2="${cbChartW}" y2="${cbBase}" stroke="var(--border2)" stroke-width="1.5"/>
      <rect x="${xEI}" y="${cbBase-hEI}" width="${cbW}" height="${Math.max(hEI,2)}" rx="8" fill="url(#gradEI${uidChart})" filter="url(#softShadowEx${uidChart})"/>
      <text x="${xEI+cbW/2}" y="${cbBase-hEI-12}" text-anchor="middle" font-size="18" font-weight="800" fill="var(--text)">${fn(eiCabTotal)}</text>
      <text x="${xEI+cbW/2}" y="${cbBase+24}" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text2)">Existencia inicial</text>
      <rect x="${xEF}" y="${cbBase-hEF}" width="${cbW}" height="${Math.max(hEF,2)}" rx="8" fill="url(#gradEF${uidChart})" filter="url(#softShadowEx${uidChart})"/>
      <text x="${xEF+cbW/2}" y="${cbBase-hEF-12}" text-anchor="middle" font-size="18" font-weight="800" fill="var(--text)">${fn(efCabTotal)}</text>
      <text x="${xEF+cbW/2}" y="${cbBase+24}" text-anchor="middle" font-size="13" font-weight="600" fill="var(--text2)">Existencia final</text>
    </svg>`;

    h += `<div style="display:grid;grid-template-columns:1fr 1.2fr;gap:16px;margin-bottom:20px;align-items:stretch">
      <div class="panel" style="margin-bottom:0;display:flex;flex-direction:column">
        <div class="panel-title">🐄 Existencia — cabezas</div>
        <div style="flex:1;display:flex;align-items:center;justify-content:center;padding-top:4px">${existSvg}</div>
        <div style="text-align:center;font-size:13px;color:${deltaColor};font-weight:700;margin-top:4px">
          ${deltaCab>=0?'▲':'▼'} ${fn(Math.abs(deltaCab))} cabezas ${deltaCabPct!==null?`(${deltaCabPct>=0?'+':''}${deltaCabPct.toFixed(1)}%)`:''}
        </div>

      <div class="panel" style="margin-bottom:0;display:flex;flex-direction:column;justify-content:center">
        <div class="panel-title">💰 Existencia — importe</div>
        <table class="dt"><thead><tr><th></th><th class="tc">Cabezas</th><th class="tc">Importe</th></tr></thead><tbody>
          <tr><td style="font-weight:600">Existencia inicial (EI)</td><td class="tc">${fn(eiCabTotal)}</td><td class="tc">${fmMB(eiImpTotal)}</td></tr>
          ${nacCabTotal>0?`<tr><td style="padding-left:16px;color:var(--text2)">+ Nacimientos del período</td><td class="tc">${fn(nacCabTotal)}</td><td class="tc">${nacImpTotal ? fmMB(nacImpTotal) : '<span style="color:var(--clay-text);font-size:11px">⚠ sin precio</span>'}</td></tr>`:''}
          <tr><td style="font-weight:600">Existencia final (EF)</td><td class="tc">${fn(efCabTotal)}</td><td class="tc">${fmMB(efImpTotal)}</td></tr>
          <tr style="background:var(--bg2);font-weight:800">
            <td>Variación</td>
            <td class="tc" style="color:${deltaColor}">${deltaCab>=0?'+':''}${fn(deltaCab)}</td>
