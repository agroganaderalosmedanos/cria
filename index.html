function buildCesionesCria() {
  const rodeos    = (S.catalogs && S.catalogs.rodeos) || [];
  const campos    = (S.catalogs && S.catalogs.campos) || [];
  const movs      = S.cache.movimientos || [];
  const pesadas   = S.cache.pesadas || [];
  const rodeosPorId = Object.fromEntries(rodeos.map(r=>[String(r.rodeo_id),r]));

  // Rodeos de Cría categoria ternero/ternera como origen
  const rodeosCria = rodeos.filter(r=>normAct_(r.actividad)==='cria'&&(r.activo===true||String(r.activo).toUpperCase()==='TRUE')&&
    (r.categoria==='ternero'||r.categoria==='ternera'));
  // Rodeos de Recría como destino
  const rodeosRec  = rodeos.filter(r=>normAct_(r.actividad)==='recria'&&(r.activo===true||String(r.activo).toUpperCase()==='TRUE'));

  // Cesiones existentes — traslados de Cría a Recría con precio cargado
  const cesiones = movs.filter(m=>{
    if (m.tipo!=='Traslado en bloque'&&m.tipo!=='Traslado individual') return false;
    const or = rodeosPorId[String(m.rodeo_origen_id)];
    const de = rodeosPorId[String(m.rodeo_destino_id)];
    return or&&(normAct_(or.actividad)==='cria'||normAct_(or.actividad)==='cria')&&de&&(normAct_(de.actividad)==='recria');
  }).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));

  let h = `<div class="page-header">
    <div class="page-title">Cesiones — Cría a Recría</div>
    <div class="page-sub">Registrá el traspaso de animales de Cría a Recría con precio de cesión $/kg</div>
    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
      <button class="radio-pill" onclick="goto('recria_dashboard')">📊 Dashboard</button>
      <button class="radio-pill selected" onclick="goto('cesiones_cria')">⬇ Cesiones de Cría</button>
      <button class="radio-pill" onclick="goto('cesiones_recria')">⬆ Cesiones a Terminación</button>
    </div>
  </div>`;

  h += `<div class="panel">
    <div class="panel-title">➕ Nueva cesión</div>
    <div class="fgrid">
      <div class="fg"><label>Fecha</label><input type="date" id="ces-c-fecha" value="${today()}"></div>
      <div class="fg"><label>Rodeo origen (Cría)</label>
        <select id="ces-c-origen">
          <option value="">— Seleccioná —</option>
          ${rodeosCria.map(r=>`<option value="${r.rodeo_id}">${r.nombre} (${campoNombre(r.campo_id)})</option>`).join('')}
        </select>
      </div>
      <div class="fg"><label>Rodeo destino (Recría)</label>
        <select id="ces-c-destino">
          <option value="">— Seleccioná —</option>
          ${rodeosRec.map(r=>`<option value="${r.rodeo_id}">${r.nombre} (${campoNombre(r.campo_id)})</option>`).join('')}
        </select>
      </div>
      <div class="fg"><label>Categoría</label>
        <select id="ces-c-cat">
          <option value="ternero">Ternero</option>
          <option value="ternera">Ternera</option>
        </select>
      </div>
      <div class="fg"><label>Cantidad</label><input type="number" id="ces-c-cant" min="1" placeholder="Ej: 150"></div>
      <div class="fg"><label>Peso promedio (kg)</label><input type="number" id="ces-c-peso" min="0" step="0.1" placeholder="Ej: 180"></div>
      <div class="fg"><label>Precio cesión ($/kg)</label>
        <input type="number" id="ces-c-precio" min="0" step="1" placeholder="Ej: 2500" oninput="cesCriaCalcTotal_()">
        <button type="button" class="btn btn-ghost btn-sm" id="ces-c-usar-precio-mes" style="margin-top:4px;font-size:11px;padding:3px 8px">💲 Usar precio del mes</button>
      </div>
      <div class="fg"><label>Total estimado</label><div id="ces-c-total" style="font-size:15px;font-weight:700;color:var(--green);padding:9px 0">—</div></div>
      <div class="fg" style="min-width:200px"><label>Observaciones</label><input type="text" id="ces-c-obs" placeholder="Opcional"></div>
    </div>
    <button class="btn btn-primary" id="ces-c-save" style="margin-top:8px">💾 Registrar cesión</button>
  </div>`;

  // Traslados sin precio (valorización pendiente)
  const sinPrecio = cesiones.filter(m => !Number(m.precio_kg) && !Number(m.precio_cabeza));
  if (sinPrecio.length) {
    h += `<div class="panel" style="border:2px solid var(--gold);background:var(--gold-bg);margin-bottom:16px">
      <div class="panel-title" style="color:var(--gold-text)">⚠ ${sinPrecio.length} cesión${sinPrecio.length>1?'es':''} Cría→Recría sin precio $/kg</div>
      <div style="font-size:12.5px;color:var(--text2);margin-bottom:10px">El Margen Bruto las valoriza automáticamente con el precio del mes. Podés fijar el precio real acá:</div>
      <div class="tw"><table class="dt"><thead><tr>
        <th>Fecha</th><th>Origen</th><th>Destino</th><th class="tc">Cant.</th><th class="tc">Peso</th><th>Precio $/kg</th>
      </tr></thead><tbody>`;
    sinPrecio.forEach(m => {
      const or = rodeosPorId[String(m.rodeo_origen_id)];
      const de = rodeosPorId[String(m.rodeo_destino_id)];
      const p = preciosValGet_(m.fecha);
      const cat = (or?.categoria||'ternero').toLowerCase();
      const mapaKg = {ternero:'ternero',ternera:'ternera',vaquillona:'vaquillona','vaquillona venta':'vaquillona_venta',novillito:'novillito',novillo:'novillo'};
      const sugerido = p[mapaKg[cat]]||0;
      h += `<tr>
        <td>${fd(m.fecha)}</td>
        <td>${or?.nombre||'—'}</td>
        <td>${de?.nombre||'—'}</td>
        <td class="tc">${fn(m.cantidad)}</td>
        <td class="tc">${m.peso_prom_kg?fn(m.peso_prom_kg)+' kg':'—'}</td>
        <td>
          <div style="display:flex;align-items:center;gap:6px">
            <input type="number" class="ces-c-precio-rapido" data-mov-id="${m.movimiento_id}" value="${sugerido||''}" placeholder="$/kg" style="width:90px;font-size:12px;padding:3px 6px">
            <button class="btn btn-primary btn-sm ces-c-fijar-precio" data-mov-id="${m.movimiento_id}" style="font-size:11px;padding:4px 10px">✓ Fijar</button>
          </div>
        </td>
      </tr>`;
    });
    h += `</tbody></table></div>
      <button class="btn btn-secondary" id="ces-c-fijar-todos" style="margin-top:8px;font-size:12px">✓ Fijar todos con precio sugerido</button>
    </div>`;
  }

  // Historial
  h += `<div class="section-label">Historial de cesiones Cría → Recría</div>`;
  if (!cesiones.length) {
    h += `<div class="empty-state"><span class="ico">◌</span><div class="msg">Sin cesiones registradas aún.</div></div>`;
  } else {
    h += `<div class="tw"><table class="dt"><thead><tr>
      <th>Fecha</th><th>Origen</th><th>Destino</th>
      <th class="tc">Cant.</th><th class="tc">Peso prom.</th>
      <th class="tc">Precio $/kg</th><th class="tc">Total</th><th></th>
    </tr></thead><tbody>`;
    cesiones.forEach(m=>{
      const or = rodeosPorId[String(m.rodeo_origen_id)];
      const de = rodeosPorId[String(m.rodeo_destino_id)];
      const cant = Number(m.cantidad)||0;
      const pesR = pesadas.filter(p=>String(p.rodeo_id)===String(m.rodeo_origen_id)).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
      const peso = Number(m.peso_prom_kg)||Number(pesR[0]?.peso_prom_kg)||0;
      const precioKg = Number(m.precio_kg)||Number(m.precio_cabeza)||0;
      const total = cant * peso * precioKg;
      h += `<tr>
        <td>${fd(m.fecha)}</td>
        <td>${or?.nombre||'—'}</td>
        <td>${de?.nombre||'—'}</td>
        <td class="tc"><strong>${fn(cant)}</strong></td>
        <td class="tc">${peso?fn(peso)+' kg':'—'}</td>
        <td class="tc">${precioKg?'$ '+fn(precioKg)+'/kg':'<span class="pill pill-clay">sin precio</span>'}</td>
        <td class="tc"><strong>${total?'$ '+fn(Math.round(total)):'—'}</strong></td>
        <td><div class="row-actions">
          <button class="icon-btn ces-c-edit" data-id="${m.movimiento_id}"
            data-cant="${cant}" data-peso="${peso}" data-precio="${precioKg}"
            data-fecha="${m.fecha}" data-origen="${or?.nombre||'—'}" data-destino="${de?.nombre||'—'}"
            title="Editar">✎</button>
          <button class="icon-btn danger" data-del="${m.movimiento_id}" data-entity="movimientos" data-idcol="movimiento_id" title="Eliminar">✕</button>
        </div></td>
      </tr>`;
    });
    h += `</tbody></table></div>`;
  }
  return h;
}

function cesCriaCalcTotal_() {
  const cant  = Number(document.getElementById('ces-c-cant')?.value)||0;
  const peso  = Number(document.getElementById('ces-c-peso')?.value)||0;
  const precio= Number(document.getElementById('ces-c-precio')?.value)||0;
  const el = document.getElementById('ces-c-total');
  if (el) el.textContent = (cant&&peso&&precio) ? '$ '+fn(Math.round(cant*peso*precio)) : '—';
}

function attachCesionesCriaEvents() {
  // Edición de cesiones Cría→Recría (son Traslados en movimientos)
  document.querySelectorAll('.ces-c-edit').forEach(btn => {
    btn.onclick = () => {
      const movId = btn.dataset.id;
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center';
      overlay.innerHTML = `<div style="background:var(--bg);border-radius:12px;padding:24px;min-width:340px;max-width:480px;box-shadow:0 8px 32px rgba(0,0,0,0.2)">
        <div style="font-weight:700;font-size:16px;margin-bottom:16px">✎ Editar cesión Cría → Recría</div>
        <div style="font-size:12px;color:var(--text3);margin-bottom:14px">${btn.dataset.fecha ? fd(btn.dataset.fecha) : ''} · ${btn.dataset.origen||'—'} → ${btn.dataset.destino||'—'}</div>
        <div class="fgrid">
          <div class="fg"><label>Fecha</label><input type="date" id="ces-c-edit-fecha" value="${btn.dataset.fecha||''}"></div>
          <div class="fg"><label>Cantidad</label><input type="number" id="ces-c-edit-cant" value="${btn.dataset.cant||''}" min="1" step="1"></div>
          <div class="fg"><label>Peso prom. (kg)</label><input type="number" id="ces-c-edit-peso" value="${btn.dataset.peso||''}" min="0" step="1"></div>
          <div class="fg"><label>Precio $/kg</label><input type="number" id="ces-c-edit-precio" value="${btn.dataset.precio||''}" min="0" step="1"></div>
        </div>
        <div id="ces-c-edit-total" style="font-size:13px;color:var(--green-text);font-weight:600;margin:8px 0"></div>
        <div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end">
          <button class="btn btn-secondary" id="ces-c-edit-cancel">Cancelar</button>
          <button class="btn btn-primary" id="ces-c-edit-save">💾 Guardar</button>
        </div>
      </div>`;
      document.body.appendChild(overlay);

      const upd = () => {
        const c=Number(document.getElementById('ces-c-edit-cant')?.value)||0;
        const p=Number(document.getElementById('ces-c-edit-peso')?.value)||0;
        const pr=Number(document.getElementById('ces-c-edit-precio')?.value)||0;
        const el=document.getElementById('ces-c-edit-total');
        if(el) el.textContent = c&&p&&pr ? '💰 Total: $ '+fn(Math.round(c*p*pr)) : '';
      };
      ['ces-c-edit-cant','ces-c-edit-peso','ces-c-edit-precio'].forEach(id=>
        document.getElementById(id)?.addEventListener('input', upd));
      upd();

      document.getElementById('ces-c-edit-cancel').onclick = () => overlay.remove();
      document.getElementById('ces-c-edit-save').onclick = async () => {
        const fecha  = document.getElementById('ces-c-edit-fecha').value;
        const cant   = Number(document.getElementById('ces-c-edit-cant').value)||0;
        const peso   = Number(document.getElementById('ces-c-edit-peso').value)||0;
        const precio = Number(document.getElementById('ces-c-edit-precio').value)||0;
        if (!cant) { toast('La cantidad es obligatoria.','err'); return; }
        if (!fecha) { toast('La fecha es obligatoria.','err'); return; }
        const sb = document.getElementById('ces-c-edit-save');
        sb.disabled=true; sb.textContent='⏳...';
        try {
          await apiCall('update', { body: { entity: 'movimientos', id: movId, data: {
            fecha, cantidad: cant, peso_prom_kg: peso, precio_kg: precio, precio_cabeza: precio,
          }}});
          invalidateCache('movimientos');
          await loadEntity('movimientos', true);
          S.margenBruto = null; S._resultCria = null; S._resultRecria = null; S._resultEng = null;
          toast('✓ Cesión actualizada', 'ok');
          overlay.remove();
          render();
        } catch(err) { sb.disabled=false; sb.textContent='💾 Guardar'; toast(err.message,'err'); }
      };
    };
  });

  attachTableDeleteEvents('movimientos', 'movimiento_id');

  document.getElementById('ces-c-cant')?.addEventListener('input', cesCriaCalcTotal_);
  document.getElementById('ces-c-peso')?.addEventListener('input', cesCriaCalcTotal_);

  const btnPrecioMes = document.getElementById('ces-c-usar-precio-mes');
  if (btnPrecioMes) btnPrecioMes.onclick = () => {
    const cat = document.getElementById('ces-c-cat')?.value || '';
    const fecha = document.getElementById('ces-c-fecha')?.value;
    const p = preciosValGet_(fecha);
    const mapaKg = { ternero: 'ternero', ternera: 'ternera' };
    const valor = p[mapaKg[cat]] || 0;
    if (!valor) { toast('No hay precio por kg cargado para "' + cat + '" en Precios de Valorización para esa fecha.', 'err'); return; }
    document.getElementById('ces-c-precio').value = valor;
    toast('Precio cargado desde Valorización de Stock — revisalo antes de guardar', 'ok');
    cesCriaCalcTotal_();
  };

  const btn = document.getElementById('ces-c-save');
  if (!btn) return;
  btn.onclick = async () => {
    const fecha   = document.getElementById('ces-c-fecha').value;
    const origen  = document.getElementById('ces-c-origen').value;
    const destino = document.getElementById('ces-c-destino').value;
    const cant    = Number(document.getElementById('ces-c-cant').value)||0;
    const peso    = Number(document.getElementById('ces-c-peso').value)||0;
    const precio  = Number(document.getElementById('ces-c-precio').value)||0;
    const obs     = document.getElementById('ces-c-obs').value.trim();
    if (!fecha||!origen||!destino||!cant) { toast('Completá fecha, rodeos y cantidad.', 'err'); return; }
    if (!precio) { toast('Ingresá el precio de cesión ($/kg).', 'err'); return; }
    btn.disabled = true; btn.textContent = '⏳ Guardando...';
    try {
      await apiCall('create', { body: { entity: 'movimientos', data: {
        tipo: 'Traslado en bloque',
        fecha,
        rodeo_origen_id: origen,
        rodeo_destino_id: destino,
        campo_origen_id: (S.catalogs?.rodeos||[]).find(r=>String(r.rodeo_id)===String(origen))?.campo_id||'',
        campo_destino_id: (S.catalogs?.rodeos||[]).find(r=>String(r.rodeo_id)===String(destino))?.campo_id||'',
        cantidad: cant,
        peso_prom_kg: peso,
        precio_kg: precio,
        observaciones: obs || 'Cesión Cría → Recría',
      }}});
      invalidateCache('movimientos');
      await loadEntity('movimientos', true);
      toast('Cesión registrada — '+fn(cant)+' animales · $ '+fn(precio)+'/kg', 'ok');
      render();
    } catch(err) { toast(err.message, 'err'); }
    finally { btn.disabled=false; btn.textContent='💾 Registrar cesión'; }
  };

  // Fijar precio rápido en cesiones Cría→Recría sin precio
  async function fijarPrecioCesionCria_(movId, precio) {
    if (!precio||precio<=0) { toast('Ingresá un precio $/kg.','err'); return; }
    await apiCall('update', { body: { entity: 'movimientos', id: movId, data: { precio_kg: precio, precio_cabeza: 0 } } });
    invalidateCache('movimientos');
    await loadEntity('movimientos', true);
    S.margenBruto = null; S._resultCria = null; S._resultRecria = null; S._resultEng = null;
  }
  document.querySelectorAll('.ces-c-fijar-precio').forEach(b => {
    b.onclick = async () => {
      const movId = b.dataset.movId;
      const precio = Number(document.querySelector('.ces-c-precio-rapido[data-mov-id="'+movId+'"]')?.value)||0;
      b.disabled=true; b.textContent='⏳...';
      try { await fijarPrecioCesionCria_(movId, precio); toast('Precio fijado','ok'); render(); }
      catch(e) { toast(e.message,'err'); b.disabled=false; b.textContent='✓ Fijar'; }
    };
  });
  const btnFijarTodos = document.getElementById('ces-c-fijar-todos');
  if (btnFijarTodos) btnFijarTodos.onclick = async () => {
    const btns = document.querySelectorAll('.ces-c-fijar-precio');
    btnFijarTodos.disabled=true; btnFijarTodos.textContent='⏳...';
    let ok=0, err=0;
    for (const b of btns) {
      const movId = b.dataset.movId;
      const precio = Number(document.querySelector('.ces-c-precio-rapido[data-mov-id="'+movId+'"]')?.value)||0;
      try { await fijarPrecioCesionCria_(movId, precio); ok++; } catch(e) { err++; }
    }
    toast('✓ '+ok+' actualizados'+(err?', '+err+' con error':''), ok>0?'ok':'err');
    render();
  };
}

function buildCesionesRecria() {
  const rodeos    = (S.catalogs && S.catalogs.rodeos) || [];
  const campos    = (S.catalogs && S.catalogs.campos) || [];
  const rodeosRec = rodeos.filter(r=>normAct_(r.actividad)==='recria'&&(r.activo===true||String(r.activo).toUpperCase()==='TRUE'));
  const rodeosEng = rodeosEngordeValidos_().filter(r=>r.activo===true||String(r.activo).toUpperCase()==='TRUE');
  const egresos   = (S.cache.egresos_recria||[])
    .filter(e=>e.destino==='Engorde')
    .sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
  const rodeosRecIds = new Set(rodeosRec.map(r=>String(r.rodeo_id)));
  const rodeosPorId  = Object.fromEntries(rodeos.map(r=>[String(r.rodeo_id),r]));

  let h = `<div class="page-header">
    <div class="page-title">Cesiones — Recría a Terminación</div>
    <div class="page-sub">Registrá el traspaso de animales de Recría a Terminación con precio de cesión $/kg</div>
    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
      <button class="radio-pill" onclick="goto('recria_dashboard')">📊 Dashboard</button>
      <button class="radio-pill" onclick="goto('cesiones_cria')">⬇ Cesiones de Cría</button>
      <button class="radio-pill selected" onclick="goto('cesiones_recria')">⬆ Cesiones a Terminación</button>
    </div>
  </div>`;

  h += `<div class="panel">
    <div class="panel-title">➕ Nueva cesión</div>
    <div class="fgrid">
      <div class="fg"><label>Fecha</label><input type="date" id="ces-r-fecha" value="${today()}"></div>
      <div class="fg"><label>Rodeo origen (Recría)</label>
        <select id="ces-r-origen">
          <option value="">— Seleccioná —</option>
          ${rodeosRec.map(r=>`<option value="${r.rodeo_id}">${r.nombre} (${campoNombre(r.campo_id)})</option>`).join('')}
        </select>
      </div>
      <div class="fg"><label>Rodeo destino (Terminación)</label>
        <select id="ces-r-destino">
          <option value="">— Seleccioná —</option>
          ${rodeosEng.map(r=>`<option value="${r.rodeo_id}">${r.nombre} (${campoNombre(r.campo_id)})</option>`).join('')}
        </select>
      </div>
      <div class="fg"><label>Cantidad</label><input type="number" id="ces-r-cant" min="1" placeholder="Ej: 120" oninput="cesRecriaCalcTotal_()"></div>
      <div class="fg"><label>Peso promedio (kg)</label><input type="number" id="ces-r-peso" min="0" step="0.1" placeholder="Ej: 250" oninput="cesRecriaCalcTotal_()"></div>
      <div class="fg"><label>Precio cesión ($/kg)</label>
        <input type="number" id="ces-r-precio" min="0" step="1" placeholder="Ej: 3500" oninput="cesRecriaCalcTotal_()">
        <button type="button" class="btn btn-ghost btn-sm" id="ces-r-usar-precio-mes" style="margin-top:4px;font-size:11px;padding:3px 8px">💲 Usar precio del mes</button>
      </div>
      <div class="fg"><label>Total estimado</label><div id="ces-r-total" style="font-size:15px;font-weight:700;color:var(--green);padding:9px 0">—</div></div>
      <div class="fg" style="min-width:200px"><label>Observaciones</label><input type="text" id="ces-r-obs" placeholder="Opcional"></div>
    </div>
    <button class="btn btn-primary" id="ces-r-save" style="margin-top:8px">💾 Registrar cesión</button>
  </div>`;

  // Detectar traslados Recría→Engorde que no tienen su registro en egresos_recria
  // Usa TODOS los rodeos del catálogo (incluyendo inactivos) para no perder traslados
  // de rodeos que ya vaciaron su stock y quedaron inactivos.
  const rodeosPorIdTodos = Object.fromEntries(rodeos.map(r=>[String(r.rodeo_id),r]));
  const movsTodos = S.cache.movimientos || [];
  const trasladosHuerfanos = movsTodos.filter(m => {
    if (m.tipo !== 'Traslado en bloque' && m.tipo !== 'Traslado individual') return false;
    const or = rodeosPorIdTodos[String(m.rodeo_origen_id)];
    const de = rodeosPorIdTodos[String(m.rodeo_destino_id)];
    if (!or || !de) return false;
    const normAct = s => String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    if (normAct(or.actividad) !== 'recria') return false;
    const actDe = normAct(de.actividad);
    if (actDe !== 'engorde' && actDe !== 'terminacion') return false;
    // Verificar que no tenga ya su registro en egresos_recria
    return !(S.cache.egresos_recria||[]).some(e =>
      String(e.rodeo_id) === String(m.rodeo_origen_id) &&
      String(e.rodeo_destino_id) === String(m.rodeo_destino_id) &&
      String(e.fecha) === String(m.fecha) &&
      Number(e.cant_animales) === Number(m.cantidad)
    );
  });

  if (trasladosHuerfanos.length) {
    h += `<div class="panel" style="border:2px solid var(--gold);background:var(--gold-bg);margin-bottom:16px">
      <div class="panel-title" style="color:var(--gold-text)">⚠ ${trasladosHuerfanos.length} traslado${trasladosHuerfanos.length>1?'s':''} Recría→Terminación sin registro de cesión</div>
      <div style="font-size:12.5px;color:var(--text2);margin-bottom:10px">Estos traslados mueven el stock correctamente, pero no tienen su registro contable de cesión (sin precio/kg). El Margen Bruto los incluye con valorización automática del mes. Podés regularizarlos acá para fijar el precio real.</div>
      <div class="tw"><table class="dt"><thead><tr>
        <th>Fecha</th><th>Rodeo origen</th><th>Rodeo destino</th><th class="tc">Cant.</th><th class="tc">Peso</th><th></th>
      </tr></thead><tbody>`;
    trasladosHuerfanos.sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha))).forEach(m => {
      const or = rodeosPorIdTodos[String(m.rodeo_origen_id)];
      const de = rodeosPorIdTodos[String(m.rodeo_destino_id)];
      const p = preciosValGet_(m.fecha);
      const cat = (or?.categoria||'novillo').toLowerCase();
      const mapaKg = {ternero:'ternero',ternera:'ternera',vaquillona:'vaquillona','vaquillona venta':'vaquillona_venta',novillito:'novillito',novillo:'novillo','vaca venta':'vaca_venta'};
      const precioSugerido = Number(m.precio_kg)||Number(m.precio_cabeza)||p[mapaKg[cat]]||0;
      h += `<tr>
        <td>${fd(m.fecha)}</td>
        <td>${or?.nombre||'—'}</td>
        <td>${de?.nombre||'—'}</td>
        <td class="tc">${fn(m.cantidad)}</td>
        <td class="tc">${m.peso_prom_kg?fn(m.peso_prom_kg)+' kg':'—'}</td>
        <td>
          <div style="display:flex;align-items:center;gap:6px">
            <input type="number" class="ces-huerfano-precio" data-mov-id="${m.movimiento_id}" placeholder="$/kg" value="${precioSugerido||''}" style="width:90px;font-size:12px;padding:3px 6px">
            <button class="btn btn-primary btn-sm ces-regularizar" data-mov-id="${m.movimiento_id}" style="font-size:11px;padding:4px 10px">✓ Regularizar</button>
          </div>
        </td>
      </tr>`;
    });
    h += `</tbody></table></div>
      <button class="btn btn-secondary" id="ces-regularizar-todos" style="margin-top:8px;font-size:12px">✓ Regularizar todos con precio sugerido</button>
    </div>`;
  }

  h += `<div class="section-label">Historial de cesiones Recría → Terminación</div>`;
  if (!egresos.length) {
    h += `<div class="empty-state"><span class="ico">◌</span><div class="msg">Sin cesiones registradas aún.</div></div>`;
  } else {
    h += `<div class="tw"><table class="dt"><thead><tr>
      <th>Fecha</th><th>Rodeo origen</th><th>Rodeo destino</th><th class="tc">Cant.</th>
      <th class="tc">Peso prom.</th><th class="tc">Precio $/kg</th><th class="tc">Total</th><th></th>
    </tr></thead><tbody>`;
    egresos.forEach(e=>{
      const cant    = Number(e.cant_animales)||0;
      const peso    = Number(e.peso_prom_kg)||0;
      const precio  = Number(e.precio_kg_cesion)||0;
      const total   = cant*peso*precio;
      const or      = rodeosPorId[String(e.rodeo_id)];
      const de      = rodeosPorId[String(e.rodeo_destino_id)];
      h += `<tr>
        <td>${fd(e.fecha)}</td>
        <td>${or?.nombre||'—'}</td>
        <td>${de?.nombre||'—'}</td>
        <td class="tc"><strong>${fn(cant)}</strong></td>
        <td class="tc">${peso?fn(peso)+' kg':'—'}</td>
        <td class="tc">${precio?'$ '+fn(precio)+'/kg':'<span class="pill pill-clay">sin precio</span>'}</td>
        <td class="tc"><strong>${total?'$ '+fn(Math.round(total)):'—'}</strong></td>
        <td><div class="row-actions">
          <button class="icon-btn ces-r-edit" data-id="${e.egreso_id}" title="Editar">✎</button>
          <button class="icon-btn danger" data-del="${e.egreso_id}" data-entity="egresos_recria" data-idcol="egreso_id" title="Eliminar">✕</button>
        </div></td>
      </tr>`;
    });
    h += `</tbody></table></div>`;
  }
  return h;
}

function cesRecriaCalcTotal_() {
  const cant  = Number(document.getElementById('ces-r-cant')?.value)||0;
  const peso  = Number(document.getElementById('ces-r-peso')?.value)||0;
  const precio= Number(document.getElementById('ces-r-precio')?.value)||0;
  const el = document.getElementById('ces-r-total');
  if (el) el.textContent = (cant&&peso&&precio) ? '$ '+fn(Math.round(cant*peso*precio)) : '—';
}

function attachCesionesRecriaEvents() {
  const btnPrecioMes = document.getElementById('ces-r-usar-precio-mes');
  if (btnPrecioMes) btnPrecioMes.onclick = () => {
    const origenId = document.getElementById('ces-r-origen')?.value;
    const fecha = document.getElementById('ces-r-fecha')?.value;
    const rodeoOrigen = rodeosTodos().find(r => String(r.rodeo_id) === String(origenId));
    if (!rodeoOrigen) { toast('Elegí primero el rodeo origen.', 'err'); return; }
    const cat = (rodeoOrigen.categoria || '').toLowerCase().trim();
    const p = preciosValGet_(fecha);
    const mapaKg = { ternero:'ternero', ternera:'ternera', vaquillona:'vaquillona', 'vaquillona venta':'vaquillona_venta', novillito:'novillito', novillo:'novillo', 'vaca venta':'vaca_venta' };
    const valor = p[mapaKg[cat]] || 0;
    if (!valor) { toast('No hay precio por kg cargado para "' + (rodeoOrigen.categoria||'—') + '" en Precios de Valorización para esa fecha.', 'err'); return; }
    document.getElementById('ces-r-precio').value = valor;
    toast('Precio cargado desde Valorización de Stock — revisalo antes de guardar', 'ok');
    cesRecriaCalcTotal_();
  };

  // Handler de edición — va ANTES del early return para que siempre se ejecute
  attachTableDeleteEvents('egresos_recria', 'egreso_id');
  document.querySelectorAll('.ces-r-edit').forEach(editBtn => {
    editBtn.onclick = () => {
      const egresoId = editBtn.dataset.id;
      const egreso = (S.cache.egresos_recria||[]).find(e=>String(e.egreso_id)===String(egresoId));
      if (!egreso) { toast('No se encontró la cesión.','err'); return; }
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center';
      overlay.innerHTML = `<div style="background:var(--bg);border-radius:12px;padding:24px;min-width:340px;max-width:480px;box-shadow:0 8px 32px rgba(0,0,0,0.2)">
        <div style="font-weight:700;font-size:16px;margin-bottom:16px">✎ Editar cesión Recría → Terminación</div>
        <div style="font-size:12px;color:var(--text3);margin-bottom:14px">
          ${fd(egreso.fecha)} · ${rodeoNombre(egreso.rodeo_id)} → ${rodeoNombre(egreso.rodeo_destino_id)}
        </div>
        <div class="fgrid">
          <div class="fg"><label>Fecha</label><input type="date" id="ces-r-edit-fecha" value="${egreso.fecha||''}"></div>
          <div class="fg"><label>Cantidad</label><input type="number" id="ces-r-edit-cant" value="${egreso.cant_animales||''}" min="1" step="1"></div>
          <div class="fg"><label>Peso prom. (kg)</label><input type="number" id="ces-r-edit-peso" value="${egreso.peso_prom_kg||''}" min="0" step="1"></div>
          <div class="fg"><label>Precio $/kg</label><input type="number" id="ces-r-edit-precio" value="${egreso.precio_kg_cesion||''}" min="0" step="1"></div>
        </div>
        <div id="ces-r-edit-total" style="font-size:13px;color:var(--green-text);font-weight:600;margin:8px 0"></div>
        <div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end">
          <button class="btn btn-secondary" id="ces-r-edit-cancel">Cancelar</button>
          <button class="btn btn-primary" id="ces-r-edit-save">💾 Guardar</button>
        </div>
      </div>`;
      document.body.appendChild(overlay);
      const upd = () => {
        const c=Number(document.getElementById('ces-r-edit-cant')?.value)||0;
        const p=Number(document.getElementById('ces-r-edit-peso')?.value)||0;
        const pr=Number(document.getElementById('ces-r-edit-precio')?.value)||0;
        const el=document.getElementById('ces-r-edit-total');
        if(el) el.textContent = c&&p&&pr ? '💰 Total: $ '+fn(Math.round(c*p*pr)) : '';
      };
      ['ces-r-edit-cant','ces-r-edit-peso','ces-r-edit-precio'].forEach(id=>
        document.getElementById(id)?.addEventListener('input', upd));
      upd();
      document.getElementById('ces-r-edit-cancel').onclick = () => overlay.remove();
      document.getElementById('ces-r-edit-save').onclick = async () => {
        const fecha  = document.getElementById('ces-r-edit-fecha').value;
        const cant   = Number(document.getElementById('ces-r-edit-cant').value)||0;
        const peso   = Number(document.getElementById('ces-r-edit-peso').value)||0;
        const precio = Number(document.getElementById('ces-r-edit-precio').value)||0;
        if (!cant) { toast('La cantidad es obligatoria.','err'); return; }
        if (!fecha) { toast('La fecha es obligatoria.','err'); return; }
        const sb = document.getElementById('ces-r-edit-save');
        sb.disabled=true; sb.textContent='⏳...';
        try {
          // Buscamos el Movimiento vinculado ANTES de cambiar la fecha del egreso —
          // el match es por fecha+rodeos+cantidad tal como estaban guardados.
          const movCorresp = (S.cache.movimientos||[]).find(m=>
            (m.tipo==='Traslado en bloque'||m.tipo==='Traslado individual') &&
            String(m.rodeo_origen_id)===String(egreso.rodeo_id) &&
            String(m.rodeo_destino_id)===String(egreso.rodeo_destino_id) &&
            String(m.fecha)===String(egreso.fecha)
          );
          await apiCall('update', { body: { entity: 'egresos_recria', id: egresoId, data: {
            fecha, cant_animales: cant, peso_prom_kg: peso, precio_kg_cesion: precio,
          }}});
          if (movCorresp) {
            await apiCall('update', { body: { entity: 'movimientos', id: movCorresp.movimiento_id, data: {
              fecha, cantidad: cant, peso_prom_kg: peso, precio_kg: precio,
            }}});
            invalidateCache('movimientos');
            await loadEntity('movimientos', true);
            S.stock = null; await loadStock();
          }
          invalidateCache('egresos_recria');
          await loadEntity('egresos_recria', true);
          S.margenBruto = null; S._resultCria = null; S._resultRecria = null; S._resultEng = null;
          toast('✓ Cesión actualizada', 'ok');
          overlay.remove();
          render();
        } catch(err) { sb.disabled=false; sb.textContent='💾 Guardar'; toast(err.message,'err'); }
      };
    };
  });

  const btn = document.getElementById('ces-r-save');
  if (!btn) return;
  btn.onclick = async () => {
    const fecha   = document.getElementById('ces-r-fecha').value;
    const origen  = document.getElementById('ces-r-origen').value;
    const destino = document.getElementById('ces-r-destino').value;
    const cant    = Number(document.getElementById('ces-r-cant').value)||0;
    const peso    = Number(document.getElementById('ces-r-peso').value)||0;
    const precio  = Number(document.getElementById('ces-r-precio').value)||0;
    const obs     = document.getElementById('ces-r-obs').value.trim();
    if (!fecha||!origen||!cant) { toast('Completá fecha, rodeo y cantidad.', 'err'); return; }
    if (!destino) { toast('Elegí el rodeo destino de Terminación — sin esto el animal no se mueve de stock.', 'err'); return; }
    if (!precio) { toast('Ingresá el precio de cesión ($/kg).', 'err'); return; }

    // Validación de stock: no permitir ceder más animales de los que realmente hay
    // en el rodeo de Recría origen a esa fecha (mismo criterio que en Movimientos/Ventas).
    const rodeoOrigen = rodeosTodos().find(r=>String(r.rodeo_id)===String(origen));
    const rodeoDestino = rodeosTodos().find(r=>String(r.rodeo_id)===String(destino));
    const stockOrigen = (S.stock || []).find(s => String(s.rodeo_id) === String(origen));
    const disponible = stockOrigen ? Number(stockOrigen.stock) || 0 : 0;
    if (cant > disponible) {
      const continuar = confirm('⚠ El rodeo de origen tiene ' + disponible + ' animales en stock actual, pero estás cediendo ' + cant + '.\n\n¿Seguro que querés continuar igual?');
      if (!continuar) return;
    }

    btn.disabled=true; btn.textContent='⏳ Guardando...';
    try {
      await apiCall('create', { body: { entity: 'movimientos', data: {
        tipo: 'Traslado en bloque',
        fecha,
        rodeo_origen_id: origen,
        rodeo_destino_id: destino,
        campo_origen_id: rodeoOrigen?.campo_id || '',
        campo_destino_id: rodeoDestino?.campo_id || '',
        cantidad: cant,
        peso_prom_kg: peso,
        precio_kg: precio,
        observaciones: obs || 'Cesión Recría → Terminación',
      }}});
      invalidateCache('movimientos');
      await loadEntity('movimientos', true);
      S.stock = null; await loadStock();

      await apiCall('create', { body: { entity: 'egresos_recria', data: {
        fecha,
        rodeo_id: origen,
        campo_id: rodeoOrigen?.campo_id||'',
        destino: 'Engorde',
        rodeo_destino_id: destino,
        cant_animales: cant,
        peso_prom_kg: peso,
        precio_kg_cesion: precio,
        observaciones: obs||'Cesión Recría → Terminación',
      }}}); 
      invalidateCache('egresos_recria');
      await loadEntity('egresos_recria', true);
      S.margenBruto = null; S._resultCria = null; S._resultRecria = null; S._resultEng = null;

      toast('✓ Cesión registrada y trasladada — '+fn(cant)+' animales · $ '+fn(precio)+'/kg', 'ok');
      render();
    } catch(err) { toast(err.message, 'err'); }
    finally { btn.disabled=false; btn.textContent='💾 Registrar cesión'; }
  };

  // Handler para regularizar traslados huérfanos individualmente
  async function regularizarTraslado_(movId, precio) {
    const movs = S.cache.movimientos || [];
    const m = movs.find(x => String(x.movimiento_id) === String(movId));
    if (!m) { toast('No se encontró el traslado.', 'err'); return; }
    if (!precio || precio <= 0) { toast('Ingresá un precio $/kg antes de regularizar.', 'err'); return; }
    const rodeoOr = rodeosTodos().find(r => String(r.rodeo_id) === String(m.rodeo_origen_id));
    await apiCall('create', { body: { entity: 'egresos_recria', data: {
      fecha: m.fecha,
      rodeo_id: m.rodeo_origen_id,
      campo_id: rodeoOr?.campo_id || '',
      destino: 'Engorde',
      rodeo_destino_id: m.rodeo_destino_id,
      cant_animales: Number(m.cantidad) || 0,
      peso_prom_kg: Number(m.peso_prom_kg) || 0,
      precio_kg_cesion: precio,
      observaciones: 'Regularización de traslado existente',
    }}});
    invalidateCache('egresos_recria');
    await loadEntity('egresos_recria', true);
    S.margenBruto = null; S._resultCria = null; S._resultRecria = null; S._resultEng = null;
  }

  document.querySelectorAll('.ces-regularizar').forEach(b => {
    b.onclick = async () => {
      const movId = b.dataset.movId;
      const precio = Number(document.querySelector('.ces-huerfano-precio[data-mov-id="'+movId+'"]')?.value) || 0;
      b.disabled = true; b.textContent = '⏳...';
      try {
        await regularizarTraslado_(movId, precio);
        toast('Traslado regularizado', 'ok');
        render();
      } catch(err) { toast(err.message, 'err'); b.disabled=false; b.textContent='✓ Regularizar'; }
    };
  });

  const btnTodos = document.getElementById('ces-regularizar-todos');
  if (btnTodos) btnTodos.onclick = async () => {
    const btns = document.querySelectorAll('.ces-regularizar');
    btnTodos.disabled = true; btnTodos.textContent = '⏳ Regularizando...';
    let ok = 0, err = 0;
    for (const b of btns) {
      const movId = b.dataset.movId;
      const precio = Number(document.querySelector('.ces-huerfano-precio[data-mov-id="'+movId+'"]')?.value) || 0;
      try { await regularizarTraslado_(movId, precio); ok++; }
      catch(e) { err++; }
    }
    toast('✓ ' + ok + ' regularizados' + (err ? ', ' + err + ' con error' : ''), ok>0?'ok':'err');
    render();
  };
}

function buildRecria() {
  const rodeos = (S.resumenRecria && S.resumenRecria.rodeos) || [];
  const pesadas = S.cache.pesadas || [];
  const ventasR = S.cache.ventas || [];
  const egresosR = S.cache.egresos_recria || [];
  const campos = (S.catalogs && S.catalogs.campos) || [];
  const rodeosAll = (S.catalogs && S.catalogs.rodeos) || [];
  const rodeosRecria = rodeosAll.filter(r => normAct_(r.actividad)==='recria');
  const rodeosCriaTodas = rodeosAll.filter(r => normAct_(r.actividad)==='cria');

  let h = '<div class="page-header"><div class="page-title">Recría</div><div class="page-sub">Pesadas, movimientos, ventas y egresos de animales en recría</div></div>';
  h += buildSueldoKpiPanel_('recria');

  // ── Tarjetas resumen por rodeo
  h += '<div class="section-label">Rodeos en Recría</div>';
  if (!rodeos.length) {
    h += '<div class="empty-state"><span class="ico">◌</span><div class="msg">No hay rodeos con actividad "Recría". Completá la columna "actividad" en la hoja Rodeos de Sheets.</div></div>';
  } else {
    h += '<div style="display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px">';
    rodeos.forEach(r => {
      const up = r.ultima_pesada;
      h += `<div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 18px;min-width:200px">
        <div style="font-weight:700;font-size:15px;margin-bottom:2px">${r.nombre}</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:8px">${r.campo_nombre || ''}</div>
        <div style="font-size:22px;font-weight:800;color:var(--gold-text)">${fn(r.stock)} <span style="font-size:13px;font-weight:500">animales</span></div>
        ${up ? `<div style="font-size:12px;color:var(--muted);margin-top:4px">Última pesada: <strong>${fn(up.peso_prom_kg)} kg</strong> (${fd(up.fecha)})</div>` : '<div style="font-size:12px;color:var(--muted);margin-top:4px">Sin pesadas registradas</div>'}
      </div>`;
    });
    h += '</div>';
  }

  // ── Formulario de registro
  const campoOpts = campos.map(c => `<option value="${c.campo_id}">${c.nombre}</option>`).join('');
  const rodeoOpts = rodeosRecria.map(r => `<option value="${r.rodeo_id}">${r.nombre} (${campoNombre(r.campo_id)})</option>`).join('');

  h += `<div class="section-label">Registrar</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
    ${['pesada','venta','egreso'].map(t =>
      `<button class="radio-pill${S.recriaTab === t ? ' selected' : ''}" data-rtab="${t}">${t === 'pesada' ? '⚖ Pesada' : t === 'venta' ? '$ Venta' : '→ Egreso'}</button>`
    ).join('')}
  </div>`;

  // Tab Pesada
  h += `<div id="rc-tab-pesada" style="display:${(!S.recriaTab || S.recriaTab === 'pesada') ? 'block' : 'none'}">
  <div class="panel"><div class="fgrid">
    <div class="fg"><label>Fecha</label><input type="date" id="rc-pe-fecha" value="${today()}"></div>
    <div class="fg"><label>Rodeo</label><select id="rc-pe-rodeo">${rodeoOpts}</select></div>
    <div class="fg"><label>Cantidad pesada</label><input type="number" id="rc-pe-cantidad" placeholder="Ej: 45" min="1"></div>
    <div class="fg"><label>Peso promedio (kg)</label><input type="number" id="rc-pe-peso" placeholder="Ej: 185" min="0" step="0.1"></div>
    <div class="fg"><label>Observación</label><input type="text" id="rc-pe-obs" placeholder="Opcional"></div>
  </div>
  <button class="btn btn-primary" id="rc-pe-save" style="margin-top:6px">Registrar pesada</button>
  </div></div>`;

  // Tab Venta
  h += `<div id="rc-tab-venta" style="display:${S.recriaTab === 'venta' ? 'block' : 'none'}">
  <div class="panel"><div class="fgrid">
    <div class="fg"><label>Fecha</label><input type="date" id="rc-ve-fecha" value="${today()}"></div>
    <div class="fg"><label>Rodeo</label><select id="rc-ve-rodeo">${rodeoOpts}</select></div>
    <div class="fg"><label>Comprador</label><input type="text" id="rc-ve-comprador" placeholder="Nombre del comprador" list="rc-compradores-list">
      <datalist id="rc-compradores-list">${((S.catalogs && S.catalogs.compradores) || []).map(c => `<option value="${c.nombre}">`).join('')}</datalist></div>
    <div class="fg"><label>Cantidad</label><input type="number" id="rc-ve-cantidad" placeholder="Ej: 15" min="1"></div>
    <div class="fg"><label>Peso total (kg)</label><input type="number" id="rc-ve-peso" placeholder="Ej: 3200" min="0" oninput="actualizarImporteRecria_()"></div>
    <div class="fg"><label>Precio por kg</label><input type="number" id="rc-ve-precio" placeholder="Ej: 2900" min="0" oninput="actualizarImporteRecria_()"></div>
    <div class="fg" id="rc-ve-importe-preview" style="display:none"><label>Importe total</label><div id="rc-ve-importe-val" style="font-size:17px;font-weight:700;padding:8px 0;color:var(--green-text)"></div></div>
    <div class="fg"><label>Observación</label><input type="text" id="rc-ve-obs" placeholder="Opcional"></div>
  </div>
  <button class="btn btn-primary" id="rc-ve-save" style="margin-top:6px">Registrar venta</button>
  </div></div>`;

  // Tab Egreso
  h += `<div id="rc-tab-egreso" style="display:${S.recriaTab === 'egreso' ? 'block' : 'none'}">
  <div class="panel"><div class="fgrid">
    <div class="fg"><label>Fecha</label><input type="date" id="rc-eg-fecha" value="${today()}"></div>
    <div class="fg"><label>Rodeo de origen</label><select id="rc-eg-rodeo">${rodeoOpts}</select></div>
    <div class="fg"><label>Destino</label>
      <select id="rc-eg-destino" onchange="document.getElementById('rc-eg-rodeo-destino-wrap').style.display = this.value==='Reposición' ? 'flex' : 'none'">
        <option value="Engorde">Engorde (Corrales)</option>
        <option value="Reposición">Reposición de vientres (vuelve a Cría)</option>
      </select></div>
    <div class="fg" id="rc-eg-rodeo-destino-wrap" style="display:none">
      <label>Rodeo de Cría destino</label>
      <select id="rc-eg-rodeo-destino">
        <option value="">— Elegí un rodeo —</option>
        ${rodeosCriaTodas.map(r => `<option value="${r.rodeo_id}">${r.nombre} (${campoNombre(r.campo_id)})</option>`).join('')}
      </select>
    </div>
    <div class="fg"><label>Cantidad</label><input type="number" id="rc-eg-cantidad" placeholder="Ej: 30" min="1"></div>
    <div class="fg"><label>Peso promedio (kg)</label><input type="number" id="rc-eg-peso" placeholder="Ej: 280" min="0" step="0.1"></div>
    <div class="fg"><label>Observación</label><input type="text" id="rc-eg-obs" placeholder="Opcional"></div>
  </div>
  <button class="btn btn-primary" id="rc-eg-save" style="margin-top:6px">Registrar egreso</button>
  </div></div>`;

  // ── Historial de pesadas
  h += '<div class="section-label">Historial de pesadas</div>';
  const pesSorted = [...pesadas].sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
  if (!pesSorted.length) {
    h += '<div class="empty-state"><span class="ico">◌</span><div class="msg">No hay pesadas registradas.</div></div>';
  } else {
    h += buildEntityTable(pesSorted, [
      { key: 'fecha', label: 'Fecha', render: v => fd(v) },
      { key: 'rodeo_id', label: 'Rodeo', render: v => rodeoNombre(v) },
      { key: 'cantidad', label: 'Cant.', render: v => fn(v) },
      { key: 'peso_prom_kg', label: 'Peso prom. (kg)', render: v => fn(v) },
      { key: 'observacion', label: 'Obs.', render: v => v || '—' },
    ], 'pesadas', 'pesada_id');
  }

  // ── Historial de ventas Recría
  h += '<div class="section-label">Ventas de Recría</div>';
  const ventSorted = [...ventasR].sort((a, b) => String(b.fecha_salida).localeCompare(String(a.fecha_salida)));
  if (!ventSorted.length) {
    h += '<div class="empty-state"><span class="ico">◌</span><div class="msg">No hay ventas registradas.</div></div>';
  } else {
    h += buildEntityTable(ventSorted, [
      { key: 'fecha_salida', label: 'Fecha', render: v => fd(v) },
      { key: 'rodeo_id', label: 'Rodeo', render: v => rodeoNombre(v) },
      { key: 'comprador', label: 'Comprador', render: v => v || '—' },
      { key: 'cant_animales', label: 'Cant.', render: v => fn(v) },
      { key: 'peso_campo_kg', label: 'Peso (kg)', render: v => v ? fn(v) : '—' },
      { key: 'precio_pactado', label: '$/kg', render: v => v ? fn(v) : '—' },
      { key: 'importe_total', label: 'Importe', render: v => v ? '$ ' + fn(v) : '—' },
    ], 'ventas', 'venta_id');
  }

  // ── Historial de egresos
  h += '<div class="section-label">Egresos (a Engorde o Reposición)</div>';
  const egrSorted = [...egresosR].sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
  if (!egrSorted.length) {
    h += '<div class="empty-state"><span class="ico">◌</span><div class="msg">No hay egresos registrados.</div></div>';
  } else {
    h += buildEntityTable(egrSorted, [
      { key: 'fecha', label: 'Fecha', render: v => fd(v) },
      { key: 'rodeo_id', label: 'Rodeo', render: v => rodeoNombre(v) },
      { key: 'destino', label: 'Destino', render: v => v === 'Engorde' ? '<span class="pill pill-blue">Engorde</span>' : '<span class="pill pill-gold">Reposición</span>' },
      { key: 'cant_animales', label: 'Cant.', render: v => fn(v) },
      { key: 'peso_prom_kg', label: 'Peso prom. (kg)', render: v => v ? fn(v) : '—' },
      { key: 'observaciones', label: 'Obs.', render: v => v || '—' },
    ], 'egresos_recria', 'egreso_id');
  }

  return h;
}

function attachRecriaEvents() {
  // Tabs
  document.querySelectorAll('[data-rtab]').forEach(btn => {
    btn.onclick = () => {
      S.recriaTab = btn.dataset.rtab;
      document.querySelectorAll('[data-rtab]').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      ['pesada','venta','egreso'].forEach(t => {
        const el = document.getElementById('rc-tab-' + t);
        if (el) el.style.display = S.recriaTab === t ? 'block' : 'none';
      });
    };
  });

  // Preview importe venta
  window.actualizarImporteRecria_ = function() {
    const peso = Number(document.getElementById('rc-ve-peso')?.value) || 0;
    const precio = Number(document.getElementById('rc-ve-precio')?.value) || 0;
    const wrap = document.getElementById('rc-ve-importe-preview');
    const val = document.getElementById('rc-ve-importe-val');
    if (!wrap || !val) return;
    if (peso && precio) { wrap.style.display = 'flex'; val.textContent = '$ ' + fn(peso * precio); }
    else wrap.style.display = 'none';
  };

  // Guardar pesada
  const peSave = document.getElementById('rc-pe-save');
  if (peSave) peSave.onclick = async () => {
    const fecha = document.getElementById('rc-pe-fecha').value;
    const rodeoId = document.getElementById('rc-pe-rodeo').value;
    const cantidad = Number(document.getElementById('rc-pe-cantidad').value) || 0;
    const peso = Number(document.getElementById('rc-pe-peso').value) || 0;
    if (!fecha || !rodeoId || !cantidad || !peso) { toast('Completá fecha, rodeo, cantidad y peso.', 'err'); return; }
    const rodeo = ((S.catalogs && S.catalogs.rodeos) || []).find(r => String(r.rodeo_id) === String(rodeoId));
    peSave.disabled = true;
    try {
      await apiCall('create', { body: { entity: 'pesadas', data: {
        fecha, rodeo_id: rodeoId, campo_id: rodeo?.campo_id || '',
        cantidad, peso_prom_kg: peso, observacion: document.getElementById('rc-pe-obs').value.trim(),
      }}});
      invalidateCache('pesadas'); S.resumenRecria = null;
      await loadEntity('pesadas', true);
      S.resumenRecria = await apiCall('resumenRecria');
      toast('Pesada registrada — ' + fn(peso) + ' kg prom.', 'ok');
      render();
    } catch (err) { toast(err.message, 'err'); } finally { peSave.disabled = false; }
  };

  // Guardar venta
  const veSave = document.getElementById('rc-ve-save');
  if (veSave) veSave.onclick = async () => {
    const fecha = document.getElementById('rc-ve-fecha').value;
    const rodeoId = document.getElementById('rc-ve-rodeo').value;
    const cantidad = Number(document.getElementById('rc-ve-cantidad').value) || 0;
    const peso = Number(document.getElementById('rc-ve-peso').value) || '';
    const precio = Number(document.getElementById('rc-ve-precio').value) || '';
    const importe = (peso && precio) ? peso * precio : '';
    if (!fecha || !rodeoId || !cantidad) { toast('Completá fecha, rodeo y cantidad.', 'err'); return; }
    const rodeo = ((S.catalogs && S.catalogs.rodeos) || []).find(r => String(r.rodeo_id) === String(rodeoId));
    veSave.disabled = true;
    try {
      await apiCall('create', { body: { entity: 'ventas', data: {
        fecha_salida: fecha, rodeo_id: rodeoId, campo_id: rodeo?.campo_id || '',
        comprador: document.getElementById('rc-ve-comprador').value.trim(),
        cant_animales: cantidad, peso_campo_kg: peso, precio_pactado: precio, importe_total: importe,
        observaciones: document.getElementById('rc-ve-obs').value.trim(),
      }}});
      invalidateCache('ventas'); S.resumenRecria = null;
      await loadEntity('ventas', true);
      S.resumenRecria = await apiCall('resumenRecria');
      toast('Venta registrada — ' + cantidad + ' animales', 'ok');
      render();
    } catch (err) { toast(err.message, 'err'); } finally { veSave.disabled = false; }
  };

  // Guardar egreso
  const egSave = document.getElementById('rc-eg-save');
  if (egSave) egSave.onclick = async () => {
    const fecha = document.getElementById('rc-eg-fecha').value;
    const rodeoId = document.getElementById('rc-eg-rodeo').value;
    const destino = document.getElementById('rc-eg-destino').value;
    const rodeoDestinoCria = document.getElementById('rc-eg-rodeo-destino')?.value || '';
    const cantidad = Number(document.getElementById('rc-eg-cantidad').value) || 0;
    const peso = Number(document.getElementById('rc-eg-peso').value) || '';
    if (!fecha || !rodeoId || !cantidad) { toast('Completá fecha, rodeo y cantidad.', 'err'); return; }
    if (destino === 'Reposición' && !rodeoDestinoCria) { toast('Elegí a qué rodeo de Cría vuelven estos animales.', 'err'); return; }
    const rodeo = ((S.catalogs && S.catalogs.rodeos) || []).find(r => String(r.rodeo_id) === String(rodeoId));
    egSave.disabled = true;
    try {
      const result = await apiCall('create', { body: { entity: 'egresos_recria', data: {
        fecha, rodeo_id: rodeoId, campo_id: rodeo?.campo_id || '',
        destino, rodeo_destino_id: destino === 'Reposición' ? rodeoDestinoCria : '',
        cant_animales: cantidad, peso_prom_kg: peso,
        observaciones: document.getElementById('rc-eg-obs').value.trim(),
      }}});
      // La Reposición de vientres antes solo quedaba anotada acá, sin mover el
      // stock real — ahora también genera el Traslado correspondiente en
      // Movimientos, que es lo que efectivamente saca el animal de Recría y lo
      // suma como "Cesión recibida" en el rodeo de Cría elegido.
      if (destino === 'Reposición' && rodeoDestinoCria) {
        const rodeoDest = ((S.catalogs && S.catalogs.rodeos) || []).find(r => String(r.rodeo_id) === String(rodeoDestinoCria));
        const egresoId = result && result.id;
        await apiCall('create', { body: { entity: 'movimientos', data: {
          tipo: 'Traslado en bloque',
          fecha,
          rodeo_origen_id: rodeoId,
          campo_origen_id: rodeo?.campo_id || '',
          rodeo_destino_id: rodeoDestinoCria,
          campo_destino_id: rodeoDest?.campo_id || '',
          cantidad,
          peso_prom_kg: peso,
          observaciones: 'Reposición de vientres — vuelve a Cría' + (egresoId ? ' [erid:' + egresoId + ']' : ''),
        }}});
        invalidateCache('movimientos');
        await loadEntity('movimientos', true);
        S.stock = null; await loadStock();
        S.dashboard = null; S._resultCria = null; S._resultRecria = null; S._resultEng = null; S.margenBruto = null;
      }
      invalidateCache('egresos_recria'); S.resumenRecria = null;
      await loadEntity('egresos_recria', true);
      S.resumenRecria = await apiCall('resumenRecria');
      toast('Egreso registrado — ' + cantidad + ' animales a ' + destino, 'ok');
      render();
    } catch (err) { toast(err.message, 'err'); } finally { egSave.disabled = false; }
  };

  attachTableDeleteEvents('pesadas', 'pesada_id');
  attachTableDeleteEvents('ventas', 'venta_id');
}

      <div class="fg"><label>Observación</label><input type="text" id="egp-obs" placeholder="Opcional"></div>
    </div>
    <button class="btn btn-primary" id="egp-save" style="margin-top:6px">Registrar pesada</button>
  </div>`;

  // ── Alerta: corrales donde la GPD entre las dos últimas pesadas bajó
  // respecto al intervalo anterior (la eficiencia de engorde viene cayendo).
  const alertasGpd = egCorralesGpdEnBaja_(rodeosEng);
  if (alertasGpd.length) {
    h += `<div class="panel" style="border:1px solid var(--red);background:var(--red-bg)">
      <div class="panel-title" style="color:var(--red-text)">⚠ Caída de eficiencia (GPD) entre pesadas</div>
      <div style="font-size:12.5px;color:var(--red-text);margin-bottom:8px">En estos corrales la ganancia diaria de peso del último intervalo entre pesadas es <strong>menor</strong> que en el intervalo anterior:</div>
      <ul style="margin:0;padding-left:18px;font-size:13px;color:var(--red-text)">
        ${alertasGpd.map(a => `<li style="margin-bottom:3px"><strong>${a.nombre}</strong> (${a.campo}) — bajó a <strong>${fn(a.gpd,3)} kg/día</strong> (antes: ${fn(a.gpdAnterior,3)} kg/día) al ${fd(a.fecha)}</li>`).join('')}
      </ul>
    </div>`;
  }

  h += '<div class="section-label">Historial de pesadas por corral</div>';
  rodeosEng.forEach(r => {
    const pes = todasPes.filter(p => String(p.rodeo_id) === String(r.rodeo_id));
    if (!pes.length) return;
    // Mapa pesada_id → datos del intervalo que esa pesada cierra, para mostrar
    // la GPD contra la pesada anterior y resaltar si bajó respecto al intervalo previo.
    const intervalos = egGpdIntervalos_(r.rodeo_id);
    const gpdPorPesadaId = Object.fromEntries(intervalos.map(it => [String(it.pesada_id), it]));
    const bajaUltima = intervalos.length && intervalos[intervalos.length - 1].bajo;
    h += `<div style="font-weight:600;font-size:13px;margin:12px 0 6px;display:flex;align-items:center;gap:8px">
      ${r.nombre} <span style="color:var(--muted);font-weight:400">${campoNombre(r.campo_id)}</span>
      ${bajaUltima ? '<span class="pill pill-red" title="La GPD entre las dos últimas pesadas bajó respecto al intervalo anterior">⚠ GPD en baja</span>' : ''}
    </div>`;
    h += buildEntityTable(pes, [
      { key: 'fecha', label: 'Fecha', render: v => fd(v) },
      { key: 'cantidad', label: 'Cant.', render: v => fn(v) },
      { key: 'peso_prom_kg', label: 'Peso prom. (kg)', render: v => fn(v) },
      { key: 'pesada_id', label: 'GPD vs. pesada ant.', render: id => {
          const it = gpdPorPesadaId[String(id)];
          if (!it || it.gpd == null) return '<span style="color:var(--text3)">—</span>';
          const txt = fn(it.gpd, 3) + ' kg/día';
          if (it.bajo) return `<span style="color:var(--red-text);font-weight:700" title="Bajó respecto al intervalo anterior (${fn(it.gpdAnterior,3)} kg/día)">⚠ ${txt}</span>`;
          return `<span style="color:var(--green-text)">${txt}</span>`;
        } },
      { key: 'observacion', label: 'Obs.', render: v => v || '—' },
    ], 'pesadas', 'pesada_id');
  });
  if (!todasPes.length) h += '<div class="empty-state"><span class="ico">◌</span><div class="msg">No hay pesadas registradas.</div></div>';
  return h;
}

// ── ENGORDE — funciones auxiliares ───────────────────────────────────────
function egGetCorralId() {
  return S.engordeCorralId || '';
}
function egSetCorralId(val) {
  S.engordeCorralId = val;
}
// Configuración por corral — persiste en Sheets (entidad config_corral), una fila por rodeo_id.
// Se cachea en S.cache.config_corral igual que cualquier otra entidad (loadEntity).
// Fallback de lectura a localStorage SOLO para datos viejos cargados antes de esta migración
// (así no se "pierden" configuraciones ya guardadas mientras el usuario no las vuelve a tocar).
function egConfig_(rodeoId) {
  const fila = (S.cache.config_corral || []).find(c => String(c.rodeo_id) === String(rodeoId));
  if (fila) {
    return {
      kgIngreso: fila.kg_ingreso || '',
      precioCompra: fila.precio_compra || '',
      precioStock: fila.precio_stock || '',
      pesoObjetivo: fila.peso_objetivo || '',
      precioProyectado: fila.precio_proyectado || '',
      precioStockEsKg: fila.precio_stock_es_kg || '',
      fechaInicio: fila.fecha_inicio || '',
      stockInicial: fila.stock_inicial || '',
    };
  }
  // Fallback legacy a localStorage (datos previos a la migración a Sheets)
  try { return JSON.parse(localStorage.getItem('eg_cfg') || '{}')[rodeoId] || {}; } catch(e) { return {}; }
}
// Devuelve lista de { producto_id, fecha_baja } de productos inactivos para un corral
// Lee rodeo_productos de S.cache o catalogs (lo que esté disponible)
function egRodeoProductosTodos_() {
  return S.cache.rodeo_productos || (S.catalogs && S.catalogs.rodeo_productos) || [];
}
function egProductosInactivos_(rodeoId) {
  return egRodeoProductosTodos_()
    .filter(x => String(x.rodeo_id) === String(rodeoId) && String(x.activo).toUpperCase() !== 'TRUE');
}
// Devuelve true si el producto está activo para ese corral en la fecha indicada
function egEsProductoActivo_(rodeoId, productoId, fecha) {
  const todos = egRodeoProductosTodos_();
  const reg = todos.find(x => String(x.rodeo_id) === String(rodeoId) && String(x.producto_id) === String(productoId));
  if (!reg) return true; // no registrado → activo por defecto
  if (String(reg.activo).toUpperCase() === 'TRUE') return true; // marcado activo
  if (!reg.fecha_baja) return false; // inactivo sin fecha → siempre inactivo
  return String(fecha || today()) < String(reg.fecha_baja); // activo solo antes de la fecha de baja
}
// Guarda la configuración del corral en Sheets (asíncrono). Hace merge: solo pisa los
// campos que vienen en cfg, deja el resto como estaba. Actualiza el caché local optimistamente
// para que la UI refleje el cambio sin esperar el round-trip, y revierte si falla.
async function egSaveConfig_(rodeoId, cfg) {
  const dataApi = {};
  if (cfg.kgIngreso !== undefined) dataApi.kg_ingreso = cfg.kgIngreso;
  if (cfg.precioCompra !== undefined) dataApi.precio_compra = cfg.precioCompra;
  if (cfg.precioStock !== undefined) dataApi.precio_stock = cfg.precioStock;
  if (cfg.pesoObjetivo !== undefined) dataApi.peso_objetivo = cfg.pesoObjetivo;
  if (cfg.precioProyectado !== undefined) dataApi.precio_proyectado = cfg.precioProyectado;
  if (cfg.precioStockEsKg !== undefined) dataApi.precio_stock_es_kg = cfg.precioStockEsKg;
  if (cfg.fechaInicio !== undefined) dataApi.fecha_inicio = cfg.fechaInicio;
  if (cfg.stockInicial !== undefined) dataApi.stock_inicial = cfg.stockInicial;

  // Actualización optimista del caché local
  if (!S.cache.config_corral) S.cache.config_corral = [];
  let fila = S.cache.config_corral.find(c => String(c.rodeo_id) === String(rodeoId));
  if (fila) Object.assign(fila, dataApi);
  else S.cache.config_corral.push(Object.assign({ rodeo_id: rodeoId }, dataApi));

  try {
    await apiCall('saveConfigCorral', { body: { rodeo_id: rodeoId, data: dataApi } });
  } catch (e) {
    toast('No se pudo guardar en el servidor: ' + e.message, 'err');
    await loadEntity('config_corral', true); // revertir al estado real del servidor
  }
}
// Lotes cerrados de Terminación (Historial) — ahora persisten en Sheets (entidad
// engorde_lotes), ya no en localStorage del navegador. Se mapea de las columnas
// snake_case de la hoja al mismo shape camelCase que ya usaba el resto del código,
// para no tener que tocar buildEngordeHistorial_ ni el resto de las pantallas.
function egLotes_() {
  return (S.cache.engorde_lotes || []).map(l => ({
    id: l.lote_id, rodeoId: String(l.rodeo_id), nombre: l.nombre,
    fechaApertura: l.fecha_apertura, fechaCierre: l.fecha_cierre,
    animales: Number(l.animales)||0, kgGanados: Number(l.kg_ganados)||0,
    ganDiaria: (l.gan_diaria!==''&&l.gan_diaria!==undefined&&l.gan_diaria!==null) ? Number(l.gan_diaria) : null,
    costoAlim: Number(l.costo_alim)||0, costoCompra: Number(l.costo_compra)||0,
    ingVentas: Number(l.ing_ventas)||0, ingCesEnviada: Number(l.ing_ces_enviada)||0,
    // Lotes cerrados antes de esta actualización no tienen estos tres campos —
    // quedan en null y la tabla los muestra como "—" en vez de 0 (que sería engañoso).
    conversionMS: (l.conversion_ms!==''&&l.conversion_ms!==undefined&&l.conversion_ms!==null) ? Number(l.conversion_ms) : null,
    costoKgMS: (l.costo_kg_ms!==''&&l.costo_kg_ms!==undefined&&l.costo_kg_ms!==null) ? Number(l.costo_kg_ms) : null,
  }));
}

// Migración única: si hay configuraciones de corral guardadas en localStorage (eg_cfg)
// de antes de que esto pasara a vivir en Sheets, las sube al servidor automáticamente
// la primera vez que se detectan, así no se pierden por limpiar caché o cambiar de equipo.
// Se marca con una bandera en localStorage para no repetir la migración en cada carga.
async function migrarConfigCorralLegacy_() {
  try {
    if (localStorage.getItem('eg_cfg_migrado')) return;
    const legacy = JSON.parse(localStorage.getItem('eg_cfg') || '{}');
    const rodeoIds = Object.keys(legacy || {});
    if (!rodeoIds.length) { localStorage.setItem('eg_cfg_migrado', '1'); return; }

    const yaEnSheets = new Set((S.cache.config_corral || []).map(c => String(c.rodeo_id)));
    let migrados = 0;
    for (const rid of rodeoIds) {
      if (yaEnSheets.has(String(rid))) continue; // ya migrado antes, no pisar
      const cfg = legacy[rid] || {};
      const tieneAlgo = cfg.kgIngreso || cfg.precioCompra || cfg.precioStock || cfg.pesoObjetivo || cfg.precioProyectado;
      if (!tieneAlgo) continue;
      await egSaveConfig_(rid, cfg);
      migrados++;
    }
    localStorage.setItem('eg_cfg_migrado', '1');
    if (migrados > 0) {
      toast('✓ Se recuperaron ' + migrados + ' configuración(es) de corral guardadas localmente y se subieron a la planilla.', 'ok');
      render();
    }
  } catch (e) { /* silencioso — no bloquea la carga de la app */ }
}

function egStock_(rodeoId) {
  const row = (S.stock || []).find(r => String(r.rodeo_id) === String(rodeoId));
  return row ? (row.stock || 0) : 0;
}
function egPesadas_(rodeoId) {
  return (S.cache.pesadas || []).filter(p => String(p.rodeo_id) === String(rodeoId))
    .sort((a, b) => String(a.fecha).localeCompare(String(b.fecha)));
}
function egVentas_(rodeoId) {
  return (S.cache.ventas || []).filter(v => String(v.rodeo_id) === String(rodeoId));
}
function egConsumos_(rodeoId, hastaFecha) {
  const todos = (S.cache.consumos_insumos || []).filter(c => String(c.rodeo_id) === String(rodeoId));
  return hastaFecha ? todos.filter(c => String(c.fecha) <= hastaFecha) : todos;
}

// Conversión alimenticia (materia seca) de un corral, hasta una fecha de corte.
// Función única reutilizada en la ficha de Costos, las tarjetas del Dashboard
// general y el cierre de lote del Historial — así los tres lugares muestran
// siempre el mismo número, calculado de la misma forma.
// kgProducidos: kg vivo ganado en el mismo corte (ej. egKgGanadosHastaPesada_).
function egConversionMS_(rodeoId, hastaFecha, kgProducidos) {
  const productos = (S.catalogs && S.catalogs.productos) || (S.cache.productos || []);
  const prodPorId = Object.fromEntries(productos.map(p => [String(p.producto_id), p]));
  // Admite coma decimal (formato argentino, ej: "88,5") además de punto — si se
  // guardó con coma, Number() directo da NaN y silenciosamente lo trataba como 0.
  const numMS_ = v => Number(String(v == null ? '' : v).trim().replace(',', '.')) || 0;
  let kgMS = 0, costoTotal = 0, hayAlimSinMS = false, huboConsumos = false;
  egConsumos_(rodeoId, hastaFecha).forEach(c => {
    const p = prodPorId[String(c.producto_id)];
    if (p && p.categoria === 'Veterinaria') return;
    huboConsumos = true;
    const ms = p ? numMS_(p.materia_seca_pct) : 0;
    const cant = Number(c.cantidad) || 0;
    // Costo real de ESTE consumo (kg tal cual × precio vigente a su fecha) — se
    // suma siempre, sea o no que el producto tenga % de MS cargado.
    costoTotal += cant * egPrecioVigenteProducto_(c.producto_id, c.fecha);
    if (ms > 0) kgMS += cant * ms / 100;
    else hayAlimSinMS = true;
  });
  const conv = (kgProducidos > 0 && kgMS > 0) ? kgMS / kgProducidos : null;
  // El costo por kg de MS solo es válido si TODO el alimento tenía su % de MS
  // cargado — si falta alguno, costoTotal incluye kg que kgMS no está contando,
  // y el cociente quedaría inflado sin ningún aviso.
  const costoKgMS = (kgMS > 0 && !hayAlimSinMS) ? costoTotal / kgMS : null;
  // Diagnóstico legible cuando NO se puede mostrar la conversión — para que la
  // tarjeta explique la causa en vez de desaparecer sin avisar nada.
  let motivoSinDato = null;
  if (!huboConsumos) motivoSinDato = 'Este corral todavía no tiene consumos de alimento registrados.';
  else if (kgMS === 0) motivoSinDato = 'Ningún alimento consumido por este corral tiene % de materia seca cargado en Productos.';
  else if (!(kgProducidos > 0)) motivoSinDato = 'Todavía no hay kg ganados registrados (falta una segunda pesada).';
  return { kgMS, costoTotal, conv, costoKgMS, hayAlimSinMS, motivoSinDato };
}
// Devuelve el precio unitario vigente de un producto a una fecha dada —
// es el precio_unitario de la última compra registrada ANTES o EN esa fecha.
// Si no hay compras previas, usa el precio promedio histórico como fallback.
function egPrecioVigenteProducto_(productoId, fecha) {
  const compras = (S.cache.compras_insumos || [])
    .filter(c => String(c.producto_id) === String(productoId) && (Number(c.precio_unitario) || 0) > 0)
    .sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
  if (!compras.length) return 0;
  // Precio vigente = última compra anterior o igual a la fecha del consumo
  const vigente = fecha
    ? compras.find(c => String(c.fecha) <= String(fecha))
    : compras[0];
  return vigente ? Number(vigente.precio_unitario) || 0 : Number(compras[compras.length-1].precio_unitario) || 0;
}

function egCostoPromProducto_(productoId) {
  // Mantener compatibilidad — usa precio promedio ponderado por cantidad
  const compras = (S.cache.compras_insumos || []).filter(c => String(c.producto_id) === String(productoId));
  const cant = compras.reduce((s, c) => s + (Number(c.cantidad) || 0), 0);
  const costo = compras.reduce((s, c) => s + (Number(c.precio_unitario) || 0) * (Number(c.cantidad) || 0), 0);
  return cant > 0 ? costo / cant : 0;
}
function egCostoAlim_(rodeoId, hastaFecha, categoria) {
  const productos = (S.catalogs && S.catalogs.productos) || [];
  return egConsumos_(rodeoId, hastaFecha).reduce((s, c) => {
    if (categoria) {
      const prod = productos.find(p => String(p.producto_id) === String(c.producto_id));
      if (!prod || prod.categoria !== categoria) return s;
    }
    // Usar precio vigente a la fecha del consumo (no promedio global)
    return s + (Number(c.cantidad) || 0) * egPrecioVigenteProducto_(c.producto_id, c.fecha);
  }, 0);
}
function egKgVend_(rodeoId) {
  return egVentas_(rodeoId).reduce((s, v) => s + (Number(v.peso_campo_kg) || 0), 0);
}
function egIngVentas_(rodeoId) {
  return egVentas_(rodeoId).reduce((s, v) => {
    return s + (Number(v.importe_liq) || (Number(v.precio_pactado) * (Number(v.peso_campo_kg) || 0)) || 0);
  }, 0);
}
function egFechaIngreso_(rodeoId) {
  // Preferimos "Saldo inicial" para la fecha de ingreso (no distorsiona la GDP).
  // Si el corral no tiene Saldo inicial (ej: ingresó por traslado directo desde otro
  // rodeo, sin un Saldo inicial separado), usamos la fecha del primer Traslado recibido.
  const movs = (S.cache.movimientos || [])

        rodeo_id: r.rodeo_id, nombre: r.nombre, campo: campoNombre(r.campo_id),
        gpd: ultimo.gpd, gpdAnterior: ultimo.gpdAnterior, fecha: ultimo.fechaHasta,
      });
    }
  });
  return out;
}
function egFmon_(pesos, moneda) {
  if (moneda === 'USD') {
    const tc = tipoCambioVigente_(today());
    const val = tc ? Number(tc.valor || tc) : null;
    if (val && val > 0) return 'U$S ' + fn(Math.round(pesos / val), 0);
  }
  return '$ ' + fn(Math.round(pesos), 0);
}
// Formatea un monto en pesos usando la cotización del dólar VIGENTE A LA FECHA DE CORTE,
// no la de hoy. Se usa específicamente para el Stock valorizado (EF) — es lo único que
// se valúa "al cierre del período", así que su conversión a USD debe tomar la cotización
// de esa fecha de cierre. Todo lo demás (consumos, EI/altas de hacienda) ya se convierte
// con la cotización de su propia fecha de movimiento vía convertirAMoneda_(importe, fecha,
// moneda) en el cálculo — acá solo se resuelve el mismo criterio para el display de la EF.
function fmonACorte_(pesos, moneda, corte) {
  if (moneda === 'USD') {
    const tc = tipoCambioVigente_(corte);
    const val = tc ? Number(tc.valor || tc) : null;
    if (val && val > 0) return 'U$S ' + fn(Math.round(pesos / val), 0);
  }
  return '$ ' + fn(Math.round(pesos), 0);
}
function egPct_(a, b) { if (!b) return '—'; return (a / b * 100).toFixed(1) + '%'; }

// ── ENGORDE — construcción principal ─────────────────────────────────────

    h += `<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:8px">

          <option value="">— Todos los corrales —</option>

            } else {

        destino: rodeoNombre(e.rodeo_destino_id),
        cant: Number(e.cant_animales)||0,

    if (todasCesRec.length) {
      h += `<div class="panel"><div class="panel-title">⬇ Cesiones recibidas de Recría — detalle</div>

          <td>${fd(c.fecha)}</td><td><strong>${c.origen}</strong></td><td>${c.destino}</td>
          <td class="tc">${fn(c.cant)}</td>
          <td class="tc">${c.peso?fn(c.peso)+' kg':'—'}</td>
          <td class="tr">${c.precioKg?'$ '+fn(c.precioKg):'<span style="color:var(--gold-text);font-size:11px">⚠ sin precio</span>'}</td>
          <td class="tr"><strong>${total?fm(total):'—'}</strong></td>
        </tr>`;
      });
      h += `<tr style="background:var(--bg2);font-weight:800"><td colspan="6" class="tr">TOTAL cesiones recibidas</td>
        <td class="tr" style="color:var(--clay-text);font-size:15px">${fm(totCesRec)}</td></tr>`;
      h += `</tbody></table></div></div>`;
    }

    // ── Detalle Ventas ────────────────────────────────────────────────────
    const ventasEng = (S.cache.ventas||[]).filter(v=>rodeosEng.some(r=>String(r.rodeo_id)===String(v.rodeo_id)))
      .sort((a,b)=>String(a.fecha_salida||'').localeCompare(String(b.fecha_salida||'')));
    if (ventasEng.length) {
      h += `<div class="panel"><div class="panel-title">💰 Ventas — detalle</div>
        <div class="tw"><table class="dt"><thead><tr>
          <th>Fecha</th><th>Corral</th><th class="tc">Cab.</th>
          <th class="tr">Kg campo</th><th class="tr">Precio pactado</th><th class="tr">Importe liq.</th><th class="tr">Total</th>
        </tr></thead><tbody>`;
      let totVent=0;
      ventasEng.forEach(v=>{
        const cant=Number(v.cant_animales)||0, kg=Number(v.peso_campo_kg)||0;

        <td class="tr" style="color:var(--green-text);font-size:15px">${fm(totVent)}</td></tr>`;

    const corteEngLocal = S._corteEng || today();
