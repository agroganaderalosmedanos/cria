    h += `<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <label style="font-size:13px;font-weight:600">Corral:</label>
      <select id="eg-selector-corral" onchange="S.engordeCorralId=this.value;render()" style="padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);font-size:14px">
        ${rodeosEng.map(r => `<option value="${r.rodeo_id}" ${String(r.rodeo_id)===String(S.engordeCorralId)?'selected':''}>${r.nombre} (${campoNombre(r.campo_id)})</option>`).join('')}
      </select>
    </div>`;
  }

  if (page === 'engorde') h += buildEngordeDashboard_(rodeosEng, fm);
  else if (page === 'engorde_costos') h += buildEngordeCostos_(S.engordeCorralId, fm);
  else if (page === 'engorde_comparacion') h += buildEngordeComparacion_(rodeosEng, fm);
  else if (page === 'engorde_proyeccion') h += buildEngordeProyeccion_(S.engordeCorralId, fm);
  else if (page === 'engorde_cierre') h += buildEngordeCierre_(S.engordeCorralId, fm);
  else if (page === 'engorde_historial') h += buildEngordeHistorial_(rodeosEng, fm);

  // Formulario pesada (en Dashboard)
  if (page === 'engorde') {
    const rodeoOpts = rodeosEng.map(r => `<option value="${r.rodeo_id}">${r.nombre} (${campoNombre(r.campo_id)})</option>`).join('');
    h += `<div class="section-label" style="margin-top:20px">Registrar pesada</div>
    <div class="panel"><div class="fgrid">
      <div class="fg"><label>Fecha</label><input type="date" id="eg-pe-fecha" value="${today()}"></div>
      <div class="fg"><label>Corral</label><select id="eg-pe-rodeo">${rodeoOpts}</select></div>
      <div class="fg"><label>Cantidad</label><input type="number" id="eg-pe-cantidad" placeholder="Ej: 185" min="1"></div>
      <div class="fg"><label>Peso promedio (kg)</label><input type="number" id="eg-pe-peso" placeholder="Ej: 480" min="0" step="0.1"></div>
      <div class="fg"><label>Observación</label><input type="text" id="eg-pe-obs" placeholder="Opcional"></div>
    </div>
    <button class="btn btn-primary" id="eg-pe-save" style="margin-top:6px">Registrar pesada</button>
    </div>`;
    // Historial de pesadas
    h += '<div class="section-label">Historial de pesadas</div>';
    const todasPes = (S.cache.pesadas || [])
      .filter(p => rodeosEng.some(r => String(r.rodeo_id) === String(p.rodeo_id)))
      .sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
    h += buildEntityTable(todasPes, [
      { key: 'fecha', label: 'Fecha', render: v => fd(v) },
      { key: 'rodeo_id', label: 'Corral', render: v => rodeoNombre(v) },
      { key: 'cantidad', label: 'Cant.', render: v => fn(v) },
      { key: 'peso_prom_kg', label: 'Peso prom. (kg)', render: v => fn(v) },
      { key: 'observacion', label: 'Obs.', render: v => v || '—' },
    ], 'pesadas', 'pesada_id');
  }

  return h;
}

function buildEngordeDashboard_(rodeosEng, fm) {
  if (!rodeosEng.length) return '<div class="empty-state"><span class="ico">◌</span><div class="msg">No hay corrales de Engorde. Creá rodeos con actividad "Engorde" en la hoja Rodeos.</div></div>';

  // Acumular totales
  let totAn=0, totKgI=0, totKgV=0, totKgStk=0, totKgG=0;
  let totCC=0, totCA=0, totCV=0, totIv=0, totIvStk=0;
  const gdps=[];

  rodeosEng.forEach(r => {
    const rid = r.rodeo_id;
    totAn  += egStock_(rid);
    totKgI += egKgIngresados_(rid);
    totKgV += egKgVend_(rid);
    totKgStk += egKgStockEstimado_(rid);
    totKgG += egKgGanadosHastaPesada_(rid);
    totCC  += egCostoCompra_(rid);
    totCA  += egCostoAlim_(rid);
    // Costo vet = consumos de productos categoría Veterinaria
    totCV  += egCostoAlim_(rid, null, 'Veterinaria');
    totIv  += egIngVentas_(rid);
    const cfg = egConfig_(rid);
    const pes = egPesadas_(rid);
    const ultima = pes.length ? pes[pes.length-1] : null;
    const stkP = Number(cfg.precioStock || 0);
    if (stkP > 0 && ultima) totIvStk += egStock_(rid) * Number(ultima.peso_prom_kg) * stkP;
    const gd = egGanDiaria_(rid);
    if (gd !== null) gdps.push(gd);
  });

  const gdpProm = gdps.length ? gdps.reduce((s,g)=>s+g,0)/gdps.length : null;
  const totIvTotal = totIv + totIvStk;
  const utilSinVet = totIvTotal - totCC - totCA;
  const utilConVet = totIvTotal - totCC - totCA - totCV;
  const tc = tipoCambioVigente_(today());
  const tcVal = tc ? Number(tc.valor || tc) : null;
  const moneda = S.engordeMoneda || 'ARS';
  const tcLabel = tcVal ? '· TC: $' + fn(tcVal, 0) + '/USD' : '';
  const kgGPorAnim = totKgG > 0 && rodeosEng.length > 0 ? totKgG / rodeosEng.reduce((s,r)=>s+egCantIngresada_(r.rodeo_id),0) : null;

  let h = '';

  // Barra de moneda
  h += `<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px">
    <div style="font-size:13px;color:var(--text2)">Moneda: <strong>${moneda==='USD'?'🇺🇸 Dólares (USD) '+tcLabel:'🇦🇷 Pesos (ARS)'}</strong></div>
    <button class="btn btn-secondary" onclick="S.engordeMoneda=S.engordeMoneda==='USD'?'ARS':'USD';render()" style="font-size:12px;padding:5px 14px">${moneda==='USD'?'Ver en ARS':'🇺🇸 Ver en USD'}</button>
  </div>`;

  // KPI grid — fila 1: Stock | Ingreso ventas | Stock val. | Costo compra | Costo alim. | Costo vet.
  h += `<div class="kpi-grid">
    <div class="kpi"><div class="kpi-icon">🐄</div><div class="kpi-label">Stock total</div><div class="kpi-val">${fn(totAn,0)}</div><div class="kpi-sub">animales en corrales</div></div>
    <div class="kpi"><div class="kpi-icon">💵</div><div class="kpi-label">Ingreso por ventas</div><div class="kpi-val">${fm(totIv)}</div></div>
    <div class="kpi"><div class="kpi-icon">🏷️</div><div class="kpi-label">Stock valorizado</div><div class="kpi-val kpi-pos">${totIvStk>0?fm(totIvStk):'—'}</div><div class="kpi-sub">${totIvTotal>0&&totIvStk>0?'ingresos totales: '+fm(totIvTotal):'configurá precio de stock en Costos'}</div></div>
    <div class="kpi"><div class="kpi-icon">🛒</div><div class="kpi-label">Costo de compra</div><div class="kpi-val">${totCC>0?fm(totCC):'—'}</div><div class="kpi-sub">${totCC===0?'configurá precio de compra en Costos':''}</div></div>
    <div class="kpi"><div class="kpi-icon">🌿</div><div class="kpi-label">Costo de alimentación</div><div class="kpi-val">${fm(totCA)}</div></div>
    <div class="kpi"><div class="kpi-icon">💊</div><div class="kpi-label">Costo veterinario</div><div class="kpi-val" style="color:#7c3aed">${totCV>0?fm(totCV):'$ 0'}</div><div class="kpi-sub">sin vet: ${fm(utilSinVet)}</div></div>
  </div>`;

  // KPI grid — fila 2: Utilidad neta
  h += `<div class="kpi-grid">
    <div class="kpi"><div class="kpi-icon">📈</div><div class="kpi-label">Utilidad neta</div><div class="kpi-val ${utilConVet>=0?'kpi-pos':'kpi-neg'}">${fm(utilConVet)}</div><div class="kpi-sub">ventas + stock valorizado</div></div>
    <div class="kpi"><div class="kpi-label" style="font-size:10px;margin-bottom:6px">DESGLOSE</div>
      <div style="font-size:12px">Sin vet: <strong>${fm(utilSinVet)}</strong></div>
      <div style="font-size:12px">Con vet: <strong>${fm(utilConVet)}</strong></div>
    </div>
  </div>`;

  // KPI grid — fila 3: Kilos y GDP
  h += `<div class="kpi-grid">
    <div class="kpi"><div class="kpi-icon">📥</div><div class="kpi-label">Kg ingresados</div><div class="kpi-val">${fn(totKgI,0)}</div><div class="kpi-sub">kg al entrar al corral</div></div>
    <div class="kpi"><div class="kpi-icon">⚖️</div><div class="kpi-label">Kg vendidos</div><div class="kpi-val">${fn(totKgV,0)}</div><div class="kpi-sub">kg totales egresados</div></div>
    <div class="kpi"><div class="kpi-icon">🐄</div><div class="kpi-label">Kg en stock</div><div class="kpi-val">${fn(totKgStk,0)}</div><div class="kpi-sub">${fn(totAn,0)} animales · última pesada</div></div>
    <div class="kpi"><div class="kpi-icon">📊</div><div class="kpi-label">Kg ganados</div><div class="kpi-val kpi-pos">${fn(totKgG,0)}</div><div class="kpi-sub">${kgGPorAnim?fn(kgGPorAnim,1)+' kg gan./animal (prom.)':''}</div></div>
    <div class="kpi"><div class="kpi-icon">📈</div><div class="kpi-label">Ganancia diaria prom.</div><div class="kpi-val kpi-pos">${gdpProm!==null?fn(gdpProm,3)+' kg/día':'—'}</div><div class="kpi-sub">${rodeosEng.map(r=>campoNombre(r.campo_id)).join(' · ')}</div></div>
  </div>`;

  // Tarjetas por corral
  h += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:8px">';
  rodeosEng.forEach(r => {
    const rid = r.rodeo_id;
    const stk = egStock_(rid);
    const pes = egPesadas_(rid);
    const ultima = pes.length ? pes[pes.length-1] : null;
    const gd = egGanDiaria_(rid);
    const ca = egCostoAlim_(rid);
    const cv = egCostoAlim_(rid, null, 'Veterinaria');
    const cc = egCostoCompra_(rid);
    const iv = egIngVentas_(rid);
    const cfg = egConfig_(rid);
    const stkP = Number(cfg.precioStock || 0);
    const ivStk = stkP > 0 && ultima ? stk * Number(ultima.peso_prom_kg) * stkP : 0;
    const ivTotal = iv + ivStk;
    const util = ivTotal - cc - ca - cv;
    const fi = egFechaIngreso_(rid);
    const dias = fi ? Math.round((new Date() - new Date(fi)) / 86400000) : null;
    const kgI = egKgIngresados_(rid);
    const kgV = egKgVend_(rid);
    const kgStk = egKgStockEstimado_(rid);
    const kgG = egKgGanadosHastaPesada_(rid);
    const cantIng = egCantIngresada_(rid);
    const caXkgG = kgG > 0 ? ca / kgG : null;
    const borderColor = util >= 0 ? 'var(--green)' : 'var(--red)';

    h += `<div style="background:var(--bg);border:0.5px solid var(--border);border-top:3px solid ${borderColor};border-radius:var(--radius-lg);padding:16px 18px;box-shadow:var(--shadow)">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
        <div>
          <div style="font-weight:700;font-size:15px">${r.nombre}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:2px">${campoNombre(r.campo_id)}${dias!==null?' · '+dias+' días':''}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:24px;font-weight:800;color:var(--blue-text)">${fn(stk,0)}</div>
          <div style="font-size:10px;color:var(--text3)">animales</div>
        </div>
      </div>
      <div class="kpi-grid" style="margin-bottom:8px">
        <div class="kpi" style="padding:8px 10px"><div class="kpi-label">Última pesada</div><div class="kpi-val" style="font-size:16px">${ultima?fn(ultima.peso_prom_kg,0)+' kg':'—'}</div><div class="kpi-sub">${ultima?fd(ultima.fecha):''}</div></div>
        <div class="kpi" style="padding:8px 10px"><div class="kpi-label">GDP</div><div class="kpi-val kpi-pos" style="font-size:16px">${gd!==null?fn(gd,3)+' kg/día':'—'}</div></div>
        <div class="kpi" style="padding:8px 10px"><div class="kpi-label">Kg ganados</div><div class="kpi-val kpi-pos" style="font-size:16px">${fn(kgG,0)}</div><div class="kpi-sub">${caXkgG?fm(caXkgG)+'/kg ganado':''}</div></div>
        <div class="kpi" style="padding:8px 10px"><div class="kpi-label">Costo alim.</div><div class="kpi-val" style="font-size:16px">${fm(ca)}</div></div>
        <div class="kpi" style="padding:8px 10px"><div class="kpi-label">Ingreso ventas</div><div class="kpi-val" style="font-size:16px">${fm(iv)}</div></div>
        <div class="kpi" style="padding:8px 10px;border-top:2px solid ${util>=0?'var(--green)':'var(--red)'}"><div class="kpi-label">Resultado</div><div class="kpi-val ${util>=0?'kpi-pos':'kpi-neg'}" style="font-size:16px">${fm(util)}</div><div class="kpi-sub">${ivStk>0?'incl. stock val. '+fm(ivStk):''}</div></div>
      </div>
      <div style="font-size:11px;color:var(--text3);display:flex;gap:12px;flex-wrap:wrap">
        <span>Ingresados: <strong>${fn(cantIng,0)} cab.</strong></span>
        ${kgI>0?`<span>Kg ingr.: <strong>${fn(kgI,0)}</strong></span>`:''}
        ${kgV>0?`<span>Kg vend.: <strong>${fn(kgV,0)}</strong></span>`:''}
        <span>Kg stock: <strong>${fn(kgStk,0)}</strong></span>
      </div>
    </div>`;
  });
  h += '</div>';
  return h;
}

function buildEngordeCostos_(rodeoId, fm) {
  if (!rodeoId) return '<div class="empty-state"><span class="ico">◌</span><div class="msg">Seleccioná un corral.</div></div>';
  const r = rodeosTodos().find(r => String(r.rodeo_id) === String(rodeoId));
  if (!r) return '';
  const cfg = egConfig_(rodeoId);
  const stk = egStock_(rodeoId);
  const pes = egPesadas_(rodeoId);
  const ultima = pes.length ? pes[pes.length-1] : null;
  const fi = egFechaIngreso_(rodeoId);
  const kgIngProm = egKgIngreso_(rodeoId);
  const cantIng = egCantIngresada_(rodeoId);
  const kgI = egKgIngresados_(rodeoId);
  const ca = egCostoAlim_(rodeoId);
  const caHP = egCostoAlim_(rodeoId, ultima?.fecha);
  const cc = egCostoCompra_(rodeoId);
  const iv = egIngVentas_(rodeoId);
  const kgV = egKgVend_(rodeoId);
  const kgG = egKgGanadosHastaPesada_(rodeoId);
  const kgStk = egKgStockEstimado_(rodeoId);
  const stkPrecio = Number(cfg.precioStock || 0);
  const ivStock = stkPrecio > 0 && ultima ? stk * Number(ultima.peso_prom_kg) * stkPrecio : 0;
  const ivTotal = iv + ivStock;
  const costoTotal = cc + ca;
  const util = ivTotal - costoTotal;
  const dias = fi && ultima ? Math.round((new Date(ultima.fecha) - new Date(fi)) / 86400000) : null;
  const ganDiaria = dias && dias > 0 && kgIngProm > 0 ? (Number(ultima?.peso_prom_kg||0) - kgIngProm) / dias : null;
  const caXkg = kgG > 0 ? caHP / kgG : null;
  const ccXkg = kgG > 0 ? cc / kgG : null;
  const precVentaProm = kgV > 0 ? iv / kgV : null;
  const totalAnim = (cantIng - stk) + stk;
  const costoARecuperar = costoTotal - iv;
  const breakEven = kgStk > 0 ? costoARecuperar / kgStk : null;
  const margenVsBE = breakEven && precVentaProm ? precVentaProm - breakEven : null;

  let h = '';
  // Config del corral
  h += `<div style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center">
    <span style="font-size:13px;font-weight:600">⚙ Config. ${r.nombre}</span>
    <div style="display:flex;align-items:center;gap:6px;font-size:13px">
      <label>Kg prom. entrada:</label>
      <input type="number" id="eg-cfg-kg" value="${cfg.kgIngreso||''}" placeholder="Ej: 335" min="0" step="1" style="width:80px;padding:4px 8px;border:1px solid var(--border);border-radius:6px">
    </div>
    <div style="display:flex;align-items:center;gap:6px;font-size:13px">
      <label>Precio compra $/kg:</label>
      <input type="number" id="eg-cfg-precio" value="${cfg.precioCompra||''}" placeholder="Ej: 4500" min="0" step="1" style="width:100px;padding:4px 8px;border:1px solid var(--border);border-radius:6px">
    </div>
    <div style="display:flex;align-items:center;gap:6px;font-size:13px">
      <label>Stock valorizado $/kg:</label>
      <input type="number" id="eg-cfg-stock" value="${cfg.precioStock||''}" placeholder="Ej: 6000" min="0" step="1" style="width:100px;padding:4px 8px;border:1px solid var(--border);border-radius:6px">
    </div>
    <button class="btn btn-secondary" id="eg-cfg-save" data-rodeo="${rodeoId}" style="padding:4px 14px;font-size:12px">✓ Guardar</button>
    ${ivStock>0?`<span style="font-size:13px;font-weight:700;color:var(--green-text)">Stock valorizado: ${fm(ivStock)}</span>`:''}
  </div>`;

  // KPIs principales
  h += `<div class="kpi-grid" style="margin-bottom:8px">
    <div class="kpi"><div class="kpi-icon">🛒</div><div class="kpi-label">Costo de compra</div><div class="kpi-val">${fm(cc)}</div><div class="kpi-sub">${fn(cantIng,0)} animales × ${fn(kgIngProm,0)} kg × ${cc>0?fm(cc/Math.max(kgI,1))+'/kg':'sin precio'}</div></div>
    <div class="kpi"><div class="kpi-icon">🌿</div><div class="kpi-label">Costo alim. acumulado</div><div class="kpi-val">${fm(ca)}</div><div class="kpi-sub">todos los insumos hasta hoy</div></div>
    <div class="kpi"><div class="kpi-icon">🌿</div><div class="kpi-label">Costo alim. hasta pesada</div><div class="kpi-val">${fm(caHP)}</div><div class="kpi-sub">${ultima?'hasta '+fd(ultima.fecha):'igual al total'}</div></div>
    <div class="kpi"><div class="kpi-icon">💲</div><div class="kpi-label">Costo total</div><div class="kpi-val">${fm(costoTotal)}</div><div class="kpi-sub">compra + alimentación</div></div>
    <div class="kpi"><div class="kpi-icon">💵</div><div class="kpi-label">Ingreso ventas</div><div class="kpi-val">${fm(iv)}</div><div class="kpi-sub">${fn(kgV,0)} kg vendidos</div></div>
  </div>
  <div class="kpi-grid" style="margin-bottom:8px">
    <div class="kpi"><div class="kpi-icon">🐄</div><div class="kpi-label">Stock valorizado</div><div class="kpi-val">${stkPrecio>0?fm(ivStock):'—'}</div><div class="kpi-sub">${fn(stk,0)} anim.${stkPrecio>0?' · '+fm(stkPrecio)+'/kg':' · ingresá precio arriba'}</div></div>
    <div class="kpi"><div class="kpi-icon">💰</div><div class="kpi-label">Ingresos totales</div><div class="kpi-val kpi-pos">${fm(ivTotal)}</div><div class="kpi-sub">ventas + stock valorizado</div></div>
    <div class="kpi"><div class="kpi-icon">${util>=0?'📈':'📉'}</div><div class="kpi-label">Utilidad</div><div class="kpi-val ${util>=0?'kpi-pos':'kpi-neg'}">${fm(util)}</div><div class="kpi-sub">${util>=0?'✓ Ganancia':'⚠ Pérdida'}</div></div>
    <div class="kpi"><div class="kpi-icon">🔢</div><div class="kpi-label">% Margen</div><div class="kpi-val ${util>=0?'kpi-pos':'kpi-neg'}">${ivTotal>0?egPct_(util,ivTotal):'—'}</div></div>
  </div>
  <div class="kpi-grid" style="margin-bottom:8px">
    <div class="kpi"><div class="kpi-icon">📥</div><div class="kpi-label">Kg ingresados</div><div class="kpi-val">${fn(kgI,0)}</div><div class="kpi-sub">${fn(cantIng,0)} anim. × ${fn(kgIngProm,0)} kg</div></div>
    <div class="kpi"><div class="kpi-icon">⚖️</div><div class="kpi-label">Kg vendidos</div><div class="kpi-val">${fn(kgV,0)}</div></div>
    <div class="kpi"><div class="kpi-icon">🐄</div><div class="kpi-label">Kg en stock (pesada)</div><div class="kpi-val">${fn(kgStk,0)}</div><div class="kpi-sub">${fn(stk,0)} anim. × ${ultima?fn(ultima.peso_prom_kg,0)+' kg':'prom. ingreso'}</div></div>
    <div class="kpi"><div class="kpi-icon">📊</div><div class="kpi-label">Kg ganados</div><div class="kpi-val kpi-pos">${fn(kgG,0)}</div><div class="kpi-sub">${ultima&&kgIngProm?fn(Number(ultima.peso_prom_kg)-kgIngProm,1)+' kg/animal':'sin pesadas'}</div></div>
    <div class="kpi"><div class="kpi-icon">📈</div><div class="kpi-label">GDP</div><div class="kpi-val kpi-pos">${ganDiaria!==null?fn(ganDiaria,3)+' kg/día':'—'}</div><div class="kpi-sub">${fi&&ultima?fd(fi)+' → '+fd(ultima.fecha):''}</div></div>
  </div>
  <div class="kpi-grid" style="margin-bottom:16px">
    <div class="kpi"><div class="kpi-icon">💹</div><div class="kpi-label">Precio venta prom.</div><div class="kpi-val">${precVentaProm?fm(precVentaProm):'—'}</div><div class="kpi-sub">por kg vendido</div></div>
    <div class="kpi"><div class="kpi-icon">🌾</div><div class="kpi-label">Alim. / kg ganado</div><div class="kpi-val">${caXkg?fm(caXkg):'—'}</div></div>
    <div class="kpi"><div class="kpi-icon">🛒</div><div class="kpi-label">Compra / kg ganado</div><div class="kpi-val">${ccXkg?fm(ccXkg):'—'}</div></div>
    <div class="kpi"><div class="kpi-icon">⚖️</div><div class="kpi-label">Break-even</div><div class="kpi-val ${breakEven&&precVentaProm&&precVentaProm<breakEven?'kpi-neg':''}">${breakEven?fm(breakEven):'—'}</div><div class="kpi-sub">precio mín. para recuperar costo</div></div>
    ${margenVsBE!==null?`<div class="kpi" style="border-top:2px solid ${margenVsBE>=0?'var(--green)':'var(--red)'}"><div class="kpi-icon">${margenVsBE>=0?'✅':'❌'}</div><div class="kpi-label">Precio vs break-even</div><div class="kpi-val ${margenVsBE>=0?'kpi-pos':'kpi-neg'}">${margenVsBE>=0?'+':''}${fm(margenVsBE)}/kg</div></div>`:''}
  </div>`;

  // Tabla de costos por alimento
  const productos = (S.catalogs && S.catalogs.productos) || [];
  const consumosCrl = egConsumos_(rodeoId);
  const prodIds = [...new Set(consumosCrl.map(c => c.producto_id))];
  if (prodIds.length) {
    h += '<div class="section-label">Detalle de costos por insumo</div>';
    h += '<div class="tw"><table class="dt"><thead><tr><th>Insumo</th><th class="tc">Cantidad</th><th class="tc">Costo total</th><th class="tc">Costo hasta pesada</th><th class="tc">$/kg ganado</th></tr></thead><tbody>';
    prodIds.forEach(pid => {
      const prod = productos.find(p => String(p.producto_id) === String(pid));
      const cUnit = egCostoPromProducto_(pid);
      const cant = consumosCrl.filter(c => String(c.producto_id)===String(pid)).reduce((s,c)=>s+(Number(c.cantidad)||0),0);
      const costoTot = cant * cUnit;
      const costoHP = egConsumos_(rodeoId, ultima?.fecha).filter(c=>String(c.producto_id)===String(pid)).reduce((s,c)=>s+(Number(c.cantidad)||0)*cUnit,0);
      h += `<tr><td>${prod?.nombre||'Producto '+pid}</td><td class="tc">${fn(cant)} ${prod?.unidad||''}</td><td class="tc">${fm(costoTot)}</td><td class="tc">${fm(costoHP)}</td><td class="tc">${kgG>0?fm(costoHP/kgG):'—'}</td></tr>`;
    });
    h += `<tr class="total-row"><td><strong>Total</strong></td><td class="tc">—</td><td class="tc"><strong>${fm(ca)}</strong></td><td class="tc"><strong>${fm(caHP)}</strong></td><td class="tc"><strong>${kgG>0?fm(caHP/kgG):'—'}</strong></td></tr>`;
    h += '</tbody></table></div>';
  }
  return h;
}

function buildEngordeComparacion_(rodeosEng, fm) {
  if (!rodeosEng.length) return '<div class="empty-state"><span class="ico">◌</span><div class="msg">No hay corrales de Engorde.</div></div>';
  const rows = rodeosEng.map(r => {
    const rid = r.rodeo_id;
    const stk = egStock_(rid);
    const cantIng = egCantIngresada_(rid);
    const kgI = egKgIngresados_(rid);
    const kgV = egKgVend_(rid);
    const kgG = egKgGanadosHastaPesada_(rid);
    const kgStk = egKgStockEstimado_(rid);
    const ca = egCostoAlim_(rid);
    const cc = egCostoCompra_(rid);
    const iv = egIngVentas_(rid);
    const fi = egFechaIngreso_(rid);
    const pes = egPesadas_(rid);
    const ultima = pes.length ? pes[pes.length-1] : null;
    const gd = egGanDiaria_(rid);
    const kgIng = egKgIngreso_(rid);
    const caXkg = kgG > 0 ? egCostoAlim_(rid, ultima?.fecha) / kgG : null;
    const ccXkg = kgG > 0 ? cc / kgG : null;
    const cfg = egConfig_(rid);
    const stkP = Number(cfg.precioStock||0);
    const ivStock = stkP>0&&ultima ? stk*Number(ultima.peso_prom_kg)*stkP : 0;
    const util = iv + ivStock - ca - cc;
    const dias = fi ? Math.round((new Date()-new Date(fi))/86400000) : null;
    return { r, rid, stk, cantIng, kgI, kgV, kgG, kgStk, ca, cc, iv, ivStock, util, gd, caXkg, ccXkg, dias, kgIng, ultima };
  });

  const best = (fn, low=false) => { const vs=rows.map(fn).filter(v=>v!==null&&v>0); if(!vs.length)return null; return low?Math.min(...vs):Math.max(...vs); };
  const tag = (v, b, low=false) => (v!==null&&b!==null&&v===b)?` style="color:var(--green);font-weight:700"`:'' ;
  const bGd = best(r=>r.gd); const bKgG=best(r=>r.kgG); const bUtil=best(r=>r.util); const bCaXkg=best(r=>r.caXkg,true);

  let h = '<div class="tw"><table class="dt"><thead><tr><th>Indicador</th>' + rows.map(r=>`<th class="tc">${r.r.nombre}</th>`).join('') + '</tr></thead><tbody>';
  const row = (lbl, fn, fmt) => `<tr><td>${lbl}</td>${rows.map(r=>{const v=fn(r);return`<td class="tc">${v!==null&&v!==undefined?fmt(v):'—'}</td>`;}).join('')}</tr>`;
  const rowTag = (lbl, fn, fmt, best, low=false) => `<tr><td>${lbl}</td>${rows.map(r=>{const v=fn(r);return`<td class="tc"${tag(v,best,low)}>${v!==null&&v>0?fmt(v):'—'}</td>`;}).join('')}</tr>`;

  h += `<tr class="total-row"><td colspan="${rows.length+1}"><strong>📦 Stock y movimiento</strong></td></tr>`;
  h += row('Animales ingresados', r=>r.cantIng, v=>fn(v,0));
  h += row('Stock actual', r=>r.stk, v=>fn(v,0)+' cab.');
  h += row('Días en corral', r=>r.dias, v=>v+' días');
  h += row('Kg prom. entrada', r=>r.kgIng, v=>fn(v,0)+' kg');
  h += row('Kg prom. última pesada', r=>r.ultima?Number(r.ultima.peso_prom_kg):null, v=>fn(v,0)+' kg');
  h += `<tr class="total-row"><td colspan="${rows.length+1}"><strong>⚖️ Kilos</strong></td></tr>`;
  h += row('Kg ingresados', r=>r.kgI, v=>fn(v,0)+' kg');
  h += row('Kg vendidos', r=>r.kgV, v=>fn(v,0)+' kg');
  h += row('Kg en stock', r=>r.kgStk, v=>fn(v,0)+' kg');
  h += rowTag('Kg ganados', r=>r.kgG, v=>fn(v,0)+' kg', bKgG);
  h += rowTag('GDP', r=>r.gd, v=>fn(v,3)+' kg/día', bGd);
  h += `<tr class="total-row"><td colspan="${rows.length+1}"><strong>💲 Costos</strong></td></tr>`;
  h += row('Costo de compra', r=>r.cc, fm);
  h += row('Costo alimentación', r=>r.ca, fm);
  h += row('Costo total', r=>r.ca+r.cc, fm);
  h += rowTag('Alim. / kg ganado', r=>r.caXkg, fm, bCaXkg, true);
  h += rowTag('Compra / kg ganado', r=>r.ccXkg, fm, best(r=>r.ccXkg,true), true);
  h += `<tr class="total-row"><td colspan="${rows.length+1}"><strong>💰 Resultados</strong></td></tr>`;
  h += row('Ingreso ventas', r=>r.iv, fm);
  h += row('Stock valorizado', r=>r.ivStock>0?r.ivStock:null, fm);
  h += rowTag('Utilidad', r=>r.util, fm, bUtil);
  h += '</tbody></table></div>';
  h += `<div style="font-size:11px;color:var(--muted);margin-top:6px">Los valores en <span style="color:var(--green);font-weight:700">verde</span> indican el mejor resultado del indicador entre corrales.</div>`;
  return h;
}

function buildEngordeProyeccion_(rodeoId, fm) {
  const rodeosEng = rodeosTodos().filter(r => r.actividad === 'Engorde');
  let h = '';
  (rodeoId ? [rodeosTodos().find(r=>String(r.rodeo_id)===String(rodeoId))] : rodeosEng).filter(Boolean).forEach(r => {
    const rid = r.rodeo_id;
    const cfg = egConfig_(rid);
    const stk = egStock_(rid);
    const pes = egPesadas_(rid);
    const ultima = pes.length ? pes[pes.length-1] : null;
    const fi = egFechaIngreso_(rid);
    const dias = fi ? Math.round((new Date()-new Date(fi))/86400000) : null;
    const pesoObj = Number(cfg.pesoObjetivo || 520);
    const precioP = Number(cfg.precioProyectado || 0);
    const kgActual = ultima ? Number(ultima.peso_prom_kg) : null;
    const gd = egGanDiaria_(rid);
    const yaAlcanzo = kgActual !== null && kgActual >= pesoObj;
    const diasRest = !yaAlcanzo && gd && gd>0 && kgActual!==null ? Math.ceil((pesoObj-kgActual)/gd) : null;
    const fechaSalida = diasRest!==null&&ultima ? (() => { const d=new Date(ultima.fecha); d.setDate(d.getDate()+diasRest); return d.toISOString().slice(0,10); })() : null;
    const border = yaAlcanzo?'var(--green)':(fechaSalida?'var(--blue-text)':'var(--border)');

    h += `<div class="panel" style="border-left:4px solid ${border};margin-bottom:12px">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px">
        <div><div style="font-weight:700;font-size:15px">${r.nombre}</div><div style="font-size:12px;color:var(--muted)">${fn(stk,0)} animales${dias!==null?' · '+dias+' días':''}</div></div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px">
          <label>Peso objetivo (kg):</label>
          <input type="number" id="eg-proj-peso-${rid}" value="${pesoObj}" min="1" step="1" style="width:80px;padding:4px 8px;border:1px solid var(--border);border-radius:6px">
          <label>Precio estimado $/kg:</label>
          <input type="number" id="eg-proj-precio-${rid}" value="${precioP||''}" placeholder="$ / kg" min="0" step="1" style="width:100px;padding:4px 8px;border:1px solid var(--border);border-radius:6px">
          <button class="btn btn-secondary" id="eg-proj-save-${rid}" data-rodeo="${rid}" style="padding:4px 12px;font-size:12px">✓</button>
        </div>
      </div>`;
    if (!ultima) {
      h += `<div class="empty-state">Sin pesadas. Registrá al menos una para calcular la proyección.</div>`;
    } else if (yaAlcanzo) {
      h += `<div style="background:var(--green-bg);border-radius:8px;padding:12px;margin-bottom:10px"><div style="font-weight:700;color:var(--green-text)">✅ Peso objetivo alcanzado — ${fn(kgActual,1)} kg</div></div>
      <div class="kpi-grid">
        <div class="kpi"><div class="kpi-label">Kg totales a vender</div><div class="kpi-val">${fn(stk*kgActual,0)} kg</div><div class="kpi-sub">${fn(stk,0)} × ${fn(kgActual,1)} kg</div></div>
        ${precioP>0?`<div class="kpi"><div class="kpi-label">Ingreso proyectado</div><div class="kpi-val kpi-pos">${fm(stk*kgActual*precioP)}</div></div>`:''}
      </div>`;
    } else if (fechaSalida) {
      h += `<div class="kpi-grid">
        <div class="kpi"><div class="kpi-icon">📅</div><div class="kpi-label">Fecha estimada de salida</div><div class="kpi-val kpi-pos" style="font-size:18px">${fd(fechaSalida)}</div><div class="kpi-sub">en ${diasRest} días</div></div>
        <div class="kpi"><div class="kpi-icon">⚖️</div><div class="kpi-label">Peso actual → objetivo</div><div class="kpi-val">${fn(kgActual,1)} → ${fn(pesoObj,0)} kg</div><div class="kpi-sub">faltan ${fn(pesoObj-kgActual,1)} kg/animal</div></div>
        <div class="kpi"><div class="kpi-icon">📈</div><div class="kpi-label">GDP</div><div class="kpi-val">${fn(gd,3)} kg/día</div></div>
        <div class="kpi"><div class="kpi-icon">🐄</div><div class="kpi-label">Kg totales al vender</div><div class="kpi-val">${fn(stk*pesoObj,0)} kg</div></div>
        ${precioP>0?`<div class="kpi"><div class="kpi-icon">💵</div><div class="kpi-label">Ingreso proyectado</div><div class="kpi-val kpi-pos">${fm(stk*pesoObj*precioP)}</div></div>`:''}
      </div>`;
    } else {
      h += `<div class="empty-state">No se puede proyectar. Necesitás al menos una pesada y un GDP positivo.</div>`;
    }
    h += '</div>';
  });
  return h;
}

function buildEngordeCierre_(rodeoId, fm) {
  const rodeosEng = rodeosTodos().filter(r => r.actividad === 'Engorde');
  const lista = rodeoId ? [rodeosTodos().find(r=>String(r.rodeo_id)===String(rodeoId))].filter(Boolean) : rodeosEng;
  let h = '';
  lista.forEach(r => {
    const rid = r.rodeo_id;
    const stk = egStock_(rid);
    const cfg = egConfig_(rid);
    const pesoObj = Number(cfg.pesoObjetivo||520);
    const pes = egPesadas_(rid);
    const ultima = pes.length ? pes[pes.length-1] : null;
    const gd = egGanDiaria_(rid);
    const kgActual = ultima ? Number(ultima.peso_prom_kg) : null;
    // Fecha salida
    let fSalida = null;
    if (kgActual && gd && gd>0 && kgActual<pesoObj) {
      const diasR = Math.ceil((pesoObj-kgActual)/gd);
      const d = new Date(ultima.fecha); d.setDate(d.getDate()+diasR);
      fSalida = d.toISOString().slice(0,10);
    }
    const hoy = today();
    const diasHastaSalida = fSalida ? Math.max(0, Math.round((new Date(fSalida)-new Date(hoy))/86400000)) : null;
    const caAcum = egCostoAlim_(rid);
    const cc = egCostoCompra_(rid);
    const hace30 = new Date(hoy); hace30.setDate(hace30.getDate()-30);
    const f30 = hace30.toISOString().slice(0,10);
    const cons30 = egConsumos_(rid).filter(c => c.fecha >= f30);
    const costo30 = cons30.reduce((s,c) => s+(Number(c.cantidad)||0)*egCostoPromProducto_(c.producto_id), 0);
    const costoDiario = costo30 / 30;
    const costoProyect = diasHastaSalida !== null ? Math.round(costoDiario * diasHastaSalida) : null;
    const costoTotalCierre = costoProyect !== null ? caAcum + costoProyect : null;
    const costoFinal = costoTotalCierre !== null ? cc + costoTotalCierre : null;
    const stkP = Number(cfg.precioStock||0);
    const ivProyect = stkP>0 ? stk*pesoObj*stkP : null;
    const ivVentas = egIngVentas_(rid);
    const ivTotal = ivProyect!==null ? ivVentas+ivProyect : null;
    const utilProyect = ivTotal!==null&&costoFinal!==null ? ivTotal-costoFinal : null;
    const border = utilProyect!==null?(utilProyect>=0?'var(--green)':'var(--red)'):'var(--border)';

    h += `<div class="panel" style="border-left:4px solid ${border};margin-bottom:12px">
      <div style="font-weight:700;font-size:15px;margin-bottom:4px">${r.nombre}</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:12px">Salida proyectada: <strong>${fSalida?fd(fSalida):'sin datos'}</strong>${diasHastaSalida!==null?' ('+diasHastaSalida+' días)':''}</div>`;
    if (diasHastaSalida===null) {
      h += '<div class="empty-state">Sin proyección disponible. Necesitás pesadas registradas.</div>';
    } else {
      h += `<div class="kpi-grid" style="margin-bottom:8px">
        <div class="kpi"><div class="kpi-icon">🌿</div><div class="kpi-label">Alim. acumulada</div><div class="kpi-val">${fm(caAcum)}</div></div>
        <div class="kpi"><div class="kpi-icon">📅</div><div class="kpi-label">Costo diario (30d)</div><div class="kpi-val">${fm(costoDiario)}</div></div>
        <div class="kpi"><div class="kpi-icon">🔮</div><div class="kpi-label">Alim. proyectada</div><div class="kpi-val">${fm(costoProyect)}</div><div class="kpi-sub">${diasHastaSalida} días × ${fm(costoDiario)}/día</div></div>
        <div class="kpi"><div class="kpi-icon">💲</div><div class="kpi-label">Total alim. al cierre</div><div class="kpi-val">${fm(costoTotalCierre)}</div></div>
        <div class="kpi"><div class="kpi-icon">🛒</div><div class="kpi-label">Costo compra</div><div class="kpi-val">${fm(cc)}</div></div>
        <div class="kpi"><div class="kpi-icon">💲</div><div class="kpi-label">Costo total al cierre</div><div class="kpi-val">${fm(costoFinal)}</div></div>
        ${ivProyect!==null?`<div class="kpi"><div class="kpi-icon">💵</div><div class="kpi-label">Ingreso proyectado</div><div class="kpi-val">${fm(ivProyect)}</div><div class="kpi-sub">${fn(stk,0)} × ${fn(pesoObj,0)} kg × ${fm(stkP)}/kg</div></div>`:''}
        ${utilProyect!==null?`<div class="kpi"><div class="kpi-icon">${utilProyect>=0?'📈':'📉'}</div><div class="kpi-label">Utilidad proyectada</div><div class="kpi-val ${utilProyect>=0?'kpi-pos':'kpi-neg'}">${fm(utilProyect)}</div></div>`:''}
      </div>`;
    }
    h += '</div>';
  });
  return h;
}

function buildEngordeHistorial_(rodeosEng, fm) {
  const lotes = egLotes_().sort((a, b) => String(b.fechaCierre).localeCompare(String(a.fechaCierre)));
  // Detectar corrales en 0 que no tienen lote cerrado hoy
  const cerrados = rodeosEng.filter(r => {
    const stk = egStock_(r.rodeo_id);
    const yaGuardado = lotes.some(l => l.rodeoId===String(r.rodeo_id) && l.fechaCierre===today());
    return stk===0 && egCantIngresada_(r.rodeo_id)>0 && !yaGuardado;
  });
  let h = '';
  cerrados.forEach(r => {
    h += `<div style="background:var(--blue-bg);border-radius:8px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px">
      <div><div style="font-size:13px;font-weight:600;color:var(--blue-text)">${r.nombre} — lote completado</div>
      <div style="font-size:12px;color:var(--blue-text)">Stock en 0. Podés guardar este lote en el historial.</div></div>
      <button class="btn btn-primary" id="eg-cerrar-${r.rodeo_id}" data-rodeo="${r.rodeo_id}" style="font-size:12px;padding:6px 14px">📋 Guardar en historial</button>
    </div>`;
  });
  if (!lotes.length) {
    h += '<div class="empty-state"><span class="ico">📋</span><div class="msg">No hay lotes cerrados. Cuando un corral llegue a stock 0 podés guardarlo acá.</div></div>';
    return h;
  }
  h += '<div class="tw"><table class="dt"><thead><tr><th>Corral</th><th class="tc">Apertura</th><th class="tc">Cierre</th><th class="tc">Días</th><th class="tc">Animales</th><th class="tc">Kg ganados</th><th class="tc">GDP</th><th class="tc">Costo alim.</th><th class="tc">Ingreso</th><th class="tc">Utilidad</th><th></th></tr></thead><tbody>';
  lotes.forEach(l => {
    const dias = Math.round((new Date(l.fechaCierre)-new Date(l.fechaApertura))/86400000);
    const util = l.ingVentas - l.costoCompra - l.costoAlim;
    h += `<tr>
      <td><strong>${l.nombre}</strong></td>
      <td class="tc">${fd(l.fechaApertura)}</td>
      <td class="tc">${fd(l.fechaCierre)}</td>
      <td class="tc">${dias} días</td>
      <td class="tc">${fn(l.animales,0)} cab.</td>
      <td class="tc">${fn(l.kgGanados,0)} kg</td>
      <td class="tc">${l.ganDiaria?fn(l.ganDiaria,3)+' kg/día':'—'}</td>
      <td class="tc">${fm(l.costoAlim)}</td>
      <td class="tc">${fm(l.ingVentas)}</td>
      <td class="tc" style="font-weight:700;color:${util>=0?'var(--green-text)':'var(--clay-text)'}">${fm(util)}</td>
      <td><button class="btn-del" data-del-lote="${l.id}">🗑</button></td>
    </tr>`;
  });
  h += '</tbody></table></div>';
  if (lotes.length>1) {
    const promGD = lotes.filter(l=>l.ganDiaria).reduce((s,l)=>s+l.ganDiaria,0)/lotes.filter(l=>l.ganDiaria).length;
    const promUtil = lotes.reduce((s,l)=>s+(l.ingVentas-l.costoCompra-l.costoAlim),0)/lotes.length;
    h += `<div class="section-label" style="margin-top:16px">Promedios históricos (${lotes.length} lotes)</div>
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-icon">📈</div><div class="kpi-label">GDP prom.</div><div class="kpi-val">${fn(promGD,3)} kg/día</div></div>
      <div class="kpi"><div class="kpi-icon">${promUtil>=0?'📈':'📉'}</div><div class="kpi-label">Utilidad prom./lote</div><div class="kpi-val ${promUtil>=0?'kpi-pos':'kpi-neg'}">${fm(promUtil)}</div></div>
    </div>`;
  }
  return h;
}

function attachEngordeEvents() {
  // Pesada
  const peSave = document.getElementById('eg-pe-save');
  if (peSave) peSave.onclick = async () => {
    const fecha = document.getElementById('eg-pe-fecha').value;
    const rodeoId = document.getElementById('eg-pe-rodeo').value;
    const cantidad = Number(document.getElementById('eg-pe-cantidad').value)||0;
    const peso = Number(document.getElementById('eg-pe-peso').value)||0;
    if (!fecha||!rodeoId||!cantidad||!peso) { toast('Completá todos los campos.','err'); return; }
    const rodeo = rodeosTodos().find(r=>String(r.rodeo_id)===String(rodeoId));
    peSave.disabled = true;
    try {
      await apiCall('create', { body: { entity:'pesadas', data:{ fecha, rodeo_id:rodeoId, campo_id:rodeo?.campo_id||'', cantidad, peso_prom_kg:peso, observacion:document.getElementById('eg-pe-obs').value.trim() }}});
      invalidateCache('pesadas'); await loadEntity('pesadas',true);
      toast('Pesada registrada — '+fn(peso)+' kg prom.','ok'); render();
    } catch(err) { toast(err.message,'err'); } finally { peSave.disabled=false; }
  };

  // Config corral (Costos)
  const cfgSave = document.getElementById('eg-cfg-save');
  if (cfgSave) cfgSave.onclick = () => {
    const rid = cfgSave.dataset.rodeo;
    egSaveConfig_(rid, {
      kgIngreso: document.getElementById('eg-cfg-kg')?.value||'',
      precioCompra: document.getElementById('eg-cfg-precio')?.value||'',
      precioStock: document.getElementById('eg-cfg-stock')?.value||'',
    });
    toast('Configuración guardada','ok'); render();
  };

  // Proyección — guardar peso objetivo y precio
  document.querySelectorAll('[id^="eg-proj-save-"]').forEach(btn => {
    btn.onclick = () => {
      const rid = btn.dataset.rodeo;
      egSaveConfig_(rid, {
        pesoObjetivo: document.getElementById('eg-proj-peso-'+rid)?.value||'',
        precioProyectado: document.getElementById('eg-proj-precio-'+rid)?.value||'',
      });
      toast('Guardado','ok'); render();
    };
  });

  // Cerrar lote (historial)
  document.querySelectorAll('[id^="eg-cerrar-"]').forEach(btn => {
    btn.onclick = () => {
      const rid = btn.dataset.rodeo;
      const r = rodeosTodos().find(x=>String(x.rodeo_id)===String(rid));
      if (!r) return;
      const fi = egFechaIngreso_(rid);
      const pes = egPesadas_(rid);
      const kgG = egKgGanadosHastaPesada_(rid);
      const gd = egGanDiaria_(rid);
      const lote = {
        id: Date.now().toString(36), rodeoId: String(rid), nombre: r.nombre,
        fechaApertura: fi||today(), fechaCierre: today(),
        animales: egCantIngresada_(rid), kgGanados: kgG, ganDiaria: gd,
        costoAlim: egCostoAlim_(rid), costoCompra: egCostoCompra_(rid),
        ingVentas: egIngVentas_(rid),
      };
      const lotes = egLotes_(); lotes.push(lote); egSaveLotes_(lotes);
      toast('Lote guardado en historial','ok'); render();
    };
  });

  // Eliminar lote
  document.querySelectorAll('[data-del-lote]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.delLote;
      if (!confirm('¿Eliminar este lote del historial?')) return;
      const lotes = egLotes_().filter(l=>l.id!==id); egSaveLotes_(lotes);
      toast('Lote eliminado','ok'); render();
    };
  });

  attachTableDeleteEvents('pesadas','pesada_id');
}

function actividadDeRodeo_(rodeoId) {
  const r = rodeosTodos().find(r => String(r.rodeo_id) === String(rodeoId));
  return r ? (r.actividad || 'Cría') : 'Cría';
}

  return h;

function attachVentasEvents() {
  window.actualizarImporteVenta_ = function() {
    const peso = Number(document.getElementById('ve-peso')?.value) || 0;
    const precio = Number(document.getElementById('ve-precio')?.value) || 0;
    const wrap = document.getElementById('ve-importe-preview');
    const val = document.getElementById('ve-importe-val');
    if (!wrap || !val) return;
    if (peso && precio) { wrap.style.display = 'flex'; val.textContent = '$ ' + fn(peso * precio); }
    else wrap.style.display = 'none';
  };

  window.abrirLiquidacion_ = function(id) {
    S._liquidandoId = id;
    const modal = document.getElementById('modal-liquidacion');
    if (modal) modal.style.display = 'flex';
    document.getElementById('liq-tipo').onchange = () => {
      const esFrigo = document.getElementById('liq-tipo').value === 'frigorifico';
      document.getElementById('liq-rinde-wrap').style.display = esFrigo ? 'flex' : 'none';
    };
    calcLiqPreview_();
    document.getElementById('liq-save').onclick = guardarLiquidacion_;
  };

  window.cerrarLiquidacion_ = function() {
    const modal = document.getElementById('modal-liquidacion');
    if (modal) modal.style.display = 'none';
    S._liquidandoId = null;
  };

  window.calcLiqPreview_ = function() {
    const kg = Number(document.getElementById('liq-kg')?.value) || 0;
    const precio = Number(document.getElementById('liq-precio')?.value) || 0;
    const prev = document.getElementById('liq-preview');
    const impEl = document.getElementById('liq-importe');
    if (kg && precio) {
      const imp = Math.round(kg * precio);
      if (impEl && !impEl.value) impEl.value = imp;
      if (prev) prev.textContent = fn(kg) + ' kg × $ ' + fn(precio) + '/kg = $ ' + fn(imp);
    }
  };

  window.guardarLiquidacion_ = async function() {
    const id = S._liquidandoId;
    if (!id) return;
    const tipo = document.getElementById('liq-tipo').value;
    const kg = Number(document.getElementById('liq-kg').value) || 0;
    const rinde = Number(document.getElementById('liq-rinde')?.value) || 0;
    const precio = Number(document.getElementById('liq-precio').value) || 0;
    const importe = Number(document.getElementById('liq-importe').value) || (kg * precio);
    if (!kg || !precio) { toast('Completá kg y precio de liquidación.', 'err'); return; }
    const venta = (S.cache.ventas || []).find(v => String(v.venta_id) === String(id));
    if (!venta) { toast('Venta no encontrada.', 'err'); return; }
    const data = { ...venta, tipo_liquidacion: tipo, kg_liquidados: kg, rinde_pct: rinde, precio_liq: precio, importe_liq: importe, estado: 'liquidado' };
    try {
      document.getElementById('liq-save').disabled = true;
      await apiCall('update', { body: { entity: 'ventas', id, data } });
      invalidateCache('ventas'); S.margenBruto = null;
      await loadEntity('ventas', true);
      cerrarLiquidacion_();
      toast('Liquidación registrada — $ ' + fn(importe), 'ok');
      render();
    } catch (err) { toast(err.message, 'err'); document.getElementById('liq-save').disabled = false; }
  };

  const save = document.getElementById('ve-save');
  if (save) save.onclick = async () => {
    const peso = Number(document.getElementById('ve-peso').value) || '';
    const precio = Number(document.getElementById('ve-precio').value) || '';
    const data = {
      fecha_salida: document.getElementById('ve-fecha').value,
      rodeo_id: document.getElementById('ve-rodeo').value,
      campo_id: document.getElementById('ve-campo').value,
      comprador: document.getElementById('ve-comprador').value.trim(),
      tipo_venta: 'Venta real',
      cant_animales: Number(document.getElementById('ve-cantidad').value) || 0,
      peso_campo_kg: peso,
      precio_pactado: precio,
      observaciones: document.getElementById('ve-obs').value.trim(),
    };
    if (!data.fecha_salida || !data.rodeo_id || !data.cant_animales) { toast('Completá fecha, rodeo y cantidad.', 'err'); return; }
    save.disabled = true;
    try {
      await apiCall('create', { body: { entity: 'ventas', data } });
      invalidateCache('ventas');
      S.stock = null; S.dashboard = null; S.margenBruto = null;
      toast('Venta registrada — ' + data.cant_animales + ' animales', 'ok');
      await loadEntity('ventas', true);
      render();
    } catch (err) { toast(err.message, 'err'); } finally { save.disabled = false; }
  };
  attachTableDeleteEvents('ventas', 'venta_id');
}

function buildInsumosHistorial_(compras, consumos, productoFiltro, categoriaFiltro, desde, hasta) {
  const productosMap = {};
  ((S.catalogs && S.catalogs.productos) || []).forEach(p => { productosMap[p.producto_id] = p; });

  let comprasF = compras || [];
  let consumosF = consumos || [];
  if (productoFiltro) {
    comprasF = comprasF.filter(c => String(c.producto_id) === String(productoFiltro));
    consumosF = consumosF.filter(c => String(c.producto_id) === String(productoFiltro));
  }
  if (categoriaFiltro) {
    comprasF = comprasF.filter(c => (productosMap[c.producto_id] || {}).categoria === categoriaFiltro);
    consumosF = consumosF.filter(c => (productosMap[c.producto_id] || {}).categoria === categoriaFiltro);
  }
  if (desde) { comprasF = comprasF.filter(c => String(c.fecha || '') >= desde); consumosF = consumosF.filter(c => String(c.fecha || '') >= desde); }
  if (hasta) { comprasF = comprasF.filter(c => String(c.fecha || '') <= hasta); consumosF = consumosF.filter(c => String(c.fecha || '') <= hasta); }

  let filas = [
    ...comprasF.map(c => {
      const p = productosMap[c.producto_id] || {};
      const detalle = [c.costo_total ? 'Costo: ' + fn(c.costo_total) : '', c.proveedor ? 'Prov: ' + c.proveedor : '', c.observaciones || ''].filter(Boolean).join(' — ') || '—';
      return {
        fecha: c.fecha || '', tipoLabel: 'Compra', tipoClass: 'pill-green',
        producto: p.nombre || '(producto eliminado)', campo: '—', rodeo: '—',
        cantidad: Number(c.cantidad) || 0, unidad: p.unidad || '', detalle,
        entity: 'compras_insumos', idCol: 'compra_id', id: c.compra_id,
      };
    }),
    ...consumosF.map(c => {
      const p = productosMap[c.producto_id] || {};
      const detalle = (c.campana ? '<span class="pill pill-gold" style="margin-right:6px">' + c.campana + '</span>' : '') + (c.observaciones || (c.campana ? '' : '—'));
      return {
        fecha: c.fecha || '', tipoLabel: 'Consumo', tipoClass: 'pill-clay',
        producto: p.nombre || '(producto eliminado)',
        campo: c.campo_id ? campoNombre(c.campo_id) : '—', rodeo: c.rodeo_id ? rodeoNombre(c.rodeo_id) : '—',
        cantidad: Number(c.cantidad) || 0, unidad: p.unidad || '', detalle: detalle || '—',
        entity: 'consumos_insumos', idCol: 'consumo_id', id: c.consumo_id,
      };
    }),
  ];

  if (!filas.length) {
    return '<div class="empty-state"><span class="ico">◌</span><div class="msg">Todavía no hay registros. Cargá el primero arriba.</div></div>';
  }

  if (!S.sort) S.sort = {};
  const sortState = S.sort.historialInsumos || { key: 'fecha', dir: 'desc' };
  filas = [...filas].sort((a, b) => {
    let va = a[sortState.key], vb = b[sortState.key];
    if (va == null) va = ''; if (vb == null) vb = '';
    const na = Number(va), nb = Number(vb);
    const numeric = va !== '' && vb !== '' && !isNaN(na) && !isNaN(nb);
    const cmp = numeric ? (na - nb) : String(va).localeCompare(String(vb), 'es', { sensitivity: 'base' });
    return sortState.dir === 'asc' ? cmp : -cmp;
  });

  const cols = [
    { key: 'fecha', label: 'Fecha' }, { key: 'tipoLabel', label: 'Tipo' }, { key: 'producto', label: 'Producto' },
    { key: 'campo', label: 'Campo' }, { key: 'rodeo', label: 'Rodeo' }, { key: 'cantidad', label: 'Cantidad' }, { key: 'detalle', label: 'Detalle' },
  ];
  let h = `<div class="section-label">Historial <span class="count-badge" style="margin-left:6px">${filas.length}</span></div>
  <div class="tw"><table class="dt"><thead><tr>`;
  cols.forEach(c => {
    const activo = sortState.key === c.key;
    const flecha = activo ? (sortState.dir === 'asc' ? ' ▲' : ' ▼') : '';
    h += `<th class="sortable-th" onclick="sortHistorialInsumos('${c.key}')" style="cursor:pointer;user-select:none" title="Ordenar por ${c.label}">${c.label}${flecha}</th>`;
  });
  h += '<th></th></tr></thead><tbody>';
  filas.forEach(f => {
    h += `<tr>
      <td>${fd(f.fecha)}</td>
      <td><span class="pill ${f.tipoClass}">${f.tipoLabel}</span></td>
      <td>${f.producto}</td>
      <td>${f.campo}</td>
      <td>${f.rodeo}</td>
      <td>${fn(f.cantidad)} ${f.unidad}</td>
      <td>${f.detalle}</td>
      <td><div class="row-actions">
        <button class="icon-btn" data-edit="${f.id}" data-entity="${f.entity}" data-idcol="${f.idCol}" title="Editar">✎</button>
        <button class="icon-btn danger" data-del="${f.id}" data-entity="${f.entity}" data-idcol="${f.idCol}" title="Eliminar">✕</button>
      </div></td>
    </tr>`;
  });
  h += '</tbody></table></div>';
  return h;
}
window.sortHistorialInsumos = function(key) {
  if (!S.sort) S.sort = {};
  const current = S.sort.historialInsumos;
  if (current && current.key === key) { current.dir = current.dir === 'asc' ? 'desc' : 'asc'; }
  else { S.sort.historialInsumos = { key, dir: 'asc' }; }
  window.renderInsumosHistorialFiltrado ? window.renderInsumosHistorialFiltrado() : render();
};
function buildStockSeleccionado_(productoFiltro, campoFiltro) {
  if (!productoFiltro) return '';
  const row = (S.stockProductos || []).find(p => String(p.producto_id) === String(productoFiltro));
  if (!row) return '';
  const colores = row.categoria === 'Veterinaria' ? ['var(--blue-bg)', 'var(--blue-text)']
    : row.categoria === 'Reproducción' ? ['var(--gold-bg)', 'var(--gold-text)']
    : ['var(--green-bg)', 'var(--green-text)'];
  let stockLabel;
  if (esPorCampo_(row.por_campo)) {
    if (campoFiltro && row.stock_por_campo) {
      const cant = row.stock_por_campo[campoFiltro] || 0;
      stockLabel = `${fn(cant)} ${row.unidad || ''} en ${campoNombre(campoFiltro)}`;
    } else {
      // Mostrar todos los campos
      const partes = Object.entries(row.stock_por_campo || {}).map(([cid, cant]) => `${campoNombre(cid)}: ${fn(cant)}`).join(' · ');
      stockLabel = (partes || '0') + ' ' + (row.unidad || '');
    }
  } else {
    stockLabel = `${fn(row.stock)} ${row.unidad || ''}`;
  }
  return `<div style="background:${colores[0]};color:${colores[1]};border-radius:9px;padding:10px 16px;font-size:16px;font-weight:700;display:inline-block;margin-bottom:12px">Stock actual de ${row.nombre}: ${stockLabel}</div>`;
}
function buildInsumosKardex_(compras, consumos, productoId, desde, hasta, campoFiltro) {
  const p = ((S.catalogs && S.catalogs.productos) || []).find(x => String(x.producto_id) === String(productoId));
  if (!p) return '';
  const porCampo = esPorCampo_(p.por_campo);

  let comprasP = (compras || []).filter(c => String(c.producto_id) === String(productoId));
  let consumosP = (consumos || []).filter(c => String(c.producto_id) === String(productoId));

  // Si el producto es por campo y hay filtro de campo, restringir ambas listas
  if (porCampo && campoFiltro) {
    comprasP = comprasP.filter(c => String(c.campo_id) === String(campoFiltro));
    consumosP = consumosP.filter(c => String(c.campo_id) === String(campoFiltro));
  }

  // Saldo inicial: resultado de todo lo anterior a la fecha "Desde" (si no hay fecha "Desde", arranca en 0 desde el principio de todo)
  let saldoInicial = 0;
  if (desde) {
    comprasP.forEach(c => { if (String(c.fecha || '') < desde) saldoInicial += Number(c.cantidad) || 0; });
    consumosP.forEach(c => { if (String(c.fecha || '') < desde) saldoInicial -= Number(c.cantidad) || 0; });
  }

  let movs = [
    ...comprasP.map(c => ({
      fecha: c.fecha || '', tipoLabel: 'Compra', tipoClass: 'pill-green', entrada: Number(c.cantidad) || 0, salida: 0,
      detalle: [c.costo_total ? 'Costo: ' + fn(c.costo_total) : '', c.proveedor ? 'Prov: ' + c.proveedor : '', c.observaciones || ''].filter(Boolean).join(' — ') || '—',
      entity: 'compras_insumos', idCol: 'compra_id', id: c.compra_id,
    })),
    ...consumosP.map(c => ({
      fecha: c.fecha || '', tipoLabel: 'Consumo', tipoClass: 'pill-clay', entrada: 0, salida: Number(c.cantidad) || 0,
      detalle: [c.campo_id ? campoNombre(c.campo_id) : '', c.rodeo_id ? rodeoNombre(c.rodeo_id) : '', c.observaciones || ''].filter(Boolean).join(' — ') || '—',
      entity: 'consumos_insumos', idCol: 'consumo_id', id: c.consumo_id,
    })),
  ];
  if (desde) movs = movs.filter(m => String(m.fecha) >= desde);
  if (hasta) movs = movs.filter(m => String(m.fecha) <= hasta);
  movs.sort((a, b) => String(a.fecha).localeCompare(String(b.fecha))); // ascendente: el saldo corrido solo tiene sentido en orden cronológico

  let saldo = saldoInicial;
  const filas = movs.map(m => { saldo += m.entrada - m.salida; return { ...m, saldoCorrido: saldo }; });
  const saldoFinal = saldo;

  let h = `<div style="background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:10px 16px;font-size:14px;font-weight:600;margin-bottom:10px">
    Saldo inicial${desde ? ' al ' + fd(desde) : ''}: <strong>${fn(saldoInicial)} ${p.unidad || ''}</strong>
  </div>`;

  if (!filas.length) {
    h += '<div class="empty-state"><span class="ico">◌</span><div class="msg">No hay movimientos de este producto en el rango elegido.</div></div>';
    return h;
  }

  h += `<div class="tw"><table class="dt"><thead><tr>
    <th>Fecha</th><th>Tipo</th><th>Detalle</th><th class="tc">Entrada</th><th class="tc">Salida</th><th class="tc">Saldo</th><th></th>
  </tr></thead><tbody>`;
  filas.forEach(f => {
    h += `<tr>
      <td>${fd(f.fecha)}</td>
      <td><span class="pill ${f.tipoClass}">${f.tipoLabel}</span></td>
      <td>${f.detalle}</td>
      <td class="tc">${f.entrada ? fn(f.entrada) : '—'}</td>
      <td class="tc">${f.salida ? fn(f.salida) : '—'}</td>
      <td class="tc"><strong>${fn(f.saldoCorrido)}</strong></td>
      <td><div class="row-actions">
        <button class="icon-btn" data-edit="${f.id}" data-entity="${f.entity}" data-idcol="${f.idCol}" title="Editar">✎</button>
        <button class="icon-btn danger" data-del="${f.id}" data-entity="${f.entity}" data-idcol="${f.idCol}" title="Eliminar">✕</button>
      </div></td>
    </tr>`;
  });
  h += `</tbody></table></div>
  <div style="background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:10px 16px;font-size:14px;font-weight:600;margin-top:10px">
    Saldo final${hasta ? ' al ' + fd(hasta) : ''}: <strong>${fn(saldoFinal)} ${p.unidad || ''}</strong>
  </div>`;
  return h;
}
window.actualizarFiltroCampoHistorial_ = function() {
  const productoId = document.getElementById('in-hist-filtro-producto')?.value || '';
  const wrap = document.getElementById('in-hist-campo-wrap');
  if (!wrap) return;
  const producto = ((S.catalogs && S.catalogs.productos) || []).find(p => String(p.producto_id) === String(productoId));
  wrap.style.display = (productoId && producto && esPorCampo_(producto.por_campo)) ? 'flex' : 'none';
  if (wrap.style.display === 'none') {
    const sel = document.getElementById('in-hist-filtro-campo');
    if (sel) sel.value = '';
  }
};

window.renderInsumosHistorialFiltrado = function() {
  const productoFiltro = document.getElementById('in-hist-filtro-producto')?.value || '';
  const categoriaFiltro = document.getElementById('in-hist-filtro-categoria')?.value || '';
  const campoFiltro = document.getElementById('in-hist-filtro-campo')?.value || '';
  const desde = document.getElementById('in-hist-desde')?.value || '';
  const hasta = document.getElementById('in-hist-hasta')?.value || '';
  const stockEl = document.getElementById('in-stock-seleccionado');
  if (stockEl) stockEl.innerHTML = buildStockSeleccionado_(productoFiltro, campoFiltro);
  const el = document.getElementById('in-historial-tabla');
  if (el) {
    if (productoFiltro) {
      el.innerHTML = buildInsumosKardex_(S.cache.compras_insumos || [], S.cache.consumos_insumos || [], productoFiltro, desde, hasta, campoFiltro);
    } else {
      el.innerHTML = buildInsumosHistorial_(S.cache.compras_insumos || [], S.cache.consumos_insumos || [], productoFiltro, categoriaFiltro, desde, hasta);
    }
    attachTableDeleteEvents('compras_insumos', 'compra_id');
    attachTableDeleteEvents('consumos_insumos', 'consumo_id');
  }
};

function attachInsumosEvents() {
  function applyInsumoTipoUI(tipo) {
    const esCompra = tipo === 'Compra';
    const cw = document.getElementById('in-costo-wrap'), pw = document.getElementById('in-proveedor-wrap');
    const kw = document.getElementById('in-campo-wrap'), rw = document.getElementById('in-rodeo-wrap');
    const cnw = document.getElementById('in-campana-wrap');
    if (!cw || !pw || !rw) return;
    cw.style.display = esCompra ? 'flex' : 'none';
    pw.style.display = esCompra ? 'flex' : 'none';
    // in-campo-wrap: lo maneja actualizarCampoCompraInsumo_ según producto
    if (kw && esCompra) kw.style.display = 'none'; // en compras nunca (tiene su propio wrap)
    rw.style.display = esCompra ? 'none' : 'flex';
    if (cnw) cnw.style.display = esCompra ? 'none' : 'flex';
    actualizarCampoCompraInsumo_();
  }
  document.querySelectorAll('#in-tipo-group .radio-pill').forEach(p => p.onclick = () => {
    document.querySelectorAll('#in-tipo-group .radio-pill').forEach(x => x.classList.remove('selected'));
    p.classList.add('selected');
    applyInsumoTipoUI(p.dataset.tipo);
  });
  actualizarCampoCompraInsumo_();

  const npSave = document.getElementById('np-save');
  if (npSave) npSave.onclick = async () => {
    const nombre = document.getElementById('np-nombre').value.trim();
    const categoria = document.getElementById('np-categoria').value;
    const unidad = document.getElementById('np-unidad').value.trim();
    const porCampo = document.getElementById('np-por-campo').checked;
    if (!nombre || !unidad) { toast('Completá nombre y unidad del producto.', 'err'); return; }
    npSave.disabled = true;
    try {
      await apiCall('create', { body: { entity: 'productos', data: { nombre, categoria, unidad, activo: true, por_campo: porCampo } } });
      await loadCatalogs();
      const sel = document.getElementById('in-producto');
      if (sel) {
        sel.innerHTML = productoOptionsHtml(S.catalogs.productos || []);
        const nuevo = (S.catalogs.productos || []).find(p => p.nombre === nombre);
        if (nuevo) sel.value = nuevo.producto_id;
      }
      actualizarCampoCompraInsumo_();
      document.getElementById('np-nombre').value = '';
      document.getElementById('np-unidad').value = '';
      document.getElementById('np-por-campo').checked = false;
      document.getElementById('in-nuevo-producto-panel').style.display = 'none';
      toast('Producto creado: ' + nombre, 'ok');
    } catch (err) { toast(err.message, 'err'); } finally { npSave.disabled = false; }
  };

  const save = document.getElementById('in-save');
  if (save) save.onclick = async () => {
    const tipo = document.querySelector('#in-tipo-group .selected').dataset.tipo;
    const esCompra = tipo === 'Compra';
    const productoId = document.getElementById('in-producto').value;
    if (!productoId) { toast('Creá o seleccioná un producto primero.', 'err'); return; }
    const cantidad = Number(document.getElementById('in-cantidad').value) || 0;
    const fecha = document.getElementById('in-fecha').value;
    if (!fecha || !cantidad) { toast('Completá fecha y cantidad.', 'err'); return; }
    save.disabled = true;
    try {
      if (esCompra) {
        const producto = ((S.catalogs && S.catalogs.productos) || []).find(p => String(p.producto_id) === String(productoId));
        const esPorCampo = producto && esPorCampo_(producto.por_campo);
        const campoCompraId = document.getElementById('in-compra-campo')?.value;
        if (esPorCampo && !campoCompraId) { toast('Este producto se guarda por separado en cada campo — elegí a cuál entra esta compra.', 'err'); save.disabled = false; return; }
        const data = {
          fecha, producto_id: productoId, cantidad,
          costo_total: Number(document.getElementById('in-costo').value) || '',
          proveedor: document.getElementById('in-proveedor').value.trim(),
          observaciones: document.getElementById('in-obs').value.trim(),
          campo_id: esPorCampo ? campoCompraId : '',
        };
        await apiCall('create', { body: { entity: 'compras_insumos', data } });
        invalidateCache('compras_insumos');
      } else {
        const rodeoId = document.getElementById('in-rodeo').value;
        if (!rodeoId) { toast('Seleccioná el rodeo que consume.', 'err'); save.disabled = false; return; }
        const data = {
          fecha, producto_id: productoId,
          campo_id: document.getElementById('in-campo').value, rodeo_id: rodeoId,
          cantidad, observaciones: document.getElementById('in-obs').value.trim(),
          campana: document.getElementById('in-campana').value.trim(),
        };
        await apiCall('create', { body: { entity: 'consumos_insumos', data } });
        invalidateCache('consumos_insumos');
        S.margenBruto = null;
      }
      S.stockProductos = null;
      await loadStockProductos();
      toast((esCompra ? 'Compra' : 'Consumo') + ' registrado', 'ok');
      await loadEntity(esCompra ? 'compras_insumos' : 'consumos_insumos', true);
      render();
    } catch (err) { toast(err.message, 'err'); } finally { save.disabled = false; }
  };

  attachTableDeleteEvents('compras_insumos', 'compra_id');
  attachTableDeleteEvents('consumos_insumos', 'consumo_id');
  attachTableDeleteEvents('productos', 'producto_id');
}

// ── MARGEN BRUTO ──────────────────────────────────────────────────────────
function periodoPreset_(preset) {
  const hoy = new Date();
  const y = hoy.getFullYear();
  const pad = n => String(n).padStart(2, '0');
  if (preset === 'mes') {
    return { desde: `${y}-${pad(hoy.getMonth() + 1)}-01`, hasta: today() };
  }
  if (preset === 'anio_pasado') {
    return { desde: `${y - 1}-01-01`, hasta: `${y - 1}-12-31` };
  }
  // 'anio' (default)
  return { desde: `${y}-01-01`, hasta: today() };
}

async function calcularMargenBruto_() {
  const { desde, hasta } = S.margenBrutoPeriodo;
  S.margenBruto = await apiCall('margenBruto', { params: { desde, hasta } });
}

// Convierte ventas e insumos a dólares usando la cotización BNA vigente en la fecha de CADA línea
// (la cesión por destete ya viene resuelta en dólares desde el backend, con el precio interno guardado en su momento).
function vistaUsdMargenBruto_(mb) {
  let ventasUsd = 0, ventasSinCotizacion = 0;
  const detalleVentas = (mb.ingresos.detalle_ventas || []).map(v => {
    const tc = tipoCambioVigente_(v.fecha);
    const importeUsd = tc ? v.importe / Number(tc.valor) : null;
    const precioUsd = tc && v.cant_animales ? v.precio_pactado / Number(tc.valor) : null;
    if (importeUsd == null) ventasSinCotizacion++; else ventasUsd += importeUsd;
    return Object.assign({}, v, { importe_usd: importeUsd, precio_pactado_usd: precioUsd });
  });

  let cesionUsd = 0;
  (mb.ingresos.detalle_destetes || []).forEach(d => { cesionUsd += d.valor_usd || 0; });

  let insumosUsd = 0, consumosSinCotizacion = 0;
  const porProductoUsd = {};
  (mb.egresos.detalle_consumos || []).forEach(c => {
    const tc = tipoCambioVigente_(c.fecha);
    if (tc) {
      const usd = c.costo_ars / Number(tc.valor);
      insumosUsd += usd;
      porProductoUsd[c.producto] = (porProductoUsd[c.producto] || 0) + usd;
    } else {
      consumosSinCotizacion++;
    }
  });

  const totalIngresosUsd = ventasUsd + cesionUsd;
  return {
    ventas: ventasUsd, ventasSinCotizacion,
    cesion: cesionUsd,
    total: totalIngresosUsd,
    insumos: insumosUsd, consumosSinCotizacion,
    detalle_por_producto: Object.keys(porProductoUsd).map(n => ({ producto: n, costo: porProductoUsd[n] })).sort((a, b) => b.costo - a.costo),
    detalle_ventas: detalleVentas,
    resultado: totalIngresosUsd - insumosUsd,
  };
}

function buildMargenBruto() {
  const precios = (S.cache.precios_internos || []).slice().sort((a, b) => String(b.fecha_desde || '').localeCompare(String(a.fecha_desde || '')));
  const mb = S.margenBruto;
  if (mb && mb.ingresos) {
    mb.ingresos.detalle_ventas = mb.ingresos.detalle_ventas || [];
    mb.ingresos.detalle_destetes = mb.ingresos.detalle_destetes || [];
  }
  if (mb && mb.egresos) {
    mb.egresos.detalle_por_producto = mb.egresos.detalle_por_producto || [];
    mb.egresos.detalle_consumos = mb.egresos.detalle_consumos || [];
    mb.egresos.diferidos_proxima_campana = mb.egresos.diferidos_proxima_campana || [];
  }

function actualizarPreviewUsd_() {
  const preview = document.getElementById('pi-usd-preview');
  if (!preview) return;
  const fecha = document.getElementById('pi-fecha').value;
  const ars = Number(document.getElementById('pi-ars').value) || 0;
  if (!fecha || !ars) { preview.textContent = '—'; preview.style.color = 'var(--text2)'; return; }
  const tc = tipoCambioVigente_(fecha);
  if (!tc) {
    preview.textContent = 'Sin cotización en Corrales para esa fecha';
    preview.style.color = 'var(--clay-text)';
    return;
  }
  const usd = ars / Number(tc.valor);
  preview.innerHTML = `U$D ${fn(usd, 2)} <span style="font-size:11px;font-weight:400;color:var(--text3)">(cotización $${fn(tc.valor)} del ${fd(tc.fecha)})</span>`;
  preview.style.color = 'var(--text)';
}

function attachMargenBrutoEvents() {
  const save = document.getElementById('pi-save');
  if (save) save.onclick = async () => {
    const fecha = document.getElementById('pi-fecha').value;
    const ars = Number(document.getElementById('pi-ars').value) || 0;
    if (!fecha || !ars) { toast('Completá la fecha y el precio en pesos.', 'err'); return; }
    const tc = tipoCambioVigente_(fecha);
    let usd = '';
    if (tc) {
      usd = Math.round((ars / Number(tc.valor)) * 100) / 100;
    } else {
      toast('No hay cotización de dólar cargada en Corrales para esa fecha — se guarda solo en pesos.', 'err');
    }
    const data = {
      fecha_desde: fecha, precio_ars_kg: ars, precio_usd_kg: usd,
      observacion: document.getElementById('pi-obs').value.trim(),
    };
    save.disabled = true;
    try {
      await apiCall('create', { body: { entity: 'precios_internos', data } });
      invalidateCache('precios_internos');
      toast('Precio interno guardado', 'ok');
      await loadEntity('precios_internos', true);
      S.margenBruto = null;
      render();
    } catch (err) { toast(err.message, 'err'); } finally { save.disabled = false; }
  };
  attachTableDeleteEvents('precios_internos', 'precio_id');

  const presetSel = document.getElementById('mb-preset');
  if (presetSel) {
    const customMode = S.margenBrutoPeriodo && S.margenBrutoPeriodo.custom;
    presetSel.value = customMode ? 'custom' : (S.margenBrutoPeriodoPreset || 'anio');
    const toggleCustom = () => {
      const isCustom = presetSel.value === 'custom';
      document.getElementById('mb-desde-wrap').style.display = isCustom ? '' : 'none';
      document.getElementById('mb-hasta-wrap').style.display = isCustom ? '' : 'none';
    };
    toggleCustom();
    presetSel.onchange = toggleCustom;
  }
  const calcBtn = document.getElementById('mb-calcular');
  if (calcBtn) calcBtn.onclick = async () => {
    const preset = document.getElementById('mb-preset').value;
    if (preset === 'custom') {
      const desde = document.getElementById('mb-desde').value;
      const hasta = document.getElementById('mb-hasta').value;
      if (!desde || !hasta) { toast('Completá desde y hasta.', 'err'); return; }
      S.margenBrutoPeriodo = { desde, hasta, custom: true };
      S.margenBrutoPeriodoPreset = 'custom';
    } else {
      S.margenBrutoPeriodo = periodoPreset_(preset);
      S.margenBrutoPeriodoPreset = preset;
    }
    calcBtn.disabled = true;
    try { await calcularMargenBruto_(); render(); }
    catch (err) { toast(err.message, 'err'); }
    finally { calcBtn.disabled = false; }
  };

  document.querySelectorAll('#mb-moneda-group .radio-pill').forEach(p => p.onclick = () => {
    S.margenBrutoMoneda = p.dataset.moneda;
    render();
  });
}
